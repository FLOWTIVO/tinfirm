    get:
      tags: [Agents]
      operationId: downloadAgentSkill
      summary: Download the version of a skill the agent pins, as its canonical zip (who sees the agent)
      description: |
        How whoever sees an agent reads what its skills tell it, as they read its instructions, without seeing the
        skill in the library. A skill the agent does not have is 404.
      responses:
        '200':
          description: The zip
          content:
            application/zip:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/companies/{companyId}/audit-events:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
    get:
      tags: [Audit]
      operationId: listCompanyAuditEvents
      summary: Audit events of one company, newest first (OWNER, ADMIN)
      description: |
        Newest first, by cursor on `seq`. The filters combine (the package 6 contract, §5.8): `action` is exact, or a
        prefix ending in `.` (`tool.`); `from` and `to` bound `occurredAt` (`from` included, `to` not);
        `conversationId` matches that key of `details`. `conversationKey` is a conversation's key as people know it
        (`shop-123-dev-1`, any case), resolved to its id in the company and then matched as `conversationId`; an
        unknown key matches nothing. `principalId` finds the events about a principal, in any of three ways: the
        principal is named in `details.principalId` (a model key's events, a hold's, an account's); it is the target
        (`targetType` `principal`, or `user` with its member's user: a member added, changed or removed); or, for a
        member's principal, its user acted (`actor.type` `USER` and `actor.id` the member's user). A member's user is
        the same each time they join, so a member who left and joined again finds, through either principal, all that
        concerns their user. A service identity never acts itself, so only the first two find its events. A filter
        that matches nothing answers an empty page.

        Each event names its target in `targetName`, read now from what the company keeps and never from the chain,
        and only as the caller may see it elsewhere (CONVENTIONS §8): a target that is gone, or whose name the caller
        may not see, has none. A person whose content the company erased after they left is named nowhere in the
        company's chain: no `targetName` for them, and `actor.display` `erased person` for their acts.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - { name: action, in: query, required: false, schema: { type: string, maxLength: 64, pattern: '^[a-z0-9_.]+$' } }
        - name: actorType
          in: query
          required: false
          schema: { type: string, enum: [USER, SYSTEM, AGENT, SCIM] }
        - { name: actorId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: targetType, in: query, required: false, schema: { type: string, maxLength: 64 } }
        - { name: targetId, in: query, required: false, schema: { type: string, maxLength: 255 } }
        - { name: from, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: conversationId, in: query, required: false, schema: { type: string, format: uuid } }
        - name: conversationKey
          in: query
          required: false
          description: A conversation's key (`shop-123-dev-1`), as its page and the app show it
          schema: { type: string, minLength: 1, maxLength: 200 }
        - { name: principalId, in: query, required: false, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Audit events
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditEventPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/companies/{companyId}/audit-events/verification:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
    get:
      tags: [Audit]
      operationId: verifyCompanyAuditChain
      summary: Recompute the company's audit hash chain (OWNER, ADMIN)
      responses:
        '200':
          description: Verification result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditVerification' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/companies/{companyId}/audit-events/export:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
    get:
      tags: [Audit]
      operationId: exportCompanyAuditEvents
      summary: Export a contiguous range of the company's chain as NDJSON (OWNER, ADMIN)
      description: |
        A contiguous range of `seq`, oldest first, as `application/x-ndjson` (the package 6 contract, §5.8). By
        sequence (`fromSeq`, `toSeq`, both included; from the first event and up to the chain's head by default), or
        by time (`from` included, `to` not), which resolves to the contiguous range from the first event at or after
        `from` to the last before `to`; the two ways do not mix (`400 VALIDATION_FAILED`). A `toSeq` beyond the head
        is the head. At most 1 000 000 events (`400 AUDIT_EXPORT_TOO_LARGE`).

        The first line states the range: `{"kind":"export","companyId","fromSeq","toSeq","count","prevHash","from",
        "to"}`, where `prevHash` is the hash the first event chains from. Then one line per event: its canonical form
        (ADR-0010: `action`, `actor` `{id, type}`, `companyId`, `details`, `occurredAt`, `seq`, `targetId`,
        `targetType`) with `prevHash` and `hash` added, keys sorted. The last line is the chain's head at the export:
        `{"kind":"head","seq","hash"}`. Anyone holding it verifies it offline: drop `prevHash` and `hash` from each
        event line, and `hash = hex(sha256(prevHash + "\n" + canonical))` with keys sorted and no whitespace, each
        event chaining from the one before and the first from the first line's `prevHash`. It is read in short
        transactions and streamed outside any, and audited `audit.exported` once it ends.
      parameters:
        - { name: fromSeq, in: query, required: false, schema: { type: integer, format: int64, minimum: 1 } }
        - { name: toSeq, in: query, required: false, schema: { type: integer, format: int64, minimum: 1 } }
        - { name: from, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: false, schema: { type: string, format: date-time } }
      responses:
        '200':
          description: The events, one JSON object a line
          content:
            application/x-ndjson:
              schema: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/companies/{companyId}/audit-events/checks:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
    get:
      tags: [Audit]
      operationId: listCompanyAuditChecks
      summary: The daily checks of the company's chain, newest first (OWNER, ADMIN)
      description: |
        The daily check (the package 6 contract, §5.8) verifies the chain from the head the previous check recorded:
        the event at that head must still exist with its hash, and every event after it must chain from it. It fails
        `SHORTER` when the chain ends before that head (the newest events removed), `HEAD_CHANGED` when the event at
        that head has another hash, and `BROKEN` at the first event after it that does not verify. A failure is an
        item of the inbox of OWNER and ADMIN until a check passes, or until an OWNER acknowledges it, after which the
        next check starts from the head the failed one found. The last 400 checks are kept, and always the one the
        next check starts from.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: The checks
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditCheckPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/companies/{companyId}/audit-events/checks/{checkId}/acknowledge:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
      - $ref: '#/components/parameters/CheckId'
    post:
      tags: [Audit]
      operationId: acknowledgeCompanyAuditCheck
      summary: Acknowledge the chain's latest failed check (OWNER)
      description: |
        The next check starts from the head this check found (`MANAGE_RETENTION`). Only the chain's latest check, and
        only a failed one, is acknowledged (`400 VALIDATION_FAILED`); acknowledging it again changes nothing. Audited
        as `audit.check_acknowledged` with the check and its failure; the note stays on the check, never in the
        chain.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuditCheckAcknowledgement' }
      responses:
        '200':
          description: The acknowledged check
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditCheck' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/companies/{companyId}/conversations/{conversationId}/reads:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
      - $ref: '#/components/parameters/ConversationId'
    get:
      tags: [Conversations]
      operationId: listConversationReads
      summary: Who read the conversation other than its person, and when (its person, OWNER)
      description: |
        Every read of a personal conversation by an OWNER who is not its person is recorded as `conversation.read`
        (the package 6 contract, §5.6 and §11: no throttle), and shown here to its person (open point 10), one entry
        per reader: when first and last, how many reads, and what was read (each event's `what`). Readers first by their last read, newest first; at most 100. Reading this list is not
        itself a read of the conversation.
      responses:
        '200':
          description: The readers
          content:
            application/json:
              schema:
                type: array
                maxItems: 100
                items: { $ref: '#/components/schemas/ConversationReader' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/companies/{companyId}/retention:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
    get:
      tags: [Retention]
      operationId: getRetention
      summary: The company's retention periods, and its open conversations older than them (OWNER, ADMIN)
      description: |
        What the next sweep purges under the periods (`nextSweep`, and `due` from it) is counted by the sweep's own
        selection, each row once, as `previewRetention` counts `current`.
      responses:
        '200':
          description: The periods
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RetentionSettings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Retention]
      operationId: updateRetention
      summary: Set the company's retention periods (OWNER)
      description: |
        `MANAGE_RETENTION`. A period out of range, or chats' content kept longer than other content, is
        `400 RETENTION_INVALID`. `null` keeps content and files for good. A shorter period purges at the next daily
        sweep; the answer says how much is due then. Audited as `retention.changed` with the five periods after the
        change; a change that changes nothing is not audited.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RetentionPeriods' }
      responses:
        '200':
          description: The periods after the change, with what the next sweep purges
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RetentionSettings' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/companies/{companyId}/retention/preview:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
    post:
      tags: [Retention]
      operationId: previewRetention
      summary: What the next sweep would purge under proposed periods, storing nothing (OWNER)
      description: |
        `MANAGE_RETENTION`, for the periods' editor before a change is saved: the body of `updateRetention`, checked
        as the change checks it (`400 RETENTION_INVALID`). The answer counts what the next daily sweep would purge if
        it ran now, under the proposed periods (`proposed`) and under the stored ones (`current`, as `getRetention`'s
        `nextSweep` counts it), each row once, by the sweep's own selection and outside what an open hold covers; and
        what the open holds keep from it under the
        proposed periods (`held`). Open conversations are never purged and not counted (`getRetention`'s `openOlder`).
        Nothing is stored or audited: counts only, never content.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RetentionPeriods' }
      responses:
        '200':
          description: What the next sweep would purge
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RetentionPreview' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/companies/{companyId}/retention/open-conversations:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
    get:
      tags: [Retention]
      operationId: listRetentionOpenConversations
      summary: The open conversations older than their retention period, oldest first (OWNER)
      description: |
        Retention never purges an open conversation (the package 6 contract, G12; open point 25): these keep their
        content until they end. By key, place and age, never their title (`MANAGE_RETENTION`); a conversation is ended
        on its own page.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: The open conversations
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RetentionOpenConversationPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/companies/{companyId}/holds:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
    get:
      tags: [Retention]
      operationId: listHolds
      summary: The company's legal holds, newest first (OWNER)
      description: The open holds; with `lifted=true`, the lifted ones too, until their deletion 400 days after the lift.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - { name: lifted, in: query, required: false, schema: { type: boolean, default: false } }
      responses:
        '200':
          description: The holds
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LegalHoldPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Retention]
      operationId: createHold
      summary: Hold a conversation or a person against retention and erasure (OWNER)
      description: |
        Exactly one of `conversationId` and `principalId` (a member's; `400 VALIDATION_FAILED` otherwise). A
        conversation's hold covers all of it, its runs' events included; a person's covers their personal
        conversations and what they said, added and decided in others. The sweep skips what an open hold covers, and
        an erasure of any of it is `409 ON_HOLD`; a hold brings back nothing a sweep removed before it. The person is
        not told. Audited as `hold.set` with the ids; the reason stays on the hold.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LegalHoldRequest' }
      responses:
        '201':
          description: The hold
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LegalHold' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/companies/{companyId}/holds/conversations/{key}:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
      - name: key
        in: path
        required: true
        description: The conversation's key, as its link and the app show it (`shop-123-dev-1`)
        schema: { type: string, minLength: 1, maxLength: 200 }
    get:
      tags: [Retention]
      operationId: findHoldConversation
      summary: A conversation to hold, by its key (OWNER)
      description: |
        For a hold (`createHold`'s `conversationId`): the conversation's id and key, never its title or anything of
        its content, so not a read of it (no `conversation.read`). Any conversation of the company, whoever's; an
        unknown key is 404.
      responses:
        '200':
          description: The conversation's id and key
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HoldConversationRef' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/companies/{companyId}/holds/{holdId}:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
      - $ref: '#/components/parameters/HoldId'
    delete:
      tags: [Retention]
      operationId: liftHold
      summary: Lift a legal hold (OWNER)
      description: |
        What it held is swept and erased again as anything else. Audited as `hold.lifted`; lifting a lifted hold
        changes nothing.
      responses:
        '204': { description: Lifted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/companies/{companyId}/principals/{principalId}/erase:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
      - $ref: '#/components/parameters/PrincipalId'
    post:
      tags: [Retention]
      operationId: erasePrincipal
      summary: Erase a person's content now (OWNER)
      description: |
        `MANAGE_RETENTION` (the package 6 contract, §5.9; open point 17). For a member who left: every personal
        conversation of theirs, and their messages, files and decisions' texts in others'; and the systems' last tests
        forget that they ran them (`other.systemTests`), so that no system page names them. For a member still in the
        company: their ended personal conversations, or those named in `conversationIds` (an open one named is
        `409 ERASURE_NOT_ALLOWED`; a service identity's principal too). What all four kinds of retention would purge
        is purged at once, and each conversation shows that it was erased; so are the person's dismissals of inbox
        notices. Refused while an open hold covers any of it (`409 ON_HOLD`, `details.holdIds`). The answer counts what
        went and says what remains, where, and who removes it. Audited as `principal.erased` with the counts.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PrincipalErasureRequest' }
      responses:
        '200':
          description: What was erased and what remains
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erasure' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/companies/{companyId}/principals/{principalId}/erase/preview:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
      - $ref: '#/components/parameters/PrincipalId'
    post:
      tags: [Retention]
      operationId: previewPrincipalErasure
      summary: What erasing a person's content would remove now, erasing nothing (OWNER)
      description: |
        `MANAGE_RETENTION`: the erasure's dry run, with `erasePrincipal`'s request and authorization. It selects what
        the erasure would, by the erasure's own queries, and answers the counts the erasure's answer would give
        (`erases`), what would remain (`remains`), and the open holds that would refuse it with `409 ON_HOLD`
        (`holds`: on the person, on a conversation it reaches, or on the author of a trigger's conversation it
        reaches; empty when none does). With a hold, the counts are what would go once it is lifted. Every other
        refusal is the erasure's: `404`, `409 ERASURE_NOT_ALLOWED` (an open conversation named for a member still in
        the company, a service identity's principal). Nothing changes and nothing is audited: counts and the
        company's own holds, never content; the erasure itself is audited.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PrincipalErasureRequest' }
      responses:
        '200':
          description: What the erasure would remove and what would remain
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErasurePreview' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/companies/{companyId}/systems/{systemId}/identities/{externalId}/erase:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
      - $ref: '#/components/parameters/SystemId'
      - name: externalId
        in: path
        required: true
        description: The identity's id at the system (a chat user's, a tracker commenter's)
        schema: { type: string, minLength: 1, maxLength: 255 }
    post:
      tags: [Retention]
      operationId: eraseExternalIdentity
      summary: Erase the words of someone outside Tinfirm now (OWNER)
      description: |
        `MANAGE_RETENTION` (the package 6 contract, §5.9; open point 17): in every conversation, open ones included,
        the bodies and author names of that identity's messages (replaced by the removal marker), the events of the
        runs whose prompts quoted them, who decided outside Tinfirm where the identity answered, its firings' actor
        names and its chat user. The content modules of the chats and the triggers (packages 4 and 5) do the purge;
        refused while an open hold covers a conversation it reaches (`409 ON_HOLD`). The answer counts what went and
        says what remains. Audited as `identity.erased` with the system, the identity's id and the counts.
      responses:
        '200':
          description: What was erased and what remains
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erasure' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/companies/{companyId}/systems/{systemId}/identities/{externalId}/erase/preview:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
      - $ref: '#/components/parameters/SystemId'
      - name: externalId
        in: path
        required: true
        description: The identity's id at the system (a chat user's, a tracker commenter's)
        schema: { type: string, minLength: 1, maxLength: 255 }
    post:
      tags: [Retention]
      operationId: previewExternalIdentityErasure
      summary: What erasing the words of someone outside Tinfirm would remove now, erasing nothing (OWNER)
      description: |
        `MANAGE_RETENTION`: the erasure's dry run, with `eraseExternalIdentity`'s request and authorization. The
        content modules of the chats and the triggers count what their erasure would remove, by its own selection;
        the answer gives those counts as the erasure's answer would (`erases`), with the runs whose events would go,
        what would remain (`remains`), and the open holds on the conversations it reaches, which would refuse it with
        `409 ON_HOLD` (`holds`; empty when none does). An unknown system is `404`. Nothing changes and nothing is
        audited: counts and the company's own holds, never content; the erasure itself is audited.
      responses:
        '200':
          description: What the erasure would remove and what would remain
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErasurePreview' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/companies/{companyId}/secrets:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
    get:
      tags: [Secrets]
      operationId: listSecrets
      summary: Secret metadata; values are never returned (OWNER, ADMIN)
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Secret metadata
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SecretPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Secrets]
      operationId: createSecret
      summary: Store a new secret (OWNER, ADMIN)
      description: |
        Problems: 400 VALIDATION_FAILED; 409 DUPLICATE_SECRET_NAME when the company has a secret of this name.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SecretCreateRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SecretMeta' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/companies/{companyId}/secrets/{secretId}:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
      - $ref: '#/components/parameters/SecretId'
    put:
      tags: [Secrets]
      operationId: updateSecret
      summary: Store a new version of the value and optionally a new description (OWNER, ADMIN)
      description: |
        Problems: 400 VALIDATION_FAILED (a managed secret: its value is maintained by Tinfirm); 409 SECRET_MANAGED
        for `MODEL_GATEWAY_ADMIN_KEY` (`LITELLM_ADMIN_KEY` when entered before) while the model settings keep it (the
        detail names where): a new admin key is entered in the model settings, which turn the relay off until the
        gateway passes its test again.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SecretUpdateRequest' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SecretMeta' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Secrets]
      operationId: deleteSecret
      summary: Delete a secret and all its versions (OWNER, ADMIN)
      description: |
        A managed secret that a system's credential or a system's app keeps is not deleted here: the credential is
        removed on its system's page, as the app is, each with its own audit and events. Problems: 409 SECRET_MANAGED (the detail names where).
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/admin/users:
    get:
      tags: [Admin]
      operationId: listUsers
      summary: All users of the instance (instance admin)
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Users
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Admin]
      operationId: createUser
      summary: Create a local user (instance admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserCreateRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/admin/users/{userId}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    patch:
      tags: [Admin]
      operationId: updateUser
      summary: Change display name, instance-admin flag or active flag (instance admin). The last active instance admin cannot be demoted or deactivated.
      description: |
        Problems: 409 LAST_INSTANCE_ADMIN when the change would demote or deactivate the last active instance admin.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserUpdateRequest' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/admin/users/{userId}/password:
    parameters:
      - $ref: '#/components/parameters/UserId'
    put:
      tags: [Admin]
      operationId: setUserPassword
      summary: Set a local user's password (instance admin)
      description: |
        The user's sessions are logged out (an admin who sets their own password keeps the current one), and their
        personal access tokens and OAuth grants are revoked. Audited `user.password.set` in the instance chain and
        `member.password_reset_by_instance_admin` in the chain of every company the user belongs to. Problems: 409
        NOT_LOCAL_USER for a user who signs in with an identity provider and has no password.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordSetRequest' }
      responses:
        '204': { description: Password set }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/admin/audit-events:
    get:
      tags: [Admin]
      operationId: listInstanceAuditEvents
      summary: Instance-level audit events (company-independent), newest first (instance admin)
      description: |
        Newest first, by cursor on `seq`. Each event names its target in `targetName` as the company's list does
        (CONVENTIONS §8): a company by its name, a user by their display name, read now; a target that is gone, or of
        another type, has none.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Audit events
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditEventPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/admin/audit-events/verification:
    get:
      tags: [Admin]
      operationId: verifyInstanceAuditChain
      summary: Recompute the instance audit hash chain (instance admin)
      responses:
        '200':
          description: Verification result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditVerification' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/admin/audit-events/checks:
    get:
      tags: [Admin]
      operationId: listInstanceAuditChecks
      summary: The daily checks of the instance chain, newest first (instance admin)
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: The checks
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditCheckPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/admin/audit-events/checks/{checkId}/acknowledge:
    parameters:
      - $ref: '#/components/parameters/CheckId'
    post:
      tags: [Admin]
      operationId: acknowledgeInstanceAuditCheck
      summary: Acknowledge the instance chain's latest failed check (instance admin)
      description: As the company's, in the instance chain.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuditCheckAcknowledgement' }
      responses:
        '200':
          description: The acknowledged check
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditCheck' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/admin/vault/rewrap:
    post:
      tags: [Admin]
      operationId: rewrapVaultKeys
      summary: Re-wrap every data key with the active master key (instance admin)
      responses:
        '200':
          description: Result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VaultRewrapResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500':
          description: A data key is wrapped under a master key that is no longer configured; the problem names the key id
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /api/licence:
    get:
      tags: [Licence]
      operationId: getLicence
      summary: The licence in force (any signed-in user)
      description: |
        The edition the instance runs as, the state of its licence, its seats and the features in force now
        (ADR-0077). The web app shows a company's Owners and Admins this on their company's settings, read-only, and
        hides what the edition does not hold; every gate is the server's (`403 EDITION_REQUIRED`).
      responses:
        '200':
          description: The licence
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Licence' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/admin/licence:
    get:
      tags: [Licence]
      operationId: getAdminLicence
      summary: The licence key in force and the next one (instance admin)
      description: Without their strings, which are never returned.
      responses:
        '200':
          description: The keys held
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminLicence' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [Licence]
      operationId: putLicenceKey
      summary: Apply a licence key (instance admin)
      description: |
        Verifies the key offline against the public key the server ships with. One key is in force at a time: a key
        that starts by today replaces the key in force; a later one, a renewal, is held as the next key in place of
        any held, and takes over on its start date (`licence.key.activated`). Seats bought during the year come as
        the same licence's next revision, with the new total and the same end. Audited `licence.key.applied` in the
        instance chain (`details.next`, `details.replaced`). `400 LICENCE_KEY_INVALID`: not a key, or not signed by
        FLOWTIVO. `409 LICENCE_KEY_EXPIRED`: the key ended. `409 LICENCE_KEY_SUPERSEDED`: the instance holds a key
        of this licence with the same or a higher `rev`. `409 LICENCE_SEATS_TOO_FEW`: the key holds fewer seats than
        are in use on the day it comes into force (`details.required`, `details.licensed`); make Members Viewers
        first.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LicenceKeyRequest' }
      responses:
        '200':
          description: The keys held now
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminLicence' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/client-errors:
    post:
      tags: [ErrorReports]
      operationId: reportClientError
      summary: Report an error of the web app (any member's session)
      description: |
        The web app posts each error its `ErrorHandler` sees (ADR-0070, §1). The server scrubs it as it does its own
        (§2) and adds it to its report. Always `204`: nothing is kept while the mode is `OFF`, nor beyond 20 a minute
        from one user, and the browser is never told.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClientError' }
      responses:
        '204': { description: "Taken, or dropped" }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/admin/error-reports:
    get:
      tags: [ErrorReports]
      operationId: listErrorReports
      summary: The installation's error reports, the most recently seen first (instance admin)
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Error reports
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorReportPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/admin/error-reports/export:
    get:
      tags: [ErrorReports]
      operationId: exportErrorReports
      summary: Download every error report as the events delivery sends (instance admin)
      description: |
        One JSON file (`Content-Disposition: attachment`) with every report as the Sentry event that automatic delivery
        sends for it (ADR-0070, §6), in every mode: an installation without internet sends it to the vendor by hand.
        It is what leaves the installation, and nothing more.
      responses:
        '200':
          description: The export
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorReportExport' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/admin/error-reports/{reportId}:
    parameters:
      - $ref: '#/components/parameters/ReportId'
    get:
      tags: [ErrorReports]
      operationId: getErrorReport
      summary: One error report with its newest sample's exceptions and frames (instance admin)
      responses:
        '200':
          description: The report
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorReportDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [ErrorReports]
      operationId: deleteErrorReport
      summary: Delete an error report, once its error is understood (instance admin)
      description: The error starts a new report when it happens again. Audited `error_report.deleted`.
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/admin/error-reporting:
    get:
      tags: [ErrorReports]
      operationId: getErrorReporting
      summary: The mode of error reporting, its destination and its last delivery (instance admin)
      responses:
        '200':
          description: Error reporting
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorReporting' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [ErrorReports]
      operationId: updateErrorReporting
      summary: Turn automatic delivery to the vendor on or off (instance admin)
      description: |
        Only while the operator left `TINFIRM_ERROR_REPORTS` unset: else `409 ERROR_REPORTING_SET_BY_OPERATOR`.
        Automatic delivery needs a destination (`TINFIRM_ERROR_REPORTS_DSN`): else `409 ERROR_REPORTING_NO_DESTINATION`.
        Audited `error_reporting.changed` in the instance chain when the mode changes.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ErrorReportingUpdate' }
      responses:
        '200':
          description: Error reporting
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorReporting' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/companies/{companyId}/model-settings:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
    get:
      tags: [ModelSettings]
      operationId: getModelSettings
      summary: The company's model gateway and the defaults of its keys (OWNER and ADMIN)
      description: |
        A company that has not configured a gateway answers `configured: false` with the defaults a new configuration
        starts from. The admin key is never returned (`adminKeySet`).
      responses:
        '200':
          description: The settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelSettings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [ModelSettings]
      operationId: putModelSettings
      summary: Configure the company's model gateway and the defaults of its keys (OWNER and ADMIN)
      description: |
        `BUNDLED` uses the LiteLLM the deployment bundles (400 VALIDATION_FAILED when it bundles none). `EXTERNAL` needs
        the admin URL (https unless the operator allows http; private addresses only where the operator allows them:
        400 INVALID_BASE_URL) and a master or admin key, which is kept as a company secret
        (`MODEL_GATEWAY_ADMIN_KEY`, which the Secrets API neither replaces nor deletes while the settings keep it: 409
        SECRET_MANAGED) and never returned;
        a new URL needs the key again, so that a key is sent only where it was entered. Back to `BUNDLED`, the secret
        goes. A change of the gateway, its URL or its key turns `relayEnabled` off until the next successful test, as
        before a first test, and clears `lastError`. A change of the defaults reaches every key without an override
        after the commit; the keys whose status it may change reach it before the answer, so that their model access
        read after it shows that status (a spent key the raised default frees is `OK` again, a key whose spend the
        lowered default no longer covers is `BUDGET_SPENT`, and a spent key shows the new period's reset time).
        `budgetAlertThresholds` and `monthlyAlertUsd` (package 6) change neither the gateway nor the keys. No setting
        lets a model's provider run a tool itself (web search, MCP, code execution): the relay always refuses such a
        request (ADR-0108). Audited as
        `model_settings.changed` with the names of the changed settings (`adminKey` for a new key), never the key; a
        request that changes nothing is not. A 400 VALIDATION_FAILED, and INVALID_BASE_URL, name the fields refused in
        `errors` (`[{field, message}]`), as the request's schema validation does.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModelSettingsRequest' }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelSettings' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/companies/{companyId}/model-settings/test:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
    post:
      tags: [ModelSettings]
      operationId: testModelSettings
      summary: Reach LiteLLM's admin API, make sure the company's team exists, and list the models it serves (OWNER and ADMIN)
      description: |
        A test that passes turns `relayEnabled` on, and Tinfirm then creates the keys of the principals that have none.
        A test that fails turns it off: 502 GATEWAY_UNREACHABLE, with LiteLLM's reason when it answered (never a key).
        At a `PROVIDED` gateway (ADR-0094) the test asks the model URL for its model list with a key no gateway
        issues: it passes when the gateway answers 401, 403 or a list, `models` is empty, and no key is created: each
        is entered (`putPrincipalModelKey`, `putCompanyModelKey`, `putMyModelKey`). 409 GATEWAY_NOT_CONFIGURED
        without settings. Audited as `model_settings.changed` with the outcome.
      responses:
        '200':
          description: The gateway answered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelSettingsTestResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '502': { $ref: '#/components/responses/BadGateway' }

  /api/companies/{companyId}/model-settings/models:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
    get:
      tags: [ModelSettings]
      operationId: listGatewayModels
      summary: The models the company's gateway serves, for settings and triggers (any member)
      description: |
        409 GATEWAY_NOT_CONFIGURED until the gateway passed its test; 502 GATEWAY_UNREACHABLE when LiteLLM does not
        answer. Empty at a `PROVIDED` gateway, whose keys each serve the models their gateway team allows.
      responses:
        '200':
          description: The models
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GatewayModelList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '502': { $ref: '#/components/responses/BadGateway' }

  /api/companies/{companyId}/model-settings/rotate-keys:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
    post:
      tags: [ModelSettings]
      operationId: rotateCompanyModelKeys
      summary: Rotate every principal's LiteLLM key of the company at once (OWNER and ADMIN)
      description: |
        For a suspected leak of the vault or of the company's LiteLLM. Every key the company's principals hold is
        replaced by a new one with the same team, budget, period, models and spend, as on schedule, but the key it
        replaces gets no grace: it is blocked in LiteLLM at once, and with it the previous key of an earlier rotation
        that was still in its grace. The keys are rotated after the commit, one after the other; each principal's model
        access shows its request (`keyRotationRequestedAt`) until its new key is in place, and a request that LiteLLM
        fails stays until the reconciliation carries it out. 409 GATEWAY_NOT_CONFIGURED until the gateway passed its
        test; 409 MODEL_KEYS_MANAGED at a `PROVIDED` gateway, whose team makes and rotates its keys (ADR-0094).
        Audited as `model_key.rotation_requested` per key (`scope` `company`), then `model_key.rotated` and
        `model_key.retired` as each key is replaced; never a key.
      responses:
        '202':
          description: The rotation of every key is requested and under way
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelKeyRotationRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/companies/{companyId}/me/model-access:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
    get:
      tags: [ModelAccess]
      operationId: getMyModelAccess
      summary: The caller's own model access (any member)
      description: |
        Their budget, spend, reset time, models and key status, and the subscriptions on their personal runner hosts.
        404 for a caller without a principal in the company (an instance admin who is not a member).
      responses:
        '200':
          description: The caller's model access
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelAccessView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/companies/{companyId}/me/model-access/key:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
    put:
      tags: [ModelAccess]
      operationId: putMyModelKey
      summary: Enter the caller's own key at the company's gateway (a member, where the company allows it)
      description: |
        Only for a `PROVIDED` gateway (ADR-0094): 409 MODEL_KEYS_MANAGED while Tinfirm makes the company's keys
        itself. The key is the one the company's gateway team made for the holder, with its budget and models; it is
        checked with the gateway's model list before it is kept (400 MODEL_KEY_REFUSED when the gateway refuses it, 502
        GATEWAY_UNREACHABLE when it does not answer), kept as an internal secret and never shown again: the view shows
        its last four characters (`keyHint`). A key entered again replaces the one before. Audited as
        `model_key.provided`; never the key. 409 MODEL_KEYS_MANAGED also while the company's settings do not let
        members enter their own key (`memberKeys`), and while the caller's key is one an admin entered. 404 for a
        caller without a principal.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModelKeyRequest' }
      responses:
        '200':
          description: The key is kept; the caller's model access
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelAccessView' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '502': { $ref: '#/components/responses/BadGateway' }
    delete:
      tags: [ModelAccess]
      operationId: deleteMyModelKey
      summary: Remove the caller's own key (a member, where the company allows it)
      description: |
        Tinfirm forgets the key the caller entered: their work waits (`NO_MODEL_KEY`) until a key is entered again.
        The key stays at the gateway, its team's to revoke. 409 MODEL_KEYS_MANAGED as for `putMyModelKey`. Audited as
        `model_key.removed`.
      responses:
        '200':
          description: The key is gone; the caller's model access
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelAccessView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/companies/{companyId}/principals/{principalId}/model-access:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
      - $ref: '#/components/parameters/PrincipalId'
    get:
      tags: [ModelAccess]
      operationId: getPrincipalModelAccess
      summary: A principal's model access, a member's or a service identity's (OWNER and ADMIN)
      description: |
        As `getMyModelAccess`, without the subscriptions (a member's personal hosts are theirs alone). 404 for an unknown
        principal and one that left.
      responses:
        '200':
          description: The principal's model access
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelAccessView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [ModelAccess]
      operationId: updatePrincipalModelAccess
      summary: Set or clear a principal's budget and models (OWNER and ADMIN)
      description: |
        An absent field stays; `clearBudget` and `clearModels` return to the company's default. Setting a value and
        clearing it in one request is 400 VALIDATION_FAILED; a 400 VALIDATION_FAILED names the fields refused in
        `errors`. The key in LiteLLM follows after the commit and before the answer, which shows the status the change
        gives it (a spent budget raised above `spentUsd` is `OK` again); while another server replica works on the key,
        it follows a moment later, and a failure of LiteLLM leaves it `ERROR` until the reconciliation. Audited as
        `model_key.budget_changed`; a request that changes nothing is not.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModelAccessUpdateRequest' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelAccessView' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/companies/{companyId}/principals/{principalId}/model-access/rotate-key:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
      - $ref: '#/components/parameters/PrincipalId'
    post:
      tags: [ModelAccess]
      operationId: rotatePrincipalModelKey
      summary: Rotate a principal's LiteLLM key now, on suspicion (OWNER and ADMIN)
      description: |
        Replaces the principal's key at once, outside the schedule: LiteLLM creates the next key with the same team,
        budget, period, models and spend, the relay uses it from then on, and the key it replaces gets no grace: it is
        blocked in LiteLLM before the answer (as is the previous key of an earlier rotation still in its grace), and
        deleted a minute later, once LiteLLM wrote the spend of its last requests, which goes over to the new key. A
        principal without a key yet gets its first. 200 with the model access once the new key is in place; 202 when
        another server replica is working on the key, which carries the rotation out in a moment; 502
        GATEWAY_UNREACHABLE when LiteLLM failed a step, with its reason: the reconciliation carries out what is left
        (the new key while `keyRotationRequestedAt` shows the request, else the old key's block; the current key keeps
        working). 409 GATEWAY_NOT_CONFIGURED until the gateway passed its test, 409 MODEL_KEYS_MANAGED at a
        `PROVIDED` gateway, whose team makes and rotates its keys (ADR-0094); 404 for an unknown principal and one
        that left. Audited as `model_key.rotation_requested` (`scope` `principal`), then `model_key.rotated` and
        `model_key.retired`; never a key.
      responses:
        '200':
          description: Rotated; the previous key is refused
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelAccessView' }
        '202':
          description: Requested; another replica is working on the key and rotates it in a moment
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelAccessView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '502': { $ref: '#/components/responses/BadGateway' }


  /api/companies/{companyId}/principals/{principalId}/model-access/key:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
      - $ref: '#/components/parameters/PrincipalId'
    put:
      tags: [ModelAccess]
      operationId: putPrincipalModelKey
      summary: Enter a principal's key at the company's gateway, a member's or a service account's (OWNER and ADMIN)
      description: |
        Only for a `PROVIDED` gateway (ADR-0094): 409 MODEL_KEYS_MANAGED while Tinfirm makes the company's keys
        itself. The key is the one the company's gateway team made for the holder, with its budget and models; it is
        checked with the gateway's model list before it is kept (400 MODEL_KEY_REFUSED when the gateway refuses it, 502
        GATEWAY_UNREACHABLE when it does not answer), kept as an internal secret and never shown again: the view shows
        its last four characters (`keyHint`). A key entered again replaces the one before. Audited as
        `model_key.provided`; never the key. 404 for an unknown principal and one that left.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModelKeyRequest' }
      responses:
        '200':
          description: The key is kept; the principal's model access
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelAccessView' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '502': { $ref: '#/components/responses/BadGateway' }
    delete:
      tags: [ModelAccess]
      operationId: deletePrincipalModelKey
      summary: Remove a principal's key (OWNER and ADMIN)
      description: |
        Tinfirm forgets the key: the principal's work waits (`NO_MODEL_KEY`) until a key is entered again. The key
        stays at the gateway, its team's to revoke. 409 MODEL_KEYS_MANAGED while Tinfirm makes the company's keys.
        Audited as `model_key.removed`.
      responses:
        '200':
          description: The key is gone; the principal's model access
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelAccessView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/companies/{companyId}/model-access/company-key:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
    get:
      tags: [ModelAccess]
      operationId: getCompanyKeyModelAccess
      summary: The company's own key, which pays for Tinfirm's own requests (OWNER and ADMIN)
      description: |
        The company's own LiteLLM key (ADR-0065): no principal's, created once the company's gateway passed its test,
        with a budget and models of its own or the company's default, synced, rotated and reconciled as a principal's.
        It pays for Tinfirm's own model requests (the tidying of agents' memories), never for a run; no member or
        service identity pays for them. `principalId` is absent; `keyStatus` null until the key is created.
      responses:
        '200':
          description: The company's own key
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelAccessView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [ModelAccess]
      operationId: updateCompanyKeyModelAccess
      summary: Set or clear the company's own key's budget and models (OWNER and ADMIN)
      description: |
        As `updatePrincipalModelAccess`, for the company's own key. Audited as `model_key.budget_changed` with the
        target `company_model_key` and `holder` `company`; a request that changes nothing is not.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModelAccessUpdateRequest' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelAccessView' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/companies/{companyId}/model-access/company-key/rotate-key:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
    post:
      tags: [ModelAccess]
      operationId: rotateCompanyKey
      summary: Rotate the company's own LiteLLM key now, on suspicion (OWNER and ADMIN)
      description: |
        As `rotatePrincipalModelKey`, for the company's own key: 200 once the next key is in place, 202 while another
        server replica works on it, 502 GATEWAY_UNREACHABLE when LiteLLM failed a step, 409 GATEWAY_NOT_CONFIGURED
        until the gateway passed its test, 409 MODEL_KEYS_MANAGED at a `PROVIDED` gateway. Audited as
        `model_key.rotation_requested` (`scope` `company_key`), then `model_key.rotated` and `model_key.retired`;
        never a key.
      responses:
        '200':
          description: Rotated; the previous key is refused
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelAccessView' }
        '202':
          description: Requested; another replica is working on the key and rotates it in a moment
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelAccessView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '502': { $ref: '#/components/responses/BadGateway' }

  /api/companies/{companyId}/model-access/company-key/key:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
    put:
      tags: [ModelAccess]
      operationId: putCompanyModelKey
      summary: Enter the company's own key at its gateway, for Tinfirm's own requests (OWNER and ADMIN)
      description: |
        Only for a `PROVIDED` gateway (ADR-0094): 409 MODEL_KEYS_MANAGED while Tinfirm makes the company's keys
        itself. The key is the one the company's gateway team made for the holder, with its budget and models; it is
        checked with the gateway's model list before it is kept (400 MODEL_KEY_REFUSED when the gateway refuses it, 502
        GATEWAY_UNREACHABLE when it does not answer), kept as an internal secret and never shown again: the view shows
        its last four characters (`keyHint`). A key entered again replaces the one before. Audited as
        `model_key.provided`; never the key.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModelKeyRequest' }
      responses:
        '200':
          description: The key is kept; the company key's model access
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelAccessView' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '502': { $ref: '#/components/responses/BadGateway' }
    delete:
      tags: [ModelAccess]
      operationId: deleteCompanyModelKey
      summary: Remove the company's own key (OWNER and ADMIN)
      description: |
        Tinfirm forgets the key; its own requests wait for a new one. 409 MODEL_KEYS_MANAGED while Tinfirm makes the
        company's keys. Audited as `model_key.removed`.
      responses:
        '200':
          description: The key is gone; the company key's model access
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelAccessView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/companies/{companyId}/memory-settings:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
    get:
      tags: [MemorySettings]
      operationId: getMemorySettings
      summary: The company's settings of agents' memory (OWNER and ADMIN)
      description: |
        The model that tidies agents' memories every 30 days (ADR-0063, decision 8), on the company's own key
        (ADR-0065), and whether that key allows it now. Without one, or while the key does not allow it, a memory's
        compaction only removes duplicates.
      responses:
        '200':
          description: The memory settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemorySettings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [MemorySettings]
      operationId: putMemorySettings
      summary: Choose the model that tidies agents' memories, or none (OWNER and ADMIN)
      description: |
        `compactionModel` a model the company's own key allows (400 MODEL_NOT_ALLOWED), as the gateway names it; null
        chooses none. Audited as `memory_settings.changed` with the model; a request that changes nothing is not.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MemorySettingsRequest' }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemorySettings' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/companies/{companyId}/runner-hosts:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
    get:
      tags: [RunnerHosts]
      operationId: listRunnerHosts
      summary: The company hosts (OWNER and ADMIN) and the caller's own personal hosts, with their live status
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Runner hosts
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunnerHostPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [RunnerHosts]
      operationId: registerRunnerHost
      summary: Register a company host (OWNER and ADMIN) or the caller's own personal host (any member). The token is returned once.
      description: |
        `scope` defaults to `PERSONAL`: the caller's own host, which only runs their own work. `COMPANY` needs OWNER or
        ADMIN (403 otherwise). Audited as `runner_host.registered` with the scope and, for a personal host, its owner's
        principal. Problems: 409 DUPLICATE_RUNNER_HOST_NAME.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RunnerHostCreateRequest' }
      responses:
        '201':
          description: Registered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunnerHostRegistration' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/companies/{companyId}/runner-hosts/{runnerHostId}:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
      - $ref: '#/components/parameters/RunnerHostId'
    patch:
      tags: [RunnerHosts]
      operationId: updateRunnerHost
      summary: Set or clear the desired number of concurrent runs of a runner host, and a company host's sandbox pool (OWNER/ADMIN for a company host, the owner for a personal one)
      description: |
        The desired value is capped by the host's ceiling (`tinfirm-runner-host run --max-concurrent-runs`): the
        effective value is `min(desired, ceiling)`, or the ceiling without a desired value. A value above the ceiling
        is kept and applies up to the ceiling. A connected host applies the change at once, without a restart; a
        lower value never cancels running runs, it only stops new ones until fewer run. An offline host gets the
        change when it connects. `configPending` is true until the host confirms it. A change is audited as
        `runner_host.updated`; a request that changes nothing is not. A company host is changed by OWNER and ADMIN
        (403 for a member), a personal host by its owner only (404 for anyone else).

        `pool` sets, and `clearPool` removes, how many sandboxes wait ready on a company host that keeps ready
        sandboxes (ADR-0098, ADR-0099; its `pool` is not null): a count when no window applies, and up to 14 weekly
        windows in a time zone. The pool size is the host's number of concurrent runs, and no count may be above it.
        The server evaluates the schedule and sends the host the count; the operator's ceiling (`maxReadyCeiling`)
        bounds what the host keeps. Without settings no sandbox waits. Audited as `runner_host.updated` with
        `changed: pool`.

        Problems: 400 VALIDATION_FAILED (out of range, a value together with its clear, an unknown time zone, a
        window without a zone of its own or the pool's, without days, or with the same start and end, a count above
        the pool size, more than 14 windows); 409 RUNNER_HOST_POOL_UNSUPPORTED (`pool` or `clearPool` for a personal
        host, or for a host that keeps no ready sandboxes).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RunnerHostUpdateRequest' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunnerHost' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [RunnerHosts]
      operationId: deleteRunnerHost
      summary: Revoke and remove a runner host (OWNER/ADMIN for a company host, the owner for a personal one). Its token stops working at once. 409 RUNNER_HOST_HAS_ACTIVE_RUNS while it runs.
      description: |
        Audited as `runner_host.removed`. A member's personal hosts are also removed when they leave the company.
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/companies/{companyId}/conversations/{conversationId}/attachments:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
      - $ref: '#/components/parameters/ConversationId'
    get:
      tags: [Conversations]
      operationId: listAttachments
      summary: The conversation's files, oldest first (its person, OWNER)
      description: |
        The files its person added and the documents its agent saved (a `save_artifact` file, a file left in
        `/output`); a document of an output names it in `outputId`. A conversation the caller may not see is 404.
      responses:
        '200':
          description: Attachments
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Attachment' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Conversations]
      operationId: uploadAttachment
      summary: Add a file to the conversation; its turns get it under /attachments (its person)
      description: |
        Scanned for credentials before it is stored (ADR-0014): the value of a vault secret of the company is refused
        always, and a known credential format unless the person is OWNER or ADMIN and acknowledges it
        (`acknowledgeCredentialMatch`), both `422 CREDENTIAL_FOUND` with what matched, never the value; content that
        cannot be scanned completely is `422 ATTACHMENT_NOT_SCANNABLE`. The name is the last segment of the file's
        name, unique in the conversation (`409 DUPLICATE_ATTACHMENT_NAME`). At most 25 MB a file
        (`413 ATTACHMENT_TOO_LARGE`), 50 files and 250 MB per conversation (`409 TOO_MANY_ATTACHMENTS`). OWNER, who
        sees the conversation but is not its person, gets `409 CONVERSATION_BOUND`; an ended conversation takes no
        file (`409 CONVERSATION_ENDED`). Audited as `attachment.uploaded`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                note: { type: string, maxLength: 2000 }
                acknowledgeCredentialMatch: { type: boolean, default: false }
      responses:
        '201':
          description: Stored
          headers:
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Attachment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /api/companies/{companyId}/conversations/{conversationId}/attachments/{attachmentId}:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
      - $ref: '#/components/parameters/ConversationId'
      - $ref: '#/components/parameters/AttachmentId'
    get:
      tags: [Conversations]
      operationId: downloadAttachment
      summary: Download a file of the conversation, or an output's document (its person, OWNER)
      description: |
        The file as it was stored, as an attachment (`Content-Disposition: attachment`) of its stored content type,
        never rendered inline.
      responses:
        '200':
          description: The file
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/Gone' }
    delete:
      tags: [Conversations]
      operationId: deleteAttachment
      summary: Delete a file of the conversation (its person)
      description: |
        The document of an output stays while the output does (`409 ATTACHMENT_IS_OUTPUT`). OWNER gets
        `409 CONVERSATION_BOUND`. Audited as `attachment.deleted`.
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/companies/{companyId}/runs/{runId}:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
      - $ref: '#/components/parameters/RunId'
    get:
      tags: [Runs]
      operationId: getRun
      summary: One run (its conversation's person, OWNER)
      responses:
        '200':
          description: Run
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Run' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/companies/{companyId}/runs/{runId}/cancel:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
      - $ref: '#/components/parameters/RunId'
    post:
      tags: [Runs]
      operationId: cancelRun
      summary: Cancel a queued or running run (its conversation's person, OWNER)
      description: |
        Idempotent. A QUEUED run is CANCELLED at once, and its turn with it; a RUNNING run gets a durable cancel command
        that its runner host answers with `run.finished`, sent again when the host reconnects. Audited as
        `run.cancelled`. The conversation stays open.
      responses:
        '200':
          description: Cancelled (or already ended)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Run' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/companies/{companyId}/runs/{runId}/events:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
      - $ref: '#/components/parameters/RunId'
    get:
      tags: [Runs]
      operationId: listRunEvents
      summary: Events of a run after a sequence number, oldest first (its conversation's person, OWNER)
      description: |
        With `types`, only events of those types, as a conversation reads what the agent said in a turn whose work is
        folded (`AGENT_MESSAGE`, `USAGE`) without its tool calls. Sequence numbers keep their gaps, where the events of
        the other types are. `limit` counts the events returned, and `complete` is as without `types`.
      parameters:
        - $ref: '#/components/parameters/AfterSeq'
        - name: types
          in: query
          required: false
          style: form
          explode: false
          schema:
            type: array
            maxItems: 11
            items: { $ref: '#/components/schemas/RunEventType' }
        - name: limit
          in: query
          required: false
          schema: { type: integer, format: int32, minimum: 1, maximum: 1000, default: 500 }
      responses:
        '200':
          description: Events
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunEventPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/companies/{companyId}/runs/{runId}/events/stream:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
      - $ref: '#/components/parameters/RunId'
    get:
      tags: [Runs]
      operationId: streamRunEvents
      summary: Live events of a run as server-sent events (its conversation's person, OWNER)
      description: |
        A `run-status` event with the current Run first, then `run-event` frames (the only ones with an `id:`),
        replayed after `afterSeq` or the `Last-Event-ID` header (the later of the two), then live; another
        `run-status` when the status or a queued run's reason changes; a keep-alive comment every 15 s; closed with a
        final `run-status` when the run ends, or after `TINFIRM_RUN_STREAM_TIMEOUT` (30 minutes), after which the
        client reconnects with `Last-Event-ID`.
      parameters:
        - $ref: '#/components/parameters/AfterSeq'
        - name: Last-Event-ID
          in: header
          required: false
          description: Sent by EventSource on reconnect
          schema: { type: integer, format: int64, minimum: 0 }
      responses:
        '200':
          description: Event stream
          content:
            text/event-stream:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/companies/{companyId}/conversations:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
    get:
      tags: [Conversations]
      operationId: listConversations
      summary: The conversations the caller sees, newest activity first (any member)
      description: |
        A member's own conversations (they are its person); OWNER sees every conversation of the company, and may
        filter by `personId`. An ADMIN who is not OWNER sees only their own (the package 3 contract, §5.10). A
        trigger's conversations are seen by its author, its team and OWNER and ADMIN (the package 4 contract, §5.13).
        `agentId` names an agent the caller sees or one of their conversations' agents; any other (another
        company's, an unknown id) is 404.
      parameters:
        - name: agentId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: subjectSystemId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: subjectKey
          in: query
          required: false
          schema: { type: string, maxLength: 200 }
        - name: state
          in: query
          required: false
          schema: { $ref: '#/components/schemas/ConversationState' }
        - name: waitingOn
          in: query
          required: false
          schema: { $ref: '#/components/schemas/ConversationWaitingOn' }
        - name: personId
          in: query
          required: false
          description: OWNER only, the person's principal; ignored for anyone else
          schema: { type: string, format: uuid }
        - name: triggerId
          in: query
          required: false
          description: A trigger's conversations, for its audience (the package 4 contract, §5.13); none for anyone else
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Conversations
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Conversations]
      operationId: startConversation
      summary: Start a conversation with an agent the caller may use (who may use the agent)
      description: |
        The caller is its person: it acts for them, they pay for it and they see it (with OWNER). Its key is
        `{base}-{n}`, its title the message's first line; its runtime and model access are the caller's settings of
        the agent at the start (made on first use), and stay for its life. The workspace is `repositoryIds` (each a
        repository of the agent; an empty list for none), else the settings' default repositories, else every
        repository of the agent. The message is the first turn, queued at once; the workspace's systems are bound
        (§5.3). Audited as `conversation.started`. Problems: 400 VALIDATION_FAILED; 403 AGENT_NOT_USABLE; 409
        TOO_MANY_REPOSITORIES (more than 20 without a choice), MODEL_ACCESS_UNAVAILABLE and NO_HOST_FOR_CONVERSATION
        (with `details.reason`: what can never run). A spent budget or an offline host does not refuse the start: the first turn waits.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConversationStartRequest' }
      responses:
        '201':
          description: Started, with its first turn
          headers:
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Conversation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /api/companies/{companyId}/subjects:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
    get:
      tags: [Conversations]
      operationId: listSubjects
      summary: The subjects of the conversations the caller sees, with counts (any member)
      description: |
        The app's grouping by subject, by key; conversations without a subject are not counted. `systemId` keeps the
        subjects on one system.
      parameters:
        - name: systemId
          in: query
          required: false
          description: Only the subjects on this system
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Subjects
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubjectPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/companies/{companyId}/conversations/{conversationId}:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
      - $ref: '#/components/parameters/ConversationId'
    get:
      tags: [Conversations]
      operationId: getConversation
      summary: One conversation (its person, OWNER)
      description: |
        Its messages, turns (runs), decisions, outputs, attachments, bindings, workspace, hosts, who pays and what its
        settled turns cost (`cost`, as the caller sees spend). OWNER sees every conversation in full, which
        `seenByOwner` tells its person; anyone else gets 404. Every read by OWNER, or an instance admin, who is not its
        person is audited as `conversation.read`, with no throttle; so is every read of its runs, run events and stream
        (once, when it opens), files, decisions and the lists.
      responses:
        '200':
          description: Conversation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Conversation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Conversations]
      operationId: renameConversation
      summary: Rename a conversation (its person)
      description: 'Problems: 400 VALIDATION_FAILED; 409 CONVERSATION_BOUND (OWNER, who is not its person).'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConversationUpdateRequest' }
      responses:
        '200':
          description: Renamed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Conversation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/companies/{companyId}/conversations/{conversationId}/messages:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
      - $ref: '#/components/parameters/ConversationId'
    post:
      tags: [Conversations]
      operationId: postConversationMessage
      summary: Say something in the conversation (its person)
      description: |
        The next turn, or a message that waits for it: a message sent while a turn is queued waits, and the next turn
        takes every waiting message, oldest first. One sent while a turn runs reaches that turn after the agent's
        current step when its runner host and runtime take it (steering, ADR-0060; `ConversationMessage.steering`),
        else it waits too. While decisions are open a plain message wakes nothing; with `answersOpenQuestions` it
        answers every open question (ADR-0033). Problems: 400 VALIDATION_FAILED; 409 CONVERSATION_ENDED,
        CONVERSATION_BOUND (OWNER, who is not its person); 409 PLACE_IS_EXTERNAL for a trigger's conversation whose
        place is a tracker issue or a chat thread, which takes a message here only with `answersOpenQuestions` while
        the agent has a question open; 409 AGENT_NOT_USABLE when the conversation's person may no longer use its
        agent (its share was removed, or they left its group), whose queued turns wait until it is shared again.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConversationMessageRequest' }
      responses:
        '201':
          description: Said; the conversation as it is now
          headers:
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Conversation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /api/companies/{companyId}/conversations/{conversationId}/cancel:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
      - $ref: '#/components/parameters/ConversationId'
    post:
      tags: [Conversations]
      operationId: cancelConversation
      summary: Cancel the conversation's turn (its person, OWNER)
      description: |
        Cancels the active run (a queued one at once, a running one through its host), the open decisions and the
        parked calls; waiting messages stay unanswered; the conversation stays open, its turn `CANCELLED`. Problems: 409
        CONVERSATION_ENDED.
      responses:
        '200':
          description: Cancelled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Conversation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/companies/{companyId}/conversations/{conversationId}/retry:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
      - $ref: '#/components/parameters/ConversationId'
    post:
      tags: [Conversations]
      operationId: retryConversation
      summary: Run the last turn's request again (its person, OWNER)
      description: |
        When the last turn `FAILED` or was `CANCELLED` and nothing is active; bindings and model access are checked
        again. Problems: 409 CONVERSATION_ENDED, TURN_ACTIVE, NOTHING_TO_RETRY; 409 AGENT_NOT_USABLE when the
        conversation's person may no longer use its agent.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The retried turn is queued
          headers:
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Conversation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /api/companies/{companyId}/conversations/{conversationId}/end:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
      - $ref: '#/components/parameters/ConversationId'
    post:
      tags: [Conversations]
      operationId: endConversation
      summary: End the conversation, for good (its person, OWNER)
      description: |
        Idempotent. Waiting messages stay unanswered; a running turn finishes and its result is recorded; open
        decisions are cancelled and parked calls dropped; waiting bindings stay as they are, and nothing asks for them
        once the conversation has ended. An ended conversation takes nothing more (`CONVERSATION_ENDED`). Audited as
        `conversation.ended`.
      responses:
        '200':
          description: Ended
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Conversation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/companies/{companyId}/conversations/{conversationId}/stream:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
      - $ref: '#/components/parameters/ConversationId'
    get:
      tags: [Conversations]
      operationId: streamConversation
      summary: A conversation's changes as server-sent events, signals only (whoever sees it, as its read)
      description: |
        Signals, never content: a `conversation-status` event first (`ConversationStatus`: its state, what it waits
        on, its turn's status, its active run); then, after each committed change, a `conversation-changed` event
        (`ConversationChanged`) naming the parts that changed, on which the client reads the conversation again
        (`getConversation`); and `conversation-status` again when that summary changed, so the client follows the
        active run's own stream (`streamRunEvents`) as `activeRunId` changes. No event has an `id`: a reconnect reads
        the conversation again. A keep-alive comment every 15 s (`tinfirm.run.stream-keep-alive`, as the run stream's);
        closed with a final `conversation-status` once the conversation ends, after `TINFIRM_RUN_STREAM_TIMEOUT` (30
        minutes; the client opens it again), or without another event as soon as the caller no longer sees it: every
        signal and keep-alive checks the company's access again (a member removed or suspended, a role lowered, a user
        deactivated) and the conversation's visibility. Opening it is not a `conversation.read`: the client's reads
        are, as with polling. 404 as `getConversation` answers; 403 PRINCIPAL_SUSPENDED for a suspended member. One
        replica, as the run stream.
      responses:
        '200':
          description: Event stream
          content:
            text/event-stream:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/companies/{companyId}/conversations/{conversationId}/bindings/{systemId}/choose:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
      - $ref: '#/components/parameters/ConversationId'
      - $ref: '#/components/parameters/SystemId'
    post:
      tags: [Conversations]
      operationId: chooseConversationBinding
      summary: Pick a grant, or reconnect one's own account, for a waiting binding (its person)
      description: |
        On `PICK_GRANT` or `CHOOSE`: `grantId` among the binding's `choices` binds it (`CHOSEN`); `reconnect` turns
        `CHOOSE` into `RECONNECT_YOURS` (and `PICK_GRANT` into `NONE`: connect one's own). Audited as
        `conversation.binding.bound` or `.waiting`. Problems: 400 VALIDATION_FAILED (neither or both), GRANT_NOT_OFFERED;
        409 BINDING_NOT_WAITING, CONVERSATION_ENDED, CONVERSATION_BOUND.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConversationBindingChooseRequest' }
      responses:
        '200':
          description: The binding as it is now
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationBinding' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/companies/{companyId}/conversations/{conversationId}/bindings/{systemId}/continue:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
      - $ref: '#/components/parameters/ConversationId'
      - $ref: '#/components/parameters/SystemId'
    post:
      tags: [Conversations]
      operationId: continueConversationBinding
      summary: Resolve a waiting binding again, after connecting an account (its person)
      description: |
        By the same rule as at its first use, never by a fallback; also done on package 1's events. Idempotent: a
        binding bound already (the same connect's event, or another continue, settled it a moment earlier) is answered
        as it is, 200, and nothing changes. Problems: 409 BINDING_NOT_WAITING (a gone binding), CONVERSATION_ENDED,
        CONVERSATION_BOUND.
      responses:
        '200':
          description: The binding as it is now
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationBinding' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/companies/{companyId}/decisions:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
    get:
      tags: [Decisions]
      operationId: listDecisions
      summary: The decisions of the conversations the caller sees, newest first (their person, OWNER)
      description: |
        A person sees their own conversations' decisions; OWNER sees every conversation's. `open=true` keeps the open
        ones, `mine=true` those the caller decides.
      parameters:
        - name: open
          in: query
          required: false
          description: Only the open decisions
          schema: { type: boolean, default: false }
        - name: mine
          in: query
          required: false
          description: Only the decisions the caller decides
          schema: { type: boolean, default: false }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Decisions
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DecisionPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/companies/{companyId}/decisions/{decisionId}:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
      - $ref: '#/components/parameters/DecisionId'
    get:
      tags: [Decisions]
      operationId: getDecision
      summary: One decision (its conversation's person, OWNER)
      responses:
        '200':
          description: Decision
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Decision' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/companies/{companyId}/decisions/{decisionId}/decide:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
      - $ref: '#/components/parameters/DecisionId'
    post:
      tags: [Decisions]
      operationId: decideDecision
      summary: Decide a decision, once (its approver, the conversation's person)
      description: |
        A question: `{answer?, option?}` (at least one; the option one of the question's), also posted as the person's
        message quoting the question's first line. An approval: `{outcome: APPROVED | DENIED, note?, scope?, access?}`.
        `scope` (`CONVERSATION` by default, or `AGENT`: for good, which needs the right to edit the agent, 403
        AGENT_NOT_EDITABLE) applies to an approved repository or host; `access` to an approved repository: the agent's
        access when it lists the repository, else `READ` unless `WRITE` is picked. An approved tool call runs once
        the decision is stored, with the conversation's account, and its result is the decision's `result`; an approved
        change request opens. Approving while the agent is paused is 409 AGENT_PAUSED; answering a question is not.
        Approving a network host is 409 NETWORK_HOST_LIMIT when the conversation (scope `CONVERSATION`) or the agent
        (scope `AGENT`) holds 100 network hosts already; the decision stays open.
        Anyone else who sees the conversation gets 409 CONVERSATION_BOUND; a decision decided or cancelled already 409
        DECISION_DECIDED. Audited as `decision.decided`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DecideRequest' }
      responses:
        '200':
          description: Decided
          headers:
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Decision' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /api/companies/{companyId}/inbox:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
    get:
      tags: [Inbox]
      operationId: getInbox
      summary: What needs the caller now, longest waiting first (every member)
      responses:
        '200':
          description: Inbox
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Inbox' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/companies/{companyId}/inbox/dismissals/{noticeKey}:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
      - $ref: '#/components/parameters/NoticeKey'
    put:
      tags: [Inbox]
      operationId: dismissInboxNotice
      summary: Dismiss a notice of one's own inbox, for oneself (every member)
      description: |
        Hides the notice from the caller's inbox and its `counts.notices` while its `noticeKey` stands. The key holds
        the notice's condition, so the notice comes back once the condition changes: a budget's next threshold or
        period, the company's spend in the next month, a trigger's next pause, wait, dropped write-back or skipped
        firing. Only the caller's own inbox changes, never another member's. Only a notice of the caller's inbox now
        whose `dismissible` is true: one the caller is the one to act on (`DEPARTURE`, `CHAT_SUBSCRIPTION_SILENT`, a
        `TRIGGER` to accept, reassign or reconnect) is `409 NOTICE_NOT_DISMISSIBLE` and leaves once handled. A key that
        is not among the caller's notices is `404`, and so is every key for a caller without a principal in the company
        (an instance admin who is not a member). Dismissing a dismissed notice changes nothing. Not audited: a view of
        one's own inbox (CONVENTIONS §8).
      responses:
        '204': { description: Dismissed }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Inbox]
      operationId: restoreInboxNotice
      summary: Show a dismissed notice again (every member)
      description: |
        Undoes a dismissal: the notice shows in the caller's inbox again while it stands. A key the caller has not
        dismissed changes nothing; a caller without a principal in the company gets `404`. Not audited.
      responses:
        '204': { description: Shown again }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/companies/{companyId}/kill-switches:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
    get:
      tags: [Governance]
      operationId: getKillSwitches
      summary: Every kill switch that is on, as kinds and counts (every member; admins see all of them)
      description: |
        The package 6 contract, §5.4. Admins (OWNER, ADMIN, an instance admin under break-glass) get every switch
        that is on, each with who pulled it, when and why: the company's stop, paused systems (each with the triggers
        its pause paused), suspended members and service identities, paused agents and triggers, and the company's
        switch of personal MCP servers; `counts` gives how many of each kind. A member gets the company's stop and
        their own suspension only. A suspended member may read this page (and the company's own), and nothing else
        in the company (`403 PRINCIPAL_SUSPENDED`).
      responses:
        '200':
          description: The switches that are on
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KillSwitches' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/companies/{companyId}/runs-stop:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
    post:
      tags: [Governance]
      operationId: stopRuns
      summary: Stop every run of the company (OWNER, ADMIN; an instance admin under break-glass)
      description: |
        In one transaction the company is marked and every running or assigned run is cancelled (`run.cancelled`,
        `cause` `company.runs_stopped`). While the stop lasts, queued runs wait `COMPANY_STOPPED`, starting a
        conversation and approving are `409 COMPANY_STOPPED` (answers, denials and messages to open conversations are
        taken, and their turns wait; a direct message to the chat bot likewise starts nothing, and the bot says so at
        most once an hour), an approved call not yet run does not run, the model relay answers `503`, and
        the write-back is held. Triggers fire nothing while polls go on, and webhooks
        answer `503` with `Retry-After`. Audited as `company.runs_stopped`. Stopping a
        stopped company changes nothing and answers the stop as it is.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RunsStopRequest' }
      responses:
        '200':
          description: Stopped
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunsStopResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Governance]
      operationId: liftRunsStop
      summary: Lift the company's stop (OWNER, ADMIN; an instance admin under break-glass)
      description: |
        The queue is dispatched again, the held write-back released and every active trigger armed again at the lift,
        without a resume of each: the stated exception to package 4's decision 9 (the package 6 contract, open point
        7). Every other switch pulled meanwhile stays on, and the answer lists them by kind. Audited as
        `company.runs_resumed`. Lifting a company that is not stopped changes nothing.
      responses:
        '200':
          description: Lifted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunsLiftResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/companies/{companyId}/systems/{systemId}/pause:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
      - $ref: '#/components/parameters/SystemId'
    post:
      tags: [Governance]
      operationId: pauseSystem
      summary: Pause a company system (OWNER, ADMIN)
      description: |
        Every use of its accounts and credentials stops: `Accounts.check` answers `SYSTEM_PAUSED`, its tools are not
        listed in the next turns and a call from an earlier list is refused `TOOL_DENIED`, a queued turn whose
        workspace holds one of its repositories waits `SYSTEM_PAUSED`, and testing, refreshing its tools and connecting
        accounts on it are `409 SYSTEM_PAUSED`. Bindings keep their state. With `stopRunning`, the running turns of the
        conversations bound to it are cancelled (`run.cancelled`, `cause` `system.paused`). Its triggers pause
        `SYSTEM_PAUSED`. A paused chat system's events are verified and dropped (`SYSTEM_PAUSED`), its bot posts
        nothing, and the posts of its direct messages' conversations wait for the resume. A personal MCP server is
        `400 PERSONAL_SYSTEM`: the company's switch of personal servers stops those. Audited as `system.paused`;
        pausing a paused system changes nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SystemPauseRequest' }
      responses:
        '200':
          description: Paused
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemPauseResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/companies/{companyId}/systems/{systemId}/resume:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
      - $ref: '#/components/parameters/SystemId'
    post:
      tags: [Governance]
      operationId: resumeSystem
      summary: Resume a paused system, and with it the triggers its pause paused (OWNER, ADMIN)
      description: |
        `resumeTriggers` (on by default) resumes each trigger the pause paused through package 4's gate, with its
        `armed_at` moved to the resume, so nothing of the pause fires; one the gate stops stays paused with its new
        reason, and one left out stays `SYSTEM_PAUSED` until resumed by hand. Waiting turns go on. Audited as
        `system.resumed`; resuming a system that is not paused changes nothing.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SystemResumeRequest' }
      responses:
        '200':
          description: Resumed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemResumeResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/companies/{companyId}/members/{userId}/suspend:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
      - $ref: '#/components/parameters/UserId'
    post:
      tags: [Governance]
      operationId: suspendMember
      summary: Suspend a member (OWNER, ADMIN; an OWNER's needs OWNER)
      description: |
        The member's principal becomes `SUSPENDED`: they act, pay, write and decide nothing in the company. Every write
        of theirs there is `409 PRINCIPAL_SUSPENDED`, every read but the company's page and the kill switches' `403
        PRINCIPAL_SUSPENDED`, and their bearer credentials (personal tokens, OAuth grants) answer `404`; their direct
        messages and presses in a chat are refused as a non-member's, told once an hour. Their key is
        blocked, their bindings stop, and their running turns are cancelled after the commit (`run.cancelled`,
        `cause` `principal.suspended`). Nobody suspends themselves (`409 CANNOT_SUSPEND_SELF`), nor the last active
        OWNER (`409 LAST_OWNER`). Audited as `principal.suspended` with the member's `userId`, never their name.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SuspendRequest' }
      responses:
        '200':
          description: Suspended
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberSuspension' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/companies/{companyId}/members/{userId}/resume:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
      - $ref: '#/components/parameters/UserId'
    post:
      tags: [Governance]
      operationId: resumeMember
      summary: Resume a suspended member (OWNER, ADMIN; an OWNER's needs OWNER)
      description: |
        Their waiting turns go on; the triggers their suspension paused stay paused until resumed by hand. A suspension
        an instance admin's deactivation of the user made (`USER_DEACTIVATED`) is lifted only by reactivating the user
        (`409 PRINCIPAL_SUSPENDED`). Audited as `principal.resumed`.
      responses:
        '200':
          description: Active
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberSuspension' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/companies/{companyId}/members/{userId}/departure:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Governance]
      operationId: previewDeparture
      summary: What removing the member will do (OWNER, ADMIN)
      responses:
        '200':
          description: The preview
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeparturePreview' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/companies/{companyId}/departures:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
    get:
      tags: [Governance]
      operationId: listOpenDepartures
      summary: The members who left and whose checklist is not closed (OWNER, ADMIN)
      description: |
        Newest departure first, at most 500: each with the principal its checklist is read by
        (`GET /principals/{principalId}/departure`), the user and the name; the same as the admins' `DEPARTURE` inbox
        items, without reading the inbox.
      responses:
        '200':
          description: The open departures
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DepartureSummaryList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/companies/{companyId}/principals/{principalId}/departure:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
      - $ref: '#/components/parameters/PrincipalId'
    get:
      tags: [Governance]
      operationId: getDeparture
      summary: The checklist of a member who left (OWNER, ADMIN)
      description: |
        Computed from the state: the triggers paused `AUTHOR_LEFT`, the groups they were in
        that have no member now, the system credentials they connected, the agents passed to the admins, the
        open change requests their conversations opened with their own account, and how many personal conversations
        of theirs ended. The first three keep the checklist open. A principal that is not a member who left is `404`.
      responses:
        '200':
          description: The checklist
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Departure' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/companies/{companyId}/principals/{principalId}/departure/close:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
      - $ref: '#/components/parameters/PrincipalId'
    post:
      tags: [Governance]
      operationId: closeDeparture
      summary: Close the checklist of a member who left (OWNER, ADMIN)
      description: |
        Only once its paused triggers, emptied groups and connected accounts are resolved (`409 DEPARTURE_OPEN`), or
        with `force` when an admin accepts what remains. The admins' `DEPARTURE` item goes with it. Audited as
        `principal.departure_closed` with `force` and the counts of what stayed open. Closing a closed checklist
        changes nothing.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DepartureCloseRequest' }
      responses:
        '200':
          description: Closed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Departure' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/companies/{companyId}/agents/{agentId}/owner:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
      - $ref: '#/components/parameters/AgentId'
    put:
      tags: [Agents]
      operationId: setAgentOwner
      summary: Give an agent a new owner, a member (OWNER, ADMIN)
      description: |
        The package 6 contract, open point 13: an agent whose owner left passed to the admins; admins may give any
        agent a new owner, an active member of the company, who then edits it as its creator did. Audited as
        `agent.owner_changed`; giving it to its owner changes nothing. Problems: 400 VALIDATION_FAILED (not an active
        member's principal).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentOwnerRequest' }
      responses:
        '200':
          description: The agent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Agent' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/companies/{companyId}/spend:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
    get:
      tags: [Spend]
      operationId: getSpend
      summary: Spend over a range, grouped and filtered, within what the caller may see (every member)
      description: |
        `from` inclusive and `to` exclusive, dates in `zone` (IANA, default `UTC`); by default the current calendar
        month in `zone`; at most 366 days. A run counts on the moment it ended. At most two `groupBy` dimensions;
        `period` buckets by `bucket` (`DAY`, `WEEK` from Monday, `MONTH`) in `zone`. 400 SPEND_RANGE_INVALID for a
        longer range, `to` not after `from`, more than two groupings or an unknown zone. Filters apply after the
        caller's scope (G1): a filter on something the caller may not see answers no rows, never 404. With
        `Accept: text/csv` the same rows come as CSV (at most 100 000, audited `spend.exported` with the filters, the
        grouping and the row count).
      parameters:
        - { name: from, in: query, required: false, schema: { type: string, format: date } }
        - { name: to, in: query, required: false, schema: { type: string, format: date } }
        - { name: zone, in: query, required: false, schema: { type: string, maxLength: 64 } }
        - name: groupBy
          in: query
          required: false
          style: form
          explode: false
          schema:
            type: array
            maxItems: 7
            items: { $ref: '#/components/schemas/SpendDimension' }
        - name: bucket
          in: query
          required: false
          schema: { type: string, enum: [DAY, WEEK, MONTH], default: DAY }
        - { name: payerId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: actorId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: agentId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: triggerId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: conversationId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: model, in: query, required: false, schema: { type: string, maxLength: 200 } }
        - name: source
          in: query
          required: false
          schema: { $ref: '#/components/schemas/SpendSource' }
      responses:
        '200':
          description: The spend
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SpendReport' }
            text/csv:
              schema: { type: string }
  /api/companies/{companyId}/triggers:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
    get:
      tags: [Triggers]
      operationId: listTriggers
      summary: The triggers the caller sees, by name (any member)
      description: |
        The live triggers the caller authored or whose team they are in, and for OWNER and ADMIN every live trigger
        of the company (the package 4 contract, §5.1, §6, T15), each with its sentence, status, health, author, team,
        payer and last firing. Anything else is left out. `accountHolderPrincipalId` keeps those with a row whose
        holder is that principal (`trigger_account.holder_principal_id`): the author, for a row that names their own
        account, or a service identity, for a row that names a credential it borrows (a service account's page); among
        the same.
      parameters:
        - { name: systemId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: agentId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: authorId, in: query, required: false, description: "The author's principal", schema: { type: string, format: uuid } }
        - { name: teamGroupId, in: query, required: false, schema: { type: string, format: uuid } }
        - name: status
          in: query
          required: false
          schema: { $ref: '#/components/schemas/TriggerStatus' }
        - name: accountHolderPrincipalId
          in: query
          required: false
          description: "Only the triggers with a row whose holder is this principal: the author, for a row that names their own account, or a service identity, for a row that names a credential it borrows"
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Triggers
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TriggerPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Triggers]
      operationId: createTrigger
      summary: Create a trigger; the caller becomes its author (who may use the agent)
      description: |
        Checked whole (§5.2): the agent, live and used by the caller, its shown version accepted; the source and the
        rules of ADR-0043 (400 INVALID_TRIGGER, SYSTEM_KIND_INVALID); each row through `Accounts.bind(Trigger)`
        (400 ACCOUNT_NOT_ENTITLED with `details.systemId`, also for a chat link, which acts with nothing; 400
        BOT_ACCOUNT for a chat system's bot; 400 SOURCE_ACCOUNT_REQUIRED; 400 ACCOUNT_READ_ONLY with
        `details.systemId` when the source row's credential is lent read-only to the service account it acts through
        while the results write there, a comment or an action); the payer (400
        MODEL_ACCESS_NOT_ENTITLED; 409 MODEL_ACCESS_UNAVAILABLE with `details.reason`); the hosts (409
        CANNOT_RUN_ANYWHERE); the settings (400 MODEL_NOT_ALLOWED, MODEL_REQUIRED, SETTINGS_WIDEN,
        RUNTIME_NOT_LISTED); the team; the open events' acknowledgement, needed for every `ALLOW` write tool the open
        events would run, with the author's own account or a credential lent to a service account alike (400
        OPEN_EVENTS_NOT_ACKNOWLEDGED; D2); the firing limit (400 TRIGGER_LIMIT_TOO_HIGH). A credential lent to a service
        account that a trigger on any source but a schedule acts with is recorded the first time, and whoever lent it is
        told in their inbox (`CREDENTIAL_EXPOSED_TO_OPEN_SOURCE`).
        A `CHANNEL` trigger's channels, for its author (the package 5 contract, §5.7): 409 BOT_NOT_SET when the chat
        system has no bot; 400 CHANNEL_UNAVAILABLE with `details.channelId` for a channel the bot is not in, or one
        archived, deleted or shared with another organisation; 400 CHANNEL_NOT_JOINED when the author has not linked
        their chat account on the system, or, with `details.channelId`, is not a member of a channel; 409 CHANNEL_TAKEN
        with `details.channelId` and `details.triggerId` when the agent answers in that channel already for another
        trigger, or when this trigger marks the channel as its default and another trigger is the channel's default
        already.
        403 AGENT_NOT_USABLE; 409 DUPLICATE_TRIGGER_NAME, TOO_MANY_TRIGGERS (a source system's 100 live triggers,
        whatever their source, or the company's 50 schedules). Audited as `trigger.created`,
        `trigger.accounts_changed`, `trigger.settings_changed` and, when given, `trigger.open_events_acknowledged`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TriggerCreateRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Trigger' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/companies/{companyId}/triggers/choices:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
    get:
      tags: [Triggers]
      operationId: getTriggerChoices
      summary: The editor's one choice of whose accounts and budget a trigger uses (who may use the agent)
      description: |
        The caller and the service identities they may use (service identities first while the events are open to
        anyone, §5.8), each with what it acts with on every system the trigger would need (the source and the agent's
        systems: the caller's own account, or the credential a service identity borrows there) and its status, its
        budget's state and models, and the systems it would leave unavailable (§5.2, the one choice). With `forPrincipalId`, those of that member instead, as a save checks them for the trigger's author
        (§11): only OWNER and ADMIN, and only for the trigger they name (`triggerId`, else 400 VALIDATION_FAILED): its
        author, for an edit on the author's behalf, or a new author for a trigger that may be reassigned (paused
        `AUTHOR_LEFT`, `NOT_ENTITLED` or `TO_ACCEPT`), a member who holds a seat; anyone else, or another member, 403
        (the security review of 2026-10-27, H2). On the author's behalf the author's own accounts are offered only where
        the trigger's rows name them already, and a new author's never: only the author adds their own accounts. 400
        VALIDATION_FAILED for a principal that is not a member of the company, left, or is a Viewer for a reassignment;
        403 AGENT_NOT_USABLE when that member may not use the agent.
      parameters:
        - { name: agentId, in: query, required: false, description: 'The agent (required: else 400 VALIDATION_FAILED)', schema: { type: string, format: uuid } }
        - { name: systemId, in: query, required: false, description: The source system; none for a schedule, schema: { type: string, format: uuid } }
        - name: forPrincipalId
          in: query
          required: false
          description: "Whose choices: a member's principal, the trigger's author; absent: the caller's own"
          schema: { type: string, format: uuid }
        - name: triggerId
          in: query
          required: false
          description: "With `forPrincipalId` for another member: the trigger edited on its author's behalf, or reassigned"
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The choices
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TriggerChoices' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/companies/{companyId}/triggers/preview:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
    post:
      tags: [Triggers]
      operationId: previewTrigger
      summary: Who acts and who pays for a draft or a change, storing nothing (who may use the agent)
      description: |
        §5.2's checks and answer (§5.2, §5.8): per system the account, its holder and status, and the systems left
        unavailable; the payer, its model access and budget, or the wait or refusal; whether a host can run it; the
        trigger as one sentence; `openToAnyone`; a schedule's next three firings; for a change (`triggerId`), how many
        open conversations keep the accounts they started with. A check that refuses is answered as the save would
        be, but for the open events' acknowledgement: a draft that needs it and does not give it (nor did the trigger
        before) is answered with `openToAnyone.acknowledgementMissing` and the save's sentence in `warnings`, so that
        the editor shows what it means before the person acknowledges it; the save still refuses it (400
        OPEN_EVENTS_NOT_ACKNOWLEDGED). Nothing is stored or audited.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TriggerPreviewRequest' }
      responses:
        '200':
          description: The preview
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TriggerPreview' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/companies/{companyId}/triggers/{triggerId}:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
      - $ref: '#/components/parameters/TriggerId'
    get:
      tags: [Triggers]
      operationId: getTrigger
      summary: A trigger (its audience)
      description: |
        The trigger, its table with each row's status, its payer, the settings' model access, the accepted version and
        a pending widening, its health and counts, and what the caller may do with it. 404 to anyone but its author,
        its team and admins (T15).
      responses:
        '200':
          description: The trigger
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Trigger' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Triggers]
      operationId: updateTrigger
      summary: Change a trigger's definition (its author; admins on the author's behalf)
      description: |
        Name, instruction, events, subject, scope, conditions, repeat, schedule, team, results and the firing limit;
        absent fields stay; checked whole (§5.2) for the author, never for an admin's own entitlement (§11; 400
        ACCOUNT_READ_ONLY when the results write while the source row's credential is lent read-only). An admin's change
        on the author's behalf names the author's own accounts and MCP servers only where the trigger had them (403
        AUTHOR_ACCOUNT_NOT_ADMINS, H2), here and in `replaceTriggerAccounts`, `saveTriggerSettings` and the preview. Audited as
        `trigger.changed` with the fields and the editor; an admin's change also reaches the author's inbox. A team's
        change moves the open approvals of its conversations (`decision.approver_changed`). 403 TRIGGER_NOT_EDITABLE
        for its team. A `CHANNEL` trigger's channels are checked as on create (409 BOT_NOT_SET; 400
        CHANNEL_UNAVAILABLE and 409 CHANNEL_TAKEN with their details), and the author's membership (400
        CHANNEL_NOT_JOINED) only for the channels the change adds.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TriggerUpdateRequest' }
      responses:
        '200':
          description: Changed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Trigger' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Triggers]
      operationId: deleteTrigger
      summary: Delete a trigger (its author, admins)
      description: |
        A soft delete (§5.11): the trigger stays for its conversations' history and its name is free again; its open
        conversations end `TRIGGER_DELETED`, its undelivered write-back is dropped, and its poll goes idle when no other
        trigger needs it. Audited as `trigger.deleted`. 403 TRIGGER_NOT_EDITABLE for its team.
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/companies/{companyId}/triggers/{triggerId}/accounts:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
      - $ref: '#/components/parameters/TriggerId'
    put:
      tags: [Triggers]
      operationId: replaceTriggerAccounts
      summary: Replace a trigger's account table and payer (its author; admins on the author's behalf)
      description: |
        As a whole, checked as a save (§5.2) for the author (400 ACCOUNT_READ_ONLY with `details.systemId` for a
        source row whose credential is lent read-only while the results write); an admin's on the author's behalf names
        no account of the author's own that the table did not hold (403 AUTHOR_ACCOUNT_NOT_ADMINS with
        `details.systemId`, H2); open conversations keep the accounts they started with. Audited as
        `trigger.accounts_changed` with the whole table and the payer. 403 TRIGGER_NOT_EDITABLE.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TriggerAccountsRequest' }
      responses:
        '200':
          description: The trigger
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Trigger' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/companies/{companyId}/triggers/{triggerId}/settings:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
      - $ref: '#/components/parameters/TriggerId'
    get:
      tags: [Triggers]
      operationId: getTriggerSettings
      summary: A trigger's settings of its agent (its audience)
      description: Package 3's settings, for the trigger (§3.3), with the version its author accepted.
      responses:
        '200':
          description: The settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentSettings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Triggers]
      operationId: saveTriggerSettings
      summary: Save a trigger's settings (its author; admins on the author's behalf)
      description: |
        As a whole, with package 3's checks for the trigger (§3.3, §5.2 step 6): the model against the payer's models
        (400 MODEL_NOT_ALLOWED), a model with the model access `BUDGET` (400 MODEL_REQUIRED), a subscription only when
        the company allows one for a trigger (`triggerSubscriptions` of `PUT /settings`, off by default) and the payer
        is the author, on the author's own host (400 SUBSCRIPTION_NOT_SERVING; ADR-0085, decision 7), narrowing
        only, and the author's own MCP servers only while every row of the table is the author's own account (400
        SETTINGS_WIDEN, T3), and an admin's on the author's behalf none that the settings did not hold (403
        AUTHOR_ACCOUNT_NOT_ADMINS, H2). No `instructions`: the trigger's own instruction is in every turn (400
        VALIDATION_FAILED). Audited as `trigger.settings_changed`. 403 TRIGGER_NOT_EDITABLE.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentSettingsRequest' }
      responses:
        '200':
          description: The settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentSettings' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/companies/{companyId}/triggers/{triggerId}/accept:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
      - $ref: '#/components/parameters/TriggerId'
    post:
      tags: [Triggers]
      operationId: acceptTriggerWidening
      summary: Accept the agent's widening, or a trigger reassigned to the caller (its author only)
      description: |
        Up to the version the app showed (1 to the current: else 400 VALIDATION_FAILED); a version at or below the
        accepted one changes nothing. Audited as `trigger.accepted` with the version and the previous one. Only its
        author accepts: an admin never does on the author's behalf (403 TRIGGER_NOT_EDITABLE; the security review of
        2026-10-27, H2).
        A trigger reassigned to the caller (paused `TO_ACCEPT`) is accepted whole: its accounts and payer, checked for
        the caller as their own save would be, and the open events' acknowledgement where its open events would write
        without approval (`acknowledgeOpenEvents`; else 400 OPEN_EVENTS_NOT_ACKNOWLEDGED); it then resumes through the
        gate (409 TRIGGER_PAUSED with `details.reason` when the gate refuses, and nothing is accepted). Audited as
        `trigger.accepted` with `reassignment`, the accounts and the payer, and `trigger.resumed`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TriggerAcceptRequest' }
      responses:
        '200':
          description: The trigger
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Trigger' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/companies/{companyId}/triggers/{triggerId}/memory:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
      - $ref: '#/components/parameters/TriggerId'
    get:
      tags: [Triggers]
      operationId: getTriggerMemory
      summary: A trigger's memory, its proposals included (its audience)
      description: |
        The notes the trigger's agent keeps for the trigger (ADR-0063), written in its conversations while memory is
        in effect (the agent allows it and the trigger's settings turned it on). A note a conversation writes is
        `PROPOSED`: no conversation reads it until the trigger's audience accepts it. Reading them is not audited.
      responses:
        '200':
          description: The memory
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemoryNotes' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Triggers]
      operationId: clearTriggerMemory
      summary: Delete every note of a trigger's memory (its audience)
      description: Its author, its team, OWNER and ADMIN. Audited as `memory.cleared` with the count, when any went.
      responses:
        '200':
          description: The memory, empty
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemoryNotes' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/companies/{companyId}/triggers/{triggerId}/memory/{noteNumber}:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
      - $ref: '#/components/parameters/TriggerId'
      - $ref: '#/components/parameters/NoteNumber'
    delete:
      tags: [Triggers]
      operationId: deleteTriggerMemoryNote
      summary: Reject a proposal, or delete a note, of a trigger's memory (its audience)
      description: |
        Its author, its team, OWNER and ADMIN. Audited as `memory.deleted` (`by` `OWNER`, with the note's `state`).
        404 when the memory has no note of that number.
      responses:
        '200':
          description: The memory
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemoryNotes' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/companies/{companyId}/triggers/{triggerId}/memory/{noteNumber}/accept:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
      - $ref: '#/components/parameters/TriggerId'
      - $ref: '#/components/parameters/NoteNumber'
    post:
      tags: [Triggers]
      operationId: acceptTriggerMemoryNote
      summary: Accept a proposed note of a trigger's memory (its audience)
      description: |
        Its author, its team, OWNER and ADMIN. The note becomes `ACTIVE`, in place of the note it replaces, and the
        trigger's later conversations read it. Audited as `memory.accepted`. 404 when the memory has no proposal of
        that number; 409 MEMORY_FULL when the memory has no room for it (delete a note first).
      responses:
        '200':
          description: The memory
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemoryNotes' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/companies/{companyId}/triggers/{triggerId}/pause:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
      - $ref: '#/components/parameters/TriggerId'
    post:
      tags: [Triggers]
      operationId: pauseTrigger
      summary: Pause a trigger, the kill switch (its audience); idempotent
      description: |
        `PAUSED` `USER` (§5.11): it fires nothing, its conversations' queued turns wait (`TRIGGER_PAUSED`) and their
        write-back is held; with `stopRunning` their active turns are cancelled. Audited as `trigger.paused` with the
        runs cancelled; a paused trigger is answered as it is.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TriggerPauseRequest' }
      responses:
        '200':
          description: The trigger
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Trigger' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/companies/{companyId}/triggers/{triggerId}/resume:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
      - $ref: '#/components/parameters/TriggerId'
    post:
      tags: [Triggers]
      operationId: resumeTrigger
      summary: Resume a paused trigger (its author, admins)
      description: |
        The gate first (§5.3): a failure keeps it paused, or pauses it again for its reason, and answers 409
        TRIGGER_PAUSED naming it. Then `ACTIVE`, `armed_at` now (T16: what changed while it was paused fires nothing),
        its held write-back released, its waiting conversations' turns go on; after a reassignment each waiting
        conversation takes the new table and payer (`conversation_rebind`, §11). Audited as `trigger.resumed`. 403
        TRIGGER_NOT_EDITABLE for its team. An active trigger is answered as it is. A trigger paused `TO_ACCEPT` resumes
        only when its new author accepts it (`acceptTriggerWidening`): 409 TRIGGER_PAUSED with `details.reason`
        `TO_ACCEPT` here.
      responses:
        '200':
          description: The trigger
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Trigger' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/companies/{companyId}/triggers/{triggerId}/run:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
      - $ref: '#/components/parameters/TriggerId'
    post:
      tags: [Triggers]
      operationId: runTrigger
      summary: Run a trigger now (its audience)
      description: |
        A tracker trigger on `subjectKey`, read with its source account (409 SUBJECT_NOT_VISIBLE) and checked against
        its scope, subject kind and conditions (409 TRIGGER_CONDITIONS_FAIL), fired as its first event; a schedule once
        now (§5.6). The gate and the rate apply. 409 TRIGGER_PAUSED. Audited as `trigger.run`. Answers the firing.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TriggerRunRequest' }
      responses:
        '200':
          description: The firing
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TriggerFiring' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/companies/{companyId}/triggers/{triggerId}/subjects:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
      - $ref: '#/components/parameters/TriggerId'
    get:
      tags: [Triggers]
      operationId: listTriggerSubjects
      summary: Subjects in a tracker trigger's scope, to run it now on one (its audience)
      description: Read with its source account; at most 20, newest change first.
      parameters:
        - { name: query, in: query, required: false, schema: { type: string, maxLength: 200 } }
      responses:
        '200':
          description: Subjects
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TriggerSubjectList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/companies/{companyId}/triggers/{triggerId}/reassign:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
      - $ref: '#/components/parameters/TriggerId'
    post:
      tags: [Triggers]
      operationId: reassignTrigger
      summary: Reassign a trigger whose author left or lost a right to another author (admins)
      description: |
        Only a trigger paused `AUTHOR_LEFT` or `NOT_ENTITLED`, or one reassigned and not accepted yet (`TO_ACCEPT`):
        else 409 TRIGGER_PAUSED with `details.reason` (the security review of 2026-10-27, H2). A new author who holds a
        seat (a Viewer is 400 VALIDATION_FAILED) and uses the agent (403 AGENT_NOT_USABLE otherwise); every row and the
        payer must pass §5.2 for that author (rows of the former author's accounts are emptied: name credentials of
        service accounts the new author may use), and no row names the new author's own account, nor do the settings
        add their own MCP servers (403 AUTHOR_ACCOUNT_NOT_ADMINS): the new author adds those. The trigger keeps its
        accepted version and is paused `TO_ACCEPT`, its open events' acknowledgement cleared, until the new author
        accepts it (`acceptTriggerWidening`), which resumes it; nobody resumes it otherwise. The new author's inbox
        says so (`TRIGGER` with reason `TRIGGER_REASSIGNED_TO_YOU`). Its team-less open approvals move to the new
        author. Audited as `trigger.reassigned`, `trigger.paused` (`TO_ACCEPT`) and `trigger.accounts_changed`. 403 for
        anyone but OWNER and ADMIN.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TriggerReassignRequest' }
      responses:
        '200':
          description: The trigger
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Trigger' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/companies/{companyId}/triggers/{triggerId}/firings:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
      - $ref: '#/components/parameters/TriggerId'
    get:
      tags: [Triggers]
      operationId: listTriggerFirings
      summary: A trigger's firings, newest first (its audience)
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Firings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TriggerFiringPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/companies/{companyId}/systems/{systemId}/polls:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
      - $ref: '#/components/parameters/SystemId'
    get:
      tags: [Triggers]
      operationId: listSystemPolls
      summary: A system's polls (admins)
      description: |
        One per account that triggers read the system with (§3.9): its account and holder, its triggers, its last
        pass, error and backoff, and the rate limit the system last reported.
      responses:
        '200':
          description: Polls
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TriggerPollList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/companies/{companyId}/settings:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
    get:
      tags: [Triggers]
      operationId: getCompanySettings
      summary: The company's settings (any member)
      description: |
        Today the firing limits of its triggers (§11, open point 15): the default and the maximum of
        `maxFiringsPerHour`, from the instance's configuration until admins set them.
      responses:
        '200':
          description: The settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompanySettings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Triggers]
      operationId: updateCompanySettings
      summary: Change the company's settings (OWNER, ADMIN)
      description: |
        `triggerFiringsPerHour`: a default of at least 1, at most the maximum, itself at most 10000 (400
        VALIDATION_FAILED). Lowering the maximum lowers the triggers above it, each audited as `trigger.changed`.
        `triggerSubscriptions`: whether a trigger may pay with its author's subscription (ADR-0085, decision 7).
        `version`: the version the caller read (400 VALIDATION_FAILED without it); settings changed meanwhile are
        409 SETTINGS_CHANGED, and nothing is written. Audited as `company_settings.changed`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompanySettings' }
      responses:
        '200':
          description: The settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompanySettings' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: TINFIRM_SESSION
    bearer:
      type: http
      scheme: bearer
      description: |
        Personal access tokens (`tfp_` + 43 base64url characters, see `Tokens`) and OAuth access tokens on the MCP
        endpoint, `/api/companies/{companyId}/mcp`; the REST API itself stays session-only (ADR-0045). The MCP
        endpoint ignores the session cookie, refuses any request with an `Origin` header (403), and answers a missing
        token with 401 and `WWW-Authenticate: Bearer`, and a bad one (unknown, revoked, expired, or of a deactivated
        user) with 401, `WWW-Authenticate: Bearer error="invalid_token"` and problem code `TOKEN_INVALID`. A token
        whose user is not an active member of the company (a non-member, a suspended member, an instance admin who
        is not a member) is answered 404 whatever the method, as a non-member's bearer credentials are everywhere:
        a member SCIM deactivated, or who left, loses the endpoint with their membership.

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Makes the submission idempotent (package R): send a new key for each submission (a UUID is recommended) and
        the same key when you retry it. The same key again, for the same operation and request (the method, the path
        and the body; for an upload, the file's hash, its name and its note), answers what the first request made, as
        it is now, with the first one's status and `Idempotent-Replayed: true`, and makes, audits and charges nothing
        new. The same key with another operation or request is `422 IDEMPOTENCY_KEY_REUSED`. A request that answered
        an error stored no key, so it may be retried with the same key. A key is the caller's own (another member's
        same key is another key) and is kept for a day (`TINFIRM_IDEMPOTENCY_KEY_TTL`).
      schema: { type: string, minLength: 1, maxLength: 200, pattern: '^[!-~]+$' }
    CheckId:
      name: checkId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ReportId:
      name: reportId
      in: path
      required: true
      schema: { type: string, format: uuid }
    HoldId:
      name: holdId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AttachmentId:
      name: attachmentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    DecisionId:
      name: decisionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    RunId:
      name: runId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AfterSeq:
      name: afterSeq
      in: query
      required: false
      description: Only events with a greater sequence number
      schema: { type: integer, format: int64, minimum: 0, default: 0 }
    RunnerHostId:
      name: runnerHostId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PrincipalId:
      name: principalId
      in: path
      required: true
      description: A principal's id; a service identity's is its id
      schema: { type: string, format: uuid }
    CompanyId:
      name: companyId
      in: path
      required: true
      schema: { type: string, format: uuid }
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string, format: uuid }
    GroupId:
      name: groupId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TokenId:
      name: tokenId
      in: path
      required: true
      schema: { type: string, format: uuid }
    GrantId:
      name: grantId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CredentialId:
      name: credentialId
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: A system's credential (ADR-0072)
    ReachCredentialId:
      name: credentialId
      in: query
      required: false
      schema: { type: string, format: uuid }
      description: |
        One of the system's credentials to reach it with (OWNER, ADMIN; ADR-0072); without it, the caller's own `OK`
        account, else the system's only enabled `OK` credential, else no credential
    SecretId:
      name: secretId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ServiceIdentityId:
      name: serviceIdentityId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SystemId:
      name: systemId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TriggerId:
      name: triggerId
      in: path
      required: true
      schema: { type: string, format: uuid }
    RepositoryId:
      name: repositoryId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ToolName:
      name: toolName
      in: path
      required: true
      schema: { type: string, pattern: '^[A-Za-z0-9_-]{1,64}$' }
    NoticeKey:
      name: noticeKey
      in: path
      required: true
      description: A notice's `noticeKey`, as the inbox answers it
      schema: { type: string, minLength: 1, maxLength: 200, pattern: '^[A-Za-z0-9_.:-]+$' }
    ConversationId:
      name: conversationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AgentId:
      name: agentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SkillId:
      name: skillId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SkillVersionNumber:
      name: version
      in: path
      required: true
      schema: { type: integer, format: int32, minimum: 1 }
    NoteNumber:
      name: noteNumber
      in: path
      required: true
      description: A note's number in its memory, as its id `m{number}` shows it
      schema: { type: integer, format: int32, minimum: 1 }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, format: int32, minimum: 1, maximum: 200, default: 50 }
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor from a previous page's `nextCursor`
      schema: { type: string }
  headers:
    IdempotentReplayed:
      description: |
        `true` when the answer replays an earlier request with the same `Idempotency-Key`: it shows what that request
        made, as it is now, and nothing new was made. Absent otherwise.
      schema: { type: string, enum: ['true'] }
  responses:
    ScimProblem:
      description: A SCIM error (RFC 7644 §3.12)
      content:
        application/scim+json:
          schema: { $ref: '#/components/schemas/ScimError' }
        application/json:
          schema: { $ref: '#/components/schemas/ScimError' }
    BadRequest:
      description: Validation failed
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Not logged in, or wrong credentials
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: Logged in, but the role does not allow this
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Does not exist, or the caller cannot see it
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: Conflicts with the current state (duplicate, last owner, last admin, a decided request)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Gone:
      description: "Its content was removed under retention or by an erasure (CONTENT_PURGED); a sign-in link expired (CHAT_LINK_EXPIRED)"
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    TooManyRequests:
      description: Rate limit hit
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    BadGateway:
      description: A system the request needed did not answer, or refused (GATEWAY_UNREACHABLE)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    PayloadTooLarge:
      description: The file is larger than the server allows (ATTACHMENT_TOO_LARGE)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    UnprocessableEntity:
      description: |
        The content is refused: it holds a credential (CREDENTIAL_FOUND, with `credentialMatches`; for a skill
        SKILL_CONTAINS_CREDENTIAL), or it cannot be scanned (ATTACHMENT_NOT_SCANNABLE); or the `Idempotency-Key` was used for another request
        (IDEMPOTENCY_KEY_REUSED)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }


  schemas:
    Problem:
      type: object
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer, format: int32 }
        detail: { type: string }
        instance: { type: string }
        code:
          type: string
          description: |
            Stable machine-readable error code (CONVENTIONS §6), e.g. `LAST_OWNER` or `DUPLICATE_EMAIL`, or
            `DUPLICATE_GROUP_NAME` (409, ADR-0049). Package 6's audit and retention: `AUDIT_EXPORT_TOO_LARGE` (400),
            `RETENTION_INVALID` (400), `ERASURE_NOT_ALLOWED` (409), `ON_HOLD` (409, with `holdIds`),
            `CONTENT_PURGED` (410). Package R: `IDEMPOTENCY_KEY_REUSED` (422, an `Idempotency-Key` sent before
            with another request). The licence (ADR-0077): `SEATS_EXHAUSTED` (409, `details.licensed`,
            `details.used`), `EDITION_REQUIRED` (403, `details.feature`, `details.edition`), `VIEWER_READ_ONLY` (403),
            `LICENCE_KEY_INVALID` (400), `LICENCE_KEY_EXPIRED`, `LICENCE_KEY_SUPERSEDED` and `LICENCE_SEATS_TOO_FEW`
            (409, `details.required`, `details.licensed`). SCIM (ADR-0087): `SCIM_NOT_ENABLED` and `SCIM_TOKEN_LIMIT`
            (409). Personal access tokens (ADR-0045): `TOKEN_LIMIT` and `TOKEN_EXPIRED` (409),
            `RECENT_SIGN_IN_REQUIRED` (403).
            OIDC login failures are not JSON: the server redirects to `/login?error=EMAIL_IN_USE`,
            to `/login?error=EMAIL_MISSING` when the IdP sent no usable email for a new user,
            to `/login?error=EMAIL_NOT_VERIFIED` when the provider's email trust does not accept
            that email, to `/login?error=EMAIL_DOMAIN_NOT_ALLOWED` when a provider that lists email
            domains sent an email outside them for a new user, or, for any other failure, to
            `/login?error=OIDC_LOGIN_FAILED`.
        errors:
          type: array
          items: { $ref: '#/components/schemas/FieldError' }
    FieldError:
      type: object
      required: [field, message]
      properties:
        field: { type: string }
        message: { type: string }

    Role:
      type: string
      enum: [OWNER, ADMIN, MEMBER, VIEWER]
      description: |
        A member's role in the company (the platform redesign, Part 8; ADR-0077). OWNER: everything an admin may, and
        other owners, retention, holds and erasure; an OWNER reads every personal
        conversation in full, each read recorded. ADMIN: members, groups, systems with their apps and credentials,
        service identities and who may use them, grants, secrets, every agent and trigger, model access, company
        runner hosts, the company's settings and kill switches. MEMBER: their own accounts, agents, conversations,
        triggers, personal MCP servers and personal runner hosts. VIEWER: reads what the company shows its members and
        their own inbox, and holds no seat; never starts or continues a conversation, owns or edits an agent or a
        skill, authors a trigger, or answers or decides a request (`403 VIEWER_READ_ONLY`), and no question or
        approval is routed to them. OWNER, ADMIN and MEMBER each hold a seat under a licence that counts them: giving
        one to a person without a seat while every seat is taken is `409 SEATS_EXHAUSTED` (`details.licensed`,
        `details.used`). A specific permission beyond the role is a group's, never a role's.
    AuthSource:
      type: string
      enum: [LOCAL, OIDC, SCIM, SAML]
      description: |
        SCIM is a user a company's SCIM client created (ADR-0087), with no password and no sign-in yet; their first
        sign-in through a provider of that company binds them and makes them OIDC, or SAML through a SAML provider.
        SAML is a user a SAML identity provider signed in (ADR-0086).

    AuthProviders:
      type: object
      required: [localEnabled, providers]
      properties:
        localEnabled: { type: boolean }
        providers:
          type: array
          description: |
            The identity providers a person may sign in with now, OIDC and SAML, by id (ADR-0086 decision 15). A SAML
            provider is listed while the licence serves SAML and its IdP metadata is in force.
          items: { $ref: '#/components/schemas/LoginProvider' }
    LoginProvider:
      type: object
      required: [id, name, kind, loginUrl]
      properties:
        id: { type: string, example: keycloak, description: 'The registration id, unique across both kinds' }
        name: { type: string, example: Keycloak }
        kind: { $ref: '#/components/schemas/ProviderKind' }
        loginUrl:
          type: string
          example: /oauth2/authorization/keycloak
          description: 'Where a sign-in starts: `/oauth2/authorization/{id}`, or `/saml2/authenticate/{id}`'
    ProviderKind:
      type: string
      enum: [OIDC, SAML]
    CompanySignIn:
      type: object
      required: [providers, samlServed]
      properties:
        providers:
          type: array
          items: { $ref: '#/components/schemas/CompanySignInProvider' }
        samlServed:
          type: boolean
          description: Whether the licence serves SAML now (`SAML`, Enterprise, also after the key expired)
    CompanySignInProvider:
      type: object
      required: [id, name, kind, through, role, roleSource, emailDomains, directLink]
      properties:
        id: { type: string }
        name: { type: string }
        kind: { $ref: '#/components/schemas/ProviderKind' }
        through:
          type: string
          enum: [COMPANY, CLAIM]
          description: |
            How the provider fills this company: `COMPANY`, as its own company (`_COMPANY`), or `CLAIM`, through its
            role claim (`_COMPANIES_<KEY>_ROLE_MAP_*`, ADR-0089), its own company being another
        role:
          allOf: [{ $ref: '#/components/schemas/Role' }]
          description: |
            The role of a new member in the provider's own company, unless the provider decides it from its claim or
            attribute; through the claim, always the role mapped there
        roleSource:
          type: string
          enum: [IDP, APP]
          description: |
            `IDP`: the provider decides the role at every sign-in. `APP`: it gives a new member one, and the app decides
            after (ADR-0088)
        roleClaim:
          type: string
          nullable: true
          description: The OIDC claim or SAML attribute that carries the role, when one is named
        roleMap:
          allOf: [{ $ref: '#/components/schemas/CompanySignInRoleMap' }]
          nullable: true
          description: The claim's values that give each role in this company, when a claim is named
        emailDomains: { type: array, items: { type: string } }
        directLink:
          type: string
          description: '`{TINFIRM_PUBLIC_URL}/login?provider={id}`, the login page with only this provider (ADR-0075)'
        saml:
          allOf: [{ $ref: '#/components/schemas/SamlProviderDetails' }]
          nullable: true
    CompanySignInRoleMap:
      type: object
      description: The role claim's values, matched exactly, that give each role in one company (ADR-0088, ADR-0089)
      required: [admin, member, viewer]
      properties:
        admin: { type: array, items: { type: string } }
        member: { type: array, items: { type: string } }
        viewer: { type: array, items: { type: string } }
    SamlProviderDetails:
      type: object
      description: What an identity provider's admin needs, and the state of the IdP's metadata (ADR-0086)
      required: [spEntityId, acsUrl, spMetadataUrl, startUrl, metadataSource, idpCertificates, spCertificates]
      properties:
        spEntityId: { type: string }
        acsUrl: { type: string, description: 'The assertion consumer service, HTTP-POST' }
        spMetadataUrl: { type: string, description: 'The service provider metadata, public' }
        startUrl: { type: string, description: 'Where a sign-in starts, for a portal tile' }
        idpEntityId: { type: string, nullable: true }
        metadataSource: { type: string, description: "The metadata URL's host, or `file`" }
        metadataReadAt: { type: string, format: date-time, nullable: true }
        lastError:
          type: string
          nullable: true
          description: 'The last failed read: `unreachable`, `invalid`, `no_idp`, `expired`, `too_large`, `entity_id_changed` (the document names another IdP than the pinned one) or `entity_id_in_use` (it names another provider''s IdP or an OIDC issuer)'
        lastErrorAt: { type: string, format: date-time, nullable: true }
        validUntil: { type: string, format: date-time, nullable: true }
        idpCertificates: { type: array, items: { $ref: '#/components/schemas/CertificateInfo' } }
        spCertificates: { type: array, items: { $ref: '#/components/schemas/CertificateInfo' } }
    CertificateInfo:
      type: object
      required: [subject, sha256, notAfter]
      properties:
        subject: { type: string }
        sha256: { type: string, description: 'The SHA-256 fingerprint of the DER, hex' }
        notAfter: { type: string, format: date-time }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 320 }
        password: { type: string, format: password, writeOnly: true, minLength: 1, maxLength: 1024 }

    CurrentUser:
      type: object
      required: [id, email, displayName, instanceAdmin, authSource, memberships]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        displayName: { type: string }
        instanceAdmin: { type: boolean }
        authSource: { $ref: '#/components/schemas/AuthSource' }
        memberships:
          type: array
          items: { $ref: '#/components/schemas/Membership' }
    Membership:
      type: object
      required: [companyId, companyName, role]
      properties:
        companyId: { type: string, format: uuid }
        companyName: { type: string }
        role: { $ref: '#/components/schemas/Role' }

    OwnPasswordChangeRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string, format: password, writeOnly: true, minLength: 1, maxLength: 1024 }
        newPassword: { type: string, format: password, writeOnly: true, minLength: 12, maxLength: 1024 }
    TokenScope:
      type: string
      enum: [READ, WRITE, DECIDE]
      description: |
        What a personal access token lets a client do on the MCP endpoint, as the OAuth scopes `tinfirm:read`,
        `tinfirm:write` and `tinfirm:decide`. Each level includes the lower ones: READ reads; WRITE also comments,
        starts conversations and threads, cancels and retries, but never decides; DECIDE also decides decisions. A
        scope never adds to the member's role in a company.
    ScimResource:
      type: object
      additionalProperties: true
      description: |
        A SCIM resource or message as RFC 7643 and RFC 7644 define it, identified by its `schemas`: a `User`
        (`urn:ietf:params:scim:schemas:core:2.0:User`, with Tinfirm's extension
        `urn:ietf:params:scim:schemas:extension:tinfirm:2.0:User` and its one attribute `role`, `admin`, `member`,
        `viewer` or, answered for an owner only, `owner`), a `PatchOp`
        (`urn:ietf:params:scim:api:messages:2.0:PatchOp`), a `ListResponse`, the `ServiceProviderConfig`, a
        `ResourceType` or a `Schema`. The attributes Tinfirm keeps are ADR-0087 decision 4's: `id`, `userName`,
        `externalId`, `emails`, `name`, `displayName`, `active`, the extension's `role` and `meta`; every other is
        accepted and ignored, never stored.
    ScimError:
      type: object
      required: [schemas, status]
      properties:
        schemas:
          type: array
          items: { type: string, enum: ['urn:ietf:params:scim:api:messages:2.0:Error'] }
        status: { type: string, description: 'The HTTP status, as a string ("400")' }
        scimType:
          type: string
          enum: [invalidFilter, tooMany, uniqueness, mutability, invalidSyntax, invalidPath, noTarget, invalidValue,
                 invalidVers, sensitive]
        detail: { type: string, description: 'Why; `EDITION_REQUIRED` or `LAST_OWNER` where those apply' }
    ScimStatus:
      type: object
      required: [enabled, licensed, baseUrl, defaultRole, roleSource]
      properties:
        enabled:
          type: boolean
          description: Whether the deployment allows SCIM for the company (`companies[].scim.enabled`)
        licensed: { type: boolean, description: 'Whether the licence serves SCIM now (`SCIM`, Enterprise)' }
        baseUrl: { type: string, description: '`{TINFIRM_PUBLIC_URL}/scim/v2`, to paste at the identity provider' }
        defaultRole: { $ref: '#/components/schemas/Role' }
        roleSource:
          type: string
          enum: [IDP, APP]
          description: |
            `IDP`: SCIM decides the role of the members it manages whenever a request carries it, and the app cannot
            change it. `APP`: SCIM gives the role once, at creation (ADR-0088 decision 8)
    ScimToken:
      type: object
      description: A SCIM token's metadata. Neither the token nor its hash is ever returned after its creation.
      required: [id, name, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        createdAt: { type: string, format: date-time }
        createdBy: { type: string, format: uuid, nullable: true }
        createdByName: { type: string, nullable: true }
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: |
            When the token stops working; null for a token that never expires.
        companyIds:
          type: array
          nullable: true
          items: { type: string, format: uuid }
          description: The companies the token reaches; null for every company of the user
        lastUsedAt:
          type: string
          format: date-time
          nullable: true
          description: The latest request with the token, up to a minute stale; null before the first use
        revokedAt: { type: string, format: date-time, nullable: true }
    ScimTokenList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ScimToken' }
    ScimTokenCreateRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100, description: 'A label, e.g. "Entra ID"' }
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: |
            When the token stops working; in the future. Absent or null for a token that never expires.
        companyIds:
          type: array
          nullable: true
          minItems: 1
          maxItems: 100
          items: { type: string, format: uuid }
          description: |
            The companies the token reaches, each one the user is a member of. Absent or null for every company of
            the user. Leaving a named company revokes the token.
        currentPassword:
          type: string
          format: password
          writeOnly: true
          nullable: true
          maxLength: 1024
          description: The user's current password; required for a local user, absent for an identity provider's
    ScimTokenCreated:
      type: object
      required: [token, secret]
      properties:
        token: { $ref: '#/components/schemas/ScimToken' }
        secret:
          type: string
          description: The token, `tfs_` and 43 base64url characters, shown this once
    PersonalAccessToken:
      type: object
      description: A personal access token's metadata. Neither the token nor its hash is ever returned after creation.
      required: [id, name, scope, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        scope: { $ref: '#/components/schemas/TokenScope' }
        createdAt: { type: string, format: date-time }
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: |
            When the token stops working unless it is renewed. Null only for a token that was revoked before
            migration V072 made tokens expire; every other token expires.
        companyIds:
          type: array
          nullable: true
          items: { type: string, format: uuid }
          description: The companies the token reaches; null for every company of the user
        lastUsedAt:
          type: string
          format: date-time
          nullable: true
          description: The latest request with the token, up to a minute stale; null before the first use
    PersonalAccessTokenCreateRequest:
      type: object
      required: [name, scope]
      properties:
        name: { type: string, minLength: 1, maxLength: 100, description: 'A label, e.g. "laptop claude code"' }
        scope: { $ref: '#/components/schemas/TokenScope' }
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: |
            When the token stops working; in the future and at most 90 days ahead. Absent or null for 90 days.
        companyIds:
          type: array
          nullable: true
          minItems: 1
          maxItems: 100
          items: { type: string, format: uuid }
          description: |
            The companies the token reaches, each one the user is a member of. Absent or null for every company of
            the user. Leaving a named company revokes the token.
        currentPassword:
          type: string
          format: password
          writeOnly: true
          nullable: true
          maxLength: 1024
          description: The user's current password; required for a local user, absent for an identity provider's
    PersonalAccessTokenCreated:
      type: object
      required: [personalAccessToken, token, ownerNotice]
      properties:
        personalAccessToken: { $ref: '#/components/schemas/PersonalAccessToken' }
        token:
          type: string
          description: |
            Shown once. The client sends it as `Authorization: Bearer <token>` to the MCP endpoint. Format `tfp_` + 43
            base64url characters.
        ownerNotice: { $ref: '#/components/schemas/TokenOwnerNotice' }
    CompanyOwnerNotice:
      type: object
      description: |
        Who can read the personal conversations a person starts in a company (security review, row 18; the package 6
        contract, §5.6): its OWNERs, by name. Every read by one of them is recorded and shown to the person.
      required: [companyId, companyName, owners]
      properties:
        companyId: { type: string, format: uuid }
        companyName: { type: string }
        owners:
          type: array
          description: The OWNERs' display names, by name
          items: { type: string }
    TokenOwnerNotice:
      type: object
      description: |
        The notice of a personal access token's creation: conversations started with it are personal, the agents act
        with the person's own accounts and budget, and the OWNERs of each company they start them in can read them in
        full, each read recorded and shown to the person.
      required: [companies]
      properties:
        companies:
          type: array
          description: The companies the user is a member of, by name
          items: { $ref: '#/components/schemas/CompanyOwnerNotice' }
    OAuthClient:
      type: object
      description: |
        A client of Tinfirm's authorization server. `domain` is the host of its Client ID Metadata Document, the name
        a person can check; it is absent for a pre-registered client, whose name is Tinfirm's.
      required: [clientId, name]
      properties:
        clientId: { type: string, description: 'The metadata document URL, or a pre-registered id' }
        name: { type: string, description: The name the client gives itself (from its metadata document) }
        domain: { type: string, nullable: true }
    OAuthScopeName:
      type: string
      enum: ['tinfirm:read', 'tinfirm:write', 'tinfirm:decide']
      description: |
        The OAuth scopes of the MCP endpoint, as the personal access tokens' `TokenScope` READ, WRITE and DECIDE; each
        includes the lower ones, and none adds to the member's role.
    OAuthScope:
      type: object
      required: [scope, title, description]
      properties:
        scope: { $ref: '#/components/schemas/OAuthScopeName' }
        title: { type: string }
        description: { type: string, description: One line on what the scope lets the client do }
    OAuthConsentRequest:
      type: object
      required: [client, companyId, companyName, requested, offered, ownerNotice]
      properties:
        client: { $ref: '#/components/schemas/OAuthClient' }
        companyId: { type: string, format: uuid }
        companyName: { type: string }
        requested:
          type: array
          description: |
            The scopes the client asked for that Tinfirm knows, lowest first. The page preselects the highest of
            them below `tinfirm:decide` (`tinfirm:write` when the client asked for deciding); it never preselects
            deciding.
          items: { $ref: '#/components/schemas/OAuthScopeName' }
        offered:
          type: array
          description: |
            The levels the person may choose from, lowest first: always the three, whatever the client asked for.
            Each level includes the ones before it; the consent posts the scopes up to the chosen one.
          items: { $ref: '#/components/schemas/OAuthScope' }
        ownerNotice: { $ref: '#/components/schemas/CompanyOwnerNotice' }
    OAuthGrant:
      type: object
      required: [id, client, companyId, companyName, scopes, grantedAt]
      properties:
        id: { type: string, format: uuid }
        client: { $ref: '#/components/schemas/OAuthClient' }
        companyId: { type: string, format: uuid }
        companyName: { type: string, description: 'The company''s name; "Unknown company" once it no longer exists' }
        scopes:
          type: array
          description: The granted scopes, lowest first
          items: { $ref: '#/components/schemas/OAuthScopeName' }
        grantedAt: { type: string, format: date-time, description: The latest consent of this grant }
        lastUsedAt:
          type: string
          format: date-time
          nullable: true
          description: When the client last obtained an access token with this grant; null before its first
    PasswordSetRequest:
      type: object
      required: [newPassword]
      properties:
        newPassword: { type: string, format: password, writeOnly: true, minLength: 12, maxLength: 1024 }

    SystemInfo:
      type: object
      required: [version, telemetryEnabled]
      properties:
        version: { type: string, example: 0.1.0 }
        commit:
          type: string
          nullable: true
          description: The git revision of this build. The full 40-character SHA in images built by CI (runner hosts on auto-deploy follow it); null when unknown.
        telemetryEnabled:
          type: boolean
          description: |
            Whether the installation sends anything to the vendor: true exactly while error reports are delivered
            automatically to a destination (ADR-0070). Tinfirm sends no other telemetry.

    Company:
      type: object
      required: [id, name, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        key:
          type: string
          nullable: true
          description: |
            The key the deployment declares the company by (ADR-0075, `TINFIRM_COMPANIES_<KEY>_*`); null for a
            company from before keys that no declaration adopted yet
        createdAt: { type: string, format: date-time }
        myRole:
          $ref: '#/components/schemas/Role'
    CompanyUpdateRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
    CompanyPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Company' }
        nextCursor: { type: string, nullable: true }

    Member:
      type: object
      required: [userId, email, displayName, role, addedAt, suspended]
      properties:
        userId: { type: string, format: uuid }
        email: { type: string, format: email }
        displayName: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        suspended: { type: boolean, description: Whether an admin (or the user's deactivation) suspended the member }
        principalId:
          type: string
          format: uuid
          nullable: true
          description: |
            The member's principal in the company, which `getPrincipalModelAccess` and `updatePrincipalModelAccess`
            take (a member's own budget and models)
        addedAt: { type: string, format: date-time }
        roleManagedBy:
          allOf: [{ $ref: '#/components/schemas/RoleManager' }]
          nullable: true
          description: |
            Who decides the member's role (ADR-0088): an identity provider at every sign-in through it, or SCIM. Null
            while the company's Owners and Admins decide it in the app. While it is set, `updateMember` changes the
            role only to OWNER.
    RoleManager:
      type: object
      required: [source, name]
      description: What decides a member's role instead of the app (ADR-0088)
      properties:
        source:
          type: string
          enum: [IDP, SCIM]
          description: "`IDP`: an identity provider, at every sign-in through it; `SCIM`: the company's SCIM client"
        provider:
          type: string
          nullable: true
          description: The provider's registration id; null for SCIM
        name: { type: string, description: "The provider's display name, or `SCIM`" }
    MemberAddRequest:
      type: object
      required: [email, role]
      properties:
        email: { type: string, format: email, maxLength: 320 }
        role: { $ref: '#/components/schemas/Role' }
    MemberUpdateRequest:
      type: object
      required: [role]
      properties:
        role: { $ref: '#/components/schemas/Role' }
    MemberPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Member' }
        nextCursor: { type: string, nullable: true }
    MemberAccount:
      type: object
      required: [systemId, systemName, status]
      description: A member's account on a company system as admins see it (I4), without who it is there
      properties:
        systemId: { type: string, format: uuid }
        systemName: { type: string }
        systemKind:
          allOf: [{ $ref: '#/components/schemas/SystemKind' }]
          nullable: true
          description: The system's kind
        status:
          type: string
          enum: [OK, RECONNECT, ERROR]
          description: '`RECONNECT`: the system refused it or the grant expired; the member signs in again'
    MemberAccountList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/MemberAccount' }

    GroupSummary:
      type: object
      required: [id, name, memberCount]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: Finance }
        description: { type: string, nullable: true }
        memberCount: { type: integer, format: int32 }
    GroupPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/GroupSummary' }
        nextCursor: { type: string, nullable: true }
    GroupMember:
      type: object
      required: [userId, email, displayName]
      description: A member of a group, shown as `Members` shows people
      properties:
        userId: { type: string, format: uuid }
        email: { type: string, format: email }
        displayName: { type: string }
    Group:
      type: object
      required: [id, name, members, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: Finance }
        description: { type: string, nullable: true }
        members:
          type: array
          items: { $ref: '#/components/schemas/GroupMember' }
          description: By display name
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    GroupInput:
      type: object
      required: [name, memberIds]
      description: A group as a whole, for a create or a replace
      properties:
        name: { type: string, minLength: 1, maxLength: 100, description: 'Unique in the company, ignoring case' }
        description: { type: string, maxLength: 500, nullable: true, description: 'Absent, null or blank: none' }
        memberIds:
          type: array
          maxItems: 500
          items: { type: string, format: uuid }
          description: The members, each a member of the company; one named twice counts once
    GroupUsage:
      type: object
      required: [agents, grants, serviceIdentities]
      description: What a group's members may use through it (`getGroupUsage`)
      properties:
        agents:
          type: array
          items: { $ref: '#/components/schemas/GroupUsageItem' }
          description: The live agents shared with the group, by name
        grants:
          type: array
          items: { $ref: '#/components/schemas/AccountGrant' }
          description: The grants that lend the group a system's credential, by system and credential name
        serviceIdentities:
          type: array
          items: { $ref: '#/components/schemas/GroupUsageItem' }
          description: The service identities the group's members may use, by name
    GroupUsageItem:
      type: object
      required: [id, name]
      description: An agent or a service identity a group uses, by id and name
      properties:
        id: { type: string, format: uuid }
        name: { type: string }


    PrincipalStatus:
      type: string
      enum: [ACTIVE, SUSPENDED, LEFT]
      description: |
        `ACTIVE`; `SUSPENDED`: an admin stopped it, and nothing acts through it until it is resumed (a member's own
        accounts, the credentials a service identity borrows); `LEFT`: the member left the company (final; never a
        service identity's)
    GroupRef:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
    ServiceIdentity:
      type: object
      required: [id, name, status, usableByMe, createdAt, updatedAt]
      description: |
        A service account (the API calls it a service identity): a non-human principal that admins manage, with its budget;
        it never logs in and acts only through the credentials systems lend it (ADR-0072)
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: Jira bot }
        description: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/PrincipalStatus' }
        usableByMe:
          type: boolean
          description: Whether the caller may use it on triggers (OWNER always; others through a group in `userGroups`)
        userGroups:
          type: array
          nullable: true
          items: { $ref: '#/components/schemas/GroupRef' }
          description: The groups that may use it, by name; OWNER and ADMIN only (null for others)
        suspendedAt:
          type: string
          format: date-time
          nullable: true
          description: When it was suspended, while it is `SUSPENDED`; null otherwise
        suspensionReason:
          type: string
          nullable: true
          description: |
            The reason typed when it was suspended, while it is `SUSPENDED`; OWNER and ADMIN only (null for others,
            and when none was typed). Never in the audit chain
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ServiceIdentityPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ServiceIdentity' }
        nextCursor: { type: string, nullable: true }
    ServiceIdentityCreateRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100, description: 'Unique in the company, ignoring case' }
        description: { type: string, maxLength: 500, nullable: true, description: 'Absent, null or blank: none' }
    ServiceIdentityUpdateRequest:
      type: object
      description: Absent fields stay unchanged
      properties:
        name: { type: string, minLength: 1, maxLength: 100, description: 'Unique in the company, ignoring case' }
        description: { type: string, maxLength: 500, description: 'Blank: none' }
    ServiceIdentityUsersRequest:
      type: object
      required: [groupIds]
      properties:
        groupIds:
          type: array
          maxItems: 100
          items: { type: string, format: uuid }
          description: The groups whose members may use it, each a group of the company; one named twice counts once

    SystemKind:
      type: string
      enum: [JIRA_DC, JIRA_CLOUD, GITHUB, GITLAB, GIT, MCP, SLACK, TEAMS, BUZZ, WEBHOOK]
      description: |
        Trackers (`JIRA_DC`, `JIRA_CLOUD`), code hosts (`GITHUB`, `GITLAB`, `GIT`), `MCP` servers; chats (`SLACK`,
        `TEAMS`) and the generic `WEBHOOK` from package 5; `BUZZ` is parked
    ToolEffect:
      type: string
      enum: [READ, WRITE, UNKNOWN]
      description: Whether a tool reads or writes on its system; `UNKNOWN` counts as `WRITE` everywhere
    SystemApp:
      type: object
      required: [clientId, clientSecretSet, callbackUrl]
      description: The system's OAuth client, shown to whoever manages the system; the secret never is
      properties:
        clientId: { type: string }
        clientSecretSet: { type: boolean, description: Whether a client secret is kept (a confidential client) }
        scopes: { type: string, nullable: true, description: 'Space-separated; null: the profile''s' }
        callbackUrl: { type: string, description: The redirect URI to register at the system }
        authorizationEndpoint: { type: string, nullable: true }
    ExternalSystem:
      type: object
      required: [id, name, handle, kind, personal, status, oauthAvailable, accountsRequired, receivesData, internalHost, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: Support Jira }
        handle:
          type: string
          example: jira
          description: |
            Read-only: prefixes its tools in a run, `{handle}_{tool}`. Tinfirm makes it from the name at registration,
            unique in the company (`_2`, `_3`… while taken), and it never changes
        kind: { $ref: '#/components/schemas/SystemKind' }
        baseUrl: { type: string, nullable: true }
        personal:
          type: boolean
          description: The caller's own personal MCP server; only its owner sees one
        status:
          type: string
          enum: [NEW, OK, ERROR]
          description: '`NEW` until a test or a refresh reached it'
        lastError: { type: string, nullable: true }
        lastTest:
          allOf: [{ $ref: '#/components/schemas/SystemLastTest' }]
          nullable: true
          description: |
            Its last test, for every member who sees the system; who ran it, for whoever manages it. Null until a test
            ran (the tests from before migration V043 were not kept), and for a webhook system, which is never tested
        paused:
          type: boolean
          description: Whether an admin paused it (package 6); its accounts and credentials are used for nothing until it is resumed
        oauthAvailable: { type: boolean, description: Whether accounts on it may sign in with OAuth (it has an app) }
        app:
          allOf: [{ $ref: '#/components/schemas/SystemApp' }]
          nullable: true
          description: The app, for whoever manages the system; null otherwise, and while it has none
        oauthCallbackUrl:
          type: string
          nullable: true
          description: |
            The redirect URI to register at the system for its app (`app.callbackUrl` once it has one), for whoever
            manages a system whose accounts may sign in with OAuth, before its app is set as after; null otherwise
        authHeader:
          type: string
          nullable: true
          description: 'An MCP server''s header for a stored token; null: `Authorization: Bearer`'
        accountsRequired:
          type: boolean
          description: |
            Whether a conversation needs an account on it (ADR-0071). False only for an MCP server whoever manages it
            set so, after it answered without a credential: runs call it without one, nobody needs an account there,
            and a trigger needs no row for it
        receivesData:
          type: boolean
          description: |
            Read-only: whether agents may call tools on it, and so send it what they pass as the tools' arguments,
            which can include what they read elsewhere in the conversation, through a read tool too (the threat
            model's accepted risk for tools as data sinks). True for every kind with tools: `JIRA_DC`, `JIRA_CLOUD`,
            `GITHUB`, `GITLAB`, `MCP` and `SLACK` (its `history`); false for `GIT`, `TEAMS` and `WEBHOOK`. A tool
            call's arguments are at most 64 KiB as JSON in UTF-8 (`INVALID_REQUEST` beyond). Information only:
            nothing asks before a call because of it
        internalHost:
          type: boolean
          description: |
            Read-only: whether its base URL's host is one of the operator's internal hosts
            (`TINFIRM_CONNECTION_INTERNAL_HOSTS`, ADR-0066), a service on the deployment's own network; false for a
            personal MCP server, which is never reached there, and for a kind without a base URL. An `MCP` server
            that receives data and is not on an internal host is shown as a third-party server
        pollIntervalSeconds:
          type: integer
          format: int32
          nullable: true
          description: "A tracker's poll interval in seconds (30 to 3600; 60 unless set): how often its triggers' polls read it; null for another kind"
        chat:
          allOf: [{ $ref: '#/components/schemas/ChatSystemDetails' }]
          nullable: true
          description: A chat system's settings, its bot and where the platform sends its events; null for another kind
        webhook:
          allOf: [{ $ref: '#/components/schemas/WebhookSystemDetails' }]
          nullable: true
          description: A webhook system's scheme, mapping, rate and URL; null for another kind
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    WebhookSecret:
      type: object
      required: [secret]
      properties:
        secret: { type: string, description: 'Shown once' }
        previousUntil: { type: string, format: date-time, nullable: true }
    WebhookMapped:
      type: object
      required: [triggers]
      properties:
        event: { type: string, nullable: true }
        subjectKey: { type: string, nullable: true }
        subjectTitle: { type: string, nullable: true }
        subjectUrl: { type: string, nullable: true }
        actorId: { type: string, nullable: true }
        actorName: { type: string, nullable: true }
        text: { type: string, nullable: true }
        deliveryId: { type: string, nullable: true }
        failure: { type: string, nullable: true, description: 'Why the mapping could not read the body (MAPPING_FAILED)' }
        triggers:
          type: array
          items: { $ref: '#/components/schemas/WebhookMappedTrigger' }
    WebhookMappedTrigger:
      type: object
      required: [triggerId, name, matches]
      properties:
        triggerId: { type: string, format: uuid }
        name: { type: string }
        matches: { type: boolean, description: 'Its events and conditions match the body; whether it fires then depends on its state' }
        status:
          allOf: [{ $ref: '#/components/schemas/TriggerStatus' }]
          description: 'Its state now: a PAUSED trigger, or one that waits (waitingReason), takes no delivery, whatever it matches'
        pausedReason:
          allOf: [{ $ref: '#/components/schemas/TriggerPausedReason' }]
          nullable: true
        waitingReason:
          allOf: [{ $ref: '#/components/schemas/TriggerWaitingReason' }]
          nullable: true
        mismatch:
          allOf: [{ $ref: '#/components/schemas/WebhookMismatch' }]
          nullable: true
          description: 'Why it does not match: the first of its events or conditions the body fails, in the order the receiver checks them; null when it matches'
    WebhookMismatch:
      type: object
      required: [kind, detail]
      description: |
        The first test of a webhook trigger that a body fails (the receiver's own, `WebhookMapping.mismatch`): its
        events, then its conditions in their order. `detail` is Tinfirm's sentence and quotes nothing of the body;
        what the body holds is in `actual` alone.
      properties:
        kind:
          type: string
          enum: [EVENT, CONDITION]
          description: 'EVENT: no DELIVERED event of the trigger takes the mapped event; CONDITION: one condition does not hold'
        detail: { type: string }
        events:
          type: array
          items: { type: string }
          description: 'EVENT: the mapped events the trigger takes'
        event: { type: string, nullable: true, description: 'EVENT: the event the mapping read; null when it read none' }
        condition: { type: integer, format: int32, nullable: true, description: 'CONDITION: its index among the trigger''s conditions, from 0' }
        pointer: { type: string, nullable: true, description: 'CONDITION: its JSON Pointer' }
        op: { type: string, nullable: true, enum: [EQUALS, IN, PRESENT, ABSENT] }
        values:
          type: array
          items: { type: string }
          description: 'CONDITION: its values'
        actual:
          type: string
          nullable: true
          maxLength: 500
          description: 'CONDITION: what the pointer reads in the body, as text, cut to 500 characters; null when it reads nothing (or an object, an array, null), or the pointer is invalid'
    WebhookDeliveryPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/WebhookDelivery' }
        nextCursor: { type: string, nullable: true }
        lastSevenDays:
          allOf: [{ $ref: '#/components/schemas/WebhookDeliveryCounts' }]
          nullable: true
          description: The system's deliveries over the last 7 days, on the first page only (no cursor); null on the next pages
    WebhookDeliveryCounts:
      type: object
      required: [since, deliveries, failed, refused]
      description: |
        A webhook system's deliveries over the last 7 days. Deliveries are kept 7 days, so the counts are whole: the
        retention's daily sweep deletes only rows older than that, and none is counted from before `since`.
      properties:
        since: { type: string, format: date-time, description: 'The start of the 7 days: 7 days before the answer' }
        deliveries:
          type: integer
          format: int32
          description: The verified deliveries received, each once (a delivery sent again is not counted again)
        failed:
          type: integer
          format: int32
          description: Of those, the deliveries whose body the mapping could not read (`MAPPING_FAILED`)
        refused:
          type: integer
          format: int32
          description: |
            The deliveries refused before they were stored (a signature, the time window, the size, a rate), not among
            `deliveries`: the counts of the system's `webhook.refused` events, which each replica records at most once
            a minute per reason, so the refusals of the last minute may not be counted yet
    WebhookDelivery:
      type: object
      required: [id, deliveryId, receivedAt, status, firings, bodyBytes]
      properties:
        id: { type: string, format: uuid }
        deliveryId: { type: string }
        signedAt: { type: string, format: date-time, nullable: true }
        receivedAt: { type: string, format: date-time }
        status: { type: string, enum: [FIRED, NO_TRIGGER, MAPPING_FAILED] }
        event: { type: string, nullable: true }
        subjectKey: { type: string, nullable: true }
        firings: { type: integer, format: int32 }
        failure: { type: string, nullable: true }
        bodyBytes: { type: integer, format: int32 }
        body:
          type: object
          additionalProperties: true
          nullable: true
          description: The body, for 24 hours
    WebhookSystemSettings:
      type: object
      properties:
        scheme:
          type: string
          enum: [STANDARD, SECRET_HEADER]
          description: "STANDARD: Standard Webhooks' signature (webhook-id, webhook-timestamp, webhook-signature); SECRET_HEADER: the secret itself in a header, for a sender that cannot sign, weaker: whoever captures one delivery can forge any until the secret is rotated, and nothing bounds a replay's age"
        secretHeader: { type: string, maxLength: 64, nullable: true, description: 'SECRET_HEADER only: the header; absent: X-Tinfirm-Secret' }
        mapping: { $ref: '#/components/schemas/WebhookMapping' }
        maxPerMinute: { type: integer, format: int32, minimum: 1, maximum: 6000, nullable: true, description: "Deliveries a minute, within the company's maximum (400 WEBHOOK_LIMIT_TOO_HIGH); absent: the company's default" }
    WebhookMapping:
      type: object
      description: "JSON Pointers (RFC 6901) into a delivery's body, no expressions. A string, number or boolean is read as text and cut to its limit (key 200, title 500, URL 2000 and http(s) only, actor 200, text 20000); anything else, or nothing, is null"
      properties:
        event: { type: string, maxLength: 500, nullable: true }
        subjectKey: { type: string, maxLength: 500, nullable: true, description: 'One open conversation per trigger and key; it also recognises echoes' }
        subjectTitle: { type: string, maxLength: 500, nullable: true }
        subjectUrl: { type: string, maxLength: 500, nullable: true }
        actorId: { type: string, maxLength: 500, nullable: true }
        actorName: { type: string, maxLength: 500, nullable: true }
        text: { type: string, maxLength: 500, nullable: true }
        deliveryId: { type: string, maxLength: 500, nullable: true, description: 'SECRET_HEADER without webhook-id: the delivery id; else the SHA-256 of the body' }
    WebhookSystemDetails:
      type: object
      required: [scheme, mapping, perMinute, url]
      properties:
        scheme: { type: string, enum: [STANDARD, SECRET_HEADER] }
        secretHeader: { type: string, nullable: true }
        mapping: { $ref: '#/components/schemas/WebhookMapping' }
        maxPerMinute: { type: integer, format: int32, nullable: true, description: "Its own; null: the company's default" }
        perMinute: { type: integer, format: int32, description: 'Its deliveries a minute now' }
        url: { type: string, description: 'Where the sender posts: {TINFIRM_PUBLIC_URL}/api/hooks/{systemId}' }
        secretSetAt: { type: string, format: date-time, nullable: true, description: 'When the secret was generated or last rotated: rotate every 90 days' }
        previousUntil: { type: string, format: date-time, nullable: true, description: 'Until when the previous secret is still accepted' }
        secret: { type: string, nullable: true, description: 'The secret, answered once: on the system''s creation' }
    ChatSystemDetails:
      type: object
      required: [signingSecretSet, appTokenSet, botSet]
      properties:
        transport: { type: string, nullable: true, enum: [EVENTS_API, SOCKET_MODE], description: Slack only }
        teamId: { type: string, nullable: true, description: 'Slack: the workspace, fixed once the bot named it' }
        teamName: { type: string, nullable: true }
        tenantId: { type: string, nullable: true, description: 'Teams: the tenant' }
        appId: { type: string, nullable: true, description: 'Teams: the Azure Bot''s Microsoft App ID' }
        botSet: { type: boolean }
        botCredentialId:
          type: string
          format: uuid
          nullable: true
          description: "The bot: a credential of the chat system (ADR-0072), changed only with the bot; for whoever manages the system"
        botCredentialName: { type: string, nullable: true, description: "The bot's credential's name, for whoever manages the system" }
        botPrincipalId:
          type: string
          format: uuid
          nullable: true
          description: The service account that borrows the bot's credential, for whoever manages the system
        botPrincipalName: { type: string, nullable: true, description: 'Its name, for whoever manages the system' }
        botUserId: { type: string, nullable: true, description: 'Slack: the bot''s user id' }
        signingSecretSet: { type: boolean, description: 'Slack: whether the Events API''s signing secret is kept' }
        appTokenSet: { type: boolean, description: 'Slack: whether Socket Mode''s app-level token is kept' }
        eventsUrl:
          type: string
          nullable: true
          description: "Slack's Events API: the request URL of the app's events (and, under `/interactions`, of its interactivity); for whoever manages the system"
        interactionsUrl: { type: string, nullable: true, description: "Slack: the request URL of the app's interactivity; for whoever manages the system" }
        messagingUrl: { type: string, nullable: true, description: "Teams: the Azure Bot's messaging endpoint; for whoever manages the system" }
    SlackSystemSettings:
      type: object
      required: [transport]
      properties:
        transport:
          type: string
          enum: [EVENTS_API, SOCKET_MODE]
          description: |
            `EVENTS_API` where Tinfirm is reachable from the internet (Slack posts to it, signed); `SOCKET_MODE` where it
            is not (the server opens a WebSocket to Slack with the app-level token)
    TeamsSystemSettings:
      type: object
      required: [tenantId, appId]
      properties:
        tenantId:
          type: string
          pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
        appId:
          type: string
          pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
    ChatBotRequest:
      type: object
      required: [principalId, token]
      properties:
        principalId: { type: string, format: uuid, description: The service account that borrows the bot's credential }
        token:
          type: string
          minLength: 1
          maxLength: 4000
          writeOnly: true
          description: "Slack's bot token (`xoxb-`), or the Teams app's password"
    ChatBot:
      type: object
      required: [systemId, principalId, credentialId, identity]
      properties:
        systemId: { type: string, format: uuid }
        principalId: { type: string, format: uuid, description: The service account that borrows the bot's credential }
        credentialId: { type: string, format: uuid, description: "The bot's credential on the chat system" }
        identity: { type: string, description: "Slack's bot user id; Teams' app id" }
        teamId: { type: string, nullable: true }
        teamName: { type: string, nullable: true }
    ChatSecretsRequest:
      type: object
      properties:
        signingSecret: { type: string, minLength: 1, maxLength: 200, writeOnly: true }
        appToken: { type: string, minLength: 1, maxLength: 500, writeOnly: true }
    ChatChannelList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ChatChannel' }
    ChatChannel:
      type: object
      required: [channelId, kind, archived, available, hasDefault, triggers]
      properties:
        channelId: { type: string }
        name: { type: string, nullable: true }
        kind:
          type: string
          enum: [PUBLIC, PRIVATE, SHARED]
          description: A Teams channel is PUBLIC unless the platform said otherwise
        teamId: { type: string, nullable: true, description: "Teams' team" }
        archived: { type: boolean }
        available:
          type: boolean
          description: A channel trigger may be saved on it (the bot is in it, not archived, not shared)
        hasDefault: { type: boolean, description: A live channel trigger is its default }
        triggers:
          type: array
          items: { $ref: '#/components/schemas/ChatChannelTrigger' }
    ChatChannelTrigger:
      type: object
      required: [triggerId, name, agentId, default]
      properties:
        triggerId: { type: string, format: uuid }
        name: { type: string }
        agentId: { type: string, format: uuid }
        default: { type: boolean }
    ChatManifest:
      type: object
      required: [kind, fileName]
      properties:
        kind: { $ref: '#/components/schemas/SystemKind' }
        fileName: { type: string }
        manifest:
          type: object
          additionalProperties: true
          nullable: true
          description: "Slack's app manifest"
        appPackage: { type: string, nullable: true, description: "Teams' app package, a zip in base64" }
    OutlookManifest:
      type: object
      required: [fileName, addInId, taskPaneUrl, manifest]
      properties:
        fileName: { type: string, description: 'The name to save it under, `tinfirm-outlook-manifest.xml`' }
        addInId: { type: string, format: uuid, description: The add-in's id in the manifest }
        taskPaneUrl: { type: string, description: The task pane's URL }
        manifest: { type: string, description: 'The manifest, in XML' }
    GmailDeployment:
      type: object
      required: [fileName, deployment, configured]
      properties:
        fileName: { type: string, description: 'The name to save it under, `tinfirm-gmail-deployment.json`' }
        deployment: { type: string, description: 'The deployment, in JSON' }
        configured:
          type: boolean
          description: Whether the operator set the Google Cloud project's service account and OAuth client
    GmailLinkTokenRequest:
      type: object
      required: [token]
      properties:
        token: { type: string, minLength: 1, maxLength: 200, writeOnly: true }
    GmailLinkRequest:
      type: object
      required: [requestedAt, expiresAt, ownerNotice]
      properties:
        googleEmail: { type: string, nullable: true, description: "The Google account's email, as Google asserted it" }
        requestedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        ownerNotice: { type: string, description: "The notice of the Owner's reads" }
    GmailLink:
      type: object
      required: [id, companyId, companyName, linkedAt, lastUsedAt]
      properties:
        id: { type: string, format: uuid }
        companyId: { type: string, format: uuid }
        companyName: { type: string }
        googleEmail: { type: string, nullable: true }
        linkedAt: { type: string, format: date-time }
        lastUsedAt: { type: string, format: date-time }
    GmailLinkList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/GmailLink' }
    ChatSettings:
      type: object
      required: [messagesPerUserPerMinute, messagesPerUserPerDay, eventsPerSystemPerMinute, version]
      properties:
        messagesPerUserPerMinute: { type: integer, format: int32, minimum: 1, maximum: 600 }
        messagesPerUserPerDay: { type: integer, format: int32, minimum: 1, maximum: 10000 }
        eventsPerSystemPerMinute: { type: integer, format: int32, minimum: 1, maximum: 6000 }
        version:
          type: integer
          format: int32
          minimum: 0
          description: |
            The rates' version, for optimistic locking: 0 until the company set them, then one more with every change.
            A change names the version it read; one made meanwhile is refused with 409 SETTINGS_CHANGED, and the
            caller reads the rates again.
    ChatLinkTokenRequest:
      type: object
      required: [token]
      properties:
        token: { type: string, minLength: 1, maxLength: 200, writeOnly: true }
    ChatLink:
      type: object
      required: [systemId, systemKind, systemName, chatUserId, requestedAt, expiresAt]
      properties:
        systemId: { type: string, format: uuid }
        systemKind: { $ref: '#/components/schemas/SystemKind' }
        systemName: { type: string }
        chatUserId: { type: string, description: "The chat user's immutable id (Slack's user id, Teams' Entra object id)" }
        displayName: { type: string, nullable: true, description: A name anyone can set; never proof }
        workspaceId: { type: string, nullable: true }
        workspaceName: { type: string, nullable: true }
        requestedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        linked: { type: boolean, description: 'Confirm only: linked to the caller' }
        accountId: { type: string, format: uuid, nullable: true }
        ownerNotice: { type: string, description: "The notice of the Owner's reads (security review, row 18)" }
        platformName:
          type: string
          nullable: true
          description: |
            Read only: the name the platform gives the chat user now, read by the server when the page loads (the
            security review of 2026-10-27, L3): on Slack `users.info`'s real name (else its display name), asked with
            the bot's token; on Teams the Entra display name the Bot Framework's roster gave. Null when the platform
            could not be asked
        avatar:
          type: string
          nullable: true
          description: 'Read only, Slack: the chat user''s profile picture as a `data:` URL (at most 64 KiB); null without one'
        platformChecked:
          type: boolean
          description: Read only. Whether the platform was asked who the chat user is when the page loaded
        waitingMessages:
          type: integer
          description: |
            How many of the chat user's messages waited for this link. They are not sent when the link is confirmed:
            they are dropped, and the chat user is told to send them again
    ChatPreference:
      type: object
      properties:
        defaultAgentId: { type: string, format: uuid, nullable: true }
    ExternalSystemPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ExternalSystem' }
        nextCursor: { type: string, nullable: true }
    SystemCreateRequest:
      type: object
      required: [name, kind]
      properties:
        name: { type: string, minLength: 1, maxLength: 100, description: 'Unique in the company, ignoring case' }
        handle:
          type: string
          deprecated: true
          description: 'Never chosen: Tinfirm makes the handle from the name. Present: 400 VALIDATION_FAILED'
        kind: { $ref: '#/components/schemas/SystemKind' }
        baseUrl:
          type: string
          maxLength: 500
          description: |
            The API root: Jira's root, a Jira Cloud site (`https://acme.atlassian.net`), GitHub's API
            (`https://api.github.com`, `https://<host>/api/v3`), a GitLab instance, an MCP server's endpoint; none for
            GIT
        personal:
          type: boolean
          default: false
          description: One's own MCP server, which binds for oneself only
        authHeader:
          type: string
          maxLength: 64
          description: 'MCP only: the header a stored token goes in; absent: `Authorization: Bearer`'
        pollIntervalSeconds:
          type: integer
          format: int32
          minimum: 30
          maximum: 3600
          description: "A tracker's only: how often its triggers' polls read it, in seconds; absent: 60"
        slack:
          allOf: [{ $ref: '#/components/schemas/SlackSystemSettings' }]
          description: 'SLACK only, required: how its events arrive. Its base URL is fixed (https://slack.com/api)'
        teams:
          allOf: [{ $ref: '#/components/schemas/TeamsSystemSettings' }]
          description: 'TEAMS only, required: the tenant and the Azure Bot. Its base URL is fixed (the connector)'
        webhook:
          allOf: [{ $ref: '#/components/schemas/WebhookSystemSettings' }]
          description: 'WEBHOOK only, required: the scheme and the mapping. It has no base URL; Tinfirm generates its secret, answered once'
    SystemUpdateRequest:
      type: object
      description: Absent fields stay unchanged
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        baseUrl:
          type: string
          maxLength: 500
          description: |
            MCP only (ADR-0079): the server's new endpoint, checked as at registration (`400 INVALID_BASE_URL`).
            Different from the current one, it removes every account and credential on the server, and its app
        handle:
          type: string
          deprecated: true
          description: 'The handle never changes. Present: 400 VALIDATION_FAILED, never a silent rename'
        authHeader: { type: string, maxLength: 64, description: 'MCP only; blank: `Authorization: Bearer`' }
        accountsRequired:
          type: boolean
          description: |
            MCP only for false (ADR-0071): runs call the server without a credential and need no account on it. Tinfirm
            first checks that it answers `initialize` and `tools/list` without one (`400 CREDENTIAL_REQUIRED`
            otherwise). True again: conversations that used it without an account wait for one at its next use
        pollIntervalSeconds:
          type: integer
          format: int32
          minimum: 30
          maximum: 3600
          description: "A tracker's only: how often its triggers' polls read it, in seconds, from each poll's next pass"
        slack:
          allOf: [{ $ref: '#/components/schemas/SlackSystemSettings' }]
          description: 'SLACK only: another transport'
        webhook:
          allOf: [{ $ref: '#/components/schemas/WebhookSystemSettings' }]
          description: 'WEBHOOK only: its absent fields stay; a mapping replaces the mapping whole'

    SystemAppRequest:
      type: object
      properties:
        clientId:
          type: string
          minLength: 1
          maxLength: 500
          description: 'Required for a tracker; absent for an MCP server: its metadata document or a registration'
        clientSecret:
          type: string
          maxLength: 2000
          description: 'Write-only. Absent: the current one while the client id stays, else none'
        scopes: { type: string, maxLength: 2000, description: 'Space-separated; absent: the profile''s' }
        confirmEndpointsChange:
          type: boolean
          description: |
            An MCP server's: the caller confirms that a new token or revocation endpoint removes the OAuth accounts
            and credentials on the server (what 409 SYSTEM_APP_ENDPOINTS_CHANGED listed). Absent or false: such a
            change is refused while they exist
    SystemLastTest:
      type: object
      required: [at, ok, withAccount]
      description: |
        A system's last test (`POST /systems/{systemId}/test`), as stored when it ended; the next test replaces it. A
        catalogue's refresh sets the system's `status` too, but is not a test
      properties:
        at: { type: string, format: date-time, description: When it ended }
        ok: { type: boolean, description: Whether it passed }
        withAccount:
          type: boolean
          description: Whether it reached the system with an account (the tester's own; a chat system's bot), as the test answered
        error: { type: string, nullable: true, description: 'Why it failed, at most 500 characters; null when it passed' }
        byPrincipalId:
          type: string
          format: uuid
          nullable: true
          description: |
            Who ran it, their member principal, for whoever manages the system; null for anyone else, for an instance
            admin who is not a member, once the principal is gone, and once the erasure of a member who left forgot them
        byName:
          type: string
          nullable: true
          description: Their name, read when shown and never stored with the test (`deleted user` once the user is deleted); null with `byPrincipalId`
        credentialId:
          type: string
          format: uuid
          nullable: true
          description: |
            The system's credential it used, for whoever manages the system; null with the tester's own account,
            without one, or once it is gone
        credentialName: { type: string, nullable: true, description: "That credential's name, as it is now" }
    SystemTestResult:
      type: object
      required: [ok, withAccount, credentialRequired, message]
      properties:
        ok: { type: boolean }
        withAccount: { type: boolean, description: "Whether an account was used: the caller's own, or a credential" }
        credentialId:
          type: string
          format: uuid
          nullable: true
          description: The system's credential it reached the system with; null for the caller's own account or none
        credentialName: { type: string, nullable: true, description: "That credential's name" }
        credentialRequired:
          type: boolean
          description: |
            The system refused the request's credential (a 401): without `withAccount` it asks for a credential none
            was given for (add one, or connect your own), with it it refused the account or credential used (sign it
            in again)
        login: { type: string, nullable: true, description: Who that account is on the system }
        message: { type: string }
    SystemRepository:
      type: object
      required: [id, systemId, url, name]
      properties:
        id: { type: string, format: uuid }
        systemId: { type: string, format: uuid }
        url: { type: string }
        name: { type: string }
        defaultBranch: { type: string, nullable: true }
    SystemRepositoryPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/SystemRepository' }
        nextCursor: { type: string, nullable: true }
    SystemRepositoryCreateRequest:
      type: object
      required: [url]
      properties:
        url: { type: string, minLength: 1, maxLength: 500 }
        defaultBranch: { type: string, maxLength: 255 }
    SystemTool:
      type: object
      required: [name, inputSchema, effect, enabled, fixed]
      properties:
        name: { type: string }
        title: { type: string, nullable: true }
        description: { type: string, nullable: true }
        inputSchema: { type: object, additionalProperties: true }
        effect: { $ref: '#/components/schemas/ToolEffect' }
        suggestedEffect:
          allOf: [{ $ref: '#/components/schemas/ToolEffect' }]
          nullable: true
          description: 'An MCP tool''s effect as its hints suggest it: never trusted until confirmed'
        hintReadOnly: { type: boolean, nullable: true }
        hintDestructive: { type: boolean, nullable: true }
        enabled: { type: boolean }
        fixed: { type: boolean, description: One of Tinfirm's fixed tools of a tracker }
    SystemToolList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/SystemTool' }
    SystemToolUpdateRequest:
      type: object
      description: Absent fields stay unchanged
      properties:
        effect:
          type: string
          enum: [READ, WRITE]
          description: Confirms the tool's effect
        enabled: { type: boolean }
    SystemToolRefresh:
      type: object
      required: [ok, added, removed, unconfirmed, withAccount, credentialRequired]
      properties:
        ok: { type: boolean }
        message: { type: string, nullable: true, description: Why the catalogue could not be read }
        withAccount: { type: boolean, description: "Whether an account was used: the caller's own, or a credential" }
        credentialId:
          type: string
          format: uuid
          nullable: true
          description: The system's credential it was read with; null for the caller's own account or none
        credentialName: { type: string, nullable: true, description: "That credential's name" }
        credentialRequired:
          type: boolean
          description: |
            The server refused the request's credential (a 401): without `withAccount` it asks for a credential none was
            given for (add one, or connect your own), with it it refused the account or credential used (sign it in
            again)
        added: { type: array, items: { type: string } }
        removed: { type: array, items: { type: string } }
        unconfirmed:
          type: array
          items: { type: string }
          description: Tools that lost their confirmed effect because their description, schema or hints changed
    SystemSettings:
      type: object
      required: [personalMcpServers]
      properties:
        personalMcpServers:
          type: boolean
          description: Whether members may register and use personal MCP servers (on by default)

    AccountAccess:
      type: string
      enum: [READ, WRITE]
      description: |
        What a grant lets its group, or a lending its service account, do with a system's credential; one's own
        account is always `WRITE`
    SystemRef:
      type: object
      required: [id, name, handle, kind, personal]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        handle: { type: string }
        kind: { $ref: '#/components/schemas/SystemKind' }
        personal: { type: boolean }
    Account:
      type: object
      required: [id, systemId, kind, status, connectedAt]
      description: An account, without its credential
      properties:
        id: { type: string, format: uuid }
        systemId: { type: string, format: uuid }
        kind: { type: string, enum: [TOKEN, OAUTH, CLIENT, LINK] }
        status:
          type: string
          enum: [OK, RECONNECT, ERROR]
          description: '`RECONNECT`: the system refused it or the grant expired; whoever manages it signs in again'
        login: { type: string, nullable: true, description: 'Who it is on the system, where the system says' }
        lastError: { type: string, nullable: true }
        scopes: { type: string, nullable: true }
        connectedAt: { type: string, format: date-time }
        lastUsedAt: { type: string, format: date-time, nullable: true }
        binding:
          type: string
          enum: [OWN, GRANTED, CHOOSE, CONNECT, RECONNECT_YOURS, RECONNECT_COMPANY, RECONNECT_OR_GRANT, UNAVAILABLE, NOT_NEEDED]
          description: |
            Only in the answer of `storeMyAccountToken`: what a conversation of the caller would bind now on the
            system, as `MyAccount.binding` says it (`OWN` once their own account works). Absent elsewhere
    AccountList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Account' }
    GrantChoice:
      type: object
      required: [grantId, credentialId, credentialName, groupId, groupName, access]
      description: A grant the caller may act with
      properties:
        grantId: { type: string, format: uuid }
        credentialId: { type: string, format: uuid }
        credentialName: { type: string, description: The credential it lends }
        groupId: { type: string, format: uuid }
        groupName: { type: string }
        access: { $ref: '#/components/schemas/AccountAccess' }
    MyAccount:
      type: object
      required: [system, grants, binding, oauthAvailable]
      properties:
        system: { $ref: '#/components/schemas/SystemRef' }
        account:
          allOf: [{ $ref: '#/components/schemas/Account' }]
          nullable: true
          description: The caller's own account; null when they hold none
        grants:
          type: array
          items: { $ref: '#/components/schemas/GrantChoice' }
          description: The usable grants to the caller's groups, the one a conversation would take first
        binding:
          type: string
          enum: [OWN, GRANTED, CHOOSE, CONNECT, RECONNECT_YOURS, RECONNECT_COMPANY, RECONNECT_OR_GRANT, UNAVAILABLE, NOT_NEEDED]
          description: |
            What a conversation of the caller would bind now: their own account, the one grant, a choice among
            grants, or what must happen first (connect one's own, sign one's own in again, an admin signs the granted
            account in again, sign in again or use the grant); `UNAVAILABLE` for a personal server while the company
            switched them off; `NOT_NEEDED` for an MCP server that needs no account (ADR-0071), which a conversation
            calls without one, whatever account the caller holds there
        oauthAvailable: { type: boolean, description: Whether the system's app lets the caller sign in }
    MyAccountList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/MyAccount' }
    AccountTokenRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 4000
          format: password
          description: Write-only; Jira Cloud takes `email:api-token`
    SignInRequest:
      type: object
      required: [returnTo]
      properties:
        returnTo:
          type: string
          minLength: 1
          maxLength: 1000
          description: 'A path of this site to return to, e.g. `/c/{companyId}/accounts`; never another origin'
    SignInStart:
      type: object
      required: [authorizationUrl]
      properties:
        authorizationUrl: { type: string }
    SystemCredential:
      type: object
      required: [id, systemId, name, kind, status, enabled, connectedAt, bot, grants, serviceAccounts]
      description: A system's credential (ADR-0072), without its secret
      properties:
        id: { type: string, format: uuid }
        systemId: { type: string, format: uuid }
        name: { type: string }
        kind: { type: string, enum: [TOKEN, OAUTH, CLIENT], description: 'CLIENT: an OAuth client''s own credentials (an Atlassian service account''s)' }
        status:
          type: string
          enum: [OK, RECONNECT, ERROR]
          description: '`RECONNECT`: the system refused it or the grant expired; an admin stores a token or client credentials, or signs in again'
        enabled: { type: boolean, description: 'Disabled: nothing acts with it until it is enabled again' }
        login: { type: string, nullable: true, description: 'Who it is on the system, where the system says' }
        lastError: { type: string, nullable: true }
        scopes: { type: string, nullable: true }
        connectedAt: { type: string, format: date-time }
        connectedByName: { type: string, nullable: true, description: Who stored or signed it in last }
        lastUsedAt: { type: string, format: date-time, nullable: true }
        bot: { type: boolean, description: "The chat system's bot: set, replaced and removed with `setChatBot`" }
        grants:
          type: array
          items: { $ref: '#/components/schemas/CredentialGrant' }
          description: The groups it is lent to, by group name
        serviceAccounts:
          type: array
          items: { $ref: '#/components/schemas/CredentialLending' }
          description: The service accounts that borrow it, by name
        openTriggers:
          type: array
          items: { $ref: '#/components/schemas/CredentialOpenTrigger' }
          description: |
            The live triggers open to anyone that act with it through the service accounts that borrow it, by name:
            whoever may write at their source drives their agent with it (the security review of 2026-10-27, D2).
            Whoever lent it is told in their inbox the first time a trigger does (`TRIGGER` with reason
            `CREDENTIAL_EXPOSED_TO_OPEN_SOURCE`)
    CredentialGrant:
      type: object
      required: [id, groupId, groupName, access, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid, description: The grant }
        groupId: { type: string, format: uuid }
        groupName: { type: string }
        access: { $ref: '#/components/schemas/AccountAccess' }
        createdAt: { type: string, format: date-time, description: When it was lent to the group }
        updatedAt: { type: string, format: date-time, description: When its access changed last }
    CredentialLending:
      type: object
      required: [serviceIdentityId, name, status, access, triggers, createdAt, updatedAt]
      properties:
        serviceIdentityId: { type: string, format: uuid }
        name: { type: string }
        status: { type: string, enum: [ACTIVE, SUSPENDED] }
        access: { $ref: '#/components/schemas/AccountAccess' }
        triggers:
          type: integer
          format: int32
          description: |
            The live triggers whose rows act with the credential through the service account: they follow the service
            account to a credential lent in its place, and pause when it is withdrawn
        createdAt: { type: string, format: date-time, description: When it was lent to the service account }
        updatedAt: { type: string, format: date-time, description: When its access changed last }
    CredentialOpenTrigger:
      type: object
      required: [id, name, source, serviceIdentityId]
      description: |
        A live trigger open to anyone (a tracker's, a chat's channels or a webhook's: every source but a schedule)
        whose row acts with the credential through a service account (D2, the owner's decision Q3)
      properties:
        id: { type: string, format: uuid, description: The trigger }
        name: { type: string }
        source: { $ref: '#/components/schemas/TriggerSource' }
        serviceIdentityId: { type: string, format: uuid, description: The service account its row acts through }
        serviceIdentityName: { type: string, nullable: true }
    SystemCredentialList:
      type: object
      required: [items, memberAccounts]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/SystemCredential' }
        memberAccounts: { $ref: '#/components/schemas/MemberAccountCount' }
    MemberAccountCount:
      type: object
      required: [ok, notOk]
      description: |
        How many members hold their own account on the system, as Members says it (I4), without who: those that
        work, and those that need their member to sign in again
      properties:
        ok: { type: integer, format: int32 }
        notOk: { type: integer, format: int32 }
    SystemCredentialCreateRequest:
      type: object
      required: [name, token]
      properties:
        name: { type: string, minLength: 1, maxLength: 100, description: 'Unique on the system, ignoring case' }
        token:
          type: string
          minLength: 1
          maxLength: 4000
          format: password
          description: Write-only; Jira Cloud takes `email:api-token`
    AccountClientRequest:
      type: object
      required: [clientId, clientSecret]
      description: An OAuth client's own credentials, as Atlassian shows them once for a service account's OAuth 2.0 credential
      properties:
        clientId: { type: string, minLength: 1, maxLength: 500 }
        clientSecret: { type: string, minLength: 1, maxLength: 2000, format: password, description: Write-only }
    SystemCredentialClientCreateRequest:
      type: object
      required: [name, clientId, clientSecret]
      properties:
        name: { type: string, minLength: 1, maxLength: 100, description: 'Unique on the system, ignoring case' }
        clientId: { type: string, minLength: 1, maxLength: 500 }
        clientSecret: { type: string, minLength: 1, maxLength: 2000, format: password, description: Write-only }
    SystemCredentialSignInRequest:
      type: object
      required: [name, returnTo]
      properties:
        name: { type: string, minLength: 1, maxLength: 100, description: The new credential's name }
        returnTo:
          type: string
          minLength: 1
          maxLength: 1000
          description: 'A path of this site to return to, e.g. `/c/{companyId}/systems/{systemId}`; never another origin'
    SystemCredentialUpdateRequest:
      type: object
      minProperties: 1
      description: A new name, whether it is enabled, or both
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        enabled: { type: boolean }
    CredentialLendRequest:
      type: object
      required: [access]
      properties:
        access: { $ref: '#/components/schemas/AccountAccess' }
    BorrowedCredential:
      type: object
      required: [system, credential, access, triggers, createdAt, updatedAt]
      properties:
        system: { $ref: '#/components/schemas/SystemRef' }
        credential: { $ref: '#/components/schemas/SystemCredentialRef' }
        access: { $ref: '#/components/schemas/AccountAccess' }
        bot: { type: boolean, description: "The chat system's bot" }
        triggers: { type: integer, format: int32, description: The live triggers that act with it through the service account }
        openTriggers:
          type: array
          items: { $ref: '#/components/schemas/CredentialOpenTrigger' }
          description: Those of them open to anyone, by name (D2)
        createdAt: { type: string, format: date-time, description: When it was lent }
        updatedAt: { type: string, format: date-time, description: When its access changed last }
    SystemCredentialRef:
      type: object
      required: [id, name, kind, status, enabled]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        kind: { type: string, enum: [TOKEN, OAUTH, CLIENT], description: 'CLIENT: an OAuth client''s own credentials (an Atlassian service account''s)' }
        status: { type: string, enum: [OK, RECONNECT, ERROR] }
        enabled: { type: boolean }
        login: { type: string, nullable: true }
    BorrowedCredentialList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/BorrowedCredential' }
    AccountGrant:
      type: object
      required: [id, credentialId, systemId, systemName, credentialName, groupId, groupName, access, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        credentialId: { type: string, format: uuid, description: The credential it lends }
        systemId: { type: string, format: uuid }
        systemName: { type: string }
        credentialName: { type: string }
        groupId: { type: string, format: uuid }
        groupName: { type: string }
        access: { $ref: '#/components/schemas/AccountAccess' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AccountGrantPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AccountGrant' }
        nextCursor: { type: string, nullable: true }
    AccountGrantCreateRequest:
      type: object
      required: [credentialId, groupId, access]
      properties:
        credentialId: { type: string, format: uuid, description: A credential of a company system }
        groupId: { type: string, format: uuid }
        access: { $ref: '#/components/schemas/AccountAccess' }
    AccountGrantUpdateRequest:
      type: object
      required: [access]
      properties:
        access: { $ref: '#/components/schemas/AccountAccess' }
    AgentRuntime:
      type: string
      enum: [CLAUDE_CODE, CODEX, PI, OPENCODE]
      description: An agent runtime (ADR-0041)
    AgentStatus:
      type: string
      enum: [ACTIVE, PAUSED]
      description: '`PAUSED`: its conversations start no turn and run no approved call (the kill switch)'
    AgentToolMode:
      type: string
      enum: [ALLOW, ASK]
      description: '`ALLOW` runs a call; `ASK` makes each call an approval. A tool the agent does not list is not available'
    AgentRepositoryAccess:
      type: string
      enum: [READ, WRITE]
      description: '`READ`: cloned, never pushed, no change request (ADR-0017)'
    AgentEffort:
      type: string
      enum: [DEFAULT, LOW, MEDIUM, HIGH, XHIGH, MAX]
      description: How much the runtime thinks; `DEFAULT` leaves it to the runtime and its model
    SkillUpload:
      type: object
      description: Exactly one of `file` and `skillMd`
      properties:
        file: { type: string, format: binary, description: 'A zip of the skill''s folder' }
        skillMd: { type: string, maxLength: 100000, description: 'The text of a SKILL.md: a skill of one file' }
        note: { type: string, maxLength: 500, description: 'What changed, for the version''s history' }
    SkillSummary:
      type: object
      required: [id, name, description, latestVersion, editableByMe, shareGroupIds, sharePrincipalIds, deleted,
                 createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name:
          type: string
          example: write-jira-ticket
          description: The Agent Skills name, its folder's name in the sandbox
        description: { type: string, description: The latest version's description }
        latestVersion: { type: integer, format: int32 }
        ownerPrincipalId:
          type: string
          format: uuid
          nullable: true
          description: The member's principal who owns it (its creator); null once it passed to the admins
        ownerName: { type: string, nullable: true }
        editableByMe: { type: boolean, description: 'Its owner, OWNER and ADMIN' }
        shareGroupIds:
          type: array
          items: { type: string, format: uuid }
        sharePrincipalIds:
          type: array
          items: { type: string, format: uuid }
        agentCount:
          type: integer
          format: int32
          nullable: true
          description: The live agents that pin a version of it, for whoever edits it; null for anyone else
        deleted: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    SkillPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/SkillSummary' }
        nextCursor: { type: string, nullable: true }
    SkillVersionSummary:
      type: object
      required: [version, description, sha256, sizeBytes, fileCount, createdAt]
      properties:
        version: { type: integer, format: int32 }
        description: { type: string }
        sha256: { type: string, description: 'The SHA-256 of the canonical zip, in lower-case hex' }
        sizeBytes: { type: integer, format: int64, description: The canonical zip's size }
        fileCount: { type: integer, format: int32 }
        note: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        createdByName: { type: string, nullable: true }
    Skill:
      allOf:
        - $ref: '#/components/schemas/SkillSummary'
        - type: object
          required: [memberShares, versions]
          properties:
            memberShares:
              type: array
              items: { $ref: '#/components/schemas/AgentMemberShare' }
            versions:
              type: array
              items: { $ref: '#/components/schemas/SkillVersionSummary' }
              description: Newest first
    SkillFile:
      type: object
      required: [path, sizeBytes]
      properties:
        path: { type: string, description: 'Relative to the skill''s folder, `/`-separated' }
        sizeBytes: { type: integer, format: int64 }
    SkillVersion:
      allOf:
        - $ref: '#/components/schemas/SkillVersionSummary'
        - type: object
          required: [skillId, name, files, skillMd]
          properties:
            skillId: { type: string, format: uuid }
            name: { type: string }
            files:
              type: array
              items: { $ref: '#/components/schemas/SkillFile' }
            skillMd: { type: string, description: The text of its SKILL.md }
    SkillSharesRequest:
      type: object
      required: [groupIds]
      properties:
        groupIds:
          type: array
          maxItems: 50
          items: { type: string, format: uuid }
        principalIds:
          type: array
          nullable: true
          maxItems: 100
          items: { type: string, format: uuid }
          description: Absent or null, the members it is shared with stay
    AgentSkill:
      type: object
      required: [skillId, name, description, version, latestVersion, deleted]
      description: A skill of an agent, at the version it pins
      properties:
        skillId: { type: string, format: uuid }
        name: { type: string }
        description: { type: string, description: The pinned version's description }
        version: { type: integer, format: int32, description: The pinned version }
        latestVersion:
          type: integer
          format: int32
          description: The skill's latest version; above `version`, an update the agent's editors may take
        deleted: { type: boolean, description: 'Deleted from the library: kept here, never moved' }
    AgentSkillInput:
      type: object
      required: [skillId]
      properties:
        skillId: { type: string, format: uuid }
        version:
          type: integer
          format: int32
          minimum: 1
          nullable: true
          description: 'The version to pin; absent: the pin it has, or the latest for a skill that joins'
    AgentSkillsRequest:
      type: object
      required: [skills]
      properties:
        skills:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/AgentSkillInput' }
    AgentSummary:
      type: object
      required: [id, name, handle, runtimes, status, version, usableByMe, editableByMe, wideningPending, skillUpdates,
                 createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: Business analyst }
        handle: { type: string, example: business-analyst, description: 'Mentioned as @handle' }
        description: { type: string, nullable: true }
        runtimes:
          type: array
          items: { $ref: '#/components/schemas/AgentRuntime' }
          description: The runtimes its instructions are tested on; the first is the default
        status: { $ref: '#/components/schemas/AgentStatus' }
        ownerPrincipalId:
          type: string
          format: uuid
          nullable: true
          description: The member's principal who owns it (its creator); null once it passed to the admins
        ownerName: { type: string, nullable: true }
        version: { type: integer, format: int32, description: The current version }
        usableByMe:
          type: boolean
          description: 'Its owner, a member of a group it is shared with, or a member it is shared with'
        editableByMe: { type: boolean, description: 'Its owner, OWNER and ADMIN' }
        wideningPending:
          type: boolean
          description: For a caller who may use it, whether the current version widens the one they accepted
        skillUpdates:
          type: integer
          format: int32
          description: For whoever edits it, how many of its skills have a version newer than the one it pins; else 0
        shareGroupIds:
          type: array
          items: { type: string, format: uuid }
          description: |
            The groups it is shared with, by id, as `Agent.shares` shows them to whoever sees the agent (empty while
            it is private to its owner): a group's page finds its agents in the list without reading each
        sharePrincipalIds:
          type: array
          items: { type: string, format: uuid }
          description: |
            The members it is shared with on their own, by principal, as `Agent.memberShares` shows them to whoever
            sees the agent
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AgentPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AgentSummary' }
        nextCursor: { type: string, nullable: true }
    AgentTool:
      type: object
      required: [name, mode, chosenForEffect, offered]
      properties:
        name: { type: string, description: The tool as its system names it }
        title: { type: string, nullable: true }
        mode: { $ref: '#/components/schemas/AgentToolMode' }
        chosenForEffect:
          type: string
          enum: [READ, WRITE]
          description: |
            The tool's effect when its mode was chosen: an `ALLOW` chosen for a read counts as `ASK` once the tool's
            effect is `WRITE` (I19)
        effect:
          allOf: [{ $ref: '#/components/schemas/ToolEffect' }]
          nullable: true
          description: The tool's effect now; null when its system no longer serves it
        offered: { type: boolean, description: 'Whether its system still serves it; a row that is not lists nothing' }
    AgentSystem:
      type: object
      required: [systemId, name, handle, kind, tools]
      properties:
        systemId: { type: string, format: uuid }
        name: { type: string }
        handle: { type: string }
        kind: { $ref: '#/components/schemas/SystemKind' }
        tools:
          type: array
          items: { $ref: '#/components/schemas/AgentTool' }
    AgentRepository:
      type: object
      required: [repositoryId, systemId, name, url, access]
      properties:
        repositoryId: { type: string, format: uuid }
        systemId: { type: string, format: uuid }
        name: { type: string }
        url: { type: string }
        access: { $ref: '#/components/schemas/AgentRepositoryAccess' }
    AgentHost:
      type: object
      required: [host, addedAt]
      properties:
        host: { type: string, example: registry.npmjs.org }
        reason: { type: string, nullable: true }
        addedBy: { type: string, format: uuid, nullable: true, description: The user who added it }
        decisionId:
          type: string
          format: uuid
          nullable: true
          description: The approval of a request for good that added it
        addedAt: { type: string, format: date-time }
    AgentWidenedTool:
      type: object
      required: [systemId, tool, mode]
      properties:
        systemId: { type: string, format: uuid }
        tool: { type: string }
        mode: { $ref: '#/components/schemas/AgentToolMode' }
        was:
          type: string
          nullable: true
          enum: [ASK, ALLOW_FOR_READS]
          description: 'What the accepted version had: null for a new tool; `ALLOW_FOR_READS`: allowed while it read'
    AgentWidenedRepository:
      type: object
      required: [repositoryId, access]
      properties:
        repositoryId: { type: string, format: uuid }
        access: { $ref: '#/components/schemas/AgentRepositoryAccess' }
        was:
          allOf: [{ $ref: '#/components/schemas/AgentRepositoryAccess' }]
          nullable: true
          description: The accepted version's access; null for a new repository
    AgentWidening:
      type: object
      required: [acceptedVersion, currentVersion, systems, tools, repositories, hosts]
      description: |
        What the current version adds over the version the person accepted, which their conversations do not use until
        they accept it. Within a ceiling that can act (a tool `ALLOW` chosen for a write, a repository at `WRITE`, or a
        network host), a change of the instructions or of the skills is part of it too (the owner's decision Q4): the
        conversations keep the accepted version's instructions and skills until then
      properties:
        acceptedVersion: { type: integer, format: int32 }
        currentVersion: { type: integer, format: int32 }
        systems:
          type: array
          items: { type: string, format: uuid }
        tools:
          type: array
          items: { $ref: '#/components/schemas/AgentWidenedTool' }
        repositories:
          type: array
          items: { $ref: '#/components/schemas/AgentWidenedRepository' }
        hosts:
          type: array
          items: { type: string }
        instructions:
          allOf: [{ $ref: '#/components/schemas/AgentWidenedInstructions' }]
          nullable: true
          description: The instructions of both versions, for the diff, when they differ; null when they do not
        skills:
          type: array
          items: { $ref: '#/components/schemas/AgentWidenedSkill' }
          description: The skills the current version adds, or pins at another version; empty when none
    AgentWidenedInstructions:
      type: object
      required: [accepted, current]
      properties:
        accepted: { type: string, description: 'The instructions of the accepted version, which the conversations use' }
        current: { type: string, description: 'The instructions of the current version, which wait for acceptance' }
    AgentWidenedSkill:
      type: object
      required: [skillId, name, version]
      properties:
        skillId: { type: string, format: uuid }
        name: { type: string }
        version: { type: integer, format: int32, description: The version the current version pins }
        was:
          type: integer
          format: int32
          nullable: true
          description: The version the accepted version pins; null for a skill it does not have
    Agent:
      type: object
      required: [id, name, handle, instructions, runtimes, status, version, usableByMe, editableByMe, wideningPending,
                 systems, repositories, hosts, shares, memberShares, skills, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        handle: { type: string }
        description: { type: string, nullable: true }
        instructions: { type: string, description: 'The standing instructions, the first part of every prompt' }
        skills:
          type: array
          items: { $ref: '#/components/schemas/AgentSkill' }
          description: Its skills by name, each at the version it pins (ADR-0064)
        runtimes:
          type: array
          items: { $ref: '#/components/schemas/AgentRuntime' }
        turnTimeLimitMinutes:
          type: integer
          format: int32
          nullable: true
          description: |
            How long one turn of the agent may run, in minutes; null for the deployment's default
            (`defaultTurnTimeLimitMinutes`). The runner host stops a turn at its limit (`TIME_LIMIT`); the turn can be
            retried to go on where it stopped
        defaultTurnTimeLimitMinutes:
          type: integer
          format: int32
          description: The deployment's time limit of a turn (`TINFIRM_RUN_MAX_WALL_CLOCK`), for an agent that sets none
        memoryAllowed:
          type: boolean
          description: |
            Whether the people who use the agent, and its triggers' authors, may turn its memory on (ADR-0063; true
            unless its editor forbids it). Memory is opt-in (`AgentSettings.memory`): each person's notes are theirs,
            each trigger's are reviewed by its audience. Not a widening
        status: { $ref: '#/components/schemas/AgentStatus' }
        pausedAt: { type: string, format: date-time, nullable: true }
        ownerPrincipalId: { type: string, format: uuid, nullable: true }
        ownerName: { type: string, nullable: true }
        createdBy: { type: string, format: uuid, nullable: true, description: The user who created it }
        version: { type: integer, format: int32 }
        usableByMe: { type: boolean }
        editableByMe: { type: boolean }
        wideningPending: { type: boolean }
        acceptedVersion:
          type: integer
          format: int32
          nullable: true
          description: For a caller who may use it, the version their conversations use the agent as of
        widening:
          allOf: [{ $ref: '#/components/schemas/AgentWidening' }]
          nullable: true
          description: For a caller who may use it, what the current version adds over the version they accepted
        systems:
          type: array
          items: { $ref: '#/components/schemas/AgentSystem' }
        repositories:
          type: array
          items: { $ref: '#/components/schemas/AgentRepository' }
        hosts:
          type: array
          items: { $ref: '#/components/schemas/AgentHost' }
        shares:
          type: array
          items: { $ref: '#/components/schemas/GroupRef' }
          description: The groups whose members may use it
        memberShares:
          type: array
          items: { $ref: '#/components/schemas/AgentMemberShare' }
          description: The members who may use it on their own, whether or not they are in any group, by name
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AgentToolInput:
      type: object
      required: [name, mode]
      properties:
        name: { type: string, pattern: '^[A-Za-z0-9_-]{1,64}$' }
        mode: { $ref: '#/components/schemas/AgentToolMode' }
        chosenForEffect:
          type: string
          enum: [READ, WRITE]
          nullable: true
          description: |
            The effect the editor showed when the owner chose this mode (`effect`, `UNKNOWN` as `WRITE`): the mode is
            chosen for it anew, changed or not, and kept for the narrower of it and the tool's effect now (I19). So an
            `ALLOW` sent with `WRITE` for a tool that writes now is confirmed for writes and runs without asking (a
            widening), while one sent with `READ` for a tool that became a write keeps asking. Absent: an unchanged
            mode keeps the effect it was chosen for, and a changed or new one is chosen for the tool's effect now
    AgentSystemInput:
      type: object
      required: [systemId]
      properties:
        systemId: { type: string, format: uuid }
        tools:
          type: array
          nullable: true
          maxItems: 200
          items: { $ref: '#/components/schemas/AgentToolInput' }
          description: |
            Absent or null: the tools it has on the agent, or every tool its system serves for a system new to the agent
            (reads `ALLOW`, writes and unconfirmed tools `ASK`); empty: none
    AgentRepositoryInput:
      type: object
      required: [repositoryId, access]
      properties:
        repositoryId: { type: string, format: uuid }
        access: { $ref: '#/components/schemas/AgentRepositoryAccess' }
    AgentHostInput:
      type: object
      required: [host]
      properties:
        host: { type: string, minLength: 1, maxLength: 260, example: registry.npmjs.org }
        reason: { type: string, maxLength: 500, nullable: true }
    AgentCreateRequest:
      type: object
      required: [name, runtimes]
      properties:
        name: { type: string, minLength: 1, maxLength: 100, description: 'Unique among the live agents, ignoring case' }
        handle:
          type: string
          maxLength: 50
          nullable: true
          description: |
            1 to 50 lower-case letters, digits and hyphens, not starting or ending with a hyphen (capitals are lowered);
            absent or blank: made from the name
        description: { type: string, maxLength: 1000, nullable: true }
        instructions: { type: string, maxLength: 100000, nullable: true }
        runtimes:
          type: array
          minItems: 1
          maxItems: 4
          items: { $ref: '#/components/schemas/AgentRuntime' }
          description: Without duplicates; the first is the default
        turnTimeLimitMinutes:
          type: integer
          format: int32
          nullable: true
          minimum: 0
          maximum: 1440
          description: How long one turn may run, in minutes, 5 to 1440; absent, null or 0 for the deployment's default
        memoryAllowed:
          type: boolean
          description: Whether its people and triggers may turn its memory on (`Agent.memoryAllowed`); absent is true
        systems:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/AgentSystemInput' }
        repositories:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/AgentRepositoryInput' }
        hosts:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/AgentHostInput' }
        shareGroupIds:
          type: array
          maxItems: 50
          items: { type: string, format: uuid }
        sharePrincipalIds:
          type: array
          maxItems: 100
          items: { type: string, format: uuid }
          description: |
            The members who may use it on their own, by principal (`Member.principalId`): at most 100 entries, one
            named twice counting once
    AgentUpdateRequest:
      type: object
      description: Absent fields stay unchanged
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        handle: { type: string, maxLength: 50, description: 'Blank: made from the name' }
        description: { type: string, maxLength: 1000, description: 'Blank: none' }
        instructions: { type: string, maxLength: 100000 }
        runtimes:
          type: array
          minItems: 1
          maxItems: 4
          items: { $ref: '#/components/schemas/AgentRuntime' }
        turnTimeLimitMinutes:
          type: integer
          format: int32
          minimum: 0
          maximum: 1440
          description: How long one turn may run, in minutes, 5 to 1440; 0 returns to the deployment's default
        memoryAllowed:
          type: boolean
          description: |
            Whether its people and triggers may turn its memory on (`Agent.memoryAllowed`). Forbidding it keeps the
            notes, unread and unwritten, until their owner deletes them or retention does
    AgentSystemsRequest:
      type: object
      required: [systems]
      properties:
        systems:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/AgentSystemInput' }
    AgentRepositoriesRequest:
      type: object
      required: [repositories]
      properties:
        repositories:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/AgentRepositoryInput' }
    AgentHostsRequest:
      type: object
      required: [hosts]
      properties:
        hosts:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/AgentHostInput' }
    AgentSharesRequest:
      type: object
      required: [groupIds]
      properties:
        groupIds:
          type: array
          maxItems: 50
          items: { type: string, format: uuid }
        principalIds:
          type: array
          nullable: true
          maxItems: 100
          items: { type: string, format: uuid }
          description: |
            The members who may use it on their own, by principal (`Member.principalId`), each a member of the company
            who has not left: at most 100 entries, one named twice counting once; absent or null: the members it is
            shared with stay
    AgentMemberShare:
      type: object
      required: [principalId, name]
      description: A member an agent is shared with on their own
      properties:
        principalId: { type: string, format: uuid }
        userId: { type: string, format: uuid, nullable: true }
        name: { type: string, description: 'Their display name' }
    AgentPauseRequest:
      type: object
      properties:
        stopRunning:
          type: boolean
          default: false
          description: Also cancel the running turns of its conversations (a compromised agent)
    AgentAcceptRequest:
      type: object
      required: [version]
      properties:
        version: { type: integer, format: int32, minimum: 1, description: The version the app showed }
    TriggerAcceptRequest:
      type: object
      required: [version]
      description: What a trigger's author accepts (H2)
      properties:
        version: { type: integer, format: int32, minimum: 1, description: The agent's version the app showed }
        acknowledgeOpenEvents:
          type: boolean
          default: false
          description: |
            A trigger reassigned to the caller (`TO_ACCEPT`): their acknowledgement of the open events, needed when they
            would write without approval (`openToAnyone.acknowledgementNeeded`)
    AgentModelAccess:
      type: string
      enum: [BUDGET, SUBSCRIPTION]
      description: '`BUDGET`: the person''s LiteLLM key and budget; `SUBSCRIPTION`: one on their own personal runner host (a trigger''s settings take it only when the company allows it, ADR-0085)'
    AgentSubscription:
      type: object
      required: [label]
      properties:
        runnerHostId:
          type: string
          format: uuid
          nullable: true
          description: The person's personal runner host; null once the host was removed (the subscription is gone)
        label: { type: string, description: 'The subscription''s label on that host' }
    AgentProject:
      type: object
      required: [systemId, key]
      properties:
        systemId: { type: string, format: uuid }
        key: { type: string, minLength: 1, maxLength: 200, example: SHOP }
    AgentSettingsToolMode:
      type: object
      required: [systemId, tool, mode]
      properties:
        systemId: { type: string, format: uuid }
        tool: { type: string, pattern: '^[A-Za-z0-9_-]{1,64}$' }
        mode:
          type: string
          enum: [ASK, 'OFF']
          description: '`ASK` turns an `ALLOW` of the agent into an approval; `OFF` removes the tool'
    AgentOwnServerTool:
      type: object
      required: [name, mode]
      properties:
        name: { type: string, pattern: '^[A-Za-z0-9_-]{1,64}$' }
        mode: { $ref: '#/components/schemas/AgentToolMode' }
        chosenForEffect:
          type: string
          enum: [READ, WRITE]
          nullable: true
          description: |
            The tool's effect when its mode was chosen. In a request, as `AgentToolInput.chosenForEffect`: the effect
            the page showed, which chooses the mode anew for the narrower of it and the tool's effect now (I19)
    AgentOwnServer:
      type: object
      required: [systemId]
      properties:
        systemId: { type: string, format: uuid }
        name: { type: string, nullable: true, description: The server's name (answers only) }
        tools:
          type: array
          nullable: true
          maxItems: 200
          items: { $ref: '#/components/schemas/AgentOwnServerTool' }
          description: 'Absent or null in a request: every tool it serves, reads `ALLOW`, writes and unconfirmed `ASK`'
    AgentSettings:
      type: object
      required: [agentId, stored, runtime, effort, modelAccess, defaultRepositoryIds, defaultProjects, systemsOff,
                 toolModes, ownServers, skillsOff, acceptedVersion, currentVersion]
      properties:
        agentId: { type: string, format: uuid }
        stored: { type: boolean, description: 'False: no settings are stored yet, and these are the defaults' }
        runtime:
          allOf: [{ $ref: '#/components/schemas/AgentRuntime' }]
          description: The runtime in effect; the agent's first when none was chosen or the agent dropped the choice
        chosenRuntime:
          allOf: [{ $ref: '#/components/schemas/AgentRuntime' }]
          nullable: true
          description: The runtime the person chose; null for the agent's first
        model:
          type: string
          nullable: true
          description: 'Null: the runtime''s default, which a run paid by a budget cannot use (`MODEL_REQUIRED`)'
        effort: { $ref: '#/components/schemas/AgentEffort' }
        modelAccess: { $ref: '#/components/schemas/AgentModelAccess' }
        subscription:
          allOf: [{ $ref: '#/components/schemas/AgentSubscription' }]
          nullable: true
        instructions:
          type: string
          nullable: true
          description: 'Added after the agent''s; always null for a trigger''s settings, whose trigger has its instruction'
        memory:
          type: boolean
          description: |
            The owner (the person, or a trigger's author for the trigger) turned the agent's memory on (ADR-0063,
            opt-in; off by default): their conversations with the agent read and write notes while the agent allows it
            (`Agent.memoryAllowed`). Off keeps the notes, unread and unwritten, until they are deleted or retention does
        autoRetry:
          type: boolean
          description: |
            The owner (the person, or a trigger's author for the trigger) chose automatic retries (ADR-0073, opt-in; off
            by default): a turn of their conversations with the agent that fails for a reason that may pass (the
            failure class `SERVER_LIMITED`: the model's provider or gateway overloaded, limiting or unavailable; or
            `LOST` because its runner host lost it for good: the host restarted, `HOST_RESTARTED`, or no longer knew
            the run when it reconnected, `STALE_ON_RECONNECT`) is retried by itself, at most three times in a row,
            after 1, 2 and 4 minutes (`QueueReasonCode` `RETRY_SCHEDULED`); each retry is paid as the turn was. A run
            lost because its lease expired is not retried by itself, since its host may still take it back
        defaultRepositoryIds:
          type: array
          items: { type: string, format: uuid }
          description: The repositories a new conversation starts with; empty means all of the agent's
        defaultProjects:
          type: array
          items: { $ref: '#/components/schemas/AgentProject' }
        systemsOff:
          type: array
          items: { type: string, format: uuid }
          description: The agent's systems switched off for the person
        toolModes:
          type: array
          items: { $ref: '#/components/schemas/AgentSettingsToolMode' }
        ownServers:
          type: array
          items: { $ref: '#/components/schemas/AgentOwnServer' }
          description: The person's own MCP servers added to the agent for them, with each tool's mode
        skillsOff:
          type: array
          items: { type: string, format: uuid }
          description: The agent's skills switched off for the person, by skill id
        acceptedVersion: { type: integer, format: int32 }
        currentVersion: { type: integer, format: int32 }
        widening:
          allOf: [{ $ref: '#/components/schemas/AgentWidening' }]
          nullable: true
        updatedAt: { type: string, format: date-time, nullable: true }
    MemoryNotes:
      type: object
      required: [inEffect, notes, characters, maxCharacters]
      description: A memory of an agent (ADR-0063), a person's or a trigger's, with every note by number
      properties:
        inEffect:
          type: boolean
          description: Conversations read and write it now (the agent allows memory and its owner turned it on)
        notes:
          type: array
          items: { $ref: '#/components/schemas/MemoryNote' }
        characters: { type: integer, format: int32, description: The active notes' characters }
        maxCharacters:
          type: integer
          format: int32
          description: The most characters the active notes hold in all (`TINFIRM_MEMORY_MAX_CHARACTERS`)
        compactedAt:
          type: string
          format: date-time
          nullable: true
          description: The last compaction (at most once in 30 days, after a change)
    MemoryNote:
      type: object
      required: [number, id, state, about, text, createdAt, updatedAt, usedAt]
      properties:
        number: { type: integer, format: int32 }
        id: { type: string, description: 'Its id in the prompt and the tools: `m{number}`' }
        state:
          type: string
          enum: [ACTIVE, PROPOSED]
          description: '`PROPOSED`: a trigger''s note its audience has not accepted yet; no conversation reads it'
        about:
          type: string
          enum: [GENERAL, SYSTEM, REPOSITORY]
        systemId: { type: string, format: uuid, nullable: true, description: The system a `SYSTEM` note is about }
        repositoryId:
          type: string
          format: uuid
          nullable: true
          description: The repository a `REPOSITORY` note is about
        text: { type: string, description: 'The note: one line of 1 to 300 characters, the agent''s own words' }
        replaces:
          type: integer
          format: int32
          nullable: true
          description: A proposal's, the number of the note it replaces once accepted
        conversationId:
          type: string
          format: uuid
          nullable: true
          description: The conversation it was last saved in
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        usedAt:
          type: string
          format: date-time
          description: Last saved, shown to the agent or recalled; retention deletes it `memoryDays` after
    AgentSettingsRequest:
      type: object
      description: The whole settings; absent fields take their defaults
      properties:
        runtime:
          allOf: [{ $ref: '#/components/schemas/AgentRuntime' }]
          nullable: true
        model:
          type: string
          nullable: true
          maxLength: 200
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:/@+\[\]-]*$'
          description: |
            With the model access `BUDGET` a run needs one, as the company's gateway serves only the models it lists:
            without it the readiness and a conversation's start refuse (`MODEL_REQUIRED`), and so does a trigger's save
            (400 MODEL_REQUIRED). Null: the runtime's default, for a subscription.
        effort: { $ref: '#/components/schemas/AgentEffort' }
        modelAccess: { $ref: '#/components/schemas/AgentModelAccess' }
        subscription:
          allOf: [{ $ref: '#/components/schemas/AgentSubscription' }]
          nullable: true
          description: With `SUBSCRIPTION`
        instructions:
          type: string
          nullable: true
          maxLength: 20000
          description: A person's, added after the agent's; a trigger's settings take none (400 VALIDATION_FAILED)
        memory:
          type: boolean
          description: Turn the agent's memory on (`AgentSettings.memory`); absent is false
        autoRetry:
          type: boolean
          description: Retry a turn that failed for a reason that may pass by itself (`AgentSettings.autoRetry`); absent is false
        defaultRepositoryIds:
          type: array
          maxItems: 100
          items: { type: string, format: uuid }
        defaultProjects:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/AgentProject' }
        systemsOff:
          type: array
          maxItems: 100
          items: { type: string, format: uuid }
        toolModes:
          type: array
          maxItems: 500
          items: { $ref: '#/components/schemas/AgentSettingsToolMode' }
        ownServers:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/AgentOwnServer' }
        skillsOff:
          type: array
          maxItems: 20
          items: { type: string, format: uuid }
          description: Skills of the agent to switch off, by skill id (400 SKILL_NOT_ON_AGENT for another)

    AgentReadinessPayer:
      type: object
      required: [modelAccess, state, models]
      description: Who pays for the caller's conversations with the agent, as package 2 answers it now
      properties:
        modelAccess: { $ref: '#/components/schemas/AgentModelAccess' }
        state:
          type: string
          enum: [READY, WAITING, REFUSED]
          description: '`WAITING`: a turn would wait (`reason`, until `until`); `REFUSED`: no conversation can start'
        reason:
          type: string
          nullable: true
          description: |
            `BUDGET_SPENT`, `KEY_ERROR`, `NO_MODEL_KEY`, `HOST_OFFLINE` while waiting; `GATEWAY_NOT_CONFIGURED`,
            `PRINCIPAL_INACTIVE`, `SUBSCRIPTION_GONE`, `PERSONAL_HOST_CREDENTIAL_ONLY` when refused, and for a budget
            `MODEL_REQUIRED` (the settings name no model) or `MODEL_NOT_ALLOWED` (one the key does not allow)
        detail: { type: string, nullable: true }
        until: { type: string, format: date-time, nullable: true, description: The reset of a spent budget }
        models:
          type: array
          items: { type: string }
          description: 'The models the key may use; empty: every model the gateway serves'
    AgentReadinessSystem:
      type: object
      required: [systemId, name, kind, own, binding]
      properties:
        systemId: { type: string, format: uuid }
        name: { type: string }
        kind: { $ref: '#/components/schemas/SystemKind' }
        own: { type: boolean, description: 'One of the own MCP servers of the caller, added in their settings' }
        binding:
          type: string
          enum: [OWN, GRANTED, CHOOSE, CONNECT, RECONNECT_YOURS, RECONNECT_COMPANY, RECONNECT_OR_GRANT, UNAVAILABLE, NOT_NEEDED]
          description: What a conversation would bind at the system's first use now, as `MyAccount.binding`
        grantId: { type: string, format: uuid, nullable: true, description: 'The one usable grant, for `GRANTED`' }
        access:
          allOf: [{ $ref: '#/components/schemas/AgentRepositoryAccess' }]
          nullable: true
          description: '`WRITE` for an own account, the access of the grant for `GRANTED`'
    AgentReadinessHosts:
      type: object
      required: [runnable, eligible]
      properties:
        runnable: { type: boolean, description: Whether a runner host may take a run of it now }
        eligible: { type: integer, format: int32, description: The runner hosts that may take it }
        reason: { type: string, nullable: true, description: 'Why none may, for people' }
    AgentReadiness:
      type: object
      required: [settings, payer, systems, hosts]
      properties:
        settings: { $ref: '#/components/schemas/AgentSettings' }
        payer: { $ref: '#/components/schemas/AgentReadinessPayer' }
        systems:
          type: array
          items: { $ref: '#/components/schemas/AgentReadinessSystem' }
        hosts: { $ref: '#/components/schemas/AgentReadinessHosts' }

    AuditActor:
      type: object
      required: [type, display]
      properties:
        type:
          type: string
          enum: [USER, SYSTEM, AGENT, SCIM]
          description: SCIM is a company's SCIM token (ADR-0087), whose id is the token's
        id:
          type: string
          format: uuid
          nullable: true
          description: Null for SYSTEM and for anonymous actors (e.g. a failed login for an unknown email)
        display:
          type: string
          description: |
            Resolved at read time; `anonymous` or `deleted user` when there is no current user; `erased person` in a
            company's chain for a member whose content the company erased after they left, and who has not joined
            again (CONVENTIONS §8)
    AuditEvent:
      type: object
      required: [id, seq, occurredAt, actor, action, hash, prevHash]
      properties:
        id: { type: string, format: uuid }
        seq:
          type: integer
          format: int64
          description: Position in the hash chain (per company; the instance chain has no company)
        occurredAt: { type: string, format: date-time }
        companyId: { type: string, format: uuid, nullable: true }
        actor: { $ref: '#/components/schemas/AuditActor' }
        action: { type: string, example: member.added }
        targetType: { type: string, nullable: true, example: user }
        targetId: { type: string, nullable: true }
        targetName:
          type: string
          nullable: true
          example: build-01
          description: |
            The target's name, resolved at read time from what Tinfirm keeps, never stored in the chain, and only as
            the caller may see it elsewhere (CONVENTIONS §8). A principal (and a model key, whose id is its
            principal's) by its member's display name or its service identity's name, "{name} (left)" for one who
            left; a user by their display name; a company, a group, an agent, a system, a repository, a runner host or
            a trigger by its name, a personal MCP server or runner host only to its owner; a conversation as
            `SpendKey.label` names it: its key, with its title only for the caller's own and a trigger's, another
            person's personal conversation by key to OWNER and not at all to ADMIN. Null for a target that is gone (a
            deleted agent or trigger too), for a type without a name, for one the caller may not see, and for an
            erased person.
        details:
          type: object
          additionalProperties: true
        prevHash:
          type: string
          description: Hex SHA-256 of the previous event in the chain, or 64 zeros for the first event
        hash:
          type: string
          description: Hex SHA-256 over prevHash and the canonical form of this event
    AuditEventPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AuditEvent' }
        nextCursor: { type: string, nullable: true }
    AuditVerification:
      type: object
      required: [valid, checkedEvents]
      properties:
        valid: { type: boolean }
        checkedEvents: { type: integer, format: int64 }
        firstInvalidSeq: { type: integer, format: int64, nullable: true }
    AuditCheck:
      type: object
      description: One daily check of a chain (the package 6 contract, §3.6, §5.8)
      required: [id, checkedAt, ok, fromSeq, headSeq, headHash, eventsChecked]
      properties:
        id: { type: string, format: uuid }
        checkedAt: { type: string, format: date-time }
        ok: { type: boolean }
        fromSeq: { type: integer, format: int64, description: "The head it started from: the last check that passed or was acknowledged (0: the chain's start)" }
        failure:
          type: string
          nullable: true
          enum: [BROKEN, SHORTER, HEAD_CHANGED]
        firstInvalidSeq: { type: integer, format: int64, nullable: true, description: "A BROKEN chain's first event that does not verify" }
        headSeq: { type: integer, format: int64, description: "The chain's last event as the check found it" }
        headHash: { type: string, description: "Its hash, which an admin may note elsewhere" }
        eventsChecked: { type: integer, format: int64 }
        acknowledgedAt: { type: string, format: date-time, nullable: true }
        acknowledgedByUserId: { type: string, format: uuid, nullable: true }
        acknowledgedBy: { type: string, nullable: true }
        acknowledgedNote: { type: string, nullable: true }
    AuditCheckPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AuditCheck' }
        nextCursor: { type: string, nullable: true }
    AuditCheckAcknowledgement:
      type: object
      required: [note]
      properties:
        note: { type: string, minLength: 1, maxLength: 1000, description: "Why the failure is accepted; stays on the check" }

    ClientError:
      type: object
      description: An error of the web app, as its ErrorHandler saw it (ADR-0070, §1). Scrubbed by the server.
      required: [kind]
      properties:
        kind: { type: string, minLength: 1, maxLength: 100, description: "The error's name, such as TypeError" }
        message: { type: string, maxLength: 1000 }
        route: { type: string, maxLength: 300, description: "The route's pattern, such as /c/:companyId/inbox; never the URL. Kept only in that shape: lowercase segments and :params" }
        frames:
          type: array
          maxItems: 50
          description: The stack, the innermost frame first
          items: { $ref: '#/components/schemas/ClientErrorFrame' }
    ClientErrorFrame:
      type: object
      properties:
        function: { type: string, maxLength: 200, description: "Not kept: a minified name says nothing, and the tracker restores the names from the source maps" }
        file: { type: string, maxLength: 500, description: "The script's URL or path; the server keeps the path of one of the web app's own bundles (/main-<hash>.js, /chunk-<hash>.js), anything else is <external>" }
        line: { type: integer, minimum: 0 }
        column: { type: integer, minimum: 0 }

    ErrorReport:
      type: object
      description: One kind of error of the installation, grouped by its fingerprint (ADR-0070, §3)
      required: [id, source, title, occurrences, unreported, firstSeenAt, lastSeenAt, firstVersion, lastVersion]
      properties:
        id: { type: string, format: uuid }
        source: { type: string, enum: [SERVER, WEB] }
        title: { type: string, description: "The outermost exception's type; a log line's logger without one" }
        message: { type: string, nullable: true, description: "The outermost exception's message, masked; the log line's template without an exception" }
        logger: { type: string, nullable: true, description: "The server's logger" }
        route: { type: string, nullable: true, description: "The route's pattern, of the server's request or the web app's page" }
        occurrences: { type: integer, format: int64 }
        unreported: { type: integer, format: int64, description: "Occurrences since the last delivery; all of them before the first" }
        firstSeenAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }
        firstVersion: { type: string }
        lastVersion: { type: string }
        reportedAt: { type: string, format: date-time, nullable: true, description: "Its last automatic delivery" }
    ErrorReportPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ErrorReport' }
        nextCursor: { type: string, nullable: true }
    ErrorReportDetail:
      allOf:
        - $ref: '#/components/schemas/ErrorReport'
        - type: object
          required: [exceptions]
          properties:
            logMessage: { type: string, nullable: true, description: "The log line's template, its {} placeholders unfilled" }
            commit: { type: string, nullable: true }
            runtime: { type: string, nullable: true, description: "The Java version, or the browser's name and major version" }
            exceptions:
              type: array
              description: The newest sample, the outermost exception first, then its causes
              items: { $ref: '#/components/schemas/ErrorReportException' }
    ErrorReportException:
      type: object
      required: [type, frames]
      properties:
        type: { type: string }
        message: { type: string, nullable: true, description: "Masked" }
        frames:
          type: array
          description: The innermost frame first
          items: { $ref: '#/components/schemas/ErrorReportFrame' }
    ErrorReportFrame:
      type: object
      required: [inApp]
      properties:
        module: { type: string, nullable: true, description: "The Java class" }
        function: { type: string, nullable: true }
        file: { type: string, nullable: true }
        line: { type: integer, nullable: true }
        column: { type: integer, nullable: true }
        inApp: { type: boolean, description: "Tinfirm's own code" }
    ErrorReportExport:
      type: object
      description: Every report as the Sentry event automatic delivery sends for it (ADR-0070, §6)
      required: [format, instanceId, version, exportedAt, events]
      properties:
        format: { type: string, enum: [tinfirm-error-reports/1] }
        instanceId: { type: string, format: uuid }
        label: { type: string, nullable: true }
        version: { type: string }
        commit: { type: string, nullable: true }
        exportedAt: { type: string, format: date-time }
        events:
          type: array
          items:
            type: object
            additionalProperties: true
    ErrorReporting:
      type: object
      description: Error reporting's mode, who chose it, and its delivery (ADR-0070, §4 and §5)
      required: [mode, setBy, instanceId, pending]
      properties:
        mode:
          type: string
          enum: [OFF, LOCAL, AUTOMATIC]
          description: OFF captures nothing; LOCAL captures and shows; AUTOMATIC also sends to the destination
        setBy:
          type: string
          enum: [OPERATOR, ADMIN]
          description: OPERATOR when TINFIRM_ERROR_REPORTS sets the mode, which the page cannot change; else ADMIN
        destination: { type: string, nullable: true, description: "The tracker's host from TINFIRM_ERROR_REPORTS_DSN, never its key; null without one" }
        label: { type: string, nullable: true, description: "TINFIRM_ERROR_REPORTS_LABEL, the installation's name in its reports" }
        instanceId: { type: string, format: uuid, description: "The installation's random id in its reports" }
        changedAt: { type: string, format: date-time, nullable: true, description: "When an instance admin last chose the mode" }
        changedByUserId: { type: string, format: uuid, nullable: true }
        pending: { type: integer, format: int64, description: "Reports with occurrences not yet delivered" }
        lastDeliveryAt: { type: string, format: date-time, nullable: true, description: "The last pass that delivered every report it took" }
        lastDeliveryError: { type: string, nullable: true, description: "Why the last pass failed; null once one succeeds" }
        lastAttemptAt: { type: string, format: date-time, nullable: true }
    ErrorReportingUpdate:
      type: object
      required: [automatic]
      properties:
        automatic: { type: boolean, description: "AUTOMATIC when true, LOCAL when false" }

    ConversationReader:
      type: object
      description: Someone other than its person who read the conversation (the package 6 contract, §5.6)
      required: [userId, firstReadAt, lastReadAt, reads, kinds]
      properties:
        userId: { type: string, format: uuid }
        name: { type: string, description: "Resolved now; `deleted user` once the user is gone" }
        firstReadAt: { type: string, format: date-time }
        lastReadAt: { type: string, format: date-time }
        reads: { type: integer, format: int64 }
        kinds:
          type: array
          description: "What was read, each read's `what` (the conversation's detail, its runs, events, decisions, files)"
          items: { type: string }

    RetentionPeriods:
      type: object
      required: [runEventsDays, chatContentDays]
      properties:
        runEventsDays: { type: integer, format: int32, nullable: true, description: "Run events (the transcript), from the run's end: 7 to 3650, or null to keep them; 90 by default under Pro and Enterprise (ADR-0077)" }
        chatContentDays: { type: integer, format: int32, nullable: true, description: "Chats' and webhooks' messages and decisions' texts, from the conversation's end: 1 to 3650, at most contentDays, or null to keep them while contentDays keeps all content; 30 by default under Pro and Enterprise" }
        contentDays: { type: integer, format: int32, nullable: true, description: "Messages, titles, decisions' and runs' texts, outputs' titles, from the conversation's end: 30 to 3650, or null to keep them; 365 by default" }
        filesDays: { type: integer, format: int32, nullable: true, description: "Files' content, from the conversation's end: 7 to 3650, or null to keep them; 365 by default" }
        memoryDays:
          type: integer
          format: int32
          minimum: 0
          maximum: 3650
          description: |
            Agents' memory notes (ADR-0063), from their last use (saved, shown to an agent or recalled): 30 to 3650, or 0
            to keep them until they are deleted; 730 by default. Absent in a change keeps the period. A compaction never
            renews a note's last use
    RetentionDue:
      type: object
      description: |
        What the next sweep purges under these periods, outside what an open hold covers, each row once: three of
        `nextSweep`'s counts, by the sweep's own selection
      required: [conversations, runs, files]
      properties:
        conversations: { type: integer, format: int64, description: "Ended conversations whose content goes, each once (`nextSweep.conversations`); a chat's or a webhook's words alone count in `nextSweep.messages`" }
        runs: { type: integer, format: int64, description: "Runs whose events go: ended past their period, in ended conversations no hold covers (`nextSweep.runEvents`)" }
        files: { type: integer, format: int64, description: "Files whose content goes (`nextSweep.files`)" }
    RetentionSettings:
      allOf:
        - $ref: '#/components/schemas/RetentionPeriods'
        - type: object
          required: [defaults, mode, openOlder, due, nextSweep]
          properties:
            defaults: { type: boolean, description: "No OWNER set them: the defaults" }
            mode:
              type: string
              enum: [PERIODS, FROZEN, KEEP_EVERYTHING]
              description: |
                Which periods are in force (ADR-0077, decisions 7 and 8). PERIODS: Pro and Enterprise, the OWNER's or
                the defaults. FROZEN: the licence expired; the periods it left keep running and cannot be changed.
                KEEP_EVERYTHING: Community; conversations, transcripts, files and run events are never purged by
                retention, and the periods shown are null but memoryDays. Changing or previewing periods needs
                RETENTION_SETTINGS (`403 EDITION_REQUIRED`).
            updatedAt: { type: string, format: date-time, nullable: true }
            updatedByUserId: { type: string, format: uuid, nullable: true }
            lastSweptAt: { type: string, format: date-time, nullable: true }
            openOlder: { type: integer, format: int32, description: "Open conversations older than their period, which retention does not purge" }
            due: { $ref: '#/components/schemas/RetentionDue' }
            nextSweep:
              allOf: [{ $ref: '#/components/schemas/RetentionSweepCounts' }]
              description: "What the next sweep purges under these periods if it ran now, outside what an open hold covers: what `previewRetention` answers as `current`"
    RetentionSweepCounts:
      type: object
      description: What a sweep purges, by kind, each row once, as the sweep's `content.purged` audit counts it
      required: [conversations, messages, decisions, outputs, files, runs, runEvents, memoryNotes]
      properties:
        conversations: { type: integer, format: int64, description: "Ended conversations whose content goes: their title, latest result and subject's title with it" }
        messages: { type: integer, format: int64, description: "Messages whose body goes: chats' and webhooks' after their period, the others' after the content's" }
        decisions: { type: integer, format: int64, description: "Decided or cancelled decisions whose texts go" }
        outputs: { type: integer, format: int64, description: "Outputs whose title goes" }
        files: { type: integer, format: int64, description: "Files whose content goes" }
        runs: { type: integer, format: int64, description: "Runs whose texts go with their conversation's content" }
        runEvents: { type: integer, format: int64, description: "Runs whose events (the transcript) go, in ended conversations" }
        memoryNotes: { type: integer, format: int64, description: "Agents' memory notes not used for `memoryDays`, and a trigger's proposals not reviewed in 30 days (ADR-0063)" }
    RetentionPreview:
      type: object
      description: |
        What the next sweep would purge if it ran now: `proposed` under the periods asked about and `current` under the
        stored ones, both outside what an open hold covers; `held`, what the open holds keep from it under the proposed
        periods (zero without an open hold).
      required: [proposed, current, held]
      properties:
        proposed: { $ref: '#/components/schemas/RetentionSweepCounts' }
        current: { $ref: '#/components/schemas/RetentionSweepCounts' }
        held: { $ref: '#/components/schemas/RetentionSweepCounts' }
    RetentionOpenConversation:
      type: object
      required: [id, key, place, createdAt, ageDays]
      properties:
        id: { type: string, format: uuid }
        key: { type: string }
        place: { type: string, enum: [TINFIRM_THREAD, CHAT_THREAD, TRACKER_ISSUE, SCHEDULE, WEBHOOK] }
        createdAt: { type: string, format: date-time }
        ageDays: { type: integer, format: int32 }
    RetentionOpenConversationPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/RetentionOpenConversation' }
        nextCursor: { type: string, nullable: true }
    LegalHoldRequest:
      type: object
      required: [reason]
      properties:
        conversationId: { type: string, format: uuid, nullable: true }
        principalId: { type: string, format: uuid, nullable: true, description: A member's principal }
        reason: { type: string, minLength: 1, maxLength: 500 }
    LegalHold:
      type: object
      required: [id, reason, setAt]
      properties:
        id: { type: string, format: uuid }
        conversationId: { type: string, format: uuid, nullable: true }
        conversationKey: { type: string, nullable: true }
        principalId: { type: string, format: uuid, nullable: true }
        principalName: { type: string, nullable: true }
        reason: { type: string }
        setAt: { type: string, format: date-time }
        setByUserId: { type: string, format: uuid, nullable: true }
        liftedAt: { type: string, format: date-time, nullable: true }
        liftedByUserId: { type: string, format: uuid, nullable: true }
    LegalHoldPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/LegalHold' }
        nextCursor: { type: string, nullable: true }
    PrincipalErasureRequest:
      type: object
      properties:
        conversationIds:
          type: array
          nullable: true
          maxItems: 500
          items: { type: string, format: uuid }
          description: "For a member still in the company: only these of their personal conversations, each ended"
    ErasureCounts:
      type: object
      required: [conversations, messages, decisions, outputs, files, runs, runEvents]
      properties:
        conversations: { type: integer, format: int64, description: Conversations erased whole }
        messages: { type: integer, format: int64 }
        decisions: { type: integer, format: int64 }
        outputs: { type: integer, format: int64 }
        files: { type: integer, format: int64 }
        runs: { type: integer, format: int64, description: "Runs whose texts went" }
        runEvents: { type: integer, format: int64, description: "Runs whose events went" }
        other:
          type: object
          additionalProperties: { type: integer, format: int64 }
          description: "What the chats', the triggers' and the systems' modules removed, by kind (`systemTests`: the systems' last tests that no longer name the person); a person's dismissed inbox notices as `inboxDismissals`"
    ErasureRemains:
      type: object
      required: [what, where, removedBy]
      properties:
        what: { type: string, description: "A kind of what remains, e.g. AUDIT, SPEND, TOMBSTONES, AGENT_TEXTS, OPEN_CONVERSATIONS, RUNNER_SESSIONS, SOURCE_SYSTEM, USER_ACCOUNT" }
        where: { type: string }
        removedBy: { type: string, description: "Who can remove it, and how" }
        count: { type: integer, format: int64, nullable: true }
    Erasure:
      type: object
      required: [erasedAt, erased, remains]
      properties:
        erasedAt: { type: string, format: date-time }
        erased: { $ref: '#/components/schemas/ErasureCounts' }
        remains:
          type: array
          items: { $ref: '#/components/schemas/ErasureRemains' }
    ErasurePreview:
      type: object
      description: |
        What an erasure would do now, erasing nothing: `erases`, the counts its answer would give (once the holds are
        lifted, when `holds` names any); `remains`, what would remain, as its answer says it; `holds`, the open holds
        that would refuse it (`409 ON_HOLD`), empty when none does.
      required: [erases, remains, holds]
      properties:
        erases: { $ref: '#/components/schemas/ErasureCounts' }
        remains:
          type: array
          items: { $ref: '#/components/schemas/ErasureRemains' }
        holds:
          type: array
          items: { $ref: '#/components/schemas/LegalHold' }

    SecretMeta:
      type: object
      required: [id, name, version, createdAt, updatedAt, createdBy, managed]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: GITHUB_BOT_TOKEN }
        description: { type: string, nullable: true }
        version: { type: integer, format: int32 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        createdBy: { type: string, description: Display name of the creator }
        lastAccessedAt: { type: string, format: date-time, nullable: true }
        managed: { type: boolean, description: "true for a secret another part of Tinfirm writes and keeps: the token or OAuth grant of a system's credential, a system's OAuth client secret (the package 1 contract, §3.6). Its value is never replaced by hand, and while its account or app keeps it, it is not deleted here either (409 SECRET_MANAGED): it goes when the account is disconnected or the app removed" }
        managedBy: { type: string, nullable: true, description: 'What maintains a managed secret, e.g. `the credential CI token of GitHub`; null otherwise' }
    SecretCreateRequest:
      type: object
      required: [name, value]
      properties:
        name: { type: string, pattern: '^[A-Za-z_][A-Za-z0-9_]{0,63}$' }
        description: { type: string, maxLength: 500 }
        value: { type: string, minLength: 1, maxLength: 65536, writeOnly: true }
    SecretUpdateRequest:
      type: object
      required: [value]
      properties:
        value: { type: string, minLength: 1, maxLength: 65536, writeOnly: true }
        description: { type: string, maxLength: 500 }
    SecretPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/SecretMeta' }
        nextCursor: { type: string, nullable: true }

    User:
      type: object
      required: [id, email, displayName, instanceAdmin, authSource, active, createdAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        displayName: { type: string }
        instanceAdmin: { type: boolean }
        authSource: { $ref: '#/components/schemas/AuthSource' }
        active: { type: boolean }
        createdAt: { type: string, format: date-time }
        lastLoginAt: { type: string, format: date-time, nullable: true }
    UserCreateRequest:
      type: object
      required: [email, displayName, password]
      properties:
        email: { type: string, format: email, maxLength: 320 }
        displayName: { type: string, minLength: 1, maxLength: 100 }
        password: { type: string, format: password, writeOnly: true, minLength: 12, maxLength: 1024 }
        instanceAdmin: { type: boolean, default: false }
    UserUpdateRequest:
      type: object
      properties:
        displayName: { type: string, minLength: 1, maxLength: 100 }
        instanceAdmin: { type: boolean }
        active: { type: boolean }
    UserPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/User' }
        nextCursor: { type: string, nullable: true }

    VaultRewrapResult:
      type: object
      required: [activeKeyId, rewrapped]
      properties:
        activeKeyId: { type: string }
        rewrapped: { type: integer, format: int64 }

    ModelGateway:
      type: string
      description: |
        `BUNDLED`: the gateway the deployment bundles (`TINFIRM_MODEL_GATEWAY_ADMIN_URL`). `EXTERNAL`: the company's own
        LiteLLM, by its admin URL and a master or admin key. `PROVIDED` (ADR-0094): the company's own gateway by its
        model URL alone, whose keys the company's gateway team makes and hands to Tinfirm (`putPrincipalModelKey`,
        `putCompanyModelKey`, `putMyModelKey`); Tinfirm holds no admin key and makes, rotates and deletes no key there.
      enum: [BUNDLED, EXTERNAL, PROVIDED]
    ModelGatewayVendor:
      type: string
      description: |
        The product the company's gateway is, whose words Tinfirm reads in its refusals (ADR-0094). `LITELLM` for every
        `BUNDLED` and `EXTERNAL` gateway; `GENERIC`, for a `PROVIDED` gateway only, one of no vendor Tinfirm knows: a
        spent budget is a `402`, or a `429` whose error speaks of a budget or a quota.
      enum: [LITELLM, GENERIC]
    MemorySettings:
      type: object
      description: The company's settings of agents' memory (ADR-0063, ADR-0065)
      required: [compactionModelAllowed]
      properties:
        compactionModel:
          type: string
          nullable: true
          description: The model that tidies memories every 30 days, on the company's own key; null for none
        compactionModelAllowed:
          type: boolean
          description: |
            Whether the company's own key allows the model now; false without one, and while an admin narrowed the
            key's models since it was chosen, when memories are only cleared of duplicates
    MemorySettingsRequest:
      type: object
      properties:
        compactionModel:
          type: string
          nullable: true
          maxLength: 200
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:/@+\[\]-]*$'
          description: A model the company's own key allows, as the gateway names it; a small one suffices; null for none
    ModelSettings:
      type: object
      description: |
        The company's model gateway and the defaults of its keys (the package 2 contract, §3.1). Runner hosts never
        reach LiteLLM: they reach the server's model relay, `relayBaseUrl`, which refuses `400` every request that asks
        the model's provider to run a tool itself (web search or fetch, code execution, an MCP server; ADR-0108):
        agents search the web and call MCP servers through Tinfirm.
      required: [configured, gateway, vendor, memberKeys, bundledAvailable, adminKeySet, relayEnabled, relayBaseUrl, defaultBudgetUsd, budgetPeriod, defaultModels, keyRotationInterval, keyRotationGrace]
      properties:
        configured:
          type: boolean
          description: Whether an admin configured a gateway; false shows the defaults a configuration starts from
        gateway: { $ref: '#/components/schemas/ModelGateway' }
        vendor: { $ref: '#/components/schemas/ModelGatewayVendor' }
        modelUrl:
          type: string
          nullable: true
          description: A `PROVIDED` gateway's root for model requests; null for the others
        memberKeys:
          type: boolean
          description: Whether members may enter their own key (`PROVIDED` only; `putMyModelKey`)
        bundledAvailable:
          type: boolean
          description: Whether the deployment bundles a LiteLLM, which `BUNDLED` uses
        adminUrl:
          type: string
          nullable: true
          description: The admin URL of an `EXTERNAL` gateway; null for `BUNDLED`
        adminKeySet:
          type: boolean
          description: Whether an `EXTERNAL` gateway's admin key is stored; true for `BUNDLED` (the deployment's)
        relayEnabled:
          type: boolean
          description: |
            Whether runs paid by a budget may start: true once LiteLLM answered the admin test, and false again after a
            change of the gateway, its URL or its admin key until the next test passes. False with `lastError` null and
            `testedAt` set: the gateway or its admin key changed since its last test, which needs to run again
        relayBaseUrl:
          type: string
          description: The root of the server's model relay that runner hosts reach (`{TINFIRM_PUBLIC_URL}/api/runner/v1/model`)
        defaultBudgetUsd:
          type: number
          minimum: 0
          description: The budget of every member without an override, in USD per `budgetPeriod`
        budgetPeriod:
          type: string
          example: 30d
          description: >-
            How often a key's budget resets: a number and `h`, `d`, `w` or `mo`, which Tinfirm writes in the
            gateway's own terms
        defaultModels:
          type: array
          items: { type: string }
          description: The models a key may use without an override; empty allows every model the gateway serves
        budgetAlertThresholds:
          type: array
          items: { type: integer, format: int32 }
          description: The percentages of a budget at which its people are told (the package 6 contract, §5.3); `[80, 100]` at first
        monthlyAlertUsd:
          type: number
          nullable: true
          description: "Admins are told once a calendar month (UTC) when the company's spend crosses it; nothing is capped"
        testedAt:
          type: string
          format: date-time
          nullable: true
          description: When the gateway was last tested; null until its first test
        lastError:
          type: string
          nullable: true
          description: Why the last test failed; null when it passed, and once the gateway or its admin key changed since
        updatedAt: { type: string, format: date-time, nullable: true }
        updatedBy: { type: string, format: uuid, nullable: true }
        keyRotationInterval:
          type: string
          example: P30D
          description: |
            How long after its creation every principal's key is rotated, as an ISO-8601 duration: the deployment's
            `TINFIRM_MODEL_KEY_ROTATION_INTERVAL`, not a setting of the company
        keyRotationGrace:
          type: string
          example: PT10M
          description: |
            How long a key replaced on schedule still serves the requests that hold it before LiteLLM blocks it, as an
            ISO-8601 duration (`TINFIRM_MODEL_KEY_ROTATION_GRACE`); a rotation an admin asks for gives none
    ModelSettingsRequest:
      type: object
      description: |
        Absent optional fields keep their stored value (`budgetPeriod` is `30d` and `defaultModels` empty at first).
        `adminUrl` and `adminKey` are for `EXTERNAL` only; `modelUrl` and `memberKeys` for `PROVIDED` only (`modelUrl`
        required at first). `vendor` is `LITELLM` but for `PROVIDED`, where it is as sent, else as stored when the
        gateway was `PROVIDED` already, else `GENERIC`; `GENERIC` at another gateway is 400 VALIDATION_FAILED.
      required: [gateway, defaultBudgetUsd]
      properties:
        gateway: { $ref: '#/components/schemas/ModelGateway' }
        vendor: { $ref: '#/components/schemas/ModelGatewayVendor' }
        modelUrl: { type: string, maxLength: 500, example: 'https://ai-gateway.example.com' }
        memberKeys: { type: boolean }
        adminUrl: { type: string, maxLength: 500, example: 'https://litellm.example.com' }
        adminKey:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 1000
          description: The master or admin key of an `EXTERNAL` gateway; required at first and with a new URL; never returned
        defaultBudgetUsd: { type: number, minimum: 0, maximum: 1000000 }
        budgetPeriod: { type: string, pattern: '^[1-9][0-9]{0,3}(h|d|w|mo)$' }
        defaultModels:
          type: array
          maxItems: 100
          items: { type: string, minLength: 1, maxLength: 200 }
        budgetAlertThresholds:
          type: array
          minItems: 1
          maxItems: 3
          items: { type: integer, format: int32, minimum: 1, maximum: 100 }
          description: 1 to 3 distinct whole percentages, from 1 to 100
        monthlyAlertUsd: { type: number, minimum: 0, maximum: 1000000000 }
        clearMonthlyAlert: { type: boolean, description: 'Removes the monthly alert amount; not with `monthlyAlertUsd`' }
    ModelSettingsTestResult:
      type: object
      required: [ok, models]
      properties:
        ok: { type: boolean }
        models:
          type: array
          items: { type: string }
          description: The model names the gateway serves
    GatewayModelList:
      type: object
      required: [models]
      properties:
        models:
          type: array
          items: { type: string }
    ModelKeyStatus:
      type: string
      description: |
        `OK`; `BUDGET_SPENT` until `budgetResetsAt`; `BLOCKED` while the principal is suspended; `ERROR` while LiteLLM
        refuses the key or cannot be reached, or the key is not created yet (`lastError`).
      enum: [OK, BUDGET_SPENT, BLOCKED, ERROR]
    ModelSubscription:
      type: object
      description: A subscription (or provider key) on one of the member's personal runner hosts, by label
      required: [runnerHostId, runnerHostName, label, kind, runtimes, status, reported]
      properties:
        runnerHostId: { type: string, format: uuid }
        runnerHostName: { type: string }
        label: { type: string }
        kind: { type: string, enum: [CLAUDE_LOGIN, CODEX_CHATGPT_AUTH, ANTHROPIC_API_KEY, OPENAI_API_KEY] }
        runtimes:
          type: array
          items: { type: string, enum: [CLAUDE_CODE, CODEX, PI, OPENCODE] }
        status: { type: string, enum: [AVAILABLE, COOLDOWN, INVALID, OFFLINE] }
        reported: { type: boolean }
    ModelKeyRequest:
      type: object
      required: [key]
      properties:
        key:
          type: string
          writeOnly: true
          minLength: 8
          maxLength: 1000
          description: The key the company's gateway team made; kept as an internal secret, never returned
    ModelAccessView:
      type: object
      description: |
        A principal's model access (the package 2 contract, §3.2), or the company's own key's (ADR-0065): the budget and
        models of its LiteLLM key (its own or the company's default), what LiteLLM last said of its spend, and its
        status. The key itself is never shown.
      required: [gatewayConfigured, budgetUsd, budgetOverridden, budgetPeriod, models, modelsOverridden, subscriptions, keyProvided, keyProvidedBySelf, canEnterOwnKey]
      properties:
        principalId:
          type: string
          format: uuid
          description: The principal; absent for the company's own key
        gatewayConfigured:
          type: boolean
          description: Whether the company's gateway passed its test; without it nothing is paid by a budget
        keyStatus:
          allOf: [{ $ref: '#/components/schemas/ModelKeyStatus' }]
          nullable: true
          description: Null while the principal has no key yet
        budgetUsd: { type: number, description: 'The budget per period, in USD' }
        budgetOverridden: { type: boolean, description: 'Whether the budget is the principal''s own rather than the default' }
        budgetPeriod: { type: string }
        spentUsd:
          type: number
          nullable: true
          description: 'Spent in the current period, as LiteLLM said at `syncedAt`'
        budgetResetsAt: { type: string, format: date-time, nullable: true }
        models:
          type: array
          items: { type: string }
          description: The models the key may use; empty allows every model the gateway serves
        modelsOverridden: { type: boolean }
        lastError: { type: string, nullable: true }
        syncedAt:
          type: string
          format: date-time
          nullable: true
          description: |
            When LiteLLM last confirmed the key and said its spend (`spentUsd`): every reconciliation reads every key
            again (every 5 minutes by default), so the page can say how old the figure is
        keyProvided:
          type: boolean
          description: Whether the key is one the company's gateway team made and someone entered (`PROVIDED`, ADR-0094)
        keyHint:
          type: string
          nullable: true
          description: A provided key's last four characters, as it was entered; null for a key Tinfirm made
        keyProvidedAt: { type: string, format: date-time, nullable: true }
        keyProvidedBySelf:
          type: boolean
          description: Whether the principal entered its own key; false for one an admin or the API entered
        canEnterOwnKey:
          type: boolean
          description: "For the caller's own view: whether they may enter or remove their own key now (`putMyModelKey`)"
        keyCreatedAt:
          type: string
          format: date-time
          nullable: true
          description: |
            When LiteLLM created the current key, or when a provided key was entered; null while the principal has
            none
        keyAgeDays:
          type: integer
          format: int32
          nullable: true
          description: The current key's age in whole days
        keyRotatedAt:
          type: string
          format: date-time
          nullable: true
          description: When the current key replaced an earlier one by a rotation; null for a key never rotated
        nextKeyRotationAt:
          type: string
          format: date-time
          nullable: true
          description: |
            When the key is rotated next: its creation plus the rotation interval, or the time of an admin's request
            that is not carried out yet
        keyRotationRequestedAt:
          type: string
          format: date-time
          nullable: true
          description: An admin's request to rotate the key at once that is not carried out yet
        keyRotationError:
          type: string
          nullable: true
          description: Why the last attempt to rotate the key failed (LiteLLM's reason), until a rotation succeeds; the key keeps working
        previousKeyValidUntil:
          type: string
          format: date-time
          nullable: true
          description: |
            While the key a rotation replaced is still in LiteLLM: when it is blocked (the end of its grace), or was;
            it is deleted a minute after. Null otherwise
        subscriptions:
          type: array
          items: { $ref: '#/components/schemas/ModelSubscription' }
          description: The caller's subscriptions on their personal runner hosts (`getMyModelAccess` only; empty otherwise)
    ModelAccessUpdateRequest:
      type: object
      description: Absent fields stay; setting a value and clearing it in one request is 400 VALIDATION_FAILED.
      properties:
        budgetUsd: { type: number, minimum: 0, maximum: 1000000 }
        clearBudget: { type: boolean }
        models:
          type: array
          maxItems: 100
          items: { type: string, minLength: 1, maxLength: 200 }
        clearModels: { type: boolean }
    ModelKeyRotationRequest:
      type: object
      description: The rotation of every key of the company, requested and under way
      required: [requested, requestedAt]
      properties:
        requested:
          type: integer
          format: int32
          description: How many principals' keys are to be rotated
        requestedAt: { type: string, format: date-time }
    RunnerHostScope:
      type: string
      description: |
        `COMPANY`: registered by an admin, runs any conversation, holds no credentials. `PERSONAL`: a member's own
        host, runs only its owner's work, and may hold its owner's subscriptions (the package 2 contract, M4 and M5).
      enum: [COMPANY, PERSONAL]
    RunnerCredential:
      type: object
      description: |
        A credential a personal host reports when it connects, by label (a subscription such as a Claude or ChatGPT
        login, or a provider key on the host); its value never leaves the host. It is its owner's model access and
        serves only their own runs.
      required: [label, kind, runtimes, status, reported]
      properties:
        label: { type: string, example: claude-max }
        kind: { type: string, enum: [CLAUDE_LOGIN, CODEX_CHATGPT_AUTH, ANTHROPIC_API_KEY, OPENAI_API_KEY] }
        runtimes:
          type: array
          items: { type: string, enum: [CLAUDE_CODE, CODEX, PI, OPENCODE] }
        status:
          type: string
          enum: [AVAILABLE, COOLDOWN, INVALID, OFFLINE]
          description: As the host last reported it; `OFFLINE` while the host is not connected
        cooldownUntil: { type: string, format: date-time, nullable: true }
        reported:
          type: boolean
          description: False when the host's latest connection no longer reported it; runs that name it are refused (SUBSCRIPTION_GONE)
    RunnerHost:
      type: object
      description: |
        A runner host with its live status and capacity (CONVENTIONS §15.4, ADR-0016), company or personal (the package
        2 contract, §2).
      required: [id, name, scope, online, draining, maxConcurrentRuns, maxConcurrentRunsCeiling, configPending, activeRuns, credentials, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: my-laptop }
        scope: { $ref: '#/components/schemas/RunnerHostScope' }
        ownerPrincipalId:
          type: string
          format: uuid
          nullable: true
          description: The principal of the member who owns a personal host; null for a company host
        ownerDisplay:
          type: string
          nullable: true
          description: The owner's name for a personal host; null for a company host
        online: { type: boolean }
        draining:
          type: boolean
          description: |
            True while the connected host finishes its active runs before it exits (SIGHUP or
            `tinfirm-runner-host drain`, e.g. for an upgrade). It takes no new runs. False when the host is offline.
        lastSeenAt: { type: string, format: date-time, nullable: true }
        version:
          type: string
          nullable: true
          description: |
            The runner host's release version, as its latest `hello.runnerVersion` said; null before it first connects.
            Shown only: compatibility is the runner protocol and its features, never this version (ADR-0109)
        hostname: { type: string, nullable: true }
        os: { type: string, nullable: true }
        arch: { type: string, nullable: true }
        maxConcurrentRuns:
          type: integer
          format: int32
          minimum: 0
          maximum: 1000
          description: |
            Effective number of runs the host takes at once: `desiredMaxConcurrentRuns` capped by
            `maxConcurrentRunsCeiling`, or the ceiling without a desired value, as last confirmed by the host; 0 while
            it drains. The dispatcher uses it (a lower `desiredMaxConcurrentRuns` counts at once, before the host
            confirms it).
        maxConcurrentRunsCeiling:
          type: integer
          format: int32
          minimum: 1
          maximum: 1000
          description: |
            The most runs the machine owner allows on this host (`tinfirm-runner-host run --max-concurrent-runs`), as
            reported when the host last connected; 1 before its first connection. Only the machine owner changes it,
            with a restart of the host. At most 16 for a host with Docker; a host with a VM per run may allow up to
            1000 (D12 of the Kubernetes runner analysis).
        desiredMaxConcurrentRuns:
          type: integer
          format: int32
          minimum: 1
          maximum: 1000
          nullable: true
          description: |
            The number of concurrent runs set in Tinfirm (`updateRunnerHost`); null uses the ceiling. It may be above
            the ceiling, and then applies up to the ceiling.
        configPending:
          type: boolean
          description: |
            True while the host has not confirmed the latest change of its desired value, for example because it is
            offline. The host applies the change when it connects.
        activeRuns:
          type: integer
          format: int32
          description: Runs that use a slot of this host now (assigned to it or running)
        credentials:
          type: array
          items: { $ref: '#/components/schemas/RunnerCredential' }
          description: The credentials a personal host reported; always empty for a company host
        pool:
          allOf:
            - $ref: '#/components/schemas/RunnerHostPool'
          nullable: true
          description: |
            The host's sandbox pool (ADR-0098, ADR-0099): its settings, the count now and the week ahead, and the
            host's last report. Null for a host that keeps no ready sandboxes (a personal host, a host with Docker, or
            a host that has not connected since it could).
        createdAt: { type: string, format: date-time }
    RunnerHostPool:
      type: object
      description: |
        A company host's sandbox pool. The count of ready sandboxes follows `settings` in their time zone; the host
        keeps at most `maxReadyCeiling`, and never more than its free slots.
      required: [maxReadyCeiling, readyTarget, week]
      properties:
        settings:
          allOf:
            - $ref: '#/components/schemas/RunnerHostPoolSettings'
          nullable: true
          description: The settings set in Tinfirm; null when none are set, and then no sandbox waits ready
        maxReadyCeiling:
          type: integer
          format: int32
          minimum: 0
          maximum: 1000
          description: |
            The most ready sandboxes the host's operator allows (`tinfirm-runner-host run --pool-max-ready`), as the host
            last reported; 0 turns them off. A count above it applies up to it.
        readyTarget:
          type: integer
          format: int32
          minimum: 0
          description: The count of the schedule now, before the ceiling
        next:
          allOf:
            - $ref: '#/components/schemas/RunnerHostPoolChange'
          nullable: true
          description: The next change of the count within 7 days; null when there is none
        week:
          type: array
          maxItems: 200
          items: { $ref: '#/components/schemas/RunnerHostPoolChange' }
          description: |
            The count now, then each change of the next 7 days, in order. The server computes it with the zone rules, so
            a client draws the week without time zone rules of its own.
        status:
          allOf:
            - $ref: '#/components/schemas/RunnerHostPoolStatus'
          nullable: true
          description: The host's last report of its sandboxes; null before the first
    RunnerHostPoolChange:
      type: object
      required: [at, readyTarget]
      properties:
        at: { type: string, format: date-time }
        readyTarget: { type: integer, format: int32, minimum: 0 }
    RunnerHostPoolStatus:
      type: object
      required: [ready, starting, busy, servedReady, servedCold, reportedAt]
      properties:
        ready: { type: integer, format: int32, minimum: 0, description: Sandboxes that wait for a run }
        starting: { type: integer, format: int32, minimum: 0, description: Sandboxes being created }
        busy: { type: integer, format: int32, minimum: 0, description: Sandboxes that runs hold }
        coldStartP90Seconds:
          type: integer
          format: int64
          nullable: true
          description: The 90th percentile of the host's last 20 cold starts, in seconds; null before the first
        servedReady: { type: integer, format: int32, minimum: 0, description: Runs of the last 24 hours that took a ready sandbox }
        servedCold: { type: integer, format: int32, minimum: 0, description: Runs of the last 24 hours that waited for one }
        reportedAt: { type: string, format: date-time }
    RunnerHostPoolSettings:
      type: object
      description: |
        How many sandboxes wait ready: `readyDefault` when no window applies, else the highest count of the windows
        that apply. A window applies from `from` to `to` on each of its days, in its own zone or else the pool's; one
        whose end is before its start ends the next day. Summer time follows the zone: a time the change skips moves
        forward by the gap, a repeated time takes its first occurrence.
      required: [readyDefault, windows]
      properties:
        zone:
          type: string
          nullable: true
          maxLength: 64
          example: Europe/Prague
          description: The IANA time zone of the windows' times; required once a window has no zone of its own
        readyDefault:
          type: integer
          format: int32
          minimum: 0
          maximum: 1000
          description: Ready sandboxes when no window applies, at most the pool size
        windows:
          type: array
          maxItems: 14
          items: { $ref: '#/components/schemas/RunnerHostPoolWindow' }
    RunnerHostPoolWindow:
      type: object
      required: [days, from, to, ready]
      properties:
        days:
          type: array
          minItems: 1
          maxItems: 7
          uniqueItems: true
          items:
            type: string
            enum: [MON, TUE, WED, THU, FRI, SAT, SUN]
        from:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          example: '08:00'
        to:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          example: '18:00'
        ready:
          type: integer
          format: int32
          minimum: 0
          maximum: 1000
          description: Ready sandboxes while the window applies, at most the pool size
        zone:
          type: string
          nullable: true
          maxLength: 64
          description: The window's own IANA zone, for teams in several zones; null uses the pool's
    RunnerHostCreateRequest:
      type: object
      description: '`scope` is `PERSONAL` by default: the caller''s own host. `COMPANY` is for OWNER and ADMIN only.'
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]*$' }
        scope: { $ref: '#/components/schemas/RunnerHostScope' }
    RunnerHostUpdateRequest:
      type: object
      description: Absent fields stay unchanged. Setting a value and clearing it in one request is 400 VALIDATION_FAILED.
      properties:
        desiredMaxConcurrentRuns:
          type: integer
          format: int32
          minimum: 1
          maximum: 1000
          description: The desired number of concurrent runs on the host; capped by the host's ceiling
        clearDesiredMaxConcurrentRuns:
          type: boolean
          description: Remove the desired value, so the host uses its ceiling
        pool:
          $ref: '#/components/schemas/RunnerHostPoolSettings'
        clearPool:
          type: boolean
          description: Remove the pool's settings, so no sandbox waits ready
    RunnerHostRegistration:
      type: object
      required: [runnerHost, token, connectUrl]
      properties:
        runnerHost: { $ref: '#/components/schemas/RunnerHost' }
        token:
          type: string
          description: Shown once. The runner host sends it as a Bearer token. Format `tfr_` + 43 base64url characters.
        connectUrl: { type: string, example: 'ws://localhost:8080/api/runner/v1/connect' }
    RunnerHostPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/RunnerHost' }
        nextCursor: { type: string, nullable: true }
    RunStatus:
      type: string
      enum: [QUEUED, RUNNING, SUCCEEDED, FAILED, CANCELLED, LOST]
      description: "QUEUED covers a run waiting for a host and one assigned and awaiting `run.accepted` (its queue reason says which); RUNNING once the host accepted it"
    RunTurnReason:
      type: string
      enum: [FIRST, MESSAGE, DECIDED, CONNECTED, RETRY, EVENT, REVIEW_RETURNED]
      description: |
        Why the turn started (the package 3 contract, §5.7): the conversation's first message (FIRST), a person's
        message (MESSAGE), the last open decision decided (DECIDED), an account connected with parked calls
        (CONNECTED), a retry of a failed or cancelled turn (RETRY).
    RunFailureClass:
      type: string
      enum: [USAGE_LIMIT, SERVER_LIMITED, CONTEXT_OVERFLOW, LOGIN_EXPIRED, VENDOR_BLOCKED, CREDENTIAL_LEAK, PROTOCOL_ERROR, GUARD_STOPPED, TIME_LIMIT, GIT_ERROR, INFRA, RUNNER_UNAVAILABLE, MODEL_REFUSED, LOST, RUNTIME_REMOVED, MODEL_NOT_ALLOWED, MODEL_REQUIRED, MODEL_NOT_SERVED]
      description: |
        Why a run failed: the runner's failure classes (runner protocol `$defs/FailureClass`), LOST when the server
        lost the run (its runner host stopped reporting), RUNTIME_REMOVED when the agent no longer lists the
        conversation's runtime, MODEL_NOT_ALLOWED when the payer's key no longer allows the settings' model,
        MODEL_REQUIRED when a budget's settings name no model (the company's gateway serves only the models it lists),
        MODEL_NOT_SERVED when the gateway answered that it does not serve the model the run asked for (the runner
        classed it PROTOCOL_ERROR). TIME_LIMIT is a run the runner host stopped at the agent's time limit
        (`Agent.turnTimeLimitMinutes`): its session and its work so far are kept, so a retry goes on where it stopped.
        GUARD_STOPPED is one of the runner host's other guards (too many tool calls, the same call repeated, no message
        from the agent).
    RunModelAccess:
      type: string
      enum: [BUDGET, SUBSCRIPTION]
      description: "Who pays: the payer's budget (their LiteLLM key, through the server's model relay), or their subscription on their own personal runner host"
    QueueReasonCode:
      type: string
      description: |
        Why a QUEUED run waits, in the order of the dispatcher's checks (the package 3 contract, §5.7): COMPANY_STOPPED
        (the company's runs are stopped, package 6) and SYSTEM_PAUSED (the workspace holds a repository of a paused
        system, `message` names it); AGENT_PAUSED
        (until the agent is resumed); ACCOUNT_REQUIRED (an account of the workspace waits for a person); BUDGET_SPENT
        (until `retryAt`), KEY_ERROR, NO_MODEL_KEY (ADR-0094: the company's gateway team provides the keys, and the
        payer has none yet), HOST_OFFLINE (a subscription's personal host is offline) and MODEL_ACCESS_UNAVAILABLE
        (`reason`: the model
        access module's refusal, such as PRINCIPAL_INACTIVE or SUBSCRIPTION_GONE); NO_HOST_FOR_CREDENTIALS (the
        company has hosts for the runtime, but none may carry the run's credentials), NO_RUNNER_HOST,
        RUNNER_HOST_OFFLINE and RUNNER_HOST_DRAINING; CREDENTIAL_POOL_FULL (a subscription's pool) and
        RUNNER_HOST_FULL. ASSIGNED: sent to the host, waiting for it to accept. PREVIOUS_RUN_ACTIVE and
        RUNNER_HOST_REJECTED: the host rejected the run, which waits until `retryAt`. TRIGGER_PAUSED (package 4): the
        conversation's trigger is paused, and its turns wait until it is resumed. NO_HOST_FOR_SKILLS (ADR-0064): the
        agent has skills, and no connected runner host that may run the conversation delivers skills (`run.skills`).
        RETRY_SCHEDULED (ADR-0073), before every check: an automatic retry of a turn that failed for a reason that may
        pass waits until `retryAt`, the `used`th of at most `limit` in a row (`AgentSettings.autoRetry`).
        OTHER: anything else, in `message`.
      enum: [COMPANY_STOPPED, SYSTEM_PAUSED, AGENT_PAUSED, ACCOUNT_REQUIRED, BUDGET_SPENT, KEY_ERROR, NO_MODEL_KEY, HOST_OFFLINE, MODEL_ACCESS_UNAVAILABLE, NO_HOST_FOR_CREDENTIALS, NO_RUNNER_HOST, RUNNER_HOST_OFFLINE, RUNNER_HOST_DRAINING, CREDENTIAL_POOL_FULL, RUNNER_HOST_FULL, PREVIOUS_RUN_ACTIVE, RUNNER_HOST_REJECTED, ASSIGNED, TRIGGER_PAUSED, NO_HOST_FOR_SKILLS, RETRY_SCHEDULED, OTHER]
    QueueReason:
      type: object
      description: |
        Why a QUEUED run waits, with the facts to say so (`text`, in English). Which fields are set depends on `code`;
        the others are null.
      required: [code, since, text]
      properties:
        code: { $ref: '#/components/schemas/QueueReasonCode' }
        since:
          type: string
          format: date-time
          description: When the run started to wait for this code. It stays while only the other fields change.
        text:
          type: string
          description: |
            The reason in words, such as: Waiting for a free slot on office (1 of 1 in use). Its times are never in
            it: `retryAt` and `lastSeenAt` are, for the reader's clock and locale ("The budget that pays for this
            conversation is spent; the turn goes on once it resets.")
        runnerHostId: { type: string, format: uuid, nullable: true }
        runnerHostName: { type: string, nullable: true }
        credentialLabel: { type: string, nullable: true, description: "A subscription's label" }
        used: { type: integer, format: int32, nullable: true, description: "CREDENTIAL_POOL_FULL, RUNNER_HOST_FULL: slots in use; RETRY_SCHEDULED: the automatic retry's number in the row" }
        limit: { type: integer, format: int32, nullable: true, description: "CREDENTIAL_POOL_FULL, RUNNER_HOST_FULL: the limit applied; RETRY_SCHEDULED: how many automatic retries there are at most in a row" }
        lastSeenAt: { type: string, format: date-time, nullable: true, description: When an offline host was last connected }
        retryAt: { type: string, format: date-time, nullable: true, description: "BUDGET_SPENT (when the budget resets), RUNNER_HOST_REJECTED, PREVIOUS_RUN_ACTIVE, RETRY_SCHEDULED: the earliest time it goes on" }
        reason: { type: string, nullable: true, description: "MODEL_ACCESS_UNAVAILABLE: the model access module's reason" }
        rejectCode: { type: string, nullable: true, description: "RUNNER_HOST_REJECTED: the host's code" }
        message: { type: string, nullable: true, description: Text from the runner host or the server; never a secret }
        runtime: { type: string, nullable: true, enum: [CLAUDE_CODE, CODEX, PI, OPENCODE] }
    RunUsage:
      type: object
      required: [inputTokens, outputTokens]
      description: Cumulative token usage of the run as its runtime reported it; the four token counts add up to its total.
      properties:
        inputTokens: { type: integer, format: int64, description: Input tokens neither read from nor written to the prompt cache }
        outputTokens: { type: integer, format: int64 }
        cachedInputTokens: { type: integer, format: int64, nullable: true }
        cacheWriteTokens: { type: integer, format: int64, nullable: true }
        costUsd: { type: number, format: double, nullable: true, description: Estimate reported by the runtime; null when unknown }
    RunRelayUsage:
      type: object
      required: [requests, requestBytes, responseBytes]
      description: What the server's model relay passed for a run paid by a budget, recorded when it ended
      properties:
        requests: { type: integer, format: int64 }
        requestBytes: { type: integer, format: int64 }
        responseBytes: { type: integer, format: int64 }
    RunRepository:
      type: object
      description: One repository of the workspace the run was assigned with, and its git result once the run ended
      required: [repositoryName, dir, readOnly]
      properties:
        repositoryId: { type: string, format: uuid, nullable: true, description: Null after the repository was removed }
        systemId: { type: string, format: uuid, nullable: true }
        repositoryName: { type: string }
        dir: { type: string, description: "Directory under `/workspace` in the run's sandbox" }
        readOnly: { type: boolean, description: "Cloned, never pushed, no change request" }
        readOnlyCause:
          type: string
          nullable: true
          enum: [AGENT, GRANT, REQUEST]
          description: "Why it is read-only: the agent's access, the account's read-only grant, or an approval that gave READ"
        pushed: { type: boolean, nullable: true, description: True when the run pushed the branch; null until it ended or without a result }
        headSha: { type: string, nullable: true }
        commits: { type: integer, format: int32, nullable: true }
    RunCounts:
      type: object
      description: The work of a finished run as its transcript shows it
      required: [toolCalls, messages, thoughts]
      properties:
        toolCalls: { type: integer, format: int32 }
        messages: { type: integer, format: int32 }
        thoughts: { type: integer, format: int32 }
    RunResult:
      type: object
      description: "The agent's last `finish` call of the run"
      required: [outcome, summary, nextSteps, openQuestions]
      properties:
        outcome: { type: string, enum: [COMPLETED, BLOCKED] }
        summary: { type: string }
        nextSteps: { type: array, maxItems: 20, items: { type: string } }
        openQuestions: { type: array, maxItems: 10, items: { type: string } }
    Attachment:
      type: object
      description: |
        A file of a conversation (the package 3 contract, §3.13; ADR-0014, ADR-0021): one its person added, or a
        document its agent saved. Runs mount every file read-only at `/attachments`.
      required: [id, conversationId, fileName, contentType, sizeBytes, sha256, uploadedBy, createdAt]
      properties:
        id: { type: string, format: uuid }
        conversationId: { type: string, format: uuid }
        fileName:
          type: string
          description: |
            A person's file: its own name, one segment. A document from a run's `/output`: its path relative to the
            folder (`reports/q3.md`).
        contentType: { type: string }
        sizeBytes: { type: integer, format: int64 }
        sha256: { type: string, description: Lower-case hex of the content's SHA-256 }
        note: { type: string, nullable: true }
        contentPurgedAt:
          type: string
          format: date-time
          nullable: true
          description: "When retention or an erasure removed the content: the name, size and hash stay, and a download is `410 CONTENT_PURGED`"
        uploadedBy: { type: string, description: "The person's name, or the agent's for a document it saved" }
        uploadedByUserId: { type: string, format: uuid, nullable: true, description: The person who added it }
        agentId: { type: string, format: uuid, nullable: true, description: The agent that saved it }
        runId: { type: string, format: uuid, nullable: true, description: The turn that saved it }
        outputId:
          type: string
          format: uuid
          nullable: true
          description: The output whose document it is; such a file is not deleted while the output is
        createdAt: { type: string, format: date-time }
    CredentialMatch:
      type: object
      description: |
        What the upload scan found (ADR-0014): the name of a vault secret whose value occurs in the file, or a known
        credential format; never the value
      required: [kind, name]
      properties:
        kind:
          type: string
          enum: [VAULT_SECRET, FORMAT]
        name: { type: string }
    DecisionKind:
      type: string
      enum: [QUESTION, APPROVAL]
    DecisionStatus:
      type: string
      enum: [OPEN, DECIDED, CANCELLED]
    DecisionOutcome:
      type: string
      enum: [ANSWERED, APPROVED, DENIED]
    DecisionScope:
      type: string
      enum: [CONVERSATION, AGENT]
      description: "An approved request's: for this conversation, or for the agent for good"
    DecisionSubjectType:
      type: string
      enum: [TOOL_CALL, REPOSITORY, HOST, CHANGE_REQUEST, RESULT]
      description: "RESULT: the review of a trigger's turn's result before anything of it is written (the package 4 contract, §5.8)"
    DecisionSubject:
      type: object
      description: What an approval is about
      required: [type]
      properties:
        type: { $ref: '#/components/schemas/DecisionSubjectType' }
        systemId: { type: string, format: uuid, nullable: true, description: "A tool call's system" }
        systemName: { type: string, nullable: true }
        name: { type: string, nullable: true, description: "A tool call's tool as the run lists it, e.g. `jira_comment`" }
        tool: { type: string, nullable: true, description: "A tool call's tool as its system names it" }
        arguments:
          type: object
          nullable: true
          additionalProperties: true
          description: "A tool call's arguments"
        what: { type: string, nullable: true, description: 'A tool call in words, e.g. "comment on SHOP-241"' }
        accountText:
          type: string
          nullable: true
          description: |
            A tool call: the account it runs as, in the words the conversation's binding on the system shows
            (`ConversationBinding.text`, e.g. "GitHub: via Analysts, read-only"); null before the system is bound
        repositoryId: { type: string, format: uuid, nullable: true }
        repositoryName: { type: string, nullable: true }
        access:
          allOf: [{ $ref: '#/components/schemas/AgentRepositoryAccess' }]
          nullable: true
          description: "A repository's access once approved, unless the approver picks another"
        host: { type: string, nullable: true }
        runId: { type: string, format: uuid, nullable: true, description: "A RESULT's turn, whose result it reviews" }
        summary: { type: string, nullable: true, description: "A RESULT's summary, the turn's result" }
        writes:
          type: array
          nullable: true
          items: { type: string }
          description: "A RESULT: exactly what would be written to the place, the comment's Markdown then each action in words"
        writeItems:
          type: array
          nullable: true
          items: { $ref: '#/components/schemas/DecisionWrite' }
          description: |
            A RESULT: the same writes, in the same order, one item each with what it is (the outbox row's kind) and
            where it goes, for the card to label them; null otherwise
    DecisionWriteKind:
      type: string
      enum: [COMMENT, TRANSITION, LABEL_ADD, LABEL_REMOVE, CLOSE, ATTACHMENT, REMOTE_LINK, CHAT_POST, CHAT_FILE]
      description: |
        What a result's write writes, as the write-back's outbox row names it: a comment on the issue or change request,
        a Jira transition, a label added or removed, a close, a document attached, the issue's link to the conversation
        in Tinfirm (Jira), a post in the chat thread, a document uploaded to the thread
    DecisionWrite:
      type: object
      description: One write a result's review shows, exactly as it would be written
      required: [text]
      properties:
        kind:
          allOf: [{ $ref: '#/components/schemas/DecisionWriteKind' }]
          nullable: true
          description: Null for a review stored with its words only
        target: { type: string, nullable: true, description: "The subject it is written to: the issue's or change request's key (`SHOP-1`), the chat thread's reference" }
        value: { type: string, nullable: true, description: "What it names: a transition's or a label's name, a document's title, a link's address; null for a comment, a post, a close" }
        text: { type: string, description: "The write in words, as `writes` has it: a comment's or a post's Markdown in full" }
    Decision:
      type: object
      description: A question or an approval of a conversation (the package 3 contract, §3.12)
      required: [id, conversationId, kind, options, status, createdAt, mayDecide]
      properties:
        id: { type: string, format: uuid }
        conversationId: { type: string, format: uuid }
        conversationKey: { type: string, nullable: true }
        conversationTitle: { type: string, nullable: true }
        agentId: { type: string, format: uuid, nullable: true }
        agentName: { type: string, nullable: true }
        runId: { type: string, format: uuid, nullable: true, description: The run that raised it }
        kind: { $ref: '#/components/schemas/DecisionKind' }
        question: { type: string, nullable: true, description: "A question's text (Markdown)" }
        options:
          type: array
          items: { type: string }
        subject:
          allOf: [{ $ref: '#/components/schemas/DecisionSubject' }]
          nullable: true
        reason: { type: string, nullable: true, description: "The agent's reason, for a request" }
        approverPrincipalId:
          type: string
          format: uuid
          nullable: true
          description: |
            Who decides it: a personal conversation's person; a trigger's approval without a team, its author. Null
            for a trigger's team's approval (approverGroupId) and a trigger's question, which its author and team
            answer in Tinfirm and anyone answers on the issue (the package 4 contract, §5.8)
        approverName: { type: string, nullable: true }
        approverGroupId: { type: string, format: uuid, nullable: true, description: "A trigger's team, whose members decide its approval" }
        approverGroupName: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/DecisionStatus' }
        outcome:
          allOf: [{ $ref: '#/components/schemas/DecisionOutcome' }]
          nullable: true
        answer: { type: string, nullable: true }
        option: { type: string, nullable: true }
        note: { type: string, nullable: true }
        scope:
          allOf: [{ $ref: '#/components/schemas/DecisionScope' }]
          nullable: true
        access:
          allOf: [{ $ref: '#/components/schemas/AgentRepositoryAccess' }]
          nullable: true
        result: { type: string, nullable: true, description: "An approved call's result, once it ran" }
        decidedByPrincipalId: { type: string, format: uuid, nullable: true }
        decidedByName: { type: string, nullable: true }
        decidedAt: { type: string, format: date-time, nullable: true }
        cancelCause: { type: string, nullable: true }
        purgedAt: { type: string, format: date-time, nullable: true, description: "When retention or an erasure removed its texts; its kind and outcome stay" }
        createdAt: { type: string, format: date-time }
        mayDecide: { type: boolean, description: 'Whether the caller decides it: its approver, while it is open' }
        agentEditableByMe:
          type: boolean
          nullable: true
          description: |
            A REPOSITORY or HOST request's: whether the caller edits the conversation's agent (its owner, OWNER,
            ADMIN), which approving it for the agent for good (`scope` `AGENT`) needs; null for other decisions and a
            caller who decides nothing
    DecisionPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Decision' }
        nextCursor: { type: string, nullable: true }
    DecideRequest:
      type: object
      properties:
        outcome:
          type: string
          enum: [APPROVED, DENIED]
          nullable: true
          description: An approval's outcome; a question is answered
        answer: { type: string, nullable: true, maxLength: 20000 }
        option: { type: string, nullable: true, maxLength: 100 }
        note: { type: string, nullable: true, maxLength: 20000 }
        scope:
          allOf: [{ $ref: '#/components/schemas/DecisionScope' }]
          nullable: true
        access:
          allOf: [{ $ref: '#/components/schemas/AgentRepositoryAccess' }]
          nullable: true
    InboxItemKind:
      type: string
      enum: [DECISION, BINDING, FAILED, WAITING, ACCOUNT, AUDIT_CHECK, RETENTION_OPEN, BUDGET, COMPANY_SPEND, SPEND_SYNC,
             TRIGGER, DEPARTURE, CHAT_LINKED, CHAT_SUBSCRIPTION_SILENT, SEAT_FALLBACK, LICENCE, SCIM_LAST_OWNER]
      description: |
        `SCIM_LAST_OWNER` (that OWNER; ADR-0087, decision 7): the company's identity provider tried, through SCIM, to
        deactivate or remove the caller, the company's last active OWNER, and was refused; for 30 days, dismissible,
        and back at the next refusal.
        `LICENCE` (OWNER, ADMIN; ADR-0077, decision 7): the instance's licence ends within 30 days, is in its grace,
        or expired less than 90 days ago, in `licence`; dismissible, and back when the state changes.
        `SEAT_FALLBACK` (OWNER, ADMIN; ADR-0077): a new user of an identity provider joined as VIEWER because every
        seat was taken, in `seatFallback`, while they are still a Viewer and for 30 days at most; dismissible.
        `DEPARTURE` (admins): a member who left, whose checklist is not closed (package 6), in `departure`.
        `DECISION`: an open decision the caller decides; `BINDING`: a waiting binding of the caller's conversation they
        can act on; `FAILED`: the caller's conversation whose latest turn failed (a trigger's: for its author and
        team); `WAITING`: the caller's conversation waiting on a runner or on their budget; `ACCOUNT` (admins): a
        system's credential that keeps conversations waiting; `AUDIT_CHECK` (OWNER, ADMIN): the daily check of
        the audit chain failed, until a check passes or an OWNER acknowledges it; `RETENTION_OPEN` (OWNER): open
        conversations older than their retention period, which retention does not purge until they end;
        `BUDGET`: a budget threshold crossed (`budget`, the package 6 contract, §5.3);
        `COMPANY_SPEND` (admins): the company's monthly alert amount crossed (`companySpend`); `SPEND_SYNC` (admins):
        spend settled from the relay's count instead of LiteLLM's logs (`spendSync`); `TRIGGER`: a trigger that needs
        the caller (`trigger`, the package 4 contract, §5.13);
        `CHAT_LINKED`: a chat account linked to the caller, for 7 days, with its unlink (`chat`, the package 5
        contract, §5.4); `CHAT_SUBSCRIPTION_SILENT` (admins): a Slack system whose events stopped after failed
        deliveries, with the step that re-enables them (`chat`, §5.2)
    InboxChat:
      type: object
      description: A chat system's item of the inbox (CHAT_LINKED, CHAT_SUBSCRIPTION_SILENT), kept by the chat module
      required: [systemId, text]
      properties:
        systemId: { type: string, format: uuid }
        systemName: { type: string, nullable: true }
        text: { type: string }
        unlinkSystemId:
          type: string
          format: uuid
          nullable: true
          description: "The system to unlink on (`DELETE /me/accounts/{systemId}`), for a link that was not the caller's"
        chatUserId:
          type: string
          nullable: true
          description: "CHAT_LINKED: the chat user linked, as the platform names them (Slack's `U…`, Teams' `29:…`)"
        chatUserName:
          type: string
          nullable: true
          description: |
            CHAT_LINKED: the chat user's display name, as the platform said it at the link (else as it last said it);
            null when it said none. `text` names them by it too: "Slack user Jane Doe (U04ABC123) of Acme"
    InboxConversation:
      type: object
      required: [id, key, title, agentId]
      properties:
        id: { type: string, format: uuid }
        key: { type: string }
        title: { type: string }
        agentId: { type: string, format: uuid }
        agentName: { type: string, nullable: true }
    InboxBinding:
      type: object
      required: [id, systemId, reason, choices]
      properties:
        id: { type: string, format: uuid }
        systemId: { type: string, format: uuid }
        systemName: { type: string, nullable: true }
        reason: { type: string, enum: [NONE, RECONNECT_YOURS, CHOOSE, PICK_GRANT] }
        choices:
          type: array
          items: { type: string, format: uuid }
          description: The grants offered, for CHOOSE and PICK_GRANT
        grantChoices:
          type: array
          items: { $ref: '#/components/schemas/ConversationBindingChoice' }
          description: |
            The grants offered with their group, the credential each lends (`credentialName`) and its access, as
            `ConversationBinding.choices` shows them, so that the card needs no second call
        systemKind:
          allOf: [{ $ref: '#/components/schemas/SystemKind' }]
          nullable: true
          description: Null once the system was removed
        oauthAvailable:
          type: boolean
          nullable: true
          description: 'Whether the system''s app lets the caller sign in (as `MyAccount.oauthAvailable`); null once the system was removed'
    InboxTurn:
      type: object
      required: [status]
      properties:
        runId: { type: string, format: uuid, nullable: true }
        status: { type: string, description: "The latest turn's status: FAILED, or QUEUED while it waits" }
        failureClass: { type: string, nullable: true }
        failureCause: { type: string, nullable: true }
        waitingReason: { type: string, nullable: true, description: "The queue reason of a waiting turn, e.g. BUDGET_SPENT" }
        waitingText:
          type: string
          nullable: true
          description: |
            The waiting turn's queue reason in words, as its run's `queueReason.text` says it ("Waiting for a free slot
            on office (1 of 1 in use)."); null when its run has none
        retryAt: { type: string, format: date-time, nullable: true, description: "When a spent budget resets, or when a turn retried by itself (RETRY_SCHEDULED) or a rejected run goes on" }
    InboxAccount:
      type: object
      required: [systemId, reason, conversations]
      properties:
        systemId: { type: string, format: uuid }
        systemName: { type: string, nullable: true }
        credential:
          allOf: [{ $ref: '#/components/schemas/SystemCredentialRef' }]
          nullable: true
          description: |
            The credential the waiting bindings name (ADR-0072), as it is now: a token is stored again, a sign-in
            signed in again, a disabled one enabled; null for a suspended service account's
        bot: { type: boolean, description: "The chat system's bot: it is fixed with the bot, on the system's page" }
        holderPrincipalId: { type: string, format: uuid, nullable: true, description: 'The service account it acts through, for a suspended one' }
        holderName: { type: string, nullable: true }
        reason: { type: string, enum: [RECONNECT_COMPANY, SUSPENDED] }
        conversations: { type: integer, format: int32, description: How many conversations it keeps waiting }
    InboxItem:
      type: object
      required: [kind, since]
      properties:
        kind: { $ref: '#/components/schemas/InboxItemKind' }
        since: { type: string, format: date-time, description: Since when it waits }
        conversation:
          allOf: [{ $ref: '#/components/schemas/InboxConversation' }]
          nullable: true
          description: "The item's conversation: DECISION (when the caller sees it), BINDING, FAILED and WAITING"
        decision:
          allOf: [{ $ref: '#/components/schemas/Decision' }]
          nullable: true
        binding:
          allOf: [{ $ref: '#/components/schemas/InboxBinding' }]
          nullable: true
        turn:
          allOf: [{ $ref: '#/components/schemas/InboxTurn' }]
          nullable: true
        account:
          allOf: [{ $ref: '#/components/schemas/InboxAccount' }]
          nullable: true
        auditCheck:
          allOf: [{ $ref: '#/components/schemas/AuditCheck' }]
          nullable: true
        openConversations: { type: integer, format: int32, nullable: true, description: "RETENTION_OPEN: how many" }
        budget:
          allOf: [{ $ref: '#/components/schemas/InboxBudget' }]
          nullable: true
        companySpend:
          allOf: [{ $ref: '#/components/schemas/InboxCompanySpend' }]
          nullable: true
        spendSync:
          allOf: [{ $ref: '#/components/schemas/InboxSpendSync' }]
        departure:
          allOf: [{ $ref: '#/components/schemas/InboxDeparture' }]
          nullable: true
        trigger:
          allOf: [{ $ref: '#/components/schemas/InboxTrigger' }]
          nullable: true
        chat:
          allOf: [{ $ref: '#/components/schemas/InboxChat' }]
          nullable: true
        seatFallback:
          allOf: [{ $ref: '#/components/schemas/InboxSeatFallback' }]
          nullable: true
        licence:
          allOf: [{ $ref: '#/components/schemas/InboxLicence' }]
          nullable: true
        noticeKey:
          type: string
          nullable: true
          maxLength: 200
          description: |
            A notice's key (the kinds `counts.notices` counts; null for the other kinds): its kind, what it is about
            and the condition that raised it, such as `BUDGET:{principalId}:80:{crossedAt}` or
            `COMPANY_SPEND:2026-10`. It stays while the condition holds and changes with it (a budget's next threshold
            or period, the next month, a trigger's next pause), so that a dismissal
            (`PUT /inbox/dismissals/{noticeKey}`) hides the notice until then. One item per key; clients treat it as
            opaque.
        dismissible:
          type: boolean
          default: false
          description: |
            Whether the caller may dismiss the notice for themselves: true for a notice that only informs them; false
            where the caller is the one to act (`DEPARTURE`, `CHAT_SUBSCRIPTION_SILENT`, a `TRIGGER` whose agent's
            widening waits for acceptance, whose author left, or whose account is broken), for every kind but the
            notices, and for a caller without a principal in the company
    InboxCounts:
      type: object
      required: [decisions, bindings, failed, waiting, accounts]
      properties:
        decisions: { type: integer, format: int32 }
        bindings: { type: integer, format: int32 }
        failed: { type: integer, format: int32 }
        waiting: { type: integer, format: int32 }
        accounts: { type: integer, format: int32 }
        notices: { type: integer, format: int32, description: 'Items of the kinds BUDGET, COMPANY_SPEND, SPEND_SYNC, TRIGGER, DEPARTURE, CHAT_LINKED and CHAT_SUBSCRIPTION_SILENT, but those the caller dismissed' }
    Inbox:
      type: object
      required: [items, counts]
      properties:
        items:
          type: array
          description: Longest waiting first, at most 100 of each kind
          items: { $ref: '#/components/schemas/InboxItem' }
        counts: { $ref: '#/components/schemas/InboxCounts' }
    InboxBudget:
      type: object
      description: |
        A budget threshold crossed in the current period (the package 6 contract, §5.3): a member's own, or, for
        admins and the authors of the triggers it pays, a service identity's; admins also every principal's at 100 %,
        with counts of what waits and nothing more. It stays until the period resets or the budget is raised above
        the spend; an admin changes the budget with `PATCH /principals/{principalId}/model-access`.
      required: [principalId, principalKind, own, threshold, spentUsd, budgetUsd]
      properties:
        principalId: { type: string, format: uuid }
        principalName: { type: string, nullable: true }
        principalKind: { type: string, enum: [MEMBER, SERVICE] }
        own: { type: boolean, description: "The caller's own budget" }
        threshold: { type: integer, format: int32, description: 'The percentage crossed' }
        spentUsd: { type: number }
        budgetUsd: { type: number }
        resetsAt: { type: string, format: date-time, nullable: true }
        waitingRuns:
          type: integer
          format: int32
          nullable: true
          description: At 100 %, for admins and trigger authors, how many turns wait for this budget
        waitingTriggers:
          type: integer
          format: int32
          nullable: true
          description: At 100 %, for admins and trigger authors, how many live triggers this principal pays
    InboxCompanySpend:
      type: object
      description: "The company's spend this calendar month (UTC) crossed the admins' alert amount; nothing is capped"
      required: [month, totalUsd, alertUsd]
      properties:
        month: { type: string, example: '2026-10' }
        totalUsd: { type: number }
        alertUsd: { type: number }
    InboxSpendSync:
      type: object
      description: |
        Spend is settled from the relay's own count instead of LiteLLM's spend logs: more than 10 runs today, or the
        logs could not be read for an hour. Until the logs are read again.
      required: [relayRunsToday]
      properties:
        relayRunsToday: { type: integer, format: int32 }
        failingSince: { type: string, format: date-time, nullable: true }
        lastError: { type: string, nullable: true }
    SpendDimension:
      type: string
      enum: [payer, actor, agent, trigger, conversation, model, period]
      description: |
        `payer`: who paid; `actor`: the run's acting principal (the person, or the trigger's author when the run was
        made); `agent`; `trigger`; `conversation`; `model`; `period`: the run's end bucketed by `bucket` in `zone`
    SpendSource:
      type: string
      enum: [GATEWAY, RELAY, SUBSCRIPTION]
      description: "LiteLLM's records; the relay's own count at LiteLLM's prices; a subscription's reported tokens, without a cost"
    SpendKey:
      type: object
      description: |
        One grouping's value. `id` is a principal's, agent's, trigger's or conversation's id, a model's name, or the
        bucket's first day (`2026-10-01`). A folded row (ADMIN: another person's personal conversations) has no `id`
        and names their person in `personPrincipalId`. `label` is a name, "{name} (left)" for a principal who left, a
        conversation's key with its title only when it is the caller's own or a trigger's they see.
      required: [dimension, folded]
      properties:
        dimension: { $ref: '#/components/schemas/SpendDimension' }
        id: { type: string, nullable: true }
        label: { type: string, nullable: true }
        key: { type: string, nullable: true, description: "A conversation's key" }
        title: { type: string, nullable: true, description: "A conversation's title, when the caller may see it" }
        folded: { type: boolean }
        personPrincipalId: { type: string, format: uuid, nullable: true }
    SpendAmounts:
      type: object
      required: [runs, requests, inputTokens, outputTokens, cachedInputTokens, cacheWriteTokens, costUsd, relayCostUsd, subscriptionTokens]
      properties:
        runs: { type: integer, format: int64 }
        requests: { type: integer, format: int64 }
        inputTokens: { type: integer, format: int64 }
        outputTokens: { type: integer, format: int64 }
        cachedInputTokens: { type: integer, format: int64 }
        cacheWriteTokens: { type: integer, format: int64 }
        costUsd: { type: number, description: 'Of GATEWAY and RELAY rows' }
        relayCostUsd: { type: number, description: "Of that, the share from the relay's count" }
        subscriptionTokens: { type: integer, format: int64, description: "Tokens of subscriptions' runs, as their sandboxes reported them" }
    SpendRow:
      type: object
      required: [keys, amounts]
      properties:
        keys:
          type: array
          items: { $ref: '#/components/schemas/SpendKey' }
        amounts: { $ref: '#/components/schemas/SpendAmounts' }
    SpendReport:
      type: object
      required: [from, to, zone, groupBy, bucket, rows, totals]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        zone: { type: string }
        groupBy:
          type: array
          items: { $ref: '#/components/schemas/SpendDimension' }
        bucket: { type: string, enum: [DAY, WEEK, MONTH] }
        rows:
          type: array
          items: { $ref: '#/components/schemas/SpendRow' }
        totals: { $ref: '#/components/schemas/SpendAmounts' }
    Run:
      type: object
      description: One turn of a conversation, executed in a sandbox on a runner host (the package 3 contract, §3.11)
      required: [id, conversationId, conversationKey, agentId, runtime, turnReason, turnNumber, personPrincipalId, payerPrincipalId, modelAccess, status, repositories, createdAt, lastEventSeq]
      properties:
        id: { type: string, format: uuid }
        conversationId: { type: string, format: uuid }
        conversationKey: { type: string }
        agentId: { type: string, format: uuid }
        runtime: { type: string, enum: [CLAUDE_CODE, CODEX, PI, OPENCODE] }
        turnReason: { $ref: '#/components/schemas/RunTurnReason' }
        turnNumber: { type: integer, format: int32, description: "The turn's number in its conversation, from 1" }
        personPrincipalId: { type: string, format: uuid, description: The person the run acts for }
        personName: { type: string, nullable: true }
        payerPrincipalId: { type: string, format: uuid, description: Who pays }
        payerName: { type: string, nullable: true }
        modelAccess: { $ref: '#/components/schemas/RunModelAccess' }
        subscriptionLabel: { type: string, nullable: true, description: "The subscription's label, for SUBSCRIPTION" }
        runnerHostId: { type: string, format: uuid, nullable: true }
        runnerHostName: { type: string, nullable: true }
        runnerHostKind:
          allOf: [{ $ref: '#/components/schemas/RunnerHostScope' }]
          nullable: true
          description: The kind of the host the run was assigned to
        status: { $ref: '#/components/schemas/RunStatus' }
        failureClass:
          allOf: [{ $ref: '#/components/schemas/RunFailureClass' }]
          nullable: true
        failureMessage: { type: string, nullable: true }
        queueReason:
          allOf: [{ $ref: '#/components/schemas/QueueReason' }]
          nullable: true
          description: Why a QUEUED run still waits, as the dispatcher last found; null otherwise and before it looked
        createdAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time, nullable: true }
        finishedAt: { type: string, format: date-time, nullable: true }
        summary: { type: string, nullable: true, description: "The summary of the agent's `finish`, else its final message (Markdown)" }
        textsPurgedAt: { type: string, format: date-time, nullable: true, description: "When retention or an erasure removed its summary, result and failure message" }
        eventsPurgedAt: { type: string, format: date-time, nullable: true, description: "When retention or an erasure removed its events (the transcript)" }
        result:
          allOf: [{ $ref: '#/components/schemas/RunResult' }]
          nullable: true
        branch: { type: string, nullable: true, description: "The conversation's branch `agent/{key}` in every repository of the run" }
        repositories:
          type: array
          items: { $ref: '#/components/schemas/RunRepository' }
        usage:
          allOf: [{ $ref: '#/components/schemas/RunUsage' }]
          nullable: true
        relay:
          allOf: [{ $ref: '#/components/schemas/RunRelayUsage' }]
          nullable: true
        counts:
          allOf: [{ $ref: '#/components/schemas/RunCounts' }]
          nullable: true
        resumed:
          type: boolean
          nullable: true
          description: Whether the run resumed its agent's session of the previous turn; null until its host reported it
        resumeOutcome:
          type: string
          nullable: true
          enum: [FIRST_RUN, NO_SESSION, LOAD_FAILED, NOT_SUPPORTED]
        lastEventSeq: { type: integer, format: int64 }
    RunEventType:
      type: string
      enum: [AGENT_MESSAGE, AGENT_THOUGHT, TOOL_CALL, TOOL_CALL_UPDATE, PLAN, USAGE, RATE_LIMIT, STATUS, GIT, LOG, ERROR]
    RunEvent:
      type: object
      required: [seq, type, at, payload]
      properties:
        seq: { type: integer, format: int64 }
        type: { $ref: '#/components/schemas/RunEventType' }
        at: { type: string, format: date-time }
        payload:
          type: object
          additionalProperties: true
          description: "Shape depends on `type`; see protocol/runner-v2.schema.json `$defs/EventPayload*`"
    RunEventPage:
      type: object
      required: [items, complete]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/RunEvent' }
        complete: { type: boolean, description: True when the run has finished and no later events exist }
    ConversationState:
      type: string
      enum: [OPEN, ENDED]
      description: '`ENDED` is final: the conversation takes nothing more'
    ConversationEndedReason:
      type: string
      enum: [USER, AGENT_DELETED, PERSON_LEFT, AUTHOR_LEFT, TRIGGER_DELETED, SUBJECT_CLOSED, SUPERSEDED, SYSTEM_REMOVED]
      description: |
        A person ended it (its person, OWNER, or for a trigger's conversation its author, team or an admin), its agent
        was deleted, or its person left the company. Package 4: its trigger's author left (AUTHOR_LEFT, no longer used
        since the review of the package 4 contract, §11), its trigger was deleted, its subject closed, or the next
        firing of its schedule started (SUPERSEDED). Package 5: a Teams direct message's next conversation started
        (`SUPERSEDED`), or its chat system was removed (`SYSTEM_REMOVED`)
    ConversationTurnStatus:
      type: string
      enum: [QUEUED, RUNNING, WAITING, SUCCEEDED, FAILED, CANCELLED]
      description: "The latest turn: `WAITING` once it ended on open decisions or a binding to connect"
    ConversationWaitingOn:
      type: string
      enum: [PERSON, AGENT, RUNNER, NONE]
      description: |
        Whom the conversation waits on: `PERSON` (`waitingReason` QUESTION, APPROVAL, REVIEW (a result's review),
        ACCOUNT or FAILED; `Conversation.waitingGroupId` when a group holds the decision), `AGENT` (RUNNING), `RUNNER`
        (the queued run's reason, or QUEUED), `NONE`
    ConversationSubject:
      type: object
      description: |
        What the conversation is about, a reference and not a copy (the package 3 contract, §3.8); a WEBHOOK
        conversation's from its place: the mapped subject's key, with its link (http(s) only) and title where the
        mapping read them, and the webhook system
      required: [key]
      properties:
        systemId: { type: string, format: uuid, nullable: true, description: Null once the system was removed }
        systemName: { type: string, nullable: true }
        key: { type: string, description: 'The key people know: `SHOP-123`, `owner/repo#57`' }
        url: { type: string, nullable: true }
        title: { type: string, nullable: true, description: The title given at the start }
    ConversationSubjectInput:
      type: object
      required: [systemId, key]
      properties:
        systemId: { type: string, format: uuid, description: 'A company system with issues or change requests (Jira, GitHub, GitLab)' }
        key: { type: string, minLength: 1, maxLength: 200 }
        url: { type: string, maxLength: 2000, description: 'http(s), without user info' }
        title: { type: string, maxLength: 500 }
    ConversationStartRequest:
      type: object
      required: [agentId, message]
      properties:
        agentId: { type: string, format: uuid }
        message: { type: string, minLength: 1, maxLength: 100000, description: The first message (Markdown); its first line is the title }
        subject: { $ref: '#/components/schemas/ConversationSubjectInput' }
        repositoryIds:
          type: array
          maxItems: 20
          items: { type: string, format: uuid }
          description: The workspace, each a repository of the agent; empty, no repository; absent, the settings' default repositories, else all of the agent's
        attachmentIds:
          type: array
          maxItems: 50
          items: { type: string, format: uuid }
          description: |
            Files of the caller's other conversations (`Attachment.id`), copied into the new conversation before its
            first turn, as files the person added; within the limits of a conversation's files. A file of none of the
            caller's conversations is `400 VALIDATION_FAILED`, two of one name `409 DUPLICATE_ATTACHMENT_NAME`, too many
            or too large `409 TOO_MANY_ATTACHMENTS`
    ConversationUpdateRequest:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
    ConversationMessageRequest:
      type: object
      required: [body]
      properties:
        body: { type: string, minLength: 1, maxLength: 100000, description: Markdown }
        answersOpenQuestions: { type: boolean, default: false, description: The message answers every open question of the conversation (ADR-0033) }
    ConversationBindingChooseRequest:
      type: object
      properties:
        grantId: { type: string, format: uuid, description: One of the binding's `choices` }
        reconnect: { type: boolean, description: 'Reconnect (or connect) one''s own account instead' }
    ConversationSummary:
      type: object
      required: [id, key, title, agentId, agentName, state, waitingOn, turnCount, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        key: { type: string, description: '`{base}-{n}`; the branch `agent/{key}`' }
        title: { type: string }
        agentId: { type: string, format: uuid }
        agentName: { type: string }
        personPrincipalId: { type: string, format: uuid, nullable: true, description: "Its person; null for a trigger's conversation" }
        personName: { type: string, nullable: true }
        trigger:
          allOf: [{ $ref: '#/components/schemas/ConversationTrigger' }]
          nullable: true
          description: "A trigger's conversation: its trigger and author (the package 4 contract, §3.4); null for a personal one"
        subject:
          allOf: [{ $ref: '#/components/schemas/ConversationSubject' }]
          nullable: true
        state: { $ref: '#/components/schemas/ConversationState' }
        endedReason:
          allOf: [{ $ref: '#/components/schemas/ConversationEndedReason' }]
          nullable: true
        endedAt: { type: string, format: date-time, nullable: true }
        turnStatus:
          allOf: [{ $ref: '#/components/schemas/ConversationTurnStatus' }]
          nullable: true
        waitingOn: { $ref: '#/components/schemas/ConversationWaitingOn' }
        waitingReason: { type: string, nullable: true }
        waitingSince: { type: string, format: date-time, nullable: true }
        failureClass:
          type: string
          nullable: true
          description: "The latest turn's failure, as `Conversation.failureClass`: a list tells a turn stopped at its time limit (`TIME_LIMIT`) from one that failed"
        turnCount: { type: integer, format: int32 }
        lastTurnAt: { type: string, format: date-time, nullable: true }
        costUsd:
          type: number
          nullable: true
          description: "What its settled turns cost, as `Conversation.cost.costUsd` counts it; null when spend is not read"
        tokens:
          allOf: [{ $ref: '#/components/schemas/ConversationTokens' }]
          nullable: true
          description: "Its settled turns' tokens, as `Conversation.cost.tokens` counts them; null when spend is not read"
        contentPurgedAt: { type: string, format: date-time, nullable: true, description: "Its content was removed under retention; the title shows the key" }
        erasedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ConversationTrigger:
      type: object
      description: "A trigger's conversation's trigger and author (the package 4 contract, §3.4, §5.7)"
      required: [triggerId, name, authorPrincipalId, chainDepth]
      properties:
        triggerId: { type: string, format: uuid }
        name: { type: string, description: "The trigger's name" }
        authorPrincipalId: { type: string, format: uuid, description: 'Whom its turns act for: the trigger''s author when it started' }
        authorName: { type: string, nullable: true }
        subjectKind: { type: string, nullable: true, enum: [ISSUE, CHANGE_REQUEST], description: "A tracker issue's kind" }
        dueAt: { type: string, format: date-time, nullable: true, description: "A schedule's firing: when it was due" }
        chainDepth: { type: integer, format: int32, description: "0, or the depth of a subject Tinfirm created (§5.6)" }
    ConversationPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ConversationSummary' }
        nextCursor: { type: string, nullable: true }
    ConversationPayer:
      type: object
      description: Who pays for the conversation, fixed at its start (I10)
      required: [principalId, modelAccess]
      properties:
        principalId: { type: string, format: uuid }
        name: { type: string, nullable: true }
        modelAccess: { $ref: '#/components/schemas/RunModelAccess' }
        subscriptionRunnerHostId: { type: string, format: uuid, nullable: true, description: "Null for the budget, and once the subscription's host was removed" }
        subscriptionLabel: { type: string, nullable: true }
    ConversationCost:
      type: object
      description: |
        What the conversation cost so far: the spend of its settled turns, as `getSpend` with its `conversationId`
        counts it over all time, within what the caller sees of spend (G1; a turn outside it counts nothing, as an
        unknown one). A turn's spend settles minutes after it ended, from LiteLLM's records, else the relay's count;
        until then the turn is not in `turns`, and its `usage.costUsd` is the runtime's estimate. A subscription's turn
        settles at once, with its tokens and no cost.
      required: [costUsd, tokens, subscriptionTokens, turns]
      properties:
        costUsd: { type: number, description: 'Of its GATEWAY and RELAY spend' }
        tokens:
          allOf: [{ $ref: '#/components/schemas/ConversationTokens' }]
          description: "Of all its settled turns, subscriptions' included"
        subscriptionTokens: { type: integer, format: int64, description: "Of those, the tokens of its subscriptions' turns, as their sandboxes reported them" }
        turns:
          type: array
          description: Its settled turns, each once
          items: { $ref: '#/components/schemas/ConversationTurnCost' }
    ConversationTokens:
      type: object
      description: "A conversation's tokens, as the spend records count them; the four add up to their total"
      required: [inputTokens, cacheWriteTokens, cachedInputTokens, outputTokens]
      properties:
        inputTokens: { type: integer, format: int64, description: Input tokens neither read from nor written to the prompt cache }
        cacheWriteTokens: { type: integer, format: int64, description: Input tokens written to the prompt cache }
        cachedInputTokens: { type: integer, format: int64, description: Input tokens read from the prompt cache }
        outputTokens: { type: integer, format: int64 }
    ConversationTurnCost:
      type: object
      description: "One settled turn's spend, all its models together"
      required: [runId, source]
      properties:
        runId: { type: string, format: uuid }
        costUsd:
          type: number
          nullable: true
          description: "Null for a subscription's turn, and for a RELAY turn whose models LiteLLM names no price for"
        source: { $ref: '#/components/schemas/SpendSource' }
    ConversationRepository:
      type: object
      description: A repository of the conversation's workspace (the package 3 contract, §5.6)
      required: [repositoryId, name, source, readOnly]
      properties:
        repositoryId: { type: string, format: uuid }
        systemId: { type: string, format: uuid, nullable: true }
        name: { type: string }
        url: { type: string, nullable: true }
        source: { type: string, enum: [AGENT, REQUESTED] }
        readOnly: { type: boolean }
        readOnlyCause:
          type: string
          nullable: true
          enum: [AGENT, GRANT, REQUEST]
          description: "Why it is read-only: the agent's access, the binding's read-only grant, or an approval that gave READ"
    ConversationMessage:
      type: object
      required: [id, kind, body, answersOpenQuestions, waiting, createdAt]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [PERSON, AGENT, SYSTEM, EXTERNAL], description: "EXTERNAL: a comment on a trigger's conversation's issue (the package 4 contract, §3.6)" }
        authorPrincipalId: { type: string, format: uuid, nullable: true }
        authorName: { type: string, nullable: true, description: "A member's name; an EXTERNAL comment's author's name at its system" }
        externalId: { type: string, nullable: true, description: "An EXTERNAL comment's id at its system" }
        body: { type: string, description: "Markdown; the removal marker once purged (`purgedAt`)" }
        purgedAt: { type: string, format: date-time, nullable: true, description: "When retention or an erasure removed the body" }
        answersOpenQuestions: { type: boolean }
        runId: { type: string, format: uuid, nullable: true, description: "The turn that took a person's message, or produced the agent's or Tinfirm's" }
        decisionId: { type: string, format: uuid, nullable: true }
        waiting: { type: boolean, description: "A person's message that waits for the next turn" }
        unanswered: { type: boolean, description: "A person's message that waited when its turn was cancelled or the conversation ended" }
        steering:
          type: string
          nullable: true
          enum: [SENDING, DELIVERED]
          description: "A person's message written while a turn ran, for that turn (steering): SENDING while it goes to the running agent (it still `waiting`), DELIVERED once the agent took it into that turn, after its step then (`runId` is the turn's run). Null for every other message, and for one the running agent could not take (its runtime has no steering, or the turn ended first), which waits for the next turn."
        createdAt: { type: string, format: date-time }
    ConversationStatus:
      type: object
      description: "A `conversation-status` event of a conversation's stream: its state and what it waits on, as `Conversation` says them"
      required: [id, state, waitingOn, turnCount]
      properties:
        id: { type: string, format: uuid }
        state: { $ref: '#/components/schemas/ConversationState' }
        endedReason:
          allOf: [{ $ref: '#/components/schemas/ConversationEndedReason' }]
          nullable: true
        turnStatus:
          allOf: [{ $ref: '#/components/schemas/ConversationTurnStatus' }]
          nullable: true
        waitingOn: { $ref: '#/components/schemas/ConversationWaitingOn' }
        waitingReason: { type: string, nullable: true }
        waitingSince: { type: string, format: date-time, nullable: true }
        activeRunId: { type: string, format: uuid, nullable: true, description: "Its active run, whose own stream has the turn's events" }
        turnCount: { type: integer, format: int32 }
    ConversationStreamPart:
      type: string
      enum: [STATUS, MESSAGES, TURNS, DECISIONS, BINDINGS, OUTPUTS, ATTACHMENTS, WORKSPACE]
      description: |
        What of a conversation changed: STATUS its state, what it waits on, its turn's status, its active run or its
        title; TURNS its runs (created, started, waiting for another reason, ended); WORKSPACE its workspace or its
        granted hosts; the others their lists
    ConversationChanged:
      type: object
      description: "A `conversation-changed` event of a conversation's stream: what one committed change changed"
      required: [parts]
      properties:
        parts:
          type: array
          items: { $ref: '#/components/schemas/ConversationStreamPart' }
    ConversationChat:
      type: object
      description: |
        Where a `CHAT_THREAD` conversation is held (the package 5 contract, §3.9): its chat system, the channel (a
        direct message's, on Slack; the bot's conversation, on Teams) and the thread, and a link that opens it there
      required: [systemId]
      properties:
        systemId: { type: string, format: uuid }
        systemName: { type: string, nullable: true, description: Null once the system was removed }
        systemKind:
          allOf: [{ $ref: '#/components/schemas/SystemKind' }]
          nullable: true
        channelId: { type: string, nullable: true, description: "Slack's channel; Teams' conversation" }
        threadId: { type: string, nullable: true, description: "Slack's thread, its first message's `ts`" }
        permalink:
          type: string
          nullable: true
          description: |
            Opens it in the chat ("Open in Slack", "Open in Teams"): Slack's `app_redirect` to the channel in the
            workspace, Teams' chat with the bot; null when the chat named too little for one
    ConversationBindingChoice:
      type: object
      required: [grantId, access]
      properties:
        grantId: { type: string, format: uuid }
        groupId: { type: string, format: uuid, nullable: true }
        groupName: { type: string, nullable: true }
        credentialName: { type: string, nullable: true, description: The credential it lends }
        access: { $ref: '#/components/schemas/AgentRepositoryAccess' }
    ConversationBinding:
      type: object
      description: |
        What the conversation acts with on one system (the package 3 contract, §3.9, §5.3): its person's or its
        trigger's author's own account, a system's credential through a grant or a trigger's service account
        (ADR-0072), or nothing on an MCP server that needs no account (ADR-0071); bound once, at the system's first
        use, and checked at every use. `WAITING` is a card the person (or an admin) acts on; `GONE` is
        final.
      required: [id, systemId, state, text, choices]
      properties:
        id: { type: string, format: uuid }
        systemId: { type: string, format: uuid }
        systemName: { type: string, nullable: true, description: Null once the system was removed }
        systemKind:
          allOf: [{ $ref: '#/components/schemas/SystemKind' }]
          nullable: true
        state: { type: string, enum: [BOUND, WAITING, GONE] }
        how:
          type: string
          nullable: true
          enum: [OWN, GRANTED, CHOSEN, FIXED, OPEN]
          description: "FIXED: a trigger's conversation, which binds the trigger's account table when it starts (package 4). OPEN: an MCP server that needs no account (ADR-0071), called without one; no holder or grant"
        reason:
          type: string
          nullable: true
          description: "Package 4 adds NOT_ENTITLED (waits: the trigger's author lost the right to the service account, or it no longer borrows the credential) and ACCOUNT_REMOVED (gone: a reassigned trigger's new table has no account on the system)"
          enum: [NONE, RECONNECT_YOURS, RECONNECT_COMPANY, CHOOSE, PICK_GRANT, SUSPENDED, SYSTEM_OFF, NOT_ENTITLED, GRANT_REMOVED, LEFT_GROUP, IDENTITY_CHANGED, HOLDER_LEFT, SYSTEM_REMOVED, ACCOUNT_REMOVED]
        holderPrincipalId: { type: string, format: uuid, nullable: true, description: "Whom it acts through, once bound: the person (OWN), a trigger's author or service account (FIXED); null through a grant, which lends a system's credential (ADR-0072)" }
        credentialName: { type: string, nullable: true, description: "The system's credential it acts with (GRANTED, CHOSEN, a service account's FIXED)" }
        credentialKind:
          type: string
          nullable: true
          enum: [TOKEN, OAUTH, CLIENT]
          description: "That credential's kind: an admin stores a new token, or signs it in again"
        credentialEnabled:
          type: boolean
          nullable: true
          description: "Whether that credential is enabled: a disabled one waits `RECONNECT_COMPANY` until an admin enables it"
        holderName: { type: string, nullable: true, description: "The holder's name (a member's display name, a service account's own), the person's too (OWN), for the reader's own words" }
        holderKind:
          type: string
          nullable: true
          enum: [MEMBER, SERVICE]
          description: "The holder's kind: a member (the person's own account; a trigger's author's), or a service account that borrows the credential"
        grantId: { type: string, format: uuid, nullable: true }
        groupId: { type: string, format: uuid, nullable: true }
        groupName: { type: string, nullable: true }
        access:
          allOf: [{ $ref: '#/components/schemas/AgentRepositoryAccess' }]
          nullable: true
          description: "WRITE for one's own account; the grant's access now, or a trigger's service account's lending's"
        text:
          type: string
          description: |
            How the conversation uses the system, in words written for its person ("GitHub: your own account",
            "GitHub: via Analysts, read-only"); another reader words it from `state`, `how`, `reason`, the holder, the
            group and `access`, with the conversation's `personName`
        runId:
          type: string
          format: uuid
          nullable: true
          description: |
            The run whose tool call or workspace first asked for it, where the page places its card; null when no run
            did (a trigger's FIXED bindings, made at its start, and bindings made before migration V032 added the column)
        turnNumber: { type: integer, format: int32, nullable: true, description: "That run's turn number in the conversation" }
        choices:
          type: array
          items: { $ref: '#/components/schemas/ConversationBindingChoice' }
        waitingSince: { type: string, format: date-time, nullable: true }
        boundAt: { type: string, format: date-time, nullable: true }
    Output:
      type: object
      description: |
        What a conversation produced (the package 3 contract, §3.13): a change request the server opened after a turn
        pushed (§5.4), a document its agent saved (with `save_artifact`, or left in `/output`; its file is the
        attachment `attachmentId`), or a link its agent saved.
      required: [id, conversationId, kind, title, createdAt]
      properties:
        id: { type: string, format: uuid }
        conversationId: { type: string, format: uuid }
        runId: { type: string, format: uuid, nullable: true, description: The turn that produced it }
        kind: { type: string, enum: [CHANGE_REQUEST, DOCUMENT, LINK] }
        title: { type: string, description: "Empty once purged (`purgedAt`)" }
        purgedAt: { type: string, format: date-time, nullable: true }
        url: { type: string, nullable: true, description: A link's or a change request's }
        attachmentId: { type: string, format: uuid, nullable: true, description: A document's file }
        repositoryId:
          type: string
          format: uuid
          nullable: true
          description: A change request's repository; null once the repository was removed
        repositoryName: { type: string, nullable: true, description: That repository's name while it exists }
        externalNumber: { type: string, nullable: true, description: "A change request's number: #12, !4 without the sign" }
        changeRequestState:
          type: string
          nullable: true
          enum: [OPEN, DRAFT, MERGED, CLOSED, UNKNOWN]
          description: A change request's state as last read from its code host
        createdAt: { type: string, format: date-time }
    Conversation:
      type: object
      description: |
        A conversation in full (the package 3 contract, §3.8, §6): its messages oldest first, its turns, decisions,
        outputs, attachments, bindings, workspace, network hosts, who pays and what it cost.
      required: [id, key, title, agentId, agentName, place, origin, runtime, payer, state, waitingOn, turnCount, seenByOwner, workspace, grantedHosts, bindings, messages, turns, decisions, outputs, attachments, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        key: { type: string }
        title: { type: string }
        agentId: { type: string, format: uuid }
        agentName: { type: string }
        personPrincipalId: { type: string, format: uuid, nullable: true, description: "Its person; null for a trigger's conversation" }
        personName: { type: string, nullable: true }
        trigger:
          allOf: [{ $ref: '#/components/schemas/ConversationTrigger' }]
          nullable: true
          description: "A trigger's conversation: its trigger and author (the package 4 contract, §3.4); null for a personal one"
        place: { type: string, enum: [TINFIRM_THREAD, CHAT_THREAD, TRACKER_ISSUE, SCHEDULE, WEBHOOK] }
        chat:
          allOf: [{ $ref: '#/components/schemas/ConversationChat' }]
          nullable: true
          description: A `CHAT_THREAD` conversation's place in its chat, to whoever sees the conversation; null otherwise
        origin: { type: string, enum: [APP, CLIENT, DIRECT_MESSAGE, TRIGGER] }
        subject:
          allOf: [{ $ref: '#/components/schemas/ConversationSubject' }]
          nullable: true
        runtime: { $ref: '#/components/schemas/AgentRuntime' }
        payer: { $ref: '#/components/schemas/ConversationPayer' }
        cost:
          allOf: [{ $ref: '#/components/schemas/ConversationCost' }]
          nullable: true
          description: What its settled turns cost; null when spend is not read
        branch: { type: string, description: 'The branch of its turns in every repository: `agent/{key}`' }
        state: { $ref: '#/components/schemas/ConversationState' }
        endedReason:
          allOf: [{ $ref: '#/components/schemas/ConversationEndedReason' }]
          nullable: true
        endedAt: { type: string, format: date-time, nullable: true }
        turnStatus:
          allOf: [{ $ref: '#/components/schemas/ConversationTurnStatus' }]
          nullable: true
        waitingOn: { $ref: '#/components/schemas/ConversationWaitingOn' }
        waitingReason: { type: string, nullable: true }
        waitingSince: { type: string, format: date-time, nullable: true }
        waitingGroupId:
          type: string
          format: uuid
          nullable: true
          description: |
            While it waits on PERSON for a decision a group holds (a trigger's team's approval or review): the group,
            whose members decide it, so that the page says "Waits for Analysts · Review"; null otherwise
        waitingGroupName: { type: string, nullable: true }
        mayPost:
          type: boolean
          description: |
            Whether the caller may post a plain message now, as `postConversationMessage` checks it: one of its people
            (its person; a trigger's author or a member of its team, whatever their role) while it is open, where its
            place is Tinfirm (not a tracker's issue or a chat's thread)
        mayAnswer:
          type: boolean
          description: |
            Whether the caller may post a message that answers the agent's open questions (`answersOpenQuestions`):
            as `mayPost`, and on a tracker's issue or in a chat's thread too while a question is open
        turnCount: { type: integer, format: int32 }
        activeRunId: { type: string, format: uuid, nullable: true }
        lastTurnAt: { type: string, format: date-time, nullable: true }
        result:
          allOf: [{ $ref: '#/components/schemas/RunResult' }]
          nullable: true
          description: "The latest turn's result"
        failureClass: { type: string, nullable: true, description: "The latest turn's failure" }
        failureCause: { type: string, nullable: true }
        seenByOwner:
          type: boolean
          description: |
            Always true: the company's OWNER sees every conversation in full (§5.10), and an instance admin acting in
            the company too. Each such read of another person's conversation is audited (`conversation.read`). The app
            must show the person a standing notice on their conversations, not a one-time hint, saying that the
            company's owners can read them in full and that every such read is recorded in the audit log.
        contentPurgedAt:
          type: string
          format: date-time
          nullable: true
          description: "Its content was removed on this date under the company's retention; the title shows the key"
        erasedAt: { type: string, format: date-time, nullable: true, description: "Its content was erased on request on this date" }
        workspace:
          type: array
          items: { $ref: '#/components/schemas/ConversationRepository' }
        grantedHosts:
          type: array
          items: { type: string }
          description: Network hosts approved requests gave this conversation
        hosts:
          type: array
          items: { type: string }
          description: "The network hosts its next turn may reach: the agent's, as the person accepted it, and the granted ones"
        bindings:
          type: array
          items: { $ref: '#/components/schemas/ConversationBinding' }
        messages:
          type: array
          items: { $ref: '#/components/schemas/ConversationMessage' }
        turns:
          type: array
          items: { $ref: '#/components/schemas/Run' }
        decisions:
          type: array
          items: { $ref: '#/components/schemas/Decision' }
        outputs:
          type: array
          items: { $ref: '#/components/schemas/Output' }
        attachments:
          type: array
          items: { $ref: '#/components/schemas/Attachment' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Subject:
      type: object
      required: [key, conversations, open]
      properties:
        systemId: { type: string, format: uuid, nullable: true }
        systemName: { type: string, nullable: true }
        key: { type: string }
        title: { type: string, nullable: true }
        url: { type: string, nullable: true }
        conversations: { type: integer, format: int32, description: The conversations about it the caller sees }
        open: { type: integer, format: int32, description: 'Of them, the open ones' }
        lastActivityAt: { type: string, format: date-time, nullable: true }
    SubjectPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Subject' }
        nextCursor: { type: string, nullable: true }
    TriggerSource:
      type: string
      enum: [TRACKER, SCHEDULE, CHANNEL, WEBHOOK]
      description: "TRACKER: a company system of kind JIRA_DC, JIRA_CLOUD, GITHUB or GITLAB, polled with the source account; SCHEDULE: a cron, without a system; CHANNEL: mentions of a SLACK or TEAMS system's bot in the trigger's channels (package 5); WEBHOOK: a WEBHOOK system's deliveries (package 5)"
    TriggerEvent:
      type: string
      enum: [CREATED, UPDATED, STATUS_ENTERED, LABEL_ADDED, LABEL_REMOVED, ASSIGNED, MENTIONED, COMMENTED, CHANGE_REQUEST_OPENED, CHANGE_REQUEST_UPDATED, CLOSED, SCHEDULE, DELIVERED]
      description: "What happens to a subject (the package 4 contract, §5.5; ADR-0043); SCHEDULE is a schedule's firing; MENTIONED is also a channel trigger's one event (the bot mentioned in its channel); DELIVERED a webhook's delivery, its value the mapped event"
    TriggerEventSpec:
      type: object
      required: [event]
      properties:
        event: { $ref: '#/components/schemas/TriggerEvent' }
        value: { type: string, nullable: true, maxLength: 255, description: 'The status or label of STATUS_ENTERED, LABEL_ADDED, LABEL_REMOVED' }
    TriggerSubject:
      type: string
      enum: [ANY, ISSUE, CHANGE_REQUEST]
    TriggerRepeat:
      type: string
      enum: [ONCE, EVERY_TIME]
    TriggerConditionGroup:
      type: object
      description: One group of conditions; the trigger fires when any group holds, and a group holds when all its clauses do (ADR-0043)
      properties:
        statuses: { type: array, maxItems: 10, items: { type: string, maxLength: 255 } }
        notStatuses: { type: array, maxItems: 10, items: { type: string, maxLength: 255 } }
        labels: { type: array, maxItems: 10, items: { type: string, maxLength: 255 } }
        notLabels: { type: array, maxItems: 10, items: { type: string, maxLength: 255 } }
        types: { type: array, maxItems: 10, items: { type: string, maxLength: 255 } }
        notTypes: { type: array, maxItems: 10, items: { type: string, maxLength: 255 } }
        authors:
          type: string
          nullable: true
          enum: [PEOPLE, TINFIRM]
          description: "Who made the subject: people, or Tinfirm (a subject a conversation created); null: anyone"
    TriggerScheduleInput:
      type: object
      required: [cron, zone]
      properties:
        cron: { type: string, maxLength: 100, description: 'Five fields, at most every 15 minutes' }
        zone: { type: string, maxLength: 64, description: 'An IANA time zone, e.g. Europe/Prague' }
        overlap: { type: string, enum: [SKIP, CREATE], default: SKIP }
        catchUp: { type: string, enum: [NONE, ONE], default: NONE }
    TriggerSchedule:
      type: object
      required: [cron, zone, overlap, catchUp, nextFirings]
      properties:
        cron: { type: string }
        zone: { type: string }
        overlap: { type: string, enum: [SKIP, CREATE] }
        catchUp: { type: string, enum: [NONE, ONE] }
        nextRunAt: { type: string, format: date-time, nullable: true }
        lastRunAt: { type: string, format: date-time, nullable: true }
        lastOutcome:
          allOf: [{ $ref: '#/components/schemas/TriggerFiringOutcome' }]
          nullable: true
        nextFirings:
          type: array
          items: { type: string, format: date-time }
          description: The next three firings after now
    TriggerAction:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [TRANSITION, ATTACH_DOCUMENTS, LABEL_ADD, LABEL_REMOVE, CLOSE]
          description: "Jira: TRANSITION, ATTACH_DOCUMENTS; GitHub and GitLab: LABEL_ADD, LABEL_REMOVE, CLOSE"
        value: { type: string, nullable: true, maxLength: 255 }
    TriggerResults:
      type: object
      required: [comment, review, onSuccess, onFailure]
      properties:
        comment: { type: boolean, description: "Whether results and failures are written to the issue as comments" }
        review: { type: boolean, description: "Whether the team reviews a result before anything of it is written" }
        onSuccess: { type: array, maxItems: 10, items: { $ref: '#/components/schemas/TriggerAction' } }
        onFailure: { type: array, maxItems: 10, items: { $ref: '#/components/schemas/TriggerAction' } }
    TriggerStatus:
      type: string
      enum: [ACTIVE, PAUSED]
    TriggerPausedReason:
      type: string
      enum: [USER, AUTHOR_LEFT, NOT_ENTITLED, ACCOUNT_REMOVED, SYSTEM_REMOVED, ACCOUNT_BROKEN, SYSTEM_PAUSED, TO_ACCEPT]
      description: |
        `NOT_ENTITLED` includes an author who holds no seat (a Viewer authors no trigger). `TO_ACCEPT`: an admin
        reassigned it after its author's loss, and it waits for its new author to accept it (`acceptTriggerWidening`),
        which resumes it
    TriggerWaitingReason:
      type: string
      enum: [RECONNECT_YOURS, RECONNECT_COMPANY, SUSPENDED, SYSTEM_UNREACHABLE, SCOPE_UNREADABLE, GATEWAY_NOT_CONFIGURED, COMPANY_STOPPED, BOT_MISSING, BOT_RECONNECT, BOT_SUSPENDED, CHANNEL_UNAVAILABLE]
      description: "BOT_MISSING, BOT_RECONNECT, BOT_SUSPENDED: a channel trigger waits on its chat system's bot and goes on by itself once it can be used (package 5, open point 21); CHANNEL_UNAVAILABLE: every channel of the trigger is unavailable"
    TriggerFiringOutcome:
      type: string
      enum: [STARTED, CONTINUED, SKIPPED_OPEN, SKIPPED_MISSED, SKIPPED_CHAIN, SKIPPED_RATE, SKIPPED_AGENT_PAUSED, FAILED]
    TriggerAccountInput:
      type: object
      required: [systemId, accountId]
      properties:
        systemId: { type: string, format: uuid }
        accountId:
          type: string
          format: uuid
          description: "The author's own account on the system, or the credential a service account the author may use borrows there"
        holderPrincipalId:
          type: string
          format: uuid
          nullable: true
          description: "Whom the row acts through: the service account that borrows the credential, which may be left out when exactly one the author may use borrows it; the author for their own account, by default (ADR-0072)"
    TriggerAccount:
      type: object
      required: [systemId, holderPrincipalId, filledFrom, status]
      properties:
        systemId: { type: string, format: uuid }
        systemName: { type: string, nullable: true }
        accountId: { type: string, format: uuid, nullable: true, description: 'Null once the account went: the trigger is paused until another is named' }
        holderPrincipalId: { type: string, format: uuid }
        holderName: { type: string, nullable: true }
        holderKind: { type: string, enum: [MEMBER, SERVICE] }
        credentialName: { type: string, nullable: true, description: "The credential's name, when the row acts through a service account" }
        externalLogin: { type: string, nullable: true, description: "The account's login at the system" }
        access:
          allOf: [{ $ref: '#/components/schemas/AccountAccess' }]
          nullable: true
          description: |
            What the row may do there now: `WRITE` with the author's own account, a service account's credential at
            the access it is lent with (a `READ` one refuses every write tool); null without an account
        filledFrom: { type: string, enum: [CHOICE, ROW] }
        status:
          type: string
          enum: [OK, RECONNECT_YOURS, RECONNECT_COMPANY, SUSPENDED, NOT_ENTITLED, ACCOUNT_REMOVED]
          description: "Whether the trigger's conversations can bind the row now (Accounts.bind(Trigger))"
    TriggerPayer:
      type: object
      description: Who pays for the trigger's runs. `modelAccess` is `SUBSCRIPTION` only where the company allows a trigger to pay with its author's subscription (ADR-0085, decision 7).
      required: [principalId, modelAccess, state]
      properties:
        principalId: { type: string, format: uuid }
        name: { type: string, nullable: true }
        kind: { type: string, enum: [MEMBER, SERVICE] }
        modelAccess: { $ref: '#/components/schemas/RunModelAccess' }
        state:
          type: string
          enum: [READY, WAITING, REFUSED]
          description: "As ModelAccess.forRun answers for the payer, the settings' model access and runtime"
        reason: { type: string, nullable: true }
        detail: { type: string, nullable: true }
        until: { type: string, format: date-time, nullable: true, description: The reset of a spent budget }
        models:
          type: array
          nullable: true
          items: { type: string }
          description: |
            The models the principal's key may use, as `getMyModelAccess` answers them (empty allows every model the
            gateway serves), for the editor's model field; in the choices (`getTriggerChoices`) only, null elsewhere
    TriggerRights:
      type: object
      required: [edits, runs, pauses, resumes, deletes, reassigns]
      description: What the caller may do with the trigger (§5.1, §11)
      properties:
        edits: { type: boolean, description: "Its author; OWNER and ADMIN on the author's behalf" }
        runs: { type: boolean }
        pauses: { type: boolean }
        resumes: { type: boolean }
        deletes: { type: boolean }
        reassigns: { type: boolean }
    TriggerSummary:
      type: object
      required: [id, name, sentence, source, agentId, status, authorPrincipalId, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        sentence: { type: string, description: 'The trigger as one sentence' }
        source: { $ref: '#/components/schemas/TriggerSource' }
        systemId: { type: string, format: uuid, nullable: true }
        systemName: { type: string, nullable: true }
        agentId: { type: string, format: uuid }
        agentName: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/TriggerStatus' }
        pausedReason:
          allOf: [{ $ref: '#/components/schemas/TriggerPausedReason' }]
          nullable: true
        waitingReason:
          allOf: [{ $ref: '#/components/schemas/TriggerWaitingReason' }]
          nullable: true
        authorPrincipalId: { type: string, format: uuid }
        authorName: { type: string, nullable: true }
        teamGroupId: { type: string, format: uuid, nullable: true }
        teamName: { type: string, nullable: true }
        payerPrincipalId: { type: string, format: uuid, nullable: true }
        payerName: { type: string, nullable: true }
        lastFiring:
          allOf: [{ $ref: '#/components/schemas/TriggerFiring' }]
          nullable: true
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    TriggerPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/TriggerSummary' }
        nextCursor: { type: string, nullable: true }
    Trigger:
      type: object
      description: A trigger in full (the package 4 contract, §3.1, §6)
      required: [id, name, sentence, source, events, subject, conditions, repeat, agentId, acceptedVersion, currentVersion, wideningPending, instruction, authorPrincipalId, results, maxFiringsPerHour, status, armedAt, missedCount, rateSkippedCount, accounts, unavailableSystems, noAccountSystems, rights, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        sentence: { type: string }
        source: { $ref: '#/components/schemas/TriggerSource' }
        systemId: { type: string, format: uuid, nullable: true }
        systemName: { type: string, nullable: true }
        events:
          type: array
          items: { $ref: '#/components/schemas/TriggerEventSpec' }
        subject: { $ref: '#/components/schemas/TriggerSubject' }
        scope: { type: string, nullable: true }
        conditions:
          type: array
          items: { $ref: '#/components/schemas/TriggerConditionGroup' }
        repeat: { $ref: '#/components/schemas/TriggerRepeat' }
        schedule:
          allOf: [{ $ref: '#/components/schemas/TriggerSchedule' }]
          nullable: true
        agentId: { type: string, format: uuid }
        agentName: { type: string, nullable: true }
        acceptedVersion: { type: integer, format: int32, description: "The agent's version the author accepted for the trigger" }
        currentVersion: { type: integer, format: int32 }
        wideningPending: { type: boolean }
        instruction: { type: string }
        authorPrincipalId: { type: string, format: uuid }
        authorName: { type: string, nullable: true }
        teamGroupId: { type: string, format: uuid, nullable: true }
        teamName: { type: string, nullable: true }
        payer:
          allOf: [{ $ref: '#/components/schemas/TriggerPayer' }]
          nullable: true
        results: { $ref: '#/components/schemas/TriggerResults' }
        maxFiringsPerHour: { type: integer, format: int32 }
        status: { $ref: '#/components/schemas/TriggerStatus' }
        pausedReason:
          allOf: [{ $ref: '#/components/schemas/TriggerPausedReason' }]
          nullable: true
        pausedAt: { type: string, format: date-time, nullable: true }
        waitingReason:
          allOf: [{ $ref: '#/components/schemas/TriggerWaitingReason' }]
          nullable: true
        waitingSince: { type: string, format: date-time, nullable: true }
        armedAt: { type: string, format: date-time, description: 'A change before it fires nothing' }
        missedCount: { type: integer, format: int32 }
        rateSkippedCount: { type: integer, format: int32 }
        openEventsAcknowledgedAt: { type: string, format: date-time, nullable: true }
        accounts:
          type: array
          items: { $ref: '#/components/schemas/TriggerAccount' }
        channels:
          type: array
          items: { $ref: '#/components/schemas/TriggerChannel' }
          description: "A CHANNEL trigger's channels; none for another source"
        webhookConditions:
          type: array
          items: { $ref: '#/components/schemas/WebhookCondition' }
          description: "A WEBHOOK trigger's conditions on the raw body, all of which hold; none for another source"
        unavailableSystems:
          type: array
          items: { $ref: '#/components/schemas/TriggerSystemRef' }
          description: "The agent's systems without a row: not available to the trigger's runs. An MCP server that needs no account is never one (noAccountSystems)"
        noAccountSystems:
          type: array
          items: { $ref: '#/components/schemas/TriggerSystemRef' }
          description: "The agent's MCP servers without a row that need no account (ADR-0071): the trigger's runs call them without one"
        openConversations: { type: integer, format: int32 }
        lastFiring:
          allOf: [{ $ref: '#/components/schemas/TriggerFiring' }]
          nullable: true
        rights: { $ref: '#/components/schemas/TriggerRights' }
        deletedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    TriggerChannel:
      type: object
      description: A channel of a CHANNEL trigger (package 5, §3.10)
      required: [channelId, default, state]
      properties:
        channelId: { type: string, description: "The channel's id at the platform: Slack's C…, a Teams channel's conversation id" }
        name: { type: string, nullable: true }
        default: { type: boolean, description: 'Whether a mention without a handle goes to this trigger' }
        state: { type: string, enum: [ACTIVE, UNAVAILABLE], description: 'UNAVAILABLE while the bot is out of the channel, or it is archived, deleted or shared' }
    WebhookCondition:
      type: object
      required: [pointer, op]
      description: A condition on a webhook delivery's raw body (package 5, §5.12)
      properties:
        pointer: { type: string, maxLength: 500, description: 'A JSON Pointer (RFC 6901), e.g. /issue/fields/priority' }
        op:
          type: string
          enum: [EQUALS, IN, PRESENT, ABSENT]
          description: "EQUALS: the value read as text is values[0]; IN: one of values; PRESENT, ABSENT: whether the pointer reads a value"
        values:
          type: array
          maxItems: 20
          items: { type: string, maxLength: 500 }
    TriggerChannelInput:
      type: object
      required: [channelId]
      properties:
        channelId: { type: string, maxLength: 255 }
        default: { type: boolean, default: false }
    TriggerSystemRef:
      type: object
      required: [systemId]
      properties:
        systemId: { type: string, format: uuid }
        systemName: { type: string, nullable: true }
    TriggerCreateRequest:
      type: object
      required: [name, source, agentId, agentVersion, instruction, accounts, payerPrincipalId]
      properties:
        name: { type: string, maxLength: 100 }
        source: { $ref: '#/components/schemas/TriggerSource' }
        systemId: { type: string, format: uuid, nullable: true, description: "A TRACKER's, CHANNEL's or WEBHOOK's system" }
        channels:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/TriggerChannelInput' }
          description: "A CHANNEL trigger's 1 to 20 channels, each one the bot is in and its author a member of"
        webhookConditions:
          type: array
          maxItems: 5
          items: { $ref: '#/components/schemas/WebhookCondition' }
          description: "A WEBHOOK trigger's conditions on the raw body, all of which must hold"
        events:
          type: array
          maxItems: 5
          items: { $ref: '#/components/schemas/TriggerEventSpec' }
        subject: { $ref: '#/components/schemas/TriggerSubject' }
        scope: { type: string, nullable: true, maxLength: 140 }
        conditions:
          type: array
          maxItems: 5
          items: { $ref: '#/components/schemas/TriggerConditionGroup' }
        repeat: { $ref: '#/components/schemas/TriggerRepeat' }
        schedule:
          allOf: [{ $ref: '#/components/schemas/TriggerScheduleInput' }]
          nullable: true
        agentId: { type: string, format: uuid }
        agentVersion: { type: integer, format: int32, minimum: 1, description: "The agent's version the editor showed: accepted for the trigger" }
        instruction: { type: string, maxLength: 20000 }
        accounts:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/TriggerAccountInput' }
        payerPrincipalId: { type: string, format: uuid, description: 'The author, or a service identity the author may use' }
        settings:
          allOf: [{ $ref: '#/components/schemas/AgentSettingsRequest' }]
          nullable: true
        teamGroupId: { type: string, format: uuid, nullable: true }
        results:
          allOf: [{ $ref: '#/components/schemas/TriggerResults' }]
          nullable: true
        maxFiringsPerHour: { type: integer, format: int32, nullable: true, minimum: 1 }
        acknowledgeOpenEvents: { type: boolean, default: false }
    TriggerUpdateRequest:
      type: object
      description: Absent fields stay
      properties:
        name: { type: string, nullable: true, maxLength: 100 }
        instruction: { type: string, nullable: true, maxLength: 20000 }
        events:
          type: array
          nullable: true
          maxItems: 5
          items: { $ref: '#/components/schemas/TriggerEventSpec' }
        subject:
          allOf: [{ $ref: '#/components/schemas/TriggerSubject' }]
          nullable: true
        scope: { type: string, nullable: true, maxLength: 140, description: 'A blank scope clears it' }
        conditions:
          type: array
          nullable: true
          maxItems: 5
          items: { $ref: '#/components/schemas/TriggerConditionGroup' }
        repeat:
          allOf: [{ $ref: '#/components/schemas/TriggerRepeat' }]
          nullable: true
        schedule:
          allOf: [{ $ref: '#/components/schemas/TriggerScheduleInput' }]
          nullable: true
        teamGroupId: { type: string, format: uuid, nullable: true }
        clearTeam: { type: boolean, default: false, description: 'The author alone, without a team' }
        channels:
          type: array
          nullable: true
          maxItems: 20
          items: { $ref: '#/components/schemas/TriggerChannelInput' }
          description: "A CHANNEL trigger's channels, replaced as a whole; absent: they stay"
        webhookConditions:
          type: array
          nullable: true
          maxItems: 5
          items: { $ref: '#/components/schemas/WebhookCondition' }
          description: "A WEBHOOK trigger's conditions, replaced as a whole; absent: they stay"
        results:
          allOf: [{ $ref: '#/components/schemas/TriggerResults' }]
          nullable: true
        maxFiringsPerHour: { type: integer, format: int32, nullable: true, minimum: 1 }
        acknowledgeOpenEvents: { type: boolean, default: false }
    TriggerAccountsRequest:
      type: object
      required: [accounts, payerPrincipalId]
      properties:
        accounts:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/TriggerAccountInput' }
        payerPrincipalId: { type: string, format: uuid }
        acknowledgeOpenEvents: { type: boolean, default: false }
    TriggerPreviewRequest:
      type: object
      required: [draft]
      properties:
        triggerId: { type: string, format: uuid, nullable: true, description: 'A change of this trigger; null for a new one' }
        draft: { $ref: '#/components/schemas/TriggerCreateRequest' }
    TriggerPreviewAccount:
      type: object
      required: [systemId, status]
      properties:
        systemId: { type: string, format: uuid }
        systemName: { type: string, nullable: true }
        accountId: { type: string, format: uuid, nullable: true }
        holderPrincipalId: { type: string, format: uuid, nullable: true }
        holderName: { type: string, nullable: true }
        holderKind: { type: string, nullable: true, enum: [MEMBER, SERVICE] }
        credentialName: { type: string, nullable: true, description: "The credential's name, when the row acts through a service account" }
        externalLogin: { type: string, nullable: true }
        access:
          allOf: [{ $ref: '#/components/schemas/AccountAccess' }]
          nullable: true
          description: As `TriggerAccount.access`
        status:
          type: string
          enum: [OK, RECONNECT_YOURS, RECONNECT_COMPANY, NOT_ENTITLED]
    TriggerOpenWrite:
      type: object
      required: [systemId, tool]
      properties:
        systemId: { type: string, format: uuid }
        systemName: { type: string, nullable: true }
        tool: { type: string }
        holderName: { type: string, nullable: true, description: 'Whose account it would act as' }
        own: { type: boolean, description: "Whether it is the author's own account; else a credential lent to a service account, whose lender is told" }
    TriggerOpenToAnyone:
      type: object
      required: [who, writes, acknowledgementNeeded]
      description: Who can drive the trigger, and what then runs without approval (§5.8)
      properties:
        who: { type: string, description: 'E.g. "anyone who may comment on issues in SHOP"' }
        writes:
          type: array
          items: { $ref: '#/components/schemas/TriggerOpenWrite' }
        acknowledgementNeeded: { type: boolean, description: "An ALLOW write tool remains, with the author's own account or a lent credential (D2)" }
        acknowledgementMissing:
          type: boolean
          description: |
            The preview's: the acknowledgement is needed and neither the draft (`acknowledgeOpenEvents`) nor the
            trigger before gave it, so the save would refuse with 400 OPEN_EVENTS_NOT_ACKNOWLEDGED
    TriggerHostCheck:
      type: object
      required: [runnable, eligible]
      properties:
        runnable: { type: boolean }
        eligible: { type: integer, format: int32 }
        reason: { type: string, nullable: true }
    TriggerPreview:
      type: object
      required: [accounts, unavailableSystems, noAccountSystems, payer, hosts, sentence, nextFirings]
      properties:
        accounts:
          type: array
          items: { $ref: '#/components/schemas/TriggerPreviewAccount' }
        unavailableSystems:
          type: array
          items: { $ref: '#/components/schemas/TriggerSystemRef' }
        noAccountSystems:
          type: array
          items: { $ref: '#/components/schemas/TriggerSystemRef' }
          description: "The agent's MCP servers without a row that need no account (ADR-0071), as on the trigger"
        payer: { $ref: '#/components/schemas/TriggerPayer' }
        hosts: { $ref: '#/components/schemas/TriggerHostCheck' }
        sentence: { type: string }
        openToAnyone:
          allOf: [{ $ref: '#/components/schemas/TriggerOpenToAnyone' }]
          nullable: true
        nextFirings:
          type: array
          items: { type: string, format: date-time }
        openConversationsKeepingAccounts: { type: integer, format: int32, nullable: true }
        warnings:
          type: array
          items: { type: string }
          description: "What the editor warns of, in words: a WEBHOOK trigger's echoes (package 5, §5.12); the open events' acknowledgement the save would ask for"
    TriggerChoiceSystem:
      type: object
      required: [systemId, status]
      properties:
        systemId: { type: string, format: uuid }
        systemName: { type: string, nullable: true }
        accountId: { type: string, format: uuid, nullable: true, description: "The member's own account, or the credential the service account borrows" }
        credentialName: { type: string, nullable: true, description: "The credential's name, for a service account" }
        externalLogin: { type: string, nullable: true }
        access:
          allOf: [{ $ref: '#/components/schemas/AccountAccess' }]
          nullable: true
          description: "`WRITE` for the member's own account, the access the credential is lent with; null without one"
        status:
          type: string
          enum: [OK, RECONNECT, NONE, NOT_NEEDED]
          description: "OK: the principal's account (a service account's credential) fills the row; RECONNECT: it needs a sign-in, or the credential is disabled; NONE: no account, the system is left unavailable; NOT_NEEDED: an MCP server that needs no account (ADR-0071), which the trigger's runs call without one and which takes no row"
    TriggerChoice:
      type: object
      required: [principalId, kind, systems, budget]
      properties:
        principalId: { type: string, format: uuid }
        name: { type: string, nullable: true }
        kind: { type: string, enum: [MEMBER, SERVICE] }
        systems:
          type: array
          items: { $ref: '#/components/schemas/TriggerChoiceSystem' }
        budget: { $ref: '#/components/schemas/TriggerPayer' }
    TriggerChoices:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/TriggerChoice' }
    TriggerPauseRequest:
      type: object
      properties:
        stopRunning: { type: boolean, default: false, description: "Cancel its conversations' active turns too" }
    TriggerRunRequest:
      type: object
      properties:
        subjectKey: { type: string, nullable: true, maxLength: 255, description: "A tracker trigger's subject; none for a schedule" }
    TriggerReassignRequest:
      type: object
      required: [authorPrincipalId]
      properties:
        authorPrincipalId: { type: string, format: uuid, description: "The new author: a member's principal who uses the agent" }
        accounts:
          type: array
          nullable: true
          maxItems: 100
          items: { $ref: '#/components/schemas/TriggerAccountInput' }
          description: "The new table; null keeps the rows that pass for the new author"
        payerPrincipalId: { type: string, format: uuid, nullable: true, description: 'Null keeps the payer when it passes for the new author' }
    TriggerFiring:
      type: object
      required: [id, triggerId, event, once, outcome, chainDepth, createdAt]
      properties:
        id: { type: string, format: uuid }
        triggerId: { type: string, format: uuid }
        subjectKey: { type: string, nullable: true }
        event: { $ref: '#/components/schemas/TriggerEvent' }
        value: { type: string, nullable: true }
        changedAt: { type: string, format: date-time, nullable: true }
        dueAt: { type: string, format: date-time, nullable: true }
        manualBy: { type: string, format: uuid, nullable: true, description: 'Run now: the user' }
        once: { type: boolean }
        outcome: { $ref: '#/components/schemas/TriggerFiringOutcome' }
        reason: { type: string, nullable: true }
        chainDepth: { type: integer, format: int32 }
        conversationId: { type: string, format: uuid, nullable: true }
        runId: { type: string, format: uuid, nullable: true }
        createdAt: { type: string, format: date-time }
    TriggerFiringPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/TriggerFiring' }
        nextCursor: { type: string, nullable: true }
    TriggerSubjectHit:
      type: object
      required: [key, kind]
      properties:
        key: { type: string }
        kind: { type: string, enum: [ISSUE, CHANGE_REQUEST] }
        title: { type: string, nullable: true }
        status: { type: string, nullable: true }
        url: { type: string, nullable: true }
    TriggerSubjectList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/TriggerSubjectHit' }
    TriggerPoll:
      type: object
      required: [id, accountId, status, triggerIds, nextPollAt, failures]
      properties:
        id: { type: string, format: uuid }
        accountId: { type: string, format: uuid, description: "A member's own account, or a system's credential" }
        holderPrincipalId:
          type: string
          format: uuid
          nullable: true
          description: |
            The member whose own account it reads with; null for a credential, whose poll serves the triggers of
            every service account that borrows it (ADR-0072)
        holderName: { type: string, nullable: true }
        credentialName: { type: string, nullable: true, description: "The credential's name; null for a member's own account" }
        status: { type: string, enum: [ACTIVE, IDLE, WAITING] }
        triggerIds:
          type: array
          items: { type: string, format: uuid }
        lastPolledAt: { type: string, format: date-time, nullable: true }
        nextPollAt: { type: string, format: date-time }
        failures: { type: integer, format: int32 }
        lastError: { type: string, nullable: true }
        backoffUntil: { type: string, format: date-time, nullable: true }
        failingSince: { type: string, format: date-time, nullable: true }
        rateLimit: { type: integer, format: int32, nullable: true }
        rateRemaining: { type: integer, format: int32, nullable: true }
        rateResetsAt: { type: string, format: date-time, nullable: true }
    TriggerPollList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/TriggerPoll' }
    FiringLimits:
      type: object
      required: [default, max]
      properties:
        default: { type: integer, format: int32, minimum: 1, maximum: 10000, description: "A new trigger's maxFiringsPerHour" }
        max: { type: integer, format: int32, minimum: 1, maximum: 10000, description: 'The most a trigger may set' }
    CompanySettings:
      type: object
      required: [triggerFiringsPerHour, version]
      properties:
        triggerFiringsPerHour: { $ref: '#/components/schemas/FiringLimits' }
        webhookDeliveriesPerMinute:
          allOf: [{ $ref: '#/components/schemas/WebhookDeliveryLimits' }]
          description: "A webhook system's deliveries a minute (package 5, §5.12): always answered; absent in a change: unchanged"
        triggerSubscriptions:
          type: boolean
          description: |
            Whether a trigger may pay with its author's Claude or ChatGPT subscription (ADR-0085, decision 7). Off by
            default: a trigger pays with its payer's budget. A trigger fires with nobody signed in and its work goes
            to its audience, which the vendors' terms for a personal plan do not cover; the company that turns this on
            takes that on itself. Always answered; absent in a change: unchanged. Turning it off pauses a trigger that
            still pays with a subscription at its next firing, for its author to choose a model under the budget.
        version:
          type: integer
          format: int32
          minimum: 0
          description: |
            The settings' version, for optimistic locking: 0 until the company set them, then one more with every
            change. A change names the version it read; one made meanwhile is refused with 409 SETTINGS_CHANGED, and
            the caller reads the settings again.
    WebhookDeliveryLimits:
      type: object
      required: [default, max]
      properties:
        default: { type: integer, format: int32, minimum: 1, maximum: 6000, description: "A webhook system's maxPerMinute when it names none" }
        max: { type: integer, format: int32, minimum: 1, maximum: 6000, description: 'The most a webhook system may name' }
    InboxTrigger:
      type: object
      required: [triggerId, name, reason]
      description: A trigger that needs the caller (§5.13)
      properties:
        triggerId: { type: string, format: uuid }
        name: { type: string }
        reason:
          type: string
          enum: [PAUSED, WAITING, WIDENING, WRITE_BACK_DROPPED, FIRINGS_SKIPPED, CHANGED_BY_ADMIN, TO_REASSIGN, POLL_WAITING,
                 MEMORY_REVIEW, TRIGGER_REASSIGNED_TO_YOU, CREDENTIAL_EXPOSED_TO_OPEN_SOURCE]
          description: |
            PAUSED and WAITING with `detail` the reason; WIDENING: the agent's widening to accept; WRITE_BACK_DROPPED: a
            write-back dropped in the last 7 days; FIRINGS_SKIPPED: firings skipped by the chain or the rate in the last
            hour; CHANGED_BY_ADMIN: an admin changed the author's trigger; TO_REASSIGN (admins): its author left;
            POLL_WAITING (admins): a poll waiting on a system's credential or a suspended principal;
            MEMORY_REVIEW (its author and team): `count` notes its conversations proposed for its memory wait for review
            (`getTriggerMemory`), since the oldest was proposed;
            TRIGGER_REASSIGNED_TO_YOU (its new author): an admin reassigned it to the caller and it waits, paused
            `TO_ACCEPT`, for them to accept its accounts, its payer and its open events (`acceptTriggerWidening`), with
            `detail` the admin's note; not dismissible (H2);
            CREDENTIAL_EXPOSED_TO_OPEN_SOURCE (whoever lent the credential to the service account, else OWNER and
            ADMIN): the first time the trigger, on a source anyone may write to, acts with a credential lent to a
            service account, for 30 days, `detail` naming the credential, the service account and the source;
            dismissible (D2)
        detail: { type: string, nullable: true }
        count: { type: integer, format: int32, nullable: true }
    KillSwitchKind:
      type: string
      enum: [RUNS_STOPPED, SYSTEM_PAUSED, MEMBER_SUSPENDED, SERVICE_IDENTITY_SUSPENDED, AGENT_PAUSED, TRIGGER_PAUSED, PERSONAL_MCP_SERVERS_OFF]
      description: |
        `RUNS_STOPPED`: the company's runs are stopped; `SYSTEM_PAUSED`: a company system is paused;
        `MEMBER_SUSPENDED`, `SERVICE_IDENTITY_SUSPENDED`: a principal is suspended; `AGENT_PAUSED`; `TRIGGER_PAUSED`
        (package 4); `PERSONAL_MCP_SERVERS_OFF`: the company switched personal MCP servers off
    KillSwitchCount:
      type: object
      required: [kind, count]
      properties:
        kind: { $ref: '#/components/schemas/KillSwitchKind' }
        count: { type: integer, format: int32 }
    PausedTrigger:
      type: object
      required: [id, name]
      description: A trigger a system's pause paused (package 4)
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        authorPrincipalId: { type: string, format: uuid, nullable: true }
        authorName: { type: string, nullable: true }
    KillSwitch:
      type: object
      required: [kind, targetId, name]
      properties:
        kind: { $ref: '#/components/schemas/KillSwitchKind' }
        targetId:
          type: string
          format: uuid
          description: The company, system, principal, agent or trigger it holds
        name: { type: string, description: 'What it holds, by name: a member by their display name' }
        userId:
          type: string
          format: uuid
          nullable: true
          description: |
            MEMBER_SUSPENDED: the member's user, which resuming them takes (`POST /members/{userId}/resume`);
            `targetId` is their principal. Null for the other kinds
        since: { type: string, format: date-time, nullable: true }
        byUserId: { type: string, format: uuid, nullable: true, description: Who pulled it }
        byName: { type: string, nullable: true }
        reason: { type: string, nullable: true, description: The reason typed; never in the audit chain }
        cause:
          type: string
          nullable: true
          description: 'A suspension''s cause: `ADMIN`, or `USER_DEACTIVATED` (lifted by reactivating the user)'
        pausedTriggers:
          type: array
          nullable: true
          items: { $ref: '#/components/schemas/PausedTrigger' }
          description: For a paused system, the triggers its pause paused (what the resume's dialog offers)
    RunsStop:
      type: object
      required: [stoppedAt, reason]
      properties:
        stoppedAt: { type: string, format: date-time }
        byUserId: { type: string, format: uuid, nullable: true }
        byName: { type: string, nullable: true }
        reason: { type: string }
    KillSwitches:
      type: object
      required: [counts, switches]
      properties:
        runsStop:
          allOf: [{ $ref: '#/components/schemas/RunsStop' }]
          nullable: true
          description: The company's stop, for every page's banner; null while its runs go
        mySuspension:
          allOf: [{ $ref: '#/components/schemas/KillSwitch' }]
          nullable: true
          description: The caller's own suspension, if suspended
        counts:
          type: array
          description: How many switches of each kind are on (admins); the kinds the caller sees otherwise
          items: { $ref: '#/components/schemas/KillSwitchCount' }
        switches:
          type: array
          description: Each switch that is on, newest first (admins; a member gets their own suspension only)
          items: { $ref: '#/components/schemas/KillSwitch' }
    RunsStopRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 500, description: 'Stays on the company''s row, out of the audit chain' }
    RunsStopResult:
      type: object
      required: [runsStop, runsCancelled]
      properties:
        runsStop: { $ref: '#/components/schemas/RunsStop' }
        runsCancelled: { type: integer, format: int32, description: The running and assigned runs this stop cancelled }
    RunsLiftResult:
      type: object
      required: [triggersArmed, heldRowsReleased, stillOn]
      properties:
        triggersArmed: { type: integer, format: int32, description: The active triggers armed again at the lift (package 4) }
        heldRowsReleased: { type: integer, format: int32, description: The write-back rows released (package 4) }
        stillOn:
          type: array
          description: The other switches that stay on, by kind
          items: { $ref: '#/components/schemas/KillSwitchCount' }
    SystemPauseRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 500 }
        stopRunning:
          type: boolean
          default: false
          description: Also cancel the running turns of the conversations bound to the system
    SystemPauseResult:
      type: object
      required: [systemId, pausedAt, reason, runsCancelled, triggersPaused]
      properties:
        systemId: { type: string, format: uuid }
        pausedAt: { type: string, format: date-time }
        reason: { type: string }
        runsCancelled: { type: integer, format: int32 }
        triggersPaused: { type: integer, format: int32 }
    SystemResumeRequest:
      type: object
      properties:
        resumeTriggers:
          type: boolean
          default: true
          description: '"Resume its {n} triggers too": each through package 4''s gate'
    SystemResumeResult:
      type: object
      required: [systemId, triggersResumed, triggersStillPaused]
      properties:
        systemId: { type: string, format: uuid }
        triggersResumed: { type: integer, format: int32 }
        triggersStillPaused: { type: integer, format: int32 }
    SuspendRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 500, description: 'Stays on the principal''s row, out of the audit chain' }
    WebhookRotateRequest:
      type: object
      properties:
        revokePrevious:
          type: boolean
          default: false
          description: Drop the secret in use now at once instead of accepting it for 24 hours (a leaked secret)
    ServiceIdentitySuspendRequest:
      type: object
      properties:
        reason: { type: string, minLength: 1, maxLength: 500, nullable: true }
    MemberSuspension:
      type: object
      required: [userId, principalId, status]
      properties:
        userId: { type: string, format: uuid }
        principalId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/PrincipalStatus' }
        suspendedAt: { type: string, format: date-time, nullable: true }
        reason: { type: string, nullable: true }
        cause: { type: string, nullable: true, enum: [ADMIN, USER_DEACTIVATED] }
    DeparturePreview:
      type: object
      required: [userId, principalId, triggersPausing, conversationsEnding, agentsPassing, runnerHostsRemoved, accountsRemoved, groupsLeft]
      properties:
        userId: { type: string, format: uuid }
        principalId: { type: string, format: uuid }
        triggersPausing: { type: integer, format: int32, description: 'Triggers they author, which pause AUTHOR_LEFT (package 4)' }
        conversationsEnding: { type: integer, format: int32, description: 'Their open personal conversations, which end PERSON_LEFT' }
        agentsPassing: { type: integer, format: int32, description: 'The agents they own, which pass to the admins' }
        runnerHostsRemoved: { type: integer, format: int32 }
        accountsRemoved: { type: integer, format: int32 }
        groupsLeft: { type: integer, format: int32 }
    DepartureTrigger:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        waitingConversations: { type: integer, format: int32 }
    DepartureCredential:
      type: object
      required: [credentialId, systemId, systemName, credentialName, kind]
      description: A system's credential the member connected, whose token or sign-in may be theirs
      properties:
        credentialId: { type: string, format: uuid }
        systemId: { type: string, format: uuid }
        systemName: { type: string }
        credentialName: { type: string }
        kind: { type: string, enum: [TOKEN, OAUTH, CLIENT], description: 'A token is stored again; a sign-in signed in again; client credentials stored again' }
    DepartureAgent:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
    DepartureChangeRequest:
      type: object
      required: [conversationId, url, state]
      properties:
        conversationId: { type: string, format: uuid }
        url: { type: string }
        state: { type: string, enum: [OPEN, DRAFT] }
    Departure:
      type: object
      required: [principalId, userId, name, open, triggers, emptyGroups, connectedCredentials, agents, changeRequests, endedConversations]
      properties:
        principalId: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        name: { type: string }
        leftAt: { type: string, format: date-time, nullable: true }
        closedAt: { type: string, format: date-time, nullable: true }
        closedByUserId: { type: string, format: uuid, nullable: true }
        open:
          type: boolean
          description: Whether items 1 to 3 (triggers, emptied groups, connected accounts) still need someone
        triggers:
          type: array
          description: 1. Triggers paused AUTHOR_LEFT, to reassign or delete (package 4)
          items: { $ref: '#/components/schemas/DepartureTrigger' }
        emptyGroups:
          type: array
          description: 2. Groups they were in that have no member now
          items: { $ref: '#/components/schemas/GroupRef' }
        connectedCredentials:
          type: array
          description: 3. System credentials they connected, to store again with a new token or sign in again
          items: { $ref: '#/components/schemas/DepartureCredential' }
        agents:
          type: array
          description: 4. Agents passed to the admins, to give a new owner or keep
          items: { $ref: '#/components/schemas/DepartureAgent' }
        changeRequests:
          type: array
          description: 5. Open change requests their conversations opened with their own account
          items: { $ref: '#/components/schemas/DepartureChangeRequest' }
        endedConversations: { type: integer, format: int32, description: '6. Their ended personal conversations' }
    DepartureCloseRequest:
      type: object
      properties:
        force: { type: boolean, default: false, description: Close although items 1 to 3 are open }
    AgentOwnerRequest:
      type: object
      required: [principalId]
      properties:
        principalId: { type: string, format: uuid, description: An active member's principal }
    InboxDeparture:
      type: object
      required: [principalId, userId, name]
      properties:
        principalId: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        name: { type: string }
    InboxSeatFallback:
      type: object
      description: A new user who joined as VIEWER for want of a seat (ADR-0077, decision 5)
      required: [userId, name, role]
      properties:
        userId: { type: string, format: uuid }
        name: { type: string }
        role:
          allOf: [{ $ref: '#/components/schemas/Role' }]
          description: The role their provider gives, which holds a seat
        provider: { type: string, nullable: true, description: "The registration id of the provider they signed in with" }
    InboxLicence:
      type: object
      description: The instance's licence nearing or past its end (ADR-0077, decision 7)
      required: [state, endsAt, graceEndsAt]
      properties:
        state: { $ref: '#/components/schemas/LicenceState' }
        edition: { $ref: '#/components/schemas/Edition' }
        endsAt: { type: string, format: date }
        graceEndsAt: { type: string, format: date }
        auditExportUntil: { type: string, format: date, nullable: true }
    Edition:
      type: string
      enum: [COMMUNITY, PRO, ENTERPRISE]
      description: The edition the instance runs as (ADR-0077, decisions 3 and 4)
    LicenceState:
      type: string
      enum: [NONE, ACTIVE, EXPIRING, GRACE, EXPIRED]
      description: |
        NONE: no key (Community). ACTIVE: a key in force. EXPIRING: in force, 30 days or fewer before its end, with no
        renewal that follows it. GRACE: the 30 days after the end, in which everything keeps working. EXPIRED: after
        the grace, Community with decision 7's exceptions, until a new key is added or the expired keys removed.
    LicenceFeature:
      type: string
      enum: [OUTLOOK_ADDIN, GMAIL_ADDON, AUDIT_TOOLS, AUDIT_FULL_HISTORY, RETENTION_SETTINGS, ELASTIC_RUNNERS,
             LEGAL_HOLDS, SAML, SCIM, SIEM, MULTI_COMPANY, HA, AIR_GAPPED]
      description: |
        A paid feature (ADR-0077, decision 4). Pro: `OUTLOOK_ADDIN`, `GMAIL_ADDON` (ADR-0083), `AUDIT_TOOLS` (the audit's filters,
        export, chain verification and daily checks), `AUDIT_FULL_HISTORY` (the audit shown beyond 90 days),
        `RETENTION_SETTINGS`, `ELASTIC_RUNNERS` (runner hosts with the sandbox bridge or a VM per run, ready sandboxes
        and session bundles, ADR-0100). Enterprise adds `LEGAL_HOLDS`, `SAML`, `SCIM`, `SIEM`, `MULTI_COMPANY` (declared companies
        beyond the first), `HA` and `AIR_GAPPED`.
    LicenceSeats:
      type: object
      required: [used]
      properties:
        licensed:
          type: integer
          format: int32
          nullable: true
          description: The seats the key in force holds; null when nothing is counted (Community, an Enterprise key without a seat count, or an expired licence)
        used:
          type: integer
          format: int32
          description: The people who hold OWNER, ADMIN or MEMBER in any company of the instance, each once; deactivated users count for nothing
    Licence:
      type: object
      required: [edition, state, seats, features]
      properties:
        edition: { $ref: '#/components/schemas/Edition' }
        state: { $ref: '#/components/schemas/LicenceState' }
        customer: { type: string, nullable: true }
        endsAt: { type: string, format: date, nullable: true, description: "The last day of the key in force, or of the one that ended" }
        graceEndsAt: { type: string, format: date, nullable: true, description: "The last day of the grace, 30 days after endsAt" }
        auditExportUntil: { type: string, format: date, nullable: true, description: "The last day the audit's export stays after the licence expired: 90 days after graceEndsAt" }
        seats: { $ref: '#/components/schemas/LicenceSeats' }
        companiesLicensed:
          type: integer
          format: int32
          nullable: true
          description: The declared companies the instance may run; 1 but under Enterprise, which may cap them; null for no cap
        features:
          type: array
          description: The paid features in force now
          items: { $ref: '#/components/schemas/LicenceFeature' }
    LicenceKeyView:
      type: object
      description: A licence key the instance holds, without its string
      required: [licenceId, rev, customer, edition, startsAt, endsAt, appliedAt]
      properties:
        licenceId: { type: string, description: "The licence's id the key names" }
        rev: { type: integer, format: int32, description: "The key's revision of the licence, from 1" }
        customer: { type: string }
        edition: { $ref: '#/components/schemas/Edition' }
        seats: { type: integer, format: int32, nullable: true, description: "Null for an Enterprise key without a seat count" }
        companies: { type: integer, format: int32, nullable: true, description: "An Enterprise key's cap of declared companies; null for none" }
        startsAt: { type: string, format: date }
        endsAt: { type: string, format: date }
        appliedAt: { type: string, format: date-time }
        appliedBy: { type: string, format: uuid, nullable: true, description: "The instance admin who applied it; null once that user is deleted" }
        appliedByName: { type: string, nullable: true, description: "Their name now" }
    AdminLicence:
      type: object
      description: The keys an instance holds
      properties:
        current:
          allOf: [{ $ref: '#/components/schemas/LicenceKeyView' }]
          nullable: true
          description: The key in force, or the one that ended; null without a key
        next:
          allOf: [{ $ref: '#/components/schemas/LicenceKeyView' }]
          nullable: true
          description: A renewal held until its start date, when it replaces the key in force
    LicenceKeyRequest:
      type: object
      required: [key]
      properties:
        key:
          type: string
          minLength: 1
          maxLength: 4096
          description: The key as FLOWTIVO sent it, `TINFIRM1.` and two base64url parts; surrounding white space is ignored
    HoldConversationRef:
      type: object
      required: [conversationId, key]
      description: A conversation a hold may name, by id and key; nothing of its content
      properties:
        conversationId: { type: string, format: uuid }
        key: { type: string }
    DepartureSummary:
      type: object
      required: [principalId, userId, name, leftAt]
      description: A member who left, whose checklist is not closed
      properties:
        principalId: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        name: { type: string }
        leftAt: { type: string, format: date-time }
    DepartureSummaryList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/DepartureSummary' }
