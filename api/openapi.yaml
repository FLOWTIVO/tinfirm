            application/json:
              schema: { $ref: '#/components/schemas/MemoryNotes' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/companies/{companyId}/agents/{agentId}/settings/me/memory/{noteNumber}:
