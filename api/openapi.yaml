      responses:
        '200':
          description: The version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SkillVersion' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/companies/{companyId}/skills/{skillId}/versions/{version}/content:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
      - $ref: '#/components/parameters/SkillId'
      - $ref: '#/components/parameters/SkillVersionNumber'
    get:
      tags: [Skills]
      operationId: downloadSkillVersion
      summary: Download a version of a skill as its canonical zip (who sees it)
      description: As an attachment, named `{name}-v{version}.zip`.
      responses:
        '200':
          description: The zip
          content:
            application/zip:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/companies/{companyId}/skills/{skillId}/shares:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
      - $ref: '#/components/parameters/SkillId'
    put:
      tags: [Skills]
      operationId: replaceSkillShares
      summary: Replace the groups and the members who may see and use the skill (who edits it)
      description: |
        As an agent's shares: at most 50 groups of the company and at most 100 members by their principal
        (`principalIds` absent: the members it is shared with stay). Taking a share takes the skill from no agent.
        Audited as `skill.shares_changed`. Problems: 400 VALIDATION_FAILED; 403 SKILL_NOT_EDITABLE.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SkillSharesRequest' }
      responses:
        '200':
          description: Replaced
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Skill' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/companies/{companyId}/agents/{agentId}/skills:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
      - $ref: '#/components/parameters/AgentId'
    put:
      tags: [Agents]
      operationId: replaceAgentSkills
      summary: Replace the agent's skills, each pinned to a version (who edits it)
      description: |
        As a whole, at most 20, each skill once. A skill the agent has keeps its pin without `version`, or moves to
        that version (up or down; the skill must be live, else 400 SKILL_DELETED). A skill the agent does not have
        joins at `version`, or at its latest: the caller must see it in the library (else 400 VALIDATION_FAILED) and
        it must be live (400 SKILL_DELETED). Two skills of one name are 400 SKILL_NAME_CONFLICT. A change makes a
        version, audited as `agent.skills_changed`. A skill added or a pin moved widens when the agent's ceiling can
        act (as for instructions, `updateAgent`); otherwise, and for a skill removed, it applies to everyone's next turn
        (`agent.instructions_changed`, said in each conversation). 403 AGENT_NOT_EDITABLE.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentSkillsRequest' }
