        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/oauth/callback:
    get:
      tags: [Accounts]
      operationId: completeSignIn
      summary: The one OAuth callback of accounts on systems (a browser redirect)
      description: |
        Consumes the pending sign-in of its `state` once, only in the session that started it, and only within 10
        minutes; exchanges the code with its PKCE verifier, reads who the account is, and stores it. Always answers
        303 to the sign-in's `returnTo` (a path of this site; `/` when the state is unknown) with
        `account=connected&system={systemId}`, or `account={reason}`: `denied` (the person declined), `invalid_state`
        (unknown, used, or another session's), `expired`, `exchange_failed`, `refused` (the system refused the grant),
        `site_not_granted` (a Jira Cloud grant without the system's site), `identity_in_use`, `identity_shared` (a
        member's sign-in as the user of one of the system's credentials, a shared account), `already_linked` (a
        member's Slack sign-in as another Slack user than the one they are linked to), `name_taken` (a new credential's
        name, which another credential of the system took meanwhile), `system_moved` (an MCP server moved to another
        endpoint meanwhile, ADR-0079: nothing is stored), `forbidden` (the caller may no longer connect it).
      parameters:
        - { name: code, in: query, required: false, schema: { type: string, maxLength: 2000 } }
        - { name: state, in: query, required: false, schema: { type: string, maxLength: 200 } }
        - { name: error, in: query, required: false, schema: { type: string, maxLength: 200 } }
      responses:
        '303': { description: Back to the page the sign-in started from }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/companies/{companyId}/skills:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
    get:
      tags: [Skills]
      operationId: listSkills
      summary: The live skills the caller sees, by name (every member)
      description: |
        Its owner's, those shared with the caller's groups or with the caller, and for OWNER and ADMIN all of them.
        `q` keeps those whose name or description holds it, case ignored. `deleted=true`, for OWNER and ADMIN only,
        lists the deleted skills instead (403 for anyone else). Keyset on name and id.
      parameters:
        - { name: q, in: query, required: false, schema: { type: string, maxLength: 100 } }
        - { name: deleted, in: query, required: false, schema: { type: boolean, default: false } }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Skills
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SkillPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Skills]
      operationId: createSkill
      summary: Create a skill from a zip of its folder or the text of its SKILL.md; the caller owns it (every member)
      description: |
        Exactly one of `file` (a zip of the skill's folder, `SKILL.md` at its root or under one top folder) and
        `skillMd` (the text of a `SKILL.md`). The front matter's `name` is the skill's name, unique among the
        company's live skills (409 DUPLICATE_SKILL_NAME). The files are checked (400 SKILL_INVALID with
        `details.rule`; 400 SKILL_TOO_LARGE with `details.limit`: at most 200 files, 5 MiB uncompressed, 5 MiB
        uploaded, 5 MiB as the canonical zip), normalised to a canonical zip and scanned for credentials (422
        SKILL_CONTAINS_CREDENTIAL with `credentialMatches`; nothing is stored). Version 1, private to the caller until shared. Audited as
        `skill.created`.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/SkillUpload' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Skill' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /api/companies/{companyId}/skills/{skillId}:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
      - $ref: '#/components/parameters/SkillId'
    get:
      tags: [Skills]
      operationId: getSkill
      summary: A skill and its versions, newest first (who sees it)
      responses:
        '200':
          description: The skill
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Skill' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Skills]
      operationId: deleteSkill
      summary: Delete a skill (who edits it); the agents that pin it keep it, or lose it with `removeFromAgents`
      description: |
        A soft delete: its shares go, its name is free again, its versions stay. By default the agents that pin a
        version keep it and their runs still get it; it can no longer be added to an agent or moved to another
        version. With `removeFromAgents`, it also leaves every live agent that pins it, those the caller does not
        edit or see included: a narrowing, which reaches everyone's next turn at once, each agent's change a version
        that widens nothing, audited as `agent.skills_changed` with `cause` `skill.deleted`; every settings switch of
        it goes with it. Audited as `skill.deleted` with the number of live agents that pinned it and
        `removedFromAgents`. 403 SKILL_NOT_EDITABLE.
      parameters:
        - name: removeFromAgents
          in: query
          required: false
          description: Also take the skill from every live agent that pins it
          schema: { type: boolean, default: false }
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/companies/{companyId}/skills/{skillId}/versions:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
      - $ref: '#/components/parameters/SkillId'
    post:
      tags: [Skills]
      operationId: addSkillVersion
      summary: Upload a new version of a skill (who edits it); no agent moves to it by itself
      description: |
        As `createSkill`; the front matter's `name` must stay the skill's (400 SKILL_NAME_CHANGED). The same files as
        the latest version store nothing and answer 200. At most 100 versions (409 SKILL_VERSION_LIMIT). Audited as
        `skill.version_added`. 403 SKILL_NOT_EDITABLE.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/SkillUpload' }
      responses:
        '200':
          description: The same files as the latest version; nothing stored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Skill' }
        '201':
          description: Stored as the new latest version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Skill' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /api/companies/{companyId}/skills/{skillId}/versions/{version}:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
      - $ref: '#/components/parameters/SkillId'
      - $ref: '#/components/parameters/SkillVersionNumber'
    get:
      tags: [Skills]
