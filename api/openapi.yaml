openapi: 3.0.3
info:
  title: Tinfirm API
  version: 0.6.0
  # The contract is under MIT, as everything outside ee/ is (the root LICENSE, ADR-0077).
  license:
    name: MIT
    url: https://opensource.org/license/mit
  description: |
    Tinfirm control-plane API of the platform redesign (docs/PLATFORM.md; the record of the redesign,
    docs/reviews/2026-10-12-platform-redesign.md): the instance and company core (users, sessions, companies, members
    with four roles, groups, the audit log, the vault), runner hosts with their capacity settings (ADR-0016), and the
    tags of the redesign's packages (Part 9). Package 1 (docs/reviews/2026-10-12-package-1-contract.md): service
    accounts (`ServiceIdentities`), systems with their apps, repositories and MCP catalogues, members' own accounts by
    token and OAuth, and, since ADR-0072, the systems' credentials, lent to groups (`Grants`) and to service accounts.
    Package 2 (docs/reviews/2026-10-12-package-2-contract.md): the company's LiteLLM, a key and budget per principal,
    and company and personal runner hosts. Package 3 (docs/reviews/2026-10-12-package-3-contract.md): agents with
    their versions, and each person's settings of an agent; conversations, their bindings, turns, decisions and
    outputs. Package 4 (docs/reviews/2026-10-12-package-4-contract.md): triggers on trackers and schedules. Package 5
    (docs/reviews/2026-10-12-package-5-contract.md): chat systems, direct messages, channel triggers and the generic
    webhook. Package 6 (docs/reviews/2026-10-12-package-6-contract.md): spend, the audit's views and export,
    retention, holds and erasure, the kill switches and a member who leaves. Package R
    (docs/reviews/2026-10-12-package-r-contract.md): `Idempotency-Key` on submissions. Since then: agent memory
    (ADR-0063), skills (ADR-0064), the company's own model key (ADR-0065) and error reports (ADR-0070).

    Conventions:
    - Authentication is a server-side session cookie (`TINFIRM_SESSION`), created by
      `POST /api/auth/login` (local accounts) or by the OIDC flow at
      `GET /oauth2/authorization/{registrationId}`.
    - Mutating requests need the CSRF header `X-XSRF-TOKEN`, copied from the `XSRF-TOKEN` cookie.
    - Every path in this document uses the session only. A personal access token (`Tokens`, created on `/me`) or an
      OAuth access token is accepted only by the MCP endpoint of a company, `/api/companies/{companyId}/mcp`
      (ADR-0045), which speaks JSON-RPC and is not part of this document; see the `bearer` security scheme.
    - Errors use RFC 9457 problem details (`application/problem+json`).
    - IDs are UUIDs (v7). Timestamps are RFC 3339 in UTC.
    - Lists use cursor pagination: `?limit=&cursor=` returns `{ items, nextCursor }`.
    - A company the caller cannot see returns 404, never 403; so does anything in it the caller may not see, such
      as another member's personal MCP server.
servers:
  - url: /
tags:
  - name: Auth
  - name: Me
  - name: Tokens
    description: |
      Personal access tokens of the logged-in user (ADR-0045), for scripts, `curl` and CI on the MCP endpoint of a
      company. A token is `tfp_` + 43 base64url characters, shown once when created; the server keeps only its
      SHA-256 hash. These endpoints themselves are session-only, like the rest of the API.
  - name: OAuth
    description: |
      The logged-in user's side of Tinfirm's own OAuth 2.1 authorization server (ADR-0045): the details the consent
      page shows, and "Connected apps", the clients the user authorized per company. Session-only, like the rest of
      the API. The authorization server's endpoints themselves (`/oauth2/authorize`, `/oauth2/token`,
      `/oauth2/revoke`, `/oauth2/jwks`, `/.well-known/oauth-authorization-server`), the protected-resource metadata
      of each company's MCP endpoint (`/.well-known/oauth-protected-resource/api/companies/{companyId}/mcp`) and
      Tinfirm's own Client ID Metadata Document (`GET /oauth/client-metadata.json`), which the authorization server of
      an MCP system fetches to learn who Tinfirm is as its OAuth client, are standard OAuth and not part of this
      document. The consent page posts the person's decision form-encoded to `/oauth2/authorize` (`client_id`,
      `state`, one `scope` per approved scope; none denies) with the `X-XSRF-TOKEN` header and
      `Accept: application/json`, and gets `200 {"redirectUri": "..."}` to navigate to.
  - name: Outlook
    description: |
      Tinfirm's Outlook add-in (ADR-0074): a web add-in that Tinfirm serves at `/outlook/{companyId}`, a client of the
      company's MCP endpoint through Tinfirm's built-in OAuth client `tinfirm-outlook`. Its manifest is per company.
  - name: Gmail
    description: |
      Tinfirm's Gmail add-on (ADR-0083): a Google Workspace add-on whose HTTP endpoints Tinfirm serves at
      `/api/gmail/{companyId}/*` for Google alone (not part of this API: Google signs each request). A Google account
      acts as the person who linked it with a sign-in link. Its deployment file is per company.
  - name: System
  - name: Companies
  - name: Members
  - name: Scim
    description: |
      SCIM 2.0 provisioning of a company's members (ADR-0087), Enterprise. `/scim/v2/**` is the endpoint a company's
      identity provider (Entra ID, Okta) calls: RFC 7644's `Users`, `ServiceProviderConfig`, `ResourceTypes` and
      `Schemas`, with `application/scim+json` (and `application/json`, which Okta sends), authenticated by
      `Authorization: Bearer tfs_…`, a token the company's OWNER issues (`/api/companies/{companyId}/scim/tokens`);
      the token names the company, whose members alone it sees. A stateless chain of its own: no session, no CSRF,
      the session cookie ignored, a request with an `Origin` header refused `403`. Errors are SCIM's own
      (`ScimError`, RFC 7644 §3.12), never `problem+json`: `401` with `WWW-Authenticate: Bearer error="invalid_token"`
      for a missing, unknown, revoked or expired token or a company whose SCIM the deployment no longer allows; `403`
      with the detail `EDITION_REQUIRED` while the licence does not hold `SCIM`; `429` with `Retry-After` beyond the
      company's rate (`tinfirm.scim.requests-per-minute`) or 20 refused tokens a minute from one address. `/Groups`,
      `/Bulk` and `/Me` are not served (`404`).
  - name: SignIn
    description: |
      A company's sign-in as the deployment declares it (ADR-0075, ADR-0086 decision 15): its OIDC and SAML providers,
      read-only, with what an identity provider's admin needs to set one up.
  - name: Provisioning
    description: |
      A company's SCIM provisioning in the app (ADR-0087 decisions 3 and 11): its status and its SCIM tokens, which the
      OWNER issues and revokes and the ADMIN reads. Session-only paths of the API, as every other.
  - name: Groups
    description: |
      Groups of members (ADR-0049 §2, kept by ADR-0058): a named set of members of the company. Agents and skills are
      shared with groups, systems' credentials are lent to them (`Grants`), they are given the use of service
      accounts, and a group is a trigger's team, which decides its approvals. OWNER and ADMIN create, rename, fill (as
      a whole, or one member at a time) and delete groups (`MANAGE_GROUPS`) and see their members and what they may
      use through them; every member may list their names (`VIEW_GROUPS`), so that whoever picks a group can. Leaving
      the company leaves every group.
  - name: ServiceIdentities
    description: |
      Service accounts, as the web app calls service identities (the package 1 contract, §3.1 and §3.2; ADR-0072):
      non-human principals that admins manage. One never logs in and acts only through the credentials systems lend it,
      at most one per system, and pays with its own budget; admins give groups the right to use it (pick it and its
      credentials on what they set up). Suspending one is a kill switch: what acts through it acts for nothing until it
      is resumed. Every member lists them; OWNER and ADMIN manage them (`MANAGE_SERVICE_IDENTITIES`).
  - name: Systems
    description: |
      Systems (the package 1 contract, §3.3 to §3.5; the package 5 contract for chat systems and webhooks): external
      services registered once (Jira Data Center or Cloud, GitHub, GitLab, a git host, an MCP server, Slack, Microsoft
      Teams, a webhook), each with one OAuth app, its Sign-in app, and the company's credentials on it (`Credentials`,
      ADR-0072), but no account of its own. Admins register company systems; any member may register personal MCP
      servers, which only they see and only their own conversations use, unless the company switches them off. Code
      hosts hold repositories; trackers serve Tinfirm's fixed tools, and Slack its `history`; an MCP server's
      catalogue is read from it with a credential or the caller's own account, or with none from a server that needs
      no account (ADR-0071), and each tool's effect is `UNKNOWN` (counted as `WRITE`) until an admin confirms it.
  - name: Governance
    description: |
      The kill switches on one page and a member who leaves (the package 6 contract, §5.4 and §5.5): the company's stop
      of its runs, a system's pause, a member's suspension, the switches that are on, and the admins' checklist of a
      member who left. Each switch's state stays with its data (the company, the system, the principal); undoing one
      is always a person's act.
  - name: Accounts
    description: |
      Accounts (the package 1 contract, §3.6 and §3.8): a member's own credential on a system, one per member per
      system, and who it is there. A member connects their own (a token, or a sign-in with the system's app). Their
      token is kept in a secret the member owns, which no Secrets page shows and only a call acting as that member
      reveals. Every sign-in returns through the one callback, `GET /api/oauth/callback`.
  - name: Credentials
    description: |
      A system's credentials (ADR-0072): the company's tokens and sign-ins on a company system, several on one, each
      named, added on the system's page by OWNER and ADMIN (`MANAGE_SYSTEMS`) and kept in a managed company secret. A
      grant lends one to a group (`Grants`); a service account borrows at most one per system. Disabling one stops every
      use of it until it is enabled again.
  - name: Grants
    description: |
      Grants (the package 1 contract, §3.7; ADR-0072): a system's credential lent to a group, `READ` or `WRITE`; its
      members may act with it in their own conversations when they hold no account of their own. Only credentials are
      lent (I5). OWNER and ADMIN manage them (`MANAGE_GRANTS`).
  - name: Chat
    description: |
      Chat systems (the package 5 contract, §3.1, §3.2, §5.1, §5.2, §6): a Slack workspace (its events by the Events
      API or Socket Mode) or a Microsoft Teams tenant (the Bot Framework), each with one Tinfirm bot: a credential on
      the chat system that a service account borrows (ADR-0072), which is set, replaced and removed only here (`PUT`,
      `DELETE …/bot`): never granted, bound, lent otherwise or removed among the system's credentials (`BOT_ACCOUNT`,
      `BOT_ACCOUNT_IN_USE`). A Slack system keeps its signing secret or app-level token, written and never returned;
      the manifest an admin installs is generated here. The platforms' own requests arrive outside `/api/companies`,
      without a session or CSRF, verified before anything is read: `POST /api/chat/slack/{systemId}/events`, `POST
      /api/chat/slack/{systemId}/interactions`, `POST /api/chat/teams/{systemId}/messages` (CONVENTIONS §4; not part
      of this contract, as the runner's endpoints are not, since a generated interface would parse a body before its
      signature is checked). The company's chat rates are admins' (`…/chat-settings`).
  - name: Webhooks
    description: |
      The generic webhook (the package 5 contract, §3.12, §5.12, §6): a `WEBHOOK` system is one sender, registered by an
      admin with its scheme (Standard Webhooks' signature, or the weaker secret header), its mapping (JSON Pointers into
      a delivery's body) and its deliveries a minute; Tinfirm generates its secret. Its deliveries arrive outside
      `/api/companies`, without a session or CSRF, verified before anything is counted or read:
      `POST /api/hooks/{systemId}` (`application/json`, at most 1 MiB; `404` without a body for an id that is not a
      UUID, an unknown system or a system that is not a `WEBHOOK`; `401` without a body for a bad signature, a
      timestamp outside 300 seconds or the wrong secret; `429` with `Retry-After` past the system's rate, or for a client
      address with more than 60 refusals a minute; `413`, `415`, `400` for a body deeper than 32 levels or of more than
      10 000 values; `503` with `Retry-After: 300` during the company's stop, nothing stored; `200 {"paused": true}`
      while the system is paused, nothing stored; `200 {"duplicate": true}` for a known delivery id;
      `202 {deliveryId, firings}` otherwise). A delivery fires the system's `WEBHOOK` triggers whose events and
      conditions it matches; their conversations stay in Tinfirm (place `WEBHOOK`). Not part of this contract, as the
      chats' endpoints are not.
  - name: ChatLinks
    description: |
      Linking chat users to members (the package 5 contract, §5.4, security review row 5): an unlinked member of the
      workspace who writes to the bot gets, in their direct message, a sign-in link to `/link/{companyId}#{token}`: one
      chat user, single use, 10 minutes. The token travels in the link's fragment and in these requests' bodies, never
      in a path. The page names what it links by what the chat user cannot choose (their id, the workspace, when they
      asked), and both sides are told of a link: the direct message, and the member's inbox with an unlink. A
      member's default agent for their direct messages is theirs to set (`/me/chat`).
  - name: Agents
    description: |
      Agents (the package 3 contract, §3.1 to §3.6, §5.1 and §11): an agent's definition (name, `@handle`,
      instructions, the runtimes it is tested on, a turn's time limit, whether it may keep memory, ADR-0063) and its
      ceiling: the company systems it may use, each tool's mode (`ALLOW`, or `ASK`: each call an approval; a tool it
      does not list is not available), its repositories (`READ` or `WRITE`), the network hosts its runs may reach, and
      its skills, each pinned to a version (ADR-0064). An agent holds no credentials: who acts and who pays come from
      whoever uses it. Every member creates agents; an agent is private to its owner (its creator) until shared with
      groups, whose members may then use it, or with members on their own (a person in no group included). OWNER and
      ADMIN see, edit, share, pause and delete every agent and give it a new owner; they use one only as its owner or
      through a share. Anything the caller may not see is 404. Every change of the definition makes a new version; one
      that widens it (a new system, tool, repository or host, a repository raised to `WRITE`, a tool raised towards
      `ALLOW`) reaches a person only once they accept it (`acceptAgentVersion`), and a trigger once its author does
      (`acceptTriggerWidening`), while narrowing applies at once.
  - name: Settings
    description: |
      A person's settings of an agent (the package 3 contract, §3.7 and §5.2): runtime, model and effort within the
      agent's runtimes and the person's model access, budget or subscription, instructions added to the agent's,
      systems and tools switched off or turned to `ASK`, skills switched off (`skillsOff`, ADR-0064), default
      repositories and projects, the person's own MCP servers with each tool's mode, memory (`memory`, ADR-0063; the
      person's notes are read and deleted here) and automatic retries (`autoRetry`, ADR-0073). Settings narrow the
      agent, never widen it, except for one's own MCP servers. Only the person sees their settings; they are made on
      first use. A trigger has settings of its own (`getTriggerSettings`).
  - name: Skills
    description: |
      The company's library of skills (ADR-0064, the skills contract): folders in the Agent Skills format, a `SKILL.md`
      with a name and a description and any scripts, references or templates, in immutable versions. Every member
      creates skills; a skill is private to its owner until shared with groups or members, as an agent is; OWNER and
      ADMIN see and edit every skill. An agent pins a version of each of its skills (`replaceAgentSkills`): a new
      version reaches no agent until its editors move the pin. Every upload is scanned for credentials.
  - name: Conversations
    description: |
      Conversations (the package 3 contract, §3.8 to §3.11, §5.3 to §5.10; the package 4 contract, §3.4; the package 5
      contract, §5.6): one agent in one place; for whom it acts, who pays, its runtime and its model access are fixed
      at its start from the settings in effect. A personal conversation is one person's, who pays for it and for whom
      it acts: a Tinfirm thread, started in the app or from the person's AI client, or a direct message to a chat
      system's bot. It is seen by its person and, in full, by OWNER, whose reads are recorded (an ADMIN who is not
      OWNER does not see it). A trigger's conversation is held on a tracker's issue, a scheduled firing, a thread of a
      chat channel or, for a webhook, in Tinfirm (place `WEBHOOK`); it acts for the trigger's author with the
      trigger's accounts and is paid by its payer, and it is seen by the trigger's author, its team, OWNER and ADMIN,
      and by the author it started with. Its turns are runs, one at a time per conversation, conversations in
      parallel. A personal conversation binds its accounts once per system at the system's first use (`Accounts.bind`:
      the person's own account, the one usable grant of a credential, or a card: pick a grant, connect, reconnect); a
      trigger's takes them from the trigger's table; both are checked at every use. Its outputs are the change
      requests the server opens after a push, and the documents and links its agent saves; its files are scanned for
      credentials at upload (ADR-0014). Only its person, in a trigger's conversation the trigger's author and team,
      speaks in it and adds and deletes its files; anyone else who sees it gets `CONVERSATION_BOUND`. Anything the
      caller may not see is 404.
  - name: Triggers
    description: |
      Triggers (the package 4 contract; the package 5 contract for chat channels and webhooks): a company tracker's
      events, a schedule, mentions of a chat system's bot in its channels, or a `WEBHOOK` system's deliveries,
      starting conversations with an agent that act for the trigger's author with the accounts of its table and are
      paid by its payer, all fixed when it is saved and checked again at every use (`TriggerGate`). A row of the table
      names the author's own account, or a service account the author may use with the credential it borrows, and
      follows the service account when an admin lends it another (ADR-0072). Its author edits it (admins on the
      author's behalf); its audience (its author, its team, OWNER and ADMIN) runs it now, pauses it and reviews its
      memory; its author and admins resume and delete it; admins reassign it. A trigger, its firings and its
      conversations are seen by its audience, a conversation also by the author it started with; anything else is 404.
  - name: Audit
    description: |
      The company's hash-chained audit log (ADR-0010; the package 6 contract, §5.8): filters, an export by sequence
      that anyone holding it verifies offline, and the daily check of the chain against the head the previous check
      recorded. OWNER and ADMIN (`VIEW_AUDIT`) read it; an OWNER acknowledges a failed check (`MANAGE_RETENTION`).
  - name: Retention
    description: |
      Retention, legal holds and erasure (the package 6 contract, §3.7, §5.9; open points 16, 17, 22, 25). The OWNER
      (`MANAGE_RETENTION`) sets how long each kind of content is kept after a conversation ended (or a run, for its
      events), holds a conversation or a person against the sweep and erasure, and erases a person's or an outside
      identity's content on request. A daily sweep purges what is due, 500 rows a transaction, skipping what an open
      hold covers; open conversations are never purged by retention and are reported instead. What is purged leaves
      a tombstone: ids, kinds, dates, statuses and spend stay, texts and files go (`purgedAt` and the like mark it).
      The audit chain is never purged: it holds ids only. Proposed periods and an erasure are previewed first, with
      the sweep's and the erasure's own selection: counted, and the holds that would stop an erasure named, changing
      nothing.
  - name: Secrets
  - name: Admin
  - name: Licence
    description: |
      The licence (ADR-0077): one image runs as Community, Pro or Enterprise by the licence keys it holds. A key is an
      offline string signed by FLOWTIVO (Ed25519), `TINFIRM1.<base64url(payload)>.<base64url(signature)>`, that an
      instance admin pastes on the instance's licence page; one key covers the instance, and one is in force at a
      time: seats bought during the year come as the licence's next revision, which replaces it, and a renewal is
      held as the next key until its start. Every signed-in user reads the licence in force (`GET /api/licence`); the keys
      themselves are the instance admins' (`/api/admin/licence`), and a key's string is never returned. A seat
      belongs to the roles OWNER, ADMIN and MEMBER, counted once per person across the instance; VIEWER holds none.
  - name: ErrorReports
    description: |
      Error reports (ADR-0070): the server captures the errors of its own process and of the web app, scrubbed from an
      allowlist when captured and grouped into one report per kind of error. Instance admins list and download them,
      and choose whether delivery to the vendor's error tracker is automatic, unless the operator set the mode in the
      environment (`TINFIRM_ERROR_REPORTS`). Members' browsers post their errors to `POST /api/client-errors`.
  - name: RunnerHosts
    description: |
      Runner hosts (the package 2 contract, §2 and §8): a `COMPANY` host, which OWNER and ADMIN register and manage,
      runs any conversation; a member's `PERSONAL` host runs only its owner's work (their budget or subscription and
      their own accounts) and is the only kind that holds credentials of its own, its owner's subscriptions. The scope
      is chosen at registration and never changes. A member sees and manages only their own personal hosts; OWNER and
      ADMIN see the company hosts and their own personal hosts, and another member's personal host is 404 to them as to
      anyone. A host's runner version (`version`) is shown and decides nothing: every host that speaks runner protocol 2
      has the always-on model proxy and may take runs paid by a budget (ADR-0109).
  - name: ModelSettings
    description: |
      The company's model gateway (the package 2 contract, §3.1, §6, §8; ADR-0059, ADR-0094): the LiteLLM bundled
      with the deployment or the company's own, which Tinfirm manages through its admin API, or the company's own
      gateway whose keys its gateway team provides (`PROVIDED`); and the defaults of every key: a budget per period
      and the models a key may use. At a gateway Tinfirm manages, the company is a team; its provider keys and models
      live there. Runs paid by a budget may start only once the gateway answered the test (`relayEnabled`). OWNER and
      ADMIN read and change the settings (`MANAGE_MODEL_ACCESS`); every member lists the models the gateway serves.
  - name: ModelAccess
    description: |
      Model access (the package 2 contract, §3.2, §8): every principal, member or service identity, has one LiteLLM key
      with its budget and models, which Tinfirm creates, keeps in its vault and never shows; nobody holds it. A member
      reads their own (their budget, spend, reset time, models and status, and the subscriptions on their personal
      runner hosts); OWNER and ADMIN read every principal's and set or clear a principal's budget and models. The
      company has a key of its own as well (ADR-0065), which pays for Tinfirm's own requests and no principal's; OWNER
      and ADMIN read it and set its budget and models alike.
  - name: MemorySettings
    description: |
      The company's settings of agents' memory (ADR-0063, ADR-0065): the model that tidies memories, on the company's
      own key. OWNER and ADMIN read and change them (`MANAGE_MODEL_ACCESS`).
  - name: Decisions
    description: |
      Decisions (the package 3 contract, §3.12, §5.8; the package 4 contract, §5.8; the package 5 contract, §5.8): the
      questions and approvals of conversations. An agent asks a question (`ask`, or a `BLOCKED` result's open
      questions); an approval is raised by a call of an `ASK` tool, a request for a repository (`request_access`) or a
      network host (`request_network_access`), a change request under `ASK`, or the review of a trigger's result. In a
      personal conversation its person decides both. In a trigger's conversation a question is answered by whoever may
      write in its place: the trigger's author and team in Tinfirm, a comment on its tracker issue, a member of the
      workspace in its chat thread; an approval is decided by the trigger's team, or by its author when it has none
      (`approverGroupId`, `approverPrincipalId`), in Tinfirm or with the bot's buttons in its chat thread, and the
      review of a result only in Tinfirm. Anyone else who sees the conversation, OWNER and ADMIN included, gets 409
      CONVERSATION_BOUND; a suspended member decides nothing, and no agent decides. A decision is decided once (409
      DECISION_DECIDED). The conversation's next turn (`DECIDED`) starts once none of its decisions and none of its
      bindings is open, with every answer and outcome. What the caller may not see is 404.
  - name: Inbox
    description: |
      What needs the caller now (the package 3 contract, §5.10; packages 4 to 6 add their kinds), longest waiting
      first: the open decisions they decide; the waiting bindings of their conversations they can act on; their
      conversations whose latest turn failed (a trigger's: for its author and team); their conversations waiting on a
      runner or on their budget, with the reset time; a budget threshold crossed; the triggers that need them (paused
      or waiting, a widening to accept, a write-back dropped, firings skipped, a change by an admin, notes to review);
      a chat account linked to them. OWNER and ADMIN also get the system credentials that keep conversations waiting,
      each with the number of conversations, never their content; a failed check of the audit chain; the company's
      spend alert; spend settled from the relay's count; a member who left; triggers to reassign or whose poll waits;
      a Slack system whose events stopped; and OWNER, open conversations past their retention period. A notice (the
      kinds `counts.notices` counts) carries its `noticeKey`, and the caller dismisses one that only informs them, for
      themselves, until its condition changes.
  - name: Spend
    description: |
      Spend (the package 6 contract, §3.1, §5.1, §5.2; G1 to G3): what each run cost, per model, from LiteLLM's spend
      logs of the requests the model relay tagged with the run (`GATEWAY`), else from the relay's own count of each
      answer's usage at LiteLLM's model prices (`RELAY`); a subscription's run keeps the tokens its sandbox reported,
      without a cost (`SUBSCRIPTION`). The sandbox's own report sets no cost. Every member sees the runs they paid and
      those of the triggers whose author or team they are; OWNER and ADMIN see every run, ADMIN with another person's
      personal conversations folded into one row per person, OWNER with them by key only, never titled. The scope comes
      before every filter and grouping: a conversation the caller may not see filters to nothing, exactly as an unknown
      one. Reading spend is not audited; the CSV export is (`spend.exported`).
  - name: Runs
    description: |
      Runs (the package 3 contract, §3.11, §6): a turn of a conversation is one run, executed in a sandbox on a runner
      host. A run names its person, who pays and with which model access, its host and the host's kind; its events
      are the agent's transcript, also as a live stream. A run follows its conversation (I17): whoever sees the
      conversation sees the run and its events and cancels it, and anyone else gets 404; an OWNER's read of another
      person's run is recorded as a read of the conversation (`conversation.read`). Runs are started by their
      conversations, never by hand.
security:
  - session: []

paths:
  /api/auth/providers:
    get:
      tags: [Auth]
      operationId: getAuthProviders
      summary: List the login methods this instance offers
      description: Public. Also sets the `XSRF-TOKEN` cookie that the SPA needs for `POST /api/auth/login`.
      security: []
      responses:
        '200':
          description: Login methods
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthProviders' }

  /api/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Log in with a local account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Logged in; the session cookie is set
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentUser' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: End the session
      responses:
        '204': { description: Logged out }

  /api/me:
    get:
      tags: [Me]
      operationId: getCurrentUser
      summary: The logged-in user and their company memberships
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/me/password:
    put:
      tags: [Me]
      operationId: changeOwnPassword
      summary: Change the password of the logged-in local user
      description: |
        The user's other sessions are logged out, and their personal access tokens and OAuth grants are revoked.
        Problems: 400 WRONG_PASSWORD when the current password is wrong; 409
        NOT_LOCAL_USER for a user who signs in with an identity provider and has no password.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OwnPasswordChangeRequest' }
      responses:
        '204': { description: Password changed }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/me/tokens:
    get:
      tags: [Tokens]
      operationId: listOwnTokens
      summary: The logged-in user's personal access tokens that are not revoked, newest first
      description: |
        Expired tokens are listed until they are revoked. Neither the token nor its hash is ever returned. A user has
        at most 25 active tokens, so the list is not paged (it holds at most 200, the newest).
      responses:
        '200':
          description: Tokens
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PersonalAccessToken' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Tokens]
      operationId: createOwnToken
      summary: Create a personal access token for the logged-in user. The token is returned once.
      description: |
        Audited as `token.created` in the instance chain. A token expires 90 days after its creation unless it is
        renewed (`expiresAt` may set an earlier expiry, never a later one), and reaches only the companies
        `companyIds` names (absent: every company of the user). Creating one needs
        the current password of a local user (`currentPassword`); a user who signs in with an identity provider has
        none, and needs a session that signed in less than 10 minutes ago. Problems: 400 VALIDATION_FAILED (a blank
        name, an `expiresAt` that is not in the future or more than 90 days ahead, an empty `companyIds` or one that
        names a company the user is not a member of), 400 WRONG_PASSWORD (a local user's `currentPassword` is
        missing or wrong), 403 RECENT_SIGN_IN_REQUIRED (an identity provider's user whose session is older than 10
        minutes: sign in again), 409 TOKEN_LIMIT (the user already has 25 active tokens: revoke one).
        The answer carries `ownerNotice` (security review, row 18; the package 6 contract, §5.6): the companies the
        token reaches, each with its OWNERs, who can read in full the conversations started with the token.
        `/me` shows it when the token is created, since a personal token sees no consent page.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PersonalAccessTokenCreateRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PersonalAccessTokenCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/me/tokens/{tokenId}:
    parameters:
      - $ref: '#/components/parameters/TokenId'
    delete:
      tags: [Tokens]
      operationId: revokeOwnToken
      summary: Revoke one of the logged-in user's personal access tokens. It stops working at once.
      description: |
        Idempotent: revoking a revoked token answers 204 again and changes nothing. Audited as `token.revoked` in
        the instance chain (the first time only). Another user's token, or an unknown id, is 404.
      responses:
        '204': { description: Revoked }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/me/tokens/{tokenId}/renew:
    parameters:
      - $ref: '#/components/parameters/TokenId'
    post:
      tags: [Tokens]
      operationId: renewOwnToken
      summary: Renew one of the logged-in user's personal access tokens for another 90 days from now
      description: |
        The token keeps its secret, name, scope and companies; its `expiresAt` becomes 90 days from now. Audited as
        `token.renewed` in the instance chain. Problems: 404 (another user's token, a revoked or an unknown one), 409
        TOKEN_EXPIRED (an expired token is not renewed: create a new one).
      responses:
        '200':
          description: Renewed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PersonalAccessToken' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/me/oauth/consent:
    get:
      tags: [OAuth]
      operationId: getOAuthConsent
      summary: What a pending authorization request asks for, for the consent page
      description: |
        The authorization server sends the browser to the web app's consent page, `/authorize?client_id=&scope=&state=`;
        the page asks here what to show. The request must be the logged-in user's own and still pending. The company
        is the one of the request's `resource`; the user is a member of it, else the authorization endpoint would
        already have refused the request (`access_denied`, also for an instance admin who is not a member: there is no
        break-glass through a client, the package 6 contract, G9). `ownerNotice` names the company's OWNERs, who can
        read in full the conversations started through the client; the page shows it above the levels. 404 when
        the state is unknown, expired, already decided, of another user, or of another client. The page offers all
        three levels whatever the client asked for, with the requested one preselected; the token carries the level
        the person chose.
      parameters:
        - name: clientId
          in: query
          required: true
          schema: { type: string, maxLength: 500 }
        - name: scope
          in: query
          required: false
          description: The requested scopes, space-separated, as the authorization server passed them
          schema: { type: string, maxLength: 1000 }
        - name: state
          in: query
          required: true
          description: The consent state the authorization server passed (not the client's own state)
          schema: { type: string, maxLength: 500 }
      responses:
        '200':
          description: The pending request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthConsentRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/me/oauth/grants:
    get:
      tags: [OAuth]
      operationId: listOAuthGrants
      summary: The clients the logged-in user authorized, one grant per client and company, newest first
      description: |
        A grant is what the user consented to for one client in one company and has not revoked: its scopes, when
        it was given, and when the client last obtained a token with it. Not paged: a user has few.
      responses:
        '200':
          description: Grants
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/OAuthGrant' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/me/oauth/grants/{grantId}:
    parameters:
      - $ref: '#/components/parameters/GrantId'
    delete:
      tags: [OAuth]
      operationId: revokeOAuthGrant
      summary: Revoke a grant. The client's tokens for that company stop working at once.
      description: |
        Removes every authorization of that client for the logged-in user and that company, with their access and
        refresh tokens, and the user's stored consent of the client when no other company's grant of it remains.
        Idempotent: an unknown or already revoked grant answers 204 as well. Audited as `oauth.grant.revoked` in the
        company's chain when something was revoked.
      responses:
        '204': { description: Revoked }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/companies/{companyId}/outlook/manifest:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
    get:
      tags: [Outlook]
      operationId: getOutlookManifest
      summary: The Outlook add-in's manifest for the company (every member)
      description: |
        The add-in-only XML manifest of Tinfirm's Outlook add-in (ADR-0074), which an Exchange administrator uploads in
        the Microsoft 365 admin center, or a person adds from a file under "My add-ins". It names the task pane at
        `{TINFIRM_PUBLIC_URL}/outlook/{companyId}`, the icons and the app domain at the public URL, the permission
        `ReadItem` and one button on the read surface, which opens a task pane the person may pin. Its add-in id is a
        name-based UUID of the public URL and the company, the same on every download. Nothing in it is secret.
      responses:
        '200':
          description: The manifest
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OutlookManifest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/companies/{companyId}/gmail/deployment:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
    get:
      tags: [Gmail]
      operationId: getGmailDeployment
      summary: The Gmail add-on's deployment file for the company (every member)
      description: |
        The deployment of Tinfirm's Gmail add-on (ADR-0083), which a Google Workspace administrator creates in the
        instance's Google Cloud project with `gcloud workspace-add-ons deployments create`: the scopes (the open
        message, read only; the add-on's execution; the account's email), the homepage and the contextual trigger at
        `{TINFIRM_PUBLIC_URL}/api/gmail/{companyId}/home` and `/open`, the public URL as the one prefix its links may
        open, and the logo. `configured` says whether the operator set `TINFIRM_GMAIL_SERVICE_ACCOUNT` and
        `TINFIRM_GMAIL_CLIENT_ID`, without which the endpoints answer 404. Nothing in it is secret.
      responses:
        '200':
          description: The deployment
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GmailDeployment' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/companies/{companyId}/gmail/links/read:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
    post:
      tags: [Gmail]
      operationId: readGmailLink
      summary: What a Gmail sign-in link links (a signed-in member)
      description: |
        The token is in the body, never in a path: the link carries it in its fragment, which no access log sees. The
        answer names the Google account by the email Google asserted, and when the link was asked for. Reading
        consumes nothing. Problems: 404 (an unknown token, another company's, or a caller who is not an active
        member); 410 GMAIL_LINK_EXPIRED; 409 GMAIL_LINK_USED.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GmailLinkTokenRequest' }
      responses:
        '200':
          description: The link
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GmailLinkRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '410': { $ref: '#/components/responses/Gone' }

  /api/companies/{companyId}/gmail/links/confirm:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
    post:
      tags: [Gmail]
      operationId: confirmGmailLink
      summary: Link the Google account to the caller (a signed-in member)
      description: |
        In one transaction the request is consumed whatever the outcome, and the Google account is linked to the
        caller unless it is another member's (409 IDENTITY_IN_USE). The account's link to the caller, if any, is
        renewed. Audited as `gmail.linked`. Problems: 404; 410 GMAIL_LINK_EXPIRED; 409 GMAIL_LINK_USED; 409
        IDENTITY_IN_USE.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GmailLinkTokenRequest' }
      responses:
        '200':
          description: Linked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GmailLink' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '410': { $ref: '#/components/responses/Gone' }

  /api/companies/{companyId}/gmail/links/{linkId}:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
      - name: linkId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [Gmail]
      operationId: deleteGmailLink
      summary: Disconnect one of the caller's Google accounts from the Gmail add-on
      description: |
        The account then gets the add-on's sign-in card again. Only the caller's own links; another's, or an unknown
        one, is 404. Audited as `gmail.unlinked` with the reason `DISCONNECTED`.
      responses:
        '204': { description: Disconnected }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/me/gmail/links:
    get:
      tags: [Gmail]
      operationId: listMyGmailLinks
      summary: The Google accounts the logged-in user linked for the Gmail add-on, in every company of theirs
      description: Not paged; newest link first. A link unused for 30 days has ended and is not listed.
      responses:
        '200':
          description: Links
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GmailLinkList' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/system/info:
    get:
      tags: [System]
      operationId: getSystemInfo
      summary: Version and build information
      security: []
      responses:
        '200':
          description: System information
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemInfo' }

  /api/companies:
    get:
      tags: [Companies]
      operationId: listCompanies
      summary: Companies the caller is a member of (instance admins see all)
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Companies
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompanyPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/companies/{companyId}:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
    get:
      tags: [Companies]
      operationId: getCompany
      summary: One company (members and instance admins). `myRole` is absent when an instance admin is not a member.
      responses:
        '200':
          description: Company
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Company' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Companies]
      operationId: updateCompany
      summary: Rename a company (OWNER, ADMIN)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompanyUpdateRequest' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Company' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/companies/{companyId}/sign-in:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
    get:
      tags: [SignIn]
      operationId: getCompanySignIn
      summary: The company's sign-in providers, for Settings → Sign-in (OWNER, ADMIN)
      description: |
        The OIDC and SAML providers that fill the company, as the deployment declares them (ADR-0075, ADR-0086
        decision 15): as their own company, or through their role claim (ADR-0089), each with its role, the claim's
        values that give each role here, its email domains and its direct link; a SAML one with the service
        provider's entity ID, ACS URL and metadata URL, the IdP's entity ID, where its metadata comes from, when it was
        last read and its last error, its `validUntil`, and each IdP and SP certificate. Whether the licence serves SAML
        now. `MANAGE_MEMBERS`. Nothing in it can be changed in the app: a provider is the operator's. The company's
        SCIM is `GET /api/companies/{companyId}/scim`.
      responses:
        '200':
          description: The company's sign-in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompanySignIn' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/companies/{companyId}/scim:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
    get:
      tags: [Provisioning]
      operationId: getScimStatus
      summary: The company's SCIM provisioning, for Settings → Sign-in (OWNER, ADMIN)
      description: |
        Whether the deployment allows SCIM for the company (`TINFIRM_COMPANIES_<KEY>_SCIM_ENABLED`, ADR-0087 decision
        2), whether the licence serves it now, the base URL to paste at the identity provider, the role of a new
        member whose request names none, and who decides the role after creation (ADR-0088 decision 8). Every edition,
        so that the page says what is missing.
      responses:
        '200':
          description: The company's SCIM
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScimStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/companies/{companyId}/scim/tokens:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
    get:
      tags: [Provisioning]
      operationId: listScimTokens
      summary: The company's SCIM tokens, revoked ones included, newest first (OWNER, ADMIN)
      description: |
        Every edition, so that a token can be seen and revoked after the licence ended. Neither the token nor its hash
        is ever returned. At most 200, the newest.
      responses:
        '200':
          description: Tokens
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScimTokenList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Provisioning]
      operationId: createScimToken
      summary: Issue a SCIM token for the company's identity provider (OWNER, Enterprise). The token is returned once.
      description: |
        `tfs_` and 43 base64url characters; the server keeps its SHA-256 only (ADR-0087 decision 3,
        `MANAGE_PROVISIONING`). Audited `scim.token.created` in the company's chain. Problems: 400 VALIDATION_FAILED
        (a blank name, an `expiresAt` not in the future), 403 EDITION_REQUIRED (the licence does not hold `SCIM`),
        409 SCIM_NOT_ENABLED (the deployment does not allow SCIM for the company), 409 SCIM_TOKEN_LIMIT (two active
        tokens already: revoke the old one once the identity provider holds the new one).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScimTokenCreateRequest' }
      responses:
        '201':
          description: Issued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScimTokenCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/companies/{companyId}/scim/tokens/{tokenId}:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
      - $ref: '#/components/parameters/TokenId'
    delete:
      tags: [Provisioning]
      operationId: revokeScimToken
      summary: Revoke one of the company's SCIM tokens (OWNER, every edition). It stops working at once.
      description: |
        Idempotent: revoking a revoked token answers 204 again and changes nothing. Audited `scim.token.revoked` in
        the company's chain (the first time only). Another company's token, or an unknown id, is 404.
      responses:
        '204': { description: Revoked }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /scim/v2/Users:
    get:
      tags: [Scim]
      operationId: listScimUsers
      summary: The company's members as SCIM Users (RFC 7644 §3.4.2), filtered and paged
      description: |
        Filters: `userName eq "…"` (case-insensitive), `externalId eq "…"` and `id eq "…"`; any other filter is
        `400 invalidFilter`. Pages of at most 100 (`count`, default 100), 1-based `startIndex` (default 1), ordered by
        the user's id; `startIndex` above 10 000 is `400 invalidValue`. This is the one offset-paged read of the server
        (CONVENTIONS §7). The members of every role, suspended ones included.
      parameters:
        - { name: filter, in: query, required: false, schema: { type: string, maxLength: 1000 } }
        - { name: startIndex, in: query, required: false, schema: { type: integer } }
        - { name: count, in: query, required: false, schema: { type: integer } }
      responses:
        '200':
          description: A `ListResponse` (`urn:ietf:params:scim:api:messages:2.0:ListResponse`)
          content:
            application/scim+json:
              schema: { $ref: '#/components/schemas/ScimResource' }
            application/json:
              schema: { $ref: '#/components/schemas/ScimResource' }
        '400': { $ref: '#/components/responses/ScimProblem' }
        '401': { $ref: '#/components/responses/ScimProblem' }
        '403': { $ref: '#/components/responses/ScimProblem' }
        '429': { $ref: '#/components/responses/ScimProblem' }
    post:
      tags: [Scim]
      operationId: createScimUser
      summary: Create a member (ADR-0087 decision 7), or make an existing user of that email a member
      description: |
        `userName` (the email) and `externalId` are required. A `userName` a member of the company holds is
        `409 uniqueness`. The role is the extension's `role` or `_SCIM_ROLE`; a role that holds a seat becomes
        `viewer` when no seat is free (decision 8). `active: false` creates the member suspended. `password` and every
        attribute Tinfirm does not keep are ignored.
      requestBody:
        required: true
        content:
          application/scim+json:
            schema: { $ref: '#/components/schemas/ScimResource' }
          application/json:
            schema: { $ref: '#/components/schemas/ScimResource' }
      responses:
        '201':
          description: The User as stored
          content:
            application/scim+json:
              schema: { $ref: '#/components/schemas/ScimResource' }
            application/json:
              schema: { $ref: '#/components/schemas/ScimResource' }
        '400': { $ref: '#/components/responses/ScimProblem' }
        '401': { $ref: '#/components/responses/ScimProblem' }
        '403': { $ref: '#/components/responses/ScimProblem' }
        '409': { $ref: '#/components/responses/ScimProblem' }
        '429': { $ref: '#/components/responses/ScimProblem' }

  /scim/v2/Users/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, maxLength: 64 } }
    get:
      tags: [Scim]
      operationId: getScimUser
      summary: A member as a SCIM User; a user who is not a member of the token's company is 404
      responses:
        '200':
          description: The User
          content:
            application/scim+json:
              schema: { $ref: '#/components/schemas/ScimResource' }
            application/json:
              schema: { $ref: '#/components/schemas/ScimResource' }
        '401': { $ref: '#/components/responses/ScimProblem' }
        '403': { $ref: '#/components/responses/ScimProblem' }
        '404': { $ref: '#/components/responses/ScimProblem' }
        '429': { $ref: '#/components/responses/ScimProblem' }
    put:
      tags: [Scim]
      operationId: replaceScimUser
      summary: Replace a member's attributes (RFC 7644 §3.5.1)
      description: |
        The name and `displayName` it omits are cleared, `active` omitted is `true`, `userName` and `externalId` are
        required; the role changes only when the extension is present, so that Okta's whole-user `PUT` never resets
        it. An OWNER's role and `externalId` never change.
      requestBody:
        required: true
        content:
          application/scim+json:
            schema: { $ref: '#/components/schemas/ScimResource' }
          application/json:
            schema: { $ref: '#/components/schemas/ScimResource' }
      responses:
        '200':
          description: The User as stored
          content:
            application/scim+json:
              schema: { $ref: '#/components/schemas/ScimResource' }
            application/json:
              schema: { $ref: '#/components/schemas/ScimResource' }
        '400': { $ref: '#/components/responses/ScimProblem' }
        '401': { $ref: '#/components/responses/ScimProblem' }
        '403': { $ref: '#/components/responses/ScimProblem' }
        '404': { $ref: '#/components/responses/ScimProblem' }
        '409': { $ref: '#/components/responses/ScimProblem' }
        '429': { $ref: '#/components/responses/ScimProblem' }
    patch:
      tags: [Scim]
      operationId: patchScimUser
      summary: Change a member's attributes (RFC 7644 §3.5.2, `PatchOp`)
      description: |
        `add`, `replace` and `remove` in any case, with or without a `path`; values may be strings (`"False"`), as
        Entra ID sends them. `active: false` suspends the member at once, `true` lifts SCIM's suspension only. A
        `remove` of `userName` or `externalId`, or a `replace` of either with an empty value, is `400 invalidValue`;
        deactivating the last active OWNER is `400 mutability` with the detail `LAST_OWNER`.
      requestBody:
        required: true
        content:
          application/scim+json:
            schema: { $ref: '#/components/schemas/ScimResource' }
          application/json:
            schema: { $ref: '#/components/schemas/ScimResource' }
      responses:
        '200':
          description: The User as stored
          content:
            application/scim+json:
              schema: { $ref: '#/components/schemas/ScimResource' }
            application/json:
              schema: { $ref: '#/components/schemas/ScimResource' }
        '400': { $ref: '#/components/responses/ScimProblem' }
        '401': { $ref: '#/components/responses/ScimProblem' }
        '403': { $ref: '#/components/responses/ScimProblem' }
        '404': { $ref: '#/components/responses/ScimProblem' }
        '409': { $ref: '#/components/responses/ScimProblem' }
        '429': { $ref: '#/components/responses/ScimProblem' }
    delete:
      tags: [Scim]
      operationId: deleteScimUser
      summary: The member leaves the company, their content kept (ADR-0087 decision 7); never an erasure
      responses:
        '204': { description: Removed }
        '400': { $ref: '#/components/responses/ScimProblem' }
        '401': { $ref: '#/components/responses/ScimProblem' }
        '403': { $ref: '#/components/responses/ScimProblem' }
        '404': { $ref: '#/components/responses/ScimProblem' }
        '429': { $ref: '#/components/responses/ScimProblem' }

  /scim/v2/ServiceProviderConfig:
    get:
      tags: [Scim]
      operationId: getScimServiceProviderConfig
      summary: What the endpoint supports (RFC 7643 §5)
      responses:
        '200':
          description: The configuration
          content:
            application/scim+json:
              schema: { $ref: '#/components/schemas/ScimResource' }
            application/json:
              schema: { $ref: '#/components/schemas/ScimResource' }
        '401': { $ref: '#/components/responses/ScimProblem' }
        '403': { $ref: '#/components/responses/ScimProblem' }

  /scim/v2/ResourceTypes:
    get:
      tags: [Scim]
      operationId: listScimResourceTypes
      summary: The one resource type, User, with Tinfirm's extension (RFC 7643 §6)
      responses:
        '200':
          description: A `ListResponse` of resource types
          content:
            application/scim+json:
              schema: { $ref: '#/components/schemas/ScimResource' }
            application/json:
              schema: { $ref: '#/components/schemas/ScimResource' }
        '401': { $ref: '#/components/responses/ScimProblem' }
        '403': { $ref: '#/components/responses/ScimProblem' }

  /scim/v2/ResourceTypes/{name}:
    parameters:
      - { name: name, in: path, required: true, schema: { type: string, maxLength: 200 } }
    get:
      tags: [Scim]
      operationId: getScimResourceType
      summary: One resource type by its name, `User` (RFC 7644 §4)
      responses:
        '200':
          description: The resource type
          content:
            application/scim+json:
              schema: { $ref: '#/components/schemas/ScimResource' }
            application/json:
              schema: { $ref: '#/components/schemas/ScimResource' }
        '401': { $ref: '#/components/responses/ScimProblem' }
        '403': { $ref: '#/components/responses/ScimProblem' }
        '404': { $ref: '#/components/responses/ScimProblem' }

  /scim/v2/Schemas:
    get:
      tags: [Scim]
      operationId: listScimSchemas
      summary: The core User schema as Tinfirm serves it, and Tinfirm's extension (RFC 7643 §7)
      responses:
        '200':
          description: A `ListResponse` of schemas
          content:
            application/scim+json:
              schema: { $ref: '#/components/schemas/ScimResource' }
            application/json:
              schema: { $ref: '#/components/schemas/ScimResource' }
        '401': { $ref: '#/components/responses/ScimProblem' }
        '403': { $ref: '#/components/responses/ScimProblem' }

  /scim/v2/Schemas/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, maxLength: 200 } }
    get:
      tags: [Scim]
      operationId: getScimSchema
      summary: One schema by its URI (RFC 7644 §4)
      responses:
        '200':
          description: The schema
          content:
            application/scim+json:
              schema: { $ref: '#/components/schemas/ScimResource' }
            application/json:
              schema: { $ref: '#/components/schemas/ScimResource' }
        '401': { $ref: '#/components/responses/ScimProblem' }
        '403': { $ref: '#/components/responses/ScimProblem' }
        '404': { $ref: '#/components/responses/ScimProblem' }

  /api/companies/{companyId}/members:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
    get:
      tags: [Members]
      operationId: listMembers
      summary: Members of the company (any member)
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Members
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Members]
      operationId: addMember
      summary: Add an existing user to the company by email (OWNER, ADMIN; only OWNER may grant OWNER)
      description: |
        Problems: 404 USER_NOT_FOUND when no user has this email; 409 DUPLICATE_MEMBER when the user is a member
        already.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MemberAddRequest' }
      responses:
        '201':
          description: Added
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Member' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/companies/{companyId}/members/{userId}:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
      - $ref: '#/components/parameters/UserId'
    patch:
      tags: [Members]
      operationId: updateMember
      summary: Change a member's role (OWNER; ADMIN only between non-owner roles)
      description: |
        A role that an identity provider or SCIM decides (`Member.roleManagedBy`, ADR-0088) is not changed here:
        `409 ROLE_MANAGED`, with `details.provider` (the provider's registration id, or `scim`). Making such a member
        OWNER is allowed, since OWNER is never a provider's; their role is then the app's.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MemberUpdateRequest' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Member' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Members]
      operationId: removeMember
      summary: Remove a member (OWNER; ADMIN only for non-owners). The last OWNER cannot be removed.
      description: |
        The member's personal access tokens that name the company, and their OAuth grants for its MCP endpoint, are
        revoked with the membership.
      responses:
        '204': { description: Removed }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/companies/{companyId}/members/{userId}/accounts:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Members]
      operationId: listMemberAccounts
      summary: Which company systems a member holds an account on, and its status (OWNER, ADMIN)
      description: |
        The package 1 contract, I4: others see whether a member holds an account on each system and its status, never
        more: no login, no scopes, no credential, and nothing of the member's personal MCP servers, which only they
        see. Only the member manages their accounts (`/me/accounts`). By system name. Problems: 404 for a user who
        is not a member of the company.
      responses:
        '200':
          description: The member's accounts on company systems
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberAccountList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/companies/{companyId}/members/{userId}/accounts/{systemId}:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
      - $ref: '#/components/parameters/UserId'
      - $ref: '#/components/parameters/SystemId'
    delete:
      tags: [ChatLinks]
      operationId: removeMemberChatAccount
      summary: Remove a member's account on a chat system, its link or its Slack sign-in (OWNER, ADMIN)
      description: |
        The package 5 contract, open point 16: a kill switch for a compromised chat account (R45), an exception to the
        package 1 contract's I4. The member's direct messages are refused until they link again; their open direct
        message conversations stay, readable in the app. Audited as `account.disconnected` with `cause` `admin`.
        Problems: 400 NOT_A_CHAT_ACCOUNT (a system that is not a chat system); 404 for a user who is not a member, or
        who holds no account on the system.
      responses:
        '204': { description: Removed }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/companies/{companyId}/groups:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
    get:
      tags: [Groups]
      operationId: listGroups
      summary: The groups of the company, by name (any member)
      description: |
        Names, descriptions and member counts, so that whoever picks a group can (`VIEW_GROUPS`); the
        members themselves are shown by `getGroup` (OWNER, ADMIN).
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Groups
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroupPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Groups]
      operationId: createGroup
      summary: Create a group of members (OWNER, ADMIN)
      description: |
        A member named twice counts once. Audited as `group.created` (the name and the members by id). Problems:
        400 VALIDATION_FAILED (a name that is blank or longer than 100 characters, a user who is not a member of the
        company, more than 500 members); 409 DUPLICATE_GROUP_NAME (the company has a group with this name, ignoring
        case).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GroupInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Group' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/companies/{companyId}/groups/{groupId}:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
      - $ref: '#/components/parameters/GroupId'
    get:
      tags: [Groups]
      operationId: getGroup
      summary: One group with its members (OWNER, ADMIN)
      responses:
        '200':
          description: Group
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Group' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Groups]
      operationId: replaceGroup
      summary: Replace a group's name, description and members as a whole (OWNER, ADMIN)
      description: |
        A member named twice counts once; an absent or null description clears it. Audited as `group.updated` with
        `changed`, the name, and the members added and removed by id; a request that changes nothing is not.
        Problems as for the create. To add or take out one member, `addGroupMember` and `removeGroupMember` keep a
        change another admin makes to the group at the same moment, which a replace overwrites.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GroupInput' }
      responses:
        '200':
          description: Replaced
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Group' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Groups]
      operationId: deleteGroup
      summary: Delete a group (OWNER, ADMIN)
      description: Audited as `group.deleted` (the name).
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/companies/{companyId}/groups/{groupId}/usage:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
      - $ref: '#/components/parameters/GroupId'
    get:
      tags: [Groups]
      operationId: getGroupUsage
      summary: What a group's members may use through it (OWNER, ADMIN)
      description: |
        The live agents shared with the group, the grants that lend it a system's credential, and the service
        identities whose users it is, each as the company's own list shows it to OWNER and ADMIN (`listAgents` with
        `shares`, `listGrants`, `listServiceIdentities` with `userGroups`), so that the Groups page reads one group
        instead of the company's lists. Each part is answered by the module that keeps it, with a fixed number of
        queries whatever the group holds.
      responses:
        '200':
          description: What the group's members may use through it
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroupUsage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/companies/{companyId}/groups/{groupId}/members/{userId}:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
      - $ref: '#/components/parameters/GroupId'
      - $ref: '#/components/parameters/UserId'
    put:
      tags: [Groups]
      operationId: addGroupMember
      summary: Add one member to a group (OWNER, ADMIN)
      description: |
        Adds this member and touches no other, so that two admins who change the same group's members at the same
        moment both keep their change. Idempotent: a member already in the group changes nothing and is not audited.
        Answers the group with every member, also those another admin added or took out meanwhile, as a replace
        does, so that whoever shows it needs no second read. Audited as `group.updated` with `changed` `members`,
        the name and the member in `added`, and announced, as a replace that adds them. Problems: 400
        VALIDATION_FAILED (a user who is not a member of the company, a group's 501st member).
      responses:
        '200':
          description: The group with its members
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Group' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Groups]
      operationId: removeGroupMember
      summary: Take one member out of a group (OWNER, ADMIN)
      description: |
        Takes out this member and touches no other. Idempotent: a user who is not in the group, a member who left
        the company included, changes nothing and is not audited. Answers the group with every member, as
        `addGroupMember` does. Audited as `group.updated` with `changed` `members`, the name and the member in
        `removed`, and announced, as a replace that takes them out.
      responses:
        '200':
          description: The group with its members
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Group' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/companies/{companyId}/service-identities:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
    get:
      tags: [ServiceIdentities]
      operationId: listServiceIdentities
      summary: The company's service identities, by name (any member)
      description: |
        Names, descriptions, status and whether the caller may use each (`usableByMe`: OWNER may use every one, any
        other member through one of the groups in `userGroups`). Only OWNER and ADMIN see `userGroups`.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Service identities
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceIdentityPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [ServiceIdentities]
      operationId: createServiceIdentity
      summary: Create a service identity (OWNER, ADMIN)
      description: |
        `ACTIVE`, and usable by OWNER only until groups are given the right (`replaceServiceIdentityUsers`). Audited as
        `principal.created` (the kind and the name). Problems: 400 VALIDATION_FAILED (a name that is blank or longer
        than 100 characters, a description longer than 500); 409 DUPLICATE_SERVICE_IDENTITY_NAME (the company has a
        service identity with this name, ignoring case).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServiceIdentityCreateRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceIdentity' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/companies/{companyId}/service-identities/{serviceIdentityId}:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
      - $ref: '#/components/parameters/ServiceIdentityId'
    get:
      tags: [ServiceIdentities]
      operationId: getServiceIdentity
      summary: One service identity (any member)
      responses:
        '200':
          description: Service identity
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceIdentity' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [ServiceIdentities]
      operationId: updateServiceIdentity
      summary: Rename or describe a service identity (OWNER, ADMIN)
      description: |
        Audited as `principal.changed` with `changed` and the name; a request that changes nothing is not. Problems as
        for the create.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServiceIdentityUpdateRequest' }
      responses:
        '200':
          description: Changed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceIdentity' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [ServiceIdentities]
      operationId: deleteServiceIdentity
      summary: Delete a service identity with what it borrows (OWNER, ADMIN)
      description: |
        The credentials lent to it are withdrawn from it (`credential.withdrawn`) and stay with their systems (ADR-0072);
        then `principal.deleted` with the name. Problems: 409 SERVICE_IDENTITY_IN_USE while live triggers use its
        credentials or budget (`details.triggers` names them), or while it borrows a chat system's bot (remove the bot
        on the system's page first).
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/companies/{companyId}/service-identities/{serviceIdentityId}/users:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
      - $ref: '#/components/parameters/ServiceIdentityId'
    put:
      tags: [ServiceIdentities]
      operationId: replaceServiceIdentityUsers
      summary: Replace the groups that may use a service identity (OWNER, ADMIN)
      description: |
        The members of these groups may use the service account on the triggers they set up: in a trigger's table with
        the credentials it borrows (ADR-0072), and as its payer with its budget; OWNER always may, and nobody else,
        ADMIN included, without a group. A group named twice counts once. Audited as
        `service_identity.users_changed` with the groups after the change and those added and removed; a request that
        changes nothing is not. Problems: 400 VALIDATION_FAILED (a group the company does not have, more than 100
        groups).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServiceIdentityUsersRequest' }
      responses:
        '200':
          description: Replaced
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceIdentity' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/companies/{companyId}/service-identities/{serviceIdentityId}/suspend:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
      - $ref: '#/components/parameters/ServiceIdentityId'
    post:
      tags: [ServiceIdentities]
      operationId: suspendServiceIdentity
      summary: Suspend a service identity, the kill switch (OWNER, ADMIN)
      description: |
        The credentials it borrows act for nothing through it (I7) until it is resumed: no binding chooses them
        through it and every use through it of one already bound stops, while the groups' grants of the same
        credentials go on (ADR-0072). The running turns it acts for or pays are cancelled after the commit
        (`run.cancelled`, `cause` `principal.suspended`). An optional `reason` stays on its row. Audited as `principal.suspended`; suspending a
        suspended one changes nothing and is not audited.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServiceIdentitySuspendRequest' }
      responses:
        '200':
          description: Suspended
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceIdentity' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/companies/{companyId}/service-identities/{serviceIdentityId}/resume:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
      - $ref: '#/components/parameters/ServiceIdentityId'
    post:
      tags: [ServiceIdentities]
      operationId: resumeServiceIdentity
      summary: Resume a suspended service identity (OWNER, ADMIN)
      description: Audited as `principal.resumed`; resuming an active one changes nothing and is not audited.
      responses:
        '200':
          description: Active
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceIdentity' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/companies/{companyId}/systems:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
    get:
      tags: [Systems]
      operationId: listSystems
      summary: The company's systems and the caller's own personal MCP servers, by name (any member)
      description: Another member's personal server is never listed, to anyone, admins included.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Systems
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExternalSystemPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Systems]
      operationId: createSystem
      summary: Register a company system (OWNER, ADMIN), or one's own personal MCP server (any member)
      description: |
        The base URL passes the outbound guard: https unless the operator allows http, never a loopback, link-local or
        private address unless the operator allows them; a personal server's never, whatever the operator allows.
        Tinfirm makes the handle from the name, of every kind alike: the name's letters and digits in lower case, `_`
        between words, cut to 17 characters when longer than 20, and `_2`, `_3`… while the company has it already
        (`ops_alerts_2` for `Ops-Alerts` beside `Ops Alerts`), the cut shortened by a longer suffix so that every
        handle fits 20 characters.
        Registrations of a company take their handles one at a time, so two never take one; the handle never changes
        afterwards. A `SLACK` or `TEAMS` system's base URL is fixed (package 5). A `WEBHOOK` system has no base URL:
        Tinfirm generates its secret and answers it once, in `webhook.secret` (package 5, §5.12). Audited as
        `system.created`. A tracker (JIRA_DC, JIRA_CLOUD, GITHUB, GITLAB) takes `pollIntervalSeconds`, how often its
        triggers' polls read it (package 4, §5.4).
        Problems: 400 VALIDATION_FAILED (a `handle`, which is never chosen; a chat or webhook system without its
        settings, or settings of another kind; `pollIntervalSeconds` for another kind than a tracker, or outside 30 to
        3600);
        400 MAPPING_INVALID (a mapping's pointer that is not RFC 6901); 400 WEBHOOK_LIMIT_TOO_HIGH (`maxPerMinute` above
        the company's maximum); 400 INVALID_BASE_URL; 400 SYSTEM_KIND_INVALID (BUZZ is not registered; a base URL for
        GIT, SLACK, TEAMS or WEBHOOK, none for another kind); 400
        PERSONAL_SYSTEM (a personal system that is not MCP); 403 (a company system by a MEMBER); 409
        DUPLICATE_SYSTEM_NAME; 409 PERSONAL_SYSTEMS_OFF; 409 CHAT_WORKSPACE_TAKEN (a Teams tenant the company has a
        system of already).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SystemCreateRequest' }
      responses:
        '201':
          description: Registered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExternalSystem' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/companies/{companyId}/systems/{systemId}:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
      - $ref: '#/components/parameters/SystemId'
    get:
      tags: [Systems]
      operationId: getSystem
      summary: One system (any member; a personal server, its owner only)
      responses:
        '200':
          description: System
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExternalSystem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Systems]
      operationId: updateSystem
      summary: Rename a system or change its settings (OWNER, ADMIN; a personal server, its owner)
      description: |
        The kind never changes, nor does the base URL, except an MCP server's endpoint (ADR-0079): a token is sent only
        where it was connected, so a new `baseUrl` removes every account and credential on the server, each audited
        (`account.disconnected` with the cause `system.moved`, with its grants and lendings), and the app found at the
        old address; the server is `NEW` again, without its last test, and sets its app up again as a new one does.
        Its name, handle, catalogue with its confirmed effects, agents' tools and triggers stay: whoever manages it
        adds a credential and refreshes the tools. Another kind's `baseUrl` is `400 SYSTEM_KIND_INVALID`. Nor does the
        handle change: it names the system's tools in conversations already open and in agents' instructions, so a
        `handle` in the body is `400 VALIDATION_FAILED`, never a silent rename. Audited as `system.changed` with
        `changed`, and for a new endpoint with `baseUrl`, `previousBaseUrl`, `accountsRemoved` and `appRemoved`; a
        request that changes nothing is not. `accountsRequired` false (an MCP server only, ADR-0071), or a new
        endpoint of a server that needs no account, first reaches the server at the endpoint it will have, without a
        credential, `initialize` then `tools/list`, outside any transaction: a server that does not answer both is
        `400 CREDENTIAL_REQUIRED` with its answer, and nothing changes; a paused one is `409 SYSTEM_PAUSED`. Problems
        as for the create.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SystemUpdateRequest' }
      responses:
        '200':
          description: Changed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExternalSystem' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Systems]
      operationId: deleteSystem
      summary: Remove a system with its accounts, grants, repositories and tools (OWNER, ADMIN; a personal server, its owner)
      description: |
        Every account and credential on it is removed (`account.disconnected`, with its secret, its grants and its
        lendings to service accounts, `credential.withdrawn`), its app's client secret is deleted, then
        `system.deleted`.
      responses:
        '204': { description: Removed }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/companies/{companyId}/systems/{systemId}/app:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
      - $ref: '#/components/parameters/SystemId'
    put:
      tags: [Systems]
      operationId: setSystemApp
      summary: Set the system's app, its one OAuth client (OWNER, ADMIN; a personal server, its owner)
      description: |
        The app's callback URL, to register at the system, is `callbackUrl` in the answer, and the system's
        `oauthCallbackUrl` before the app is set. A tracker's endpoints are a
        fixed profile per kind; an MCP server's are discovered (RFC 9728, RFC 8414), and without a `clientId` Tinfirm
        uses its Client ID Metadata Document where the server takes one, else registers itself (RFC 7591). The client
        secret is write-only and kept in the vault: absent keeps the current one while the client id stays, and is
        none for a new client id. On `SLACK` (the package 5 contract, open point 13) it is the Slack app's client id
        and secret, for the user accounts of Slack's `history` tool: Slack's OAuth v2 with the fixed user scopes
        `channels:history` and `groups:history` (no `scopes`; a client secret is required). Audited as
        `system.app_changed`, never with the secret. An MCP server's authorization, token, revocation and registration
        endpoints must share its issuer's origin (scheme, host and port), unless the operator allows their origin
        (`TINFIRM_OAUTH_DISCOVERY_ALLOWEDENDPOINTORIGINS`); otherwise the discovery fails. When the discovery names
        another token or revocation endpoint than the stored app's (or the server has no stored endpoints) while OAuth
        accounts or credentials are on it, the save is 409 SYSTEM_APP_ENDPOINTS_CHANGED with `details` (`changed`,
        `tokenEndpoint`, `previousTokenEndpoint`, `revocationEndpoint`, `previousRevocationEndpoint`, `accounts`: the
        number of members' own OAuth accounts, `credentials`: the OAuth credentials by `id` and `name`) and nothing
        changes; with `confirmEndpointsChange` the save removes them in its transaction, each audited as
        `account.disconnected` with the cause `system.app_endpoints_changed`, with the pending sign-ins, and the audit's
        `system.app_changed` names the endpoints before and after and `accountsRemoved`. Problems: 400
        VALIDATION_FAILED; 400 SYSTEM_KIND_INVALID (GIT, TEAMS, WEBHOOK); 409 OAUTH_NOT_AVAILABLE (an MCP server that
        needs no token, or whose discovery failed, with the reason); 409 SYSTEM_APP_ENDPOINTS_CHANGED.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SystemAppRequest' }
      responses:
        '200':
          description: Set
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExternalSystem' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Systems]
      operationId: removeSystemApp
      summary: Remove the system's app (OWNER, ADMIN; a personal server, its owner)
      description: |
        Clears the OAuth client, its client secret (deleted from the vault), its scopes and endpoints: accounts on the
        system sign in with OAuth no more. Existing accounts stay as they are; an OAuth account whose grant expires
        cannot be refreshed and turns `RECONNECT` then. Audited as `system.app_changed` with `removed`. Problems: 404
        when the system has no app.
      responses:
        '204': { description: Removed }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/companies/{companyId}/systems/{systemId}/test:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
      - $ref: '#/components/parameters/SystemId'
    post:
      tags: [Systems]
      operationId: testSystem
      summary: Reach the system, with an account when there is one (OWNER, ADMIN; a personal server, its owner)
      description: |
        With the credential named (`credentialId`), else the caller's own `OK` account, else the system's only enabled
        `OK` credential (ADR-0072): its "who am I" (its token revealed for this call only, audited as
        `secret.accessed`); without any, a request that needs no credential. The outcome is the system's status, and
        is kept as its `lastTest`: when it ended, whether it passed and why not, who ran it (their principal, never
        their name) and the account or credential it used, replacing the test before. Not audited.
        Problems: 400 SYSTEM_KIND_INVALID (GIT, which has nothing to reach); 404 for a credential not of the system.
      parameters:
        - $ref: '#/components/parameters/ReachCredentialId'
      responses:
        '200':
          description: The outcome
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemTestResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/companies/{companyId}/systems/{systemId}/bot:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
      - $ref: '#/components/parameters/SystemId'
    put:
      tags: [Chat]
      operationId: setChatBot
      summary: Set or replace a chat system's bot, a credential a service account borrows (OWNER, ADMIN)
      description: |
        The package 5 contract, §3.2 and §5.1: the token is checked with the platform first, outside any transaction
        (Slack's `auth.test`, whose workspace becomes the system's `teamId` and whose bot user is kept; Teams' a
        `client_credentials` token for the app), then stored as the chat system's `Bot` credential, a managed company
        secret, lent to the service account (ADR-0072). The only way to set, replace or remove the bot's credential. Audited as
        `system.bot_set` with the account's `account.connected` or `account.reconnected`. Problems: 400
        VALIDATION_FAILED; 400 BOT_IDENTITY_MISMATCH (another workspace or bot user than the system's); 400
        ACCOUNT_REFUSED (the platform refused the token); 400 SYSTEM_KIND_INVALID (not a chat system); 404 (no such
        service identity); 409 PRINCIPAL_SUSPENDED; 409 BOT_ACCOUNT_IN_USE (another service identity borrows the bot:
        remove it first); 409 IDENTITY_IN_USE; 409 SYSTEM_PAUSED (an admin paused the system, the package 6
        contract §5.4: no account is connected on it until it is resumed).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChatBotRequest' }
      responses:
        '200':
          description: The bot
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatBot' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Chat]
      operationId: removeChatBot
      summary: Remove a chat system's bot (OWNER, ADMIN)
      description: |
        The bot's account goes with its secret (`account.disconnected` with `cause` `system.bot_removed`), then
        `system.bot_removed`. Events are verified and dropped unanswered until a bot is set again (`NO_BOT`). Problems:
        404 when the system has no bot.
      responses:
        '204': { description: Removed }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/companies/{companyId}/systems/{systemId}/chat/secrets:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
      - $ref: '#/components/parameters/SystemId'
    put:
      tags: [Chat]
      operationId: setChatSecrets
      summary: Store a Slack system's signing secret or app-level token (OWNER, ADMIN)
      description: |
        Written and never returned (`signingSecretSet`, `appTokenSet`): managed company secrets the system keeps,
        which the Secrets API neither replaces nor deletes. A secret kept in memory by another replica is read again
        on its first refusal, so a new one works at once. Audited as `system.changed` with `changed`
        (`signingSecret`, `appToken`). Problems: 400 VALIDATION_FAILED (neither, a blank one, an app-level token that
        is not `xapp-`); 400 SYSTEM_KIND_INVALID (not a Slack system).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChatSecretsRequest' }
      responses:
        '200':
          description: The system
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExternalSystem' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/companies/{companyId}/systems/{systemId}/chat/manifest:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
      - $ref: '#/components/parameters/SystemId'
    get:
      tags: [Chat]
      operationId: getChatManifest
      summary: The app an admin installs for a chat system (OWNER, ADMIN)
      description: |
        Slack's app manifest (JSON: the bot scopes, events, interactivity and the messages tab; no `message.channels`
        and no history scope for the bot, C7), or Teams' app package (a zip, in base64: the bot in the `personal` and
        `team` scopes, no resource-specific consent, no files). Problems: 400 SYSTEM_KIND_INVALID.
      responses:
        '200':
          description: The manifest
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatManifest' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/companies/{companyId}/systems/{systemId}/chat/channels:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
      - $ref: '#/components/parameters/SystemId'
    get:
      tags: [Chat]
      operationId: listChatChannels
      summary: The channels the bot is in, for a channel trigger's editor (every member)
      description: |
        The package 5 contract, §5.7 and §6: the channels of the chat system the bot is in, not deleted. Public ones,
        and private ones to a linked member the platform says is in them (on Slack `users.conversations` with the
        member's chat user; on Teams the channel's roster), asked outside any transaction; when the platform cannot be
        asked, private channels are left out. On Slack the bot's channels are read again first. Each channel carries
        its kind, whether it is archived, whether a channel trigger is its default (`hasDefault`, whoever's), and the
        live channel triggers on it the caller sees, as the trigger pages show them: a member those they author or are
        in the team of, an OWNER or ADMIN every one. With `authorPrincipalId`, an admin editing a trigger on its
        author's behalf gets the author's channels, private ones included, instead of their own, each still with
        every trigger on it (package 4, decision 7); for anyone else it is 404. Problems: 400 SYSTEM_KIND_INVALID
        (not a chat system).
      parameters:
        - name: query
          in: query
          required: false
          description: Only channels whose name contains this, ignoring case
          schema: { type: string, maxLength: 100 }
        - name: authorPrincipalId
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The channels, by name
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatChannelList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/companies/{companyId}/systems/{systemId}/webhook/rotate:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
      - $ref: '#/components/parameters/SystemId'
    post:
      tags: [Webhooks]
      operationId: rotateWebhookSecret
      summary: A webhook system's new secret (OWNER, ADMIN)
      description: |
        The package 5 contract, §5.12: a new secret (`whsec_` and 32 random bytes in base64), answered once; the
        previous one is accepted for 24 hours while the sender is updated, the one before it goes. With
        `revokePrevious` (a leaked secret) the previous one goes at once too, and `previousUntil` is null: every
        replica refuses it from its next delivery. Audited as `system.webhook_secret_rotated` (with `revokedPrevious`).
        Problems: 400 SYSTEM_KIND_INVALID (not a webhook system).
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WebhookRotateRequest' }
      responses:
        '200':
          description: The new secret
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookSecret' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/companies/{companyId}/systems/{systemId}/webhook/map:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
      - $ref: '#/components/parameters/SystemId'
    post:
      tags: [Webhooks]
      operationId: tryWebhookMapping
      summary: What the mapping reads from a body, and which triggers it would fire (OWNER, ADMIN)
      description: |
        The package 5 contract, §5.12: the body as a delivery's, mapped without storing or firing anything; with the
        live webhook triggers of the system, whether their events and conditions match it, their state, and for each
        that does not match the first event or condition the body fails (`mismatch`). A body the mapping cannot read
        answers its failure. Problems: 400 SYSTEM_KIND_INVALID (not a webhook system).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: What the mapping read
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookMapped' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/companies/{companyId}/systems/{systemId}/webhook/deliveries:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
      - $ref: '#/components/parameters/SystemId'
    get:
      tags: [Webhooks]
      operationId: listWebhookDeliveries
      summary: A webhook system's deliveries, newest first (OWNER, ADMIN)
      description: |
        The package 5 contract, §3.12: each verified delivery once, kept 7 days, its body for 24 hours. A refused
        delivery is not stored (`webhook.refused` in the audit log counts them). Keyset pages; the first one also
        counts the last 7 days' deliveries, those that failed and those refused (`lastSevenDays`).
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: The deliveries
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookDeliveryPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/companies/{companyId}/chat-settings:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
    get:
      tags: [Chat]
      operationId: getChatSettings
      summary: The company's chat rates (OWNER, ADMIN)
      description: |
        The package 5 contract, §5.2 and open point 11: messages a minute and a day per chat user, events a minute per
        chat system; the instance's values until an admin sets them. The body's size limit stays the operator's.
      responses:
        '200':
          description: The rates
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatSettings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Chat]
      operationId: setChatSettings
      summary: Set the company's chat rates (OWNER, ADMIN)
      description: |
        Audited as `chat.settings_changed`. Problems: 400 VALIDATION_FAILED (a value out of its range, or no
        `version`); 409 SETTINGS_CHANGED (the rates changed since the version the caller read; nothing is written).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChatSettings' }
      responses:
        '200':
          description: The rates
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatSettings' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/companies/{companyId}/chat-links/read:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
    post:
      tags: [ChatLinks]
      operationId: readChatLink
      summary: What a sign-in link links (a signed-in member)
      description: |
        The token is in the body, never in a path: the link carries it in its fragment, which no access log sees. The
        answer names the chat user by what they cannot choose (their id, the workspace's name and id, when they asked
        for the link) beside the display name anyone can set, and whether the caller may confirm it; and who the
        platform says the chat user is now (`platformName`, Slack's `avatar`), which the server asks with the bot's
        credential as the page loads. Reading consumes nothing. Problems: 404 (an unknown token, another company's, or a caller without a principal); 410
        CHAT_LINK_EXPIRED; 409 CHAT_LINK_USED.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChatLinkTokenRequest' }
      responses:
        '200':
          description: The link
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatLink' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '410': { $ref: '#/components/responses/Gone' }

  /api/companies/{companyId}/chat-links/confirm:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
    post:
      tags: [ChatLinks]
      operationId: confirmChatLink
      summary: Link the chat user to the caller's account (a signed-in member)
      description: |
        The package 5 contract, §5.4: in one transaction, the request consumed whatever the outcome; the chat user
        still a member of the workspace; nobody's yet; the caller holding no other identity on the system. The link is
        the caller's `LINK` account (`account.connected` with `how` `SIGN_IN_LINK`); the direct message is told, the
        messages it held are dropped, not sent (whoever confirmed may not be whoever wrote them; the direct message
        asks the chat user to send them again), and the caller's inbox holds the link with its unlink for 7 days. Problems: 404;
        410 CHAT_LINK_EXPIRED; 409 CHAT_LINK_USED; 409 IDENTITY_IN_USE; 409 ALREADY_LINKED.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChatLinkTokenRequest' }
      responses:
        '200':
          description: Linked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatLink' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '410': { $ref: '#/components/responses/Gone' }

  /api/companies/{companyId}/me/chat:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
    get:
      tags: [ChatLinks]
      operationId: getMyChatPreference
      summary: The agent one's direct messages go to without a handle (every member)
      responses:
        '200':
          description: The preference
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatPreference' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [ChatLinks]
      operationId: setMyChatPreference
      summary: Set the agent one's direct messages go to without a handle (every member)
      description: |
        An agent the caller uses; null for none (the bot then shows a picker). Problems: 404 (an agent the caller does
        not see); 403 AGENT_NOT_USABLE.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChatPreference' }
      responses:
        '200':
          description: The preference
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatPreference' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/companies/{companyId}/systems/{systemId}/repositories:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
      - $ref: '#/components/parameters/SystemId'
    get:
      tags: [Systems]
      operationId: listSystemRepositories
      summary: A code host's repositories, by name (any member)
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Repositories
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemRepositoryPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Systems]
      operationId: addSystemRepository
      summary: Add a repository to a code host by its URL (OWNER, ADMIN)
      description: |
        An https URL without credentials, a query or a fragment, on the system's host for GITHUB (`owner/repo`) and
        GITLAB (a project path). Audited as `repository.added`. Problems: 400 VALIDATION_FAILED; 400
        SYSTEM_KIND_INVALID (not GITHUB, GITLAB or GIT); 409 DUPLICATE_REPOSITORY.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SystemRepositoryCreateRequest' }
      responses:
        '201':
          description: Added
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemRepository' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/companies/{companyId}/systems/{systemId}/repositories/{repositoryId}:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
      - $ref: '#/components/parameters/SystemId'
      - $ref: '#/components/parameters/RepositoryId'
    delete:
      tags: [Systems]
      operationId: removeSystemRepository
      summary: Remove a repository from a code host (OWNER, ADMIN)
      description: Audited as `repository.removed`.
      responses:
        '204': { description: Removed }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/companies/{companyId}/systems/{systemId}/tools:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
      - $ref: '#/components/parameters/SystemId'
    get:
      tags: [Systems]
      operationId: listSystemTools
      summary: The tools a system serves, by name (any member who sees it)
      description: |
        A tracker's fixed catalogue, or an MCP server's catalogue as the last refresh found it, with each tool's
        effect: an MCP tool's is `UNKNOWN` until confirmed, and `UNKNOWN` counts as `WRITE` everywhere.
      responses:
        '200':
          description: Tools
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemToolList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/companies/{companyId}/systems/{systemId}/tools/refresh:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
      - $ref: '#/components/parameters/SystemId'
    post:
      tags: [Systems]
      operationId: refreshSystemTools
      summary: Read an MCP server's catalogue again (OWNER, ADMIN; a personal server, its owner)
      description: |
        With the credential named (`credentialId`), else the caller's own `OK` account, else the system's only enabled
        `OK` credential (ADR-0072), else without a credential. New tools are added as `UNKNOWN` and enabled; tools the
        server no longer lists are removed; a tool whose description, schema or hints changed loses its confirmed
        effect. Audited as `system.tools_refreshed` when something changed. A server that could not be read answers
        `ok: false` with the reason and keeps the catalogue, and the system's `status` turns `ERROR`; except a server
        that asks for a credential when none was given (`credentialRequired` without `withAccount`): it was reached, as
        a test without an account finds, and whoever manages it adds a credential and refreshes again. A catalogue
        beyond Tinfirm's caps (a `tools/list` page larger than 1 MiB, more than 500 tools, an `inputSchema` larger than
        64 KiB, more than 2 MiB in all) is a server that could not be read, with the cap as the reason. One refresh
        per server and minute (per replica): another is 429 RATE_LIMITED with `Retry-After`, before anything is sent.
        Problems: 400 SYSTEM_KIND_INVALID (not MCP); 404 for a credential not of the system; 429 RATE_LIMITED.
      parameters:
        - $ref: '#/components/parameters/ReachCredentialId'
      responses:
        '200':
          description: The outcome
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemToolRefresh' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/companies/{companyId}/systems/{systemId}/tools/{toolName}:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
      - $ref: '#/components/parameters/SystemId'
      - $ref: '#/components/parameters/ToolName'
    patch:
      tags: [Systems]
      operationId: updateSystemTool
      summary: Confirm an MCP tool's effect, or switch it on or off (OWNER, ADMIN; a personal server, its owner)
      description: |
        Audited as `system.tool_effect_confirmed` (a confirmation, also of the same effect again) and
        `system.tool_switched`. Problems: 400 VALIDATION_FAILED; 400 SYSTEM_KIND_INVALID (a fixed tool).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SystemToolUpdateRequest' }
      responses:
        '200':
          description: Changed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemTool' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/companies/{companyId}/system-settings:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
    get:
      tags: [Systems]
      operationId: getSystemSettings
      summary: The company's settings of systems (any member)
      responses:
        '200':
          description: Settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemSettings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Systems]
      operationId: replaceSystemSettings
      summary: Switch personal MCP servers on or off (OWNER, ADMIN)
      description: |
        Off: existing personal servers stay, but bind for nobody until it is on again, and registering one answers
        409 PERSONAL_SYSTEMS_OFF. Audited as `system.settings_changed` when it changes.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SystemSettings' }
      responses:
        '200':
          description: Settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemSettings' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/companies/{companyId}/me/accounts:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
    get:
      tags: [Accounts]
      operationId: listMyAccounts
      summary: The caller's accounts, per system they see
      description: |
        Per system (the company's and the caller's own personal servers, by name): the caller's own account and its
        status, else the grants the caller would act with (every usable one, the one a conversation would take first),
        what a conversation would bind now (`binding`), and how to connect. Never a webhook system: it takes deliveries
        under its signing secret and holds no one's account.
      responses:
        '200':
          description: The caller's accounts
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MyAccountList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/companies/{companyId}/me/accounts/{systemId}:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
      - $ref: '#/components/parameters/SystemId'
    delete:
      tags: [Accounts]
      operationId: disconnectMyAccount
      summary: Disconnect the caller's own account on a system
      description: |
        Revokes the grant where the system offers revocation, deletes the account with its secret. Audited as
        `account.disconnected`.
      responses:
        '204': { description: Disconnected }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/companies/{companyId}/me/accounts/{systemId}/token:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
      - $ref: '#/components/parameters/SystemId'
    put:
      tags: [Accounts]
      operationId: storeMyAccountToken
      summary: Store a token as the caller's own account on a system
      description: |
        Checked with the system's "who am I" (an MCP server: an `initialize` with it; GIT: taken as it is) and refused
        if the system refuses it. The token is kept in a secret the caller owns, which no Secrets page lists and only
        a call acting as the caller reveals. Jira Cloud takes `email:api-token`. Audited as `account.connected` or
        `account.reconnected`, a refusal as `account.refused`; never with the token. Answers the account with
        `binding`, what a conversation of the caller binds now, as `listMyAccounts` would say it (the answer stays an
        `Account`: the list's `MyAccount` per system is read again with `listMyAccounts`). A refusal's `detail` names
        the system by its name. Problems: 400 ACCOUNT_REFUSED; 400 SYSTEM_KIND_INVALID (a chat or webhook system: a
        Slack account is connected by signing in); 409 IDENTITY_IN_USE (another member's own account or a credential
        of the system is this user: `details.holder` `MEMBER`, never named, or `CREDENTIAL` with `credentialName`); 409
        PERSONAL_SYSTEMS_OFF; 409 SYSTEM_MOVED (an MCP server moved to another endpoint while the token was checked
        at the one before, ADR-0079: nothing is stored; connect it again).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountTokenRequest' }
      responses:
        '200':
          description: Connected
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/companies/{companyId}/me/accounts/{systemId}/oauth:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
      - $ref: '#/components/parameters/SystemId'
    post:
      tags: [Accounts]
      operationId: startMyAccountSignIn
      summary: Start a sign-in with the system's app for the caller's own account
      description: |
        Answers the authorization URL to send the browser to. The sign-in is bound to the caller's session, expires in
        10 minutes and is consumed once by `GET /api/oauth/callback`, which returns to `returnTo`. On `SLACK` (the
        package 5 contract, open point 13) it signs in to Slack through the app's user scopes `channels:history` and
        `groups:history`, for Slack's `history` tool: the `OAUTH` account is also the member's link to that Slack user,
        and replaces their `LINK` of the same user only (`already_linked` otherwise). Problems: 400 VALIDATION_FAILED
        (a `returnTo` that is not a path of this site); 400 SYSTEM_KIND_INVALID (TEAMS, WEBHOOK); 409
        OAUTH_NOT_AVAILABLE; 409 PERSONAL_SYSTEMS_OFF.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SignInRequest' }
      responses:
        '200':
          description: Where to send the browser
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SignInStart' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/companies/{companyId}/service-identities/{serviceIdentityId}/credentials:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
      - $ref: '#/components/parameters/ServiceIdentityId'
    get:
      tags: [Credentials]
      operationId: listServiceIdentityCredentials
      summary: The credentials a service account borrows, by system name (OWNER, ADMIN)
      description: |
        Lent on each system's page (`lendSystemCredential`); a chat system's bot among them.
      responses:
        '200':
          description: What it borrows
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BorrowedCredentialList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/companies/{companyId}/systems/{systemId}/credentials:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
      - $ref: '#/components/parameters/SystemId'
    get:
      tags: [Credentials]
      operationId: listSystemCredentials
      summary: A company system's credentials, by name, with the groups and service accounts they are lent to (OWNER, ADMIN)
      responses:
        '200':
          description: Its credentials
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemCredentialList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Credentials]
      operationId: addSystemCredential
      summary: Add a token as a credential of a company system (OWNER, ADMIN)
      description: |
        Checked with the system's "who am I" (an MCP server: an `initialize` with it, in the system's `authHeader`; GIT:
        taken as it is) and refused if the system refuses it. Kept in a managed company secret (`SYSTEM_CREDENTIAL`).
        Lent to nobody yet. Audited as `account.connected` with the credential's name, a refusal as `account.refused`;
        never with the token. Problems: 400 ACCOUNT_REFUSED; 400 PERSONAL_SYSTEM (a personal server holds its owner's
        account only); 400 SYSTEM_KIND_INVALID (a chat or webhook system: a bot is set with `setChatBot`); 409
        DUPLICATE_CREDENTIAL_NAME; 409 IDENTITY_IN_USE (a member's own account is this user: `details.holder`
        `MEMBER`); 409 SYSTEM_PAUSED; 409 SYSTEM_MOVED (an MCP server moved to another endpoint while the token was
        checked at the one before, ADR-0079: nothing is stored).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SystemCredentialCreateRequest' }
      responses:
        '201':
          description: Added
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemCredential' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/companies/{companyId}/systems/{systemId}/credentials/oauth:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
      - $ref: '#/components/parameters/SystemId'
    post:
      tags: [Credentials]
      operationId: startSystemCredentialSignIn
      summary: Start a sign-in with the system's app for a new credential (OWNER, ADMIN)
      description: |
        The admin signs in at the system as the user the credential should be; the callback stores the grant as a new
        credential with the name. On `SLACK`, a Slack user's sign-in for `history`. Problems as for `addSystemCredential`,
        and 409 OAUTH_NOT_AVAILABLE.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SystemCredentialSignInRequest' }
      responses:
        '200':
          description: Where to send the browser
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SignInStart' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/companies/{companyId}/systems/{systemId}/credentials/client:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
      - $ref: '#/components/parameters/SystemId'
    post:
      tags: [Credentials]
      operationId: addSystemCredentialClient
      summary: Add an OAuth client's own credentials as a credential of a Jira Cloud system (OWNER, ADMIN)
      description: |
        An Atlassian service account's OAuth 2.0 credential (`client_credentials`), kind `CLIENT`. Tinfirm mints an
        access token with it at Atlassian's token endpoint, reads the site's cloud id from its `/_edge/tenant_info` and
        asks `myself` through Atlassian's gateway (`https://api.atlassian.com/ex/jira/{cloudId}`); a refusal of either
        is 400 ACCOUNT_REFUSED. It then calls Jira through the gateway, and mints the next token itself when one expires:
        no sign-in, no refresh token, no system's app. Kept in a managed company secret (`SYSTEM_CREDENTIAL`) with the
        token it minted last. Lent to nobody yet. Audited as `account.connected` with the credential's name, a refusal
        as `account.refused`; never with the secret. Problems as for `addSystemCredential` (409 SYSTEM_MOVED among
        them); 400 SYSTEM_KIND_INVALID for a system of another kind than `JIRA_CLOUD`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SystemCredentialClientCreateRequest' }
      responses:
        '201':
          description: Added
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemCredential' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/companies/{companyId}/systems/{systemId}/credentials/{credentialId}:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
      - $ref: '#/components/parameters/SystemId'
      - $ref: '#/components/parameters/CredentialId'
    patch:
      tags: [Credentials]
      operationId: updateSystemCredential
      summary: Rename a credential, or disable or enable it (OWNER, ADMIN)
      description: |
        Disabling it stops every use of it, by groups and service accounts, at its next check (as a credential to sign
        in again, `RECONNECT_COMPANY`), until it is enabled again. Audited as `credential.changed`. Problems: 409
        DUPLICATE_CREDENTIAL_NAME; 409 BOT_ACCOUNT_IN_USE (the chat system's bot is disabled by removing it).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SystemCredentialUpdateRequest' }
      responses:
        '200':
          description: The credential
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemCredential' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Credentials]
      operationId: removeSystemCredential
      summary: Remove a credential (OWNER, ADMIN)
      description: |
        Its grants go first (`grant.deleted`), then its lendings to service accounts (`credential.withdrawn`), then the
        credential with its secret (`account.disconnected`), revoking its OAuth grant where the system offers
        revocation. Triggers that act with it pause until their author names another. Problems: 409 BOT_ACCOUNT_IN_USE
        (the chat system's bot goes with `removeChatBot`).
      responses:
        '204': { description: Removed }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/companies/{companyId}/systems/{systemId}/credentials/{credentialId}/token:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
      - $ref: '#/components/parameters/SystemId'
      - $ref: '#/components/parameters/CredentialId'
    put:
      tags: [Credentials]
      operationId: storeSystemCredentialToken
      summary: Store a new token for a credential (OWNER, ADMIN)
      description: |
        Checked as `addSystemCredential` checks one; the credential keeps its name, grants and lendings and is `OK` again.
        Audited as `account.reconnected`. Problems as for `addSystemCredential`, and 409 BOT_ACCOUNT_IN_USE.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountTokenRequest' }
      responses:
        '200':
          description: The credential
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemCredential' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/companies/{companyId}/systems/{systemId}/credentials/{credentialId}/client:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
      - $ref: '#/components/parameters/SystemId'
      - $ref: '#/components/parameters/CredentialId'
    put:
      tags: [Credentials]
      operationId: storeSystemCredentialClient
      summary: Store new client credentials for a credential of a Jira Cloud system (OWNER, ADMIN)
      description: |
        Checked as `addSystemCredentialClient` checks them; the credential becomes `CLIENT`, keeps its name, grants and
        lendings and is `OK` again. Audited as `account.reconnected`. Problems as for `addSystemCredentialClient`, and
        409 BOT_ACCOUNT_IN_USE.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountClientRequest' }
      responses:
        '200':
          description: The credential
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemCredential' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/companies/{companyId}/systems/{systemId}/credentials/{credentialId}/oauth:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
      - $ref: '#/components/parameters/SystemId'
      - $ref: '#/components/parameters/CredentialId'
    post:
      tags: [Credentials]
      operationId: startSystemCredentialSignInAgain
      summary: Sign a credential in again with the system's app (OWNER, ADMIN)
      description: |
        As `startSystemCredentialSignIn`; the callback replaces the credential's grant and keeps its name, grants and
        lendings. Problems as there, and 409 BOT_ACCOUNT_IN_USE.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SignInRequest' }
      responses:
        '200':
          description: Where to send the browser
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SignInStart' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/companies/{companyId}/systems/{systemId}/credentials/{credentialId}/service-accounts/{serviceIdentityId}:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
      - $ref: '#/components/parameters/SystemId'
      - $ref: '#/components/parameters/CredentialId'
      - $ref: '#/components/parameters/ServiceIdentityId'
    put:
      tags: [Credentials]
      operationId: lendSystemCredential
      summary: Lend a credential to a service account, or change its access (OWNER, ADMIN)
      description: |
        A service account borrows at most one credential per system: this one replaces what it borrowed there. Its
        triggers that act with the one it replaces follow it: their rows name this one at once
        (`trigger.accounts_changed`, `why` `lending.replaced`), their open conversations bind it at their next check,
        and each author is told in their inbox (`TRIGGER`, `CHANGED_BY_ADMIN`) unless they lent it themselves. Audited
        as `credential.lent`.
        Problems: 409 BOT_ACCOUNT_IN_USE (the chat system's bot is lent with `setChatBot`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CredentialLendRequest' }
      responses:
        '200':
          description: The credential
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemCredential' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Credentials]
      operationId: withdrawSystemCredential
      summary: Withdraw a credential from a service account (OWNER, ADMIN)
      description: |
        Its triggers that act with it stop and pause until their author names another. Audited as
        `credential.withdrawn`. Problems: 409 BOT_ACCOUNT_IN_USE (the chat system's bot goes with `removeChatBot`).
      responses:
        '204': { description: Withdrawn }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/companies/{companyId}/grants:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
    get:
      tags: [Grants]
      operationId: listGrants
      summary: The company's grants, oldest first (OWNER, ADMIN)
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Grants
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountGrantPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Grants]
      operationId: createGrant
      summary: Lend a system's credential to a group (OWNER, ADMIN)
      description: |
        Its members may then act with the credential in their own conversations, `READ` (no write tool) or `WRITE`.
        Audited as `grant.created`. Problems: 400 VALIDATION_FAILED (a group the company does not have); 400
        GRANT_NOT_SERVICE when `credentialId` names a member's own account, not one of a system's credentials: only
        credentials are lent (I5); 400 BOT_ACCOUNT (a chat system's bot); 409 DUPLICATE_GRANT.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountGrantCreateRequest' }
      responses:
        '201':
          description: Lent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountGrant' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/companies/{companyId}/grants/{grantId}:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
      - $ref: '#/components/parameters/GrantId'
    patch:
      tags: [Grants]
      operationId: updateGrant
      summary: Change a grant's access (OWNER, ADMIN)
      description: Audited as `grant.changed`; a request that changes nothing is not. A use reads the access anew.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountGrantUpdateRequest' }
      responses:
        '200':
          description: Changed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountGrant' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Grants]
      operationId: deleteGrant
      summary: Withdraw a grant (OWNER, ADMIN)
      description: Audited as `grant.deleted`. A conversation bound through it stops at its next use.
      responses:
        '204': { description: Withdrawn }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/companies/{companyId}/agents:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
    get:
      tags: [Agents]
      operationId: listAgents
      summary: The agents the caller sees, by name (any member)
      description: |
        Their own agents, those shared with one of their groups or with them, and for OWNER and ADMIN every agent of
        the company; each with whether the caller may use it (`usableByMe`: its owner, a member of a group it is shared
        with, or a member it is shared with) and edit it (`editableByMe`: its owner, OWNER, ADMIN), and the groups and
        members it is shared with (`shareGroupIds`, `sharePrincipalIds`). Deleted agents are not listed.
      parameters:
        - name: usable
          in: query
          required: false
          description: Only the agents the caller may use
          schema: { type: boolean, default: false }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Agents
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Agents]
      operationId: createAgent
      summary: Create an agent; the caller becomes its owner (any member)
      description: |
        Version 1, `ACTIVE`, private to the caller until shared. Without a handle one is made from the name (ADR-0034).
        Optionally with its systems, repositories, hosts and shares (`shareGroupIds`, `sharePrincipalIds`), as the four
        `PUT`s below take them. Audited as
        `agent.created` (name, handle, runtimes, owner; never the description or the instructions), and as
        `agent.tools_changed`, `agent.repositories_changed`, `agent.hosts_changed` and `agent.shares_changed` for what
        it was created with. Problems: 400 VALIDATION_FAILED; 400 PERSONAL_SYSTEM (a personal MCP server: one adds it
        in one's settings), SYSTEM_KIND_INVALID, UNKNOWN_TOOL, SYSTEM_NOT_ON_AGENT; 409 DUPLICATE_AGENT_NAME,
        DUPLICATE_AGENT_HANDLE (among the live agents). 404 for a caller without a principal in the company (an
        instance admin who is not a member).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentCreateRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Agent' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/companies/{companyId}/agents/{agentId}:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
      - $ref: '#/components/parameters/AgentId'
    get:
      tags: [Agents]
      operationId: getAgent
      summary: An agent's definition (who sees it)
      description: |
        The definition, its systems with their tools and modes, repositories, hosts and shares; for a caller who may
        use it, the version they accepted and what the current version adds over it (`widening`).
      responses:
        '200':
          description: The agent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Agent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Agents]
      operationId: updateAgent
      summary: Rename an agent, or change its handle, description, instructions or runtimes (who edits it)
      description: |
        Absent fields stay. A change makes a new version and is audited as `agent.changed` with the fields changed; a
        request that changes nothing is not. A change of the instructions widens when the agent's ceiling can act (a
        tool `ALLOW` chosen for a write, a repository at `WRITE`, or a network host: `agent.widened` with
        `instructions` `changed`, and each person's conversations keep the instructions they accepted until they
        accept it); otherwise it is audited as `agent.instructions_changed` and applies to everyone's next turn, which
        says so in each conversation. Descriptions, names and runtimes follow the current version for everyone. Problems: 400 VALIDATION_FAILED; 403 AGENT_NOT_EDITABLE; 409
        DUPLICATE_AGENT_NAME, DUPLICATE_AGENT_HANDLE.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentUpdateRequest' }
      responses:
        '200':
          description: Changed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Agent' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Agents]
      operationId: deleteAgent
      summary: Delete an agent (who edits it)
      description: |
        A soft delete: the agent stays for its conversations' history, and its name and handle are free again. Its
        shares and every person's settings go; its conversations end (`AGENT_DELETED`). Refused while a run of it is
        queued or running (409 AGENT_HAS_ACTIVE_RUNS). Audited as `agent.deleted`. 403 AGENT_NOT_EDITABLE.
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/companies/{companyId}/agents/{agentId}/systems:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
      - $ref: '#/components/parameters/AgentId'
    put:
      tags: [Agents]
      operationId: replaceAgentSystems
      summary: Replace the agent's systems and, per system, its tools with their modes (who edits it)
      description: |
        As a whole. A system without `tools` keeps its tools when the agent lists it already, and gets every tool its
        system serves when it is new to the agent: reads `ALLOW`, writes and unconfirmed tools `ASK`. `tools: []` lists
        none (a code host for its repositories only). A removed system takes its tools and repositories off the agent,
        and out of every conversation's next turn. A tool row whose tool its system no longer serves may stay
        (`offered: false`). A tool sent with `chosenForEffect` is chosen anew for that effect (I19): an "Allowed" whose
        tool became a write, which counts as "Needs approval", is confirmed for writes by sending `ALLOW` with `WRITE`;
        without it an unchanged mode keeps the effect it was chosen for, so that saving another part never widens it.
        Makes a new version, which widens when it adds a system or a tool, or raises a tool towards `ALLOW` (an `ALLOW`
        confirmed for writes included); audited as `agent.tools_changed` with the whole list after the change, and
        `agent.widened`. A `SLACK` system serves Slack's `history` (`READ`, the package 5 contract, open point 13).
        Problems: 400 VALIDATION_FAILED (an unknown system); 400 PERSONAL_SYSTEM (a personal MCP server),
        SYSTEM_KIND_INVALID (a system without tools or repositories: TEAMS, WEBHOOK), UNKNOWN_TOOL (a tool its system
        does not serve, or switched off, with `details.systemId` and `details.tool`); 403 AGENT_NOT_EDITABLE.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentSystemsRequest' }
      responses:
        '200':
          description: Replaced
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Agent' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/companies/{companyId}/agents/{agentId}/repositories:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
      - $ref: '#/components/parameters/AgentId'
    put:
      tags: [Agents]
      operationId: replaceAgentRepositories
      summary: Replace the agent's repositories with their access (who edits it)
      description: |
        As a whole, at most 100, each a repository of a code host the agent lists. Makes a new version, which widens
        when it adds a repository or raises one to `WRITE`; audited as `agent.repositories_changed` with the whole list.
        Problems: 400 VALIDATION_FAILED (an unknown repository, more than 100); 400 SYSTEM_NOT_ON_AGENT (its system is
        not on the agent, with `details.repositoryId`); 403 AGENT_NOT_EDITABLE.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentRepositoriesRequest' }
      responses:
        '200':
          description: Replaced
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Agent' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/companies/{companyId}/agents/{agentId}/hosts:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
      - $ref: '#/components/parameters/AgentId'
    put:
      tags: [Agents]
      operationId: replaceAgentHosts
      summary: Replace the network hosts the agent's runs may reach (who edits it)
      description: |
        As a whole, at most 100 hosts. A host is `HOST[:PORT]` or `*.example.com[:PORT]` (a wildcard only as the first
        label, with two labels after it, never over a public suffix or shared hosting such as `*.github.io`), without a
        scheme, path or IP address; stored in lower case without `:443`, a host named twice counting once. Makes a new
        version, which widens when it adds a host that none of the previous version covered; audited as
        `agent.hosts_changed` with the whole list. Problems: 400 VALIDATION_FAILED naming the rule, or for more than
        100; 403 AGENT_NOT_EDITABLE.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentHostsRequest' }
      responses:
        '200':
          description: Replaced
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Agent' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/companies/{companyId}/agents/{agentId}/shares:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
      - $ref: '#/components/parameters/AgentId'
    put:
      tags: [Agents]
      operationId: replaceAgentShares
      summary: Replace the groups and the members who may use the agent (who edits it)
      description: |
        As a whole: at most 50 groups of the company, and at most 100 members by their principal (`principalIds`, each
        a member of the company who has not left; absent: the members it is shared with stay). The limits count the
        entries of the request (the schema's `maxItems`); within them, one named twice counts once. A member it is
        shared with uses it as a member of one of its groups does, whether or not they are in any group. Not a change
        of the definition: no version. Audited as `agent.shares_changed` with the groups and the members after the
        change and those added and removed. Problems: 400 VALIDATION_FAILED (a group the company does not have, a
        principal that is not a current member's, more than 50 group or 100 principal entries); 403
        AGENT_NOT_EDITABLE.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentSharesRequest' }
      responses:
        '200':
          description: Replaced
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Agent' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/companies/{companyId}/agents/{agentId}/pause:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
      - $ref: '#/components/parameters/AgentId'
    post:
      tags: [Agents]
      operationId: pauseAgent
      summary: Pause an agent, the kill switch (who edits it)
      description: |
        Its conversations start no turn and run no approved call until it is resumed (I18). With `stopRunning` its
        running turns are cancelled as well (open point 12). Audited as `agent.paused` with `stopRunning` and the runs
        cancelled; pausing a paused agent changes nothing and is not audited. 403 AGENT_NOT_EDITABLE.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentPauseRequest' }
      responses:
        '200':
          description: Paused
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Agent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/companies/{companyId}/agents/{agentId}/resume:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
      - $ref: '#/components/parameters/AgentId'
    post:
      tags: [Agents]
      operationId: resumeAgent
      summary: Resume a paused agent (who edits it)
      description: |
        Audited as `agent.resumed`; resuming an active agent changes nothing and is not audited. 403
        AGENT_NOT_EDITABLE.
      responses:
        '200':
          description: Active
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Agent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/companies/{companyId}/agents/{agentId}/accept:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
      - $ref: '#/components/parameters/AgentId'
    post:
      tags: [Agents]
      operationId: acceptAgentVersion
      summary: Accept the agent's widening up to a version, for the caller's own conversations (who may use it)
      description: |
        The caller's settings record the version (made now when the caller has none): from their next turn, their
        conversations use the agent as of the current version narrowed by this one. The app offers it with what widened
        (`Agent.widening`), naming the version it showed, so that a later widening is never accepted unseen. Accepting a
        version at or below the one accepted changes nothing. Audited as `agent.accepted` with the version. Problems:
        400 VALIDATION_FAILED (not a version of the agent); 403 AGENT_NOT_USABLE.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentAcceptRequest' }
      responses:
        '200':
          description: Accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentSettings' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/companies/{companyId}/agents/{agentId}/readiness:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
      - $ref: '#/components/parameters/AgentId'
    get:
      tags: [Agents]
      operationId: getAgentReadiness
      summary: Before a conversation, whether the agent can work for the caller now (who may use it)
      description: |
        For the caller, nothing stored: the settings in effect; who pays (their budget's state and reset, or their
        subscription's); per system of the agent as they use it (and their own MCP servers), how a conversation would
        bind it now (package 1's binding rule); and whether a runner host can run it with the starting workspace's
        accounts and that model access (package 2's host scope rule). 403 AGENT_NOT_USABLE.
      responses:
        '200':
          description: The readiness
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentReadiness' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/companies/{companyId}/agents/{agentId}/settings/me:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
      - $ref: '#/components/parameters/AgentId'
    get:
      tags: [Settings]
      operationId: getMyAgentSettings
      summary: The caller's settings of the agent, or the defaults when none are stored (who may use it)
      description: |
        The defaults: the agent's first runtime, no model, `DEFAULT` effort, the budget, nothing added or switched off,
        and the current version accepted. 403 AGENT_NOT_USABLE.
      responses:
        '200':
          description: The settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentSettings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Settings]
      operationId: putMyAgentSettings
      summary: Save the caller's settings of the agent, as a whole (who may use it)
      description: |
        Absent fields take their defaults. A change applies from each conversation's next turn, except the runtime and
        the model access, which a conversation fixes at its start. Settings narrow the agent, never widen it: on the
        agent's systems only `OFF` and `ASK`; `ALLOW` and added servers only for the caller's own MCP servers, whose
        tools are filled with reads `ALLOW` and writes `ASK` when not named. Audited as `settings.changed` with the
        fields changed, the systems and tools switched off or to `ASK` and the own servers added (never the
        instructions); a save that changes nothing is not. Problems: 400 VALIDATION_FAILED (also `ALLOW` on a tool of
        the agent, a mode `toolModes` does not take); 400 RUNTIME_NOT_LISTED (not one of the agent's runtimes),
        MODEL_NOT_ALLOWED (not a model the caller's model access allows: a name of its list, one a `*` pattern of it
        prefixes, or any for an empty list or `all-proxy-models`, `all-team-models`), SUBSCRIPTION_NOT_SERVING (not a
        subscription on the caller's own runner host that serves the runtime), SETTINGS_WIDEN (an added server that is
        not the caller's own MCP server, a default repository the agent does not list, or settings the agent's change
        during the save made a widening), SYSTEM_NOT_ON_AGENT (a system switched off, a tool's mode or a default
        project on a system the agent does not list, with `details.systemId`), UNKNOWN_TOOL (a tool the agent does not
        list, or one's own server does not serve, with `details.systemId` and `details.tool`); 403 AGENT_NOT_USABLE.
        A tool of one's own server sent with `chosenForEffect` is chosen anew for it, as `replaceAgentSystems` says.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentSettingsRequest' }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentSettings' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Settings]
      operationId: resetMyAgentSettings
      summary: Return the caller's settings of the agent to the defaults (who may use it)
      description: |
        Every field to its default; the version the caller accepted stays (returning to the defaults accepts no
        widening). Audited as `settings.changed`. 403 AGENT_NOT_USABLE.
      responses:
        '200':
          description: The defaults
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentSettings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/companies/{companyId}/agents/{agentId}/settings/me/memory:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
      - $ref: '#/components/parameters/AgentId'
    get:
      tags: [Settings]
      operationId: getMyAgentMemory
      summary: The caller's memory of the agent, every note (who may use it)
      description: |
        The notes the agent keeps for the caller (ADR-0063): only theirs, written in their own conversations with the
        agent while memory is in effect (`inEffect`: the agent allows it and their settings turned it on), by number.
        Reading them is not audited. 403 AGENT_NOT_USABLE.
      responses:
