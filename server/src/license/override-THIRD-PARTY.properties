# Licences that correct a dependency's pom, read by license-maven-plugin (server/pom.xml, ADR-0082). Each line names one
# version: the next version of the dependency is checked against its own pom again.
#
# spring-session 4.1.1: its poms name a "Broadcom Foundation License", without a URL, while the jars carry the Apache
# License 2.0 and the project states it; a metadata error (spring-projects/spring-session#3910). Remove these lines
# when the version changes.
org.springframework.session--spring-session-core--4.1.1=Apache-2.0
org.springframework.session--spring-session-jdbc--4.1.1=Apache-2.0
#
# cryptacular 1.3.0 (OpenSAML's, ADR-0086): dual-licensed, its pom names both the Apache License 2.0 and the LGPL 3.0.
# Tinfirm takes it under the Apache License 2.0. Look again when the version changes.
org.cryptacular--cryptacular--1.3.0=Apache-2.0
