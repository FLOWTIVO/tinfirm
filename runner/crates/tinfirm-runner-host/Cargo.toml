[package]
name = "tinfirm-runner-host"
description = "Tinfirm runner host: connects to the server, runs agents in Docker sandboxes over ACP"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# The root LICENSE (MIT), and the Tinfirm Enterprise licence (ee/LICENSE) for the paid modules
# and tests it compiles in from ee/runner/tinfirm-runner-host (ADR-0100, ADR-0114), as
# server/pom.xml names both.
license = "MIT AND LicenseRef-Tinfirm-Enterprise"
publish.workspace = true

[[bin]]
name = "tinfirm-runner-host"
path = "src/main.rs"

[dependencies]
tinfirm-protocol.workspace = true
tinfirm-bridge.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
uuid.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tokio.workspace = true
tokio-util.workspace = true
futures.workspace = true
tokio-tungstenite.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true
rustls-native-certs.workspace = true
ring.workspace = true
# `node identity`: this host's certificate for sandbox nodes (crate::node).
rcgen.workspace = true
hyper.workspace = true
hyper-util.workspace = true
http-body-util.workspace = true
agent-client-protocol.workspace = true
bollard.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
dirs.workspace = true
rpassword.workspace = true
aho-corasick.workspace = true
base64.workspace = true
flate2.workspace = true
percent-encoding.workspace = true
tar.workspace = true
zip.workspace = true
url.workspace = true
hostname.workspace = true
libc.workspace = true

# The reader of a sandbox's input (crate::reader, crate::confine): Linux only.
[target.'cfg(target_os = "linux")'.dependencies]
landlock.workspace = true
seccompiler.workspace = true

# A sandbox's front (crate::front) passes descriptors over its control channel, on every Unix:
# the front runs unconfined where it cannot be confined, as on macOS with
# --allow-unconfined-reader. The calls of Linux alone are behind cfg(target_os = "linux").
[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[dev-dependencies]
jsonschema.workspace = true
tempfile.workspace = true
# The node driver's tests start real node agents (listener and helper, on the fake backend) from
# the agent's library. A dev-dependency only: the runner host's binary does not link the node
# agent, nor the agent the runner host (ADR-0112 decision 4).
tinfirm-node-agent.workspace = true

[lints]
workspace = true

# The paid features' tests (ADR-0100, ADR-0114), with their code under ee/.
[[test]]
name = "pool_runs"
path = "../../../ee/runner/tinfirm-runner-host/tests/pool_runs.rs"

[[test]]
name = "digitalocean_runs"
path = "../../../ee/runner/tinfirm-runner-host/tests/digitalocean_runs.rs"

[[test]]
name = "pod_driver_runs"
path = "../../../ee/runner/tinfirm-runner-host/tests/pod_driver_runs.rs"
