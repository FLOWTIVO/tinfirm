[package]
name = "tinfirm-node-agent"
description = "Tinfirm node agent: makes and deletes jailed Firecracker VMs for a control host (ADR-0112)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# A binary of its own, which links no other crate of the workspace (ADR-0112 decision 4).
[[bin]]
name = "tinfirm-node-agent"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true
ring.workspace = true
rcgen.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# Constants (O_NOFOLLOW, O_NONBLOCK, O_NOCTTY), whose values differ by architecture, and one
# call: prctl(PR_CAPBSET_DROP) in `src/bounding.rs`, the crate's only unsafe code.
libc.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
