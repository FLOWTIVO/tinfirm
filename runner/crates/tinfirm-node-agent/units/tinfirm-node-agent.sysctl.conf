# /etc/sysctl.d/60-tinfirm-node-agent.conf
# A VM's bridge is published as a DNAT from a port of the node into the VM's namespace, so
# the node forwards IPv4. The helper reads this setting before each VM and never writes it.
net.ipv4.ip_forward = 1
# No user namespaces on a node: nothing of the agent or of a VMM needs one (the jailer makes
# mount, PID and network namespaces as root), and a process that got out of a VMM would use
# one to reach kernel code that an unprivileged user otherwise cannot. The real VMM is
# refused already, by Firecracker's own filter and by the helper's unit; this closes it for
# every process of the node.
user.max_user_namespaces = 0
