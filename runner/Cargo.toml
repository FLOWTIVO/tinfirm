[workspace]
resolver = "3"
members = ["crates/tinfirm-bridge", "crates/tinfirm-protocol", "crates/tinfirm-runner-host"]

[workspace.package]
version = "0.1.0-SNAPSHOT"
edition = "2024"
rust-version = "1.89"
license = "MIT"
publish = false

[workspace.dependencies]
tinfirm-protocol = { path = "crates/tinfirm-protocol" }
tinfirm-bridge = { path = "crates/tinfirm-bridge" }

serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
chrono = { version = "0.4.44", default-features = false, features = ["std", "clock", "serde"] }
uuid = { version = "1.26", features = ["serde", "v4"] }
thiserror = "2.0"
anyhow = "1.0"

tokio = { version = "1.53", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt", "io-util"] }
futures = "0.3.32"
tokio-tungstenite = { version = "0.30", features = ["connect", "rustls-tls-native-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-native-certs = "0.8"
ring = "0.17"
# The sandbox bridge's self-signed certificate (ADR-0095), through ring as rustls is.
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
hyper = { version = "1.11", features = ["client", "server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
http-body-util = "0.1.5"
agent-client-protocol = "=5.0.0"
bollard = "0.21.1"
clap = { version = "4.6", features = ["derive", "env"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
dirs = "7.0"
rpassword = "7.4"
aho-corasick = "1.1"
base64 = "0.23"
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
percent-encoding = "2.3"
tar = "0.4"
# Reading the canonical zips of skills (ADR-0064): deflate through flate2 only, no other codec.
zip = { version = "9.0.3", default-features = false, features = ["deflate-flate2"] }
url = "2.5"
hostname = "0.4"
libc = "0.2"

jsonschema = { version = "0.60", default-features = false }
tempfile = "3.27"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.release]
lto = "thin"
strip = true
