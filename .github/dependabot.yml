# Keeps the pins and the dependencies current. Third-party actions are pinned to commit
# SHAs and base images to tag@digest, and neither updates itself. Dependabot bumps both,
# and keeps the `# vX.Y.Z` comment next to each action SHA in step. The server's and the
# model port's Maven dependencies, the web app's npm packages and the runner's crates are
# here too (L30 of the security review of 2026-10-27): server/pom.xml and ADR-0045 count on
# Dependabot for the MCP security library, and a dependency with a published fix should
# arrive as a pull request, not wait for the weekly trivy sweep to fail.
# The pr-agent image digest in .github/workflows/pr_agent.yml is outside this: see
# the comment there.
version: 2
updates:
  # The workflows, and the composite actions of .github/actions/ (ADR-0106), which pin
  # third-party actions of their own.
  - package-ecosystem: github-actions
    directories: [/, /.github/actions/*]
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: docker
    # The server image, the build environment of the static runner host binaries
    # (deploy/release/runner-musl.Dockerfile; its zig and cargo-zigbuild pins are by hand),
    # the runner's CI checks (runner/ci.Dockerfile, the same Rust image: one group, so
    # both move in one pull request), the model port (model-api/Dockerfile, the server's
    # Temurin images, in the same group), and the docs
    # site's Python and nginx images (docs-site/Dockerfile; its Zensical lock moves by hand,
    # `make docs-lock`).
    directories: [/, /deploy/release, /runner, /model-api, /docs-site]
    schedule:
      interval: weekly
    groups:
      base-images:
        patterns: ['*']
    ignore:
      # The web build's Node major is the project's (CI's setup-node, web/package.json's
      # engines, CONTRIBUTING.md), so it moves by hand with all of them; the digest still
      # follows the tag here.
      - dependency-name: node
        update-types: ['version-update:semver-major']
  # The runner's sandbox images (runner/images/*, built on each runner host by `images
  # build`): base pins node by tag; the agent images build FROM the local base image, which
  # Dependabot skips. Their tool versions and checksums (Maven, Gradle, uv, Docker) move by
  # hand.
  - package-ecosystem: docker
    directories:
      - /runner/images/base
      - /runner/images/claude
      - /runner/images/codex
      - /runner/images/opencode
      - /runner/images/pi
    schedule:
      interval: weekly
    groups:
      runner-images:
        patterns: ['*']
  - package-ecosystem: maven
    directories: [/server, /model-api]
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # Spring Boot's managed versions move together; everything else one pull request per
      # week, so that a review covers one coherent set.
      spring:
        patterns: ['org.springframework*']
      maven-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      angular:
        patterns: ['@angular/*', '@angular-devkit/*', '@schematics/angular']
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Angular compiles with one TypeScript minor (@angular/compiler-cli and @angular/build
      # declare `>=6.0 <6.1` for 22.2), so a TypeScript major waits for the Angular release
      # that takes it and moves with the angular group by hand.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
  - package-ecosystem: cargo
    directory: /runner
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      cargo-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker-compose
    directory: /deploy/compose
    schedule:
      interval: weekly
    groups:
      compose-images:
        patterns: ['*']
