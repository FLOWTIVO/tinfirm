# The docs site: the built site as static files, in place of nginx-unprivileged's
# default.conf. It expects a reverse proxy in front of it to terminate TLS and set the
# security headers.
server {
    listen 8080;
    server_name _;
    root /srv/docs;
    index index.html;

    server_tokens off;
    # Behind the reverse proxy, a redirect (/concepts to /concepts/) keeps the scheme and
    # host the browser used, instead of naming this container's port.
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/xml image/svg+xml text/plain;

    error_page 404 /404.html;

    # The probes'. Not logged.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Pages: checked again at every visit (by ETag), so a deploy shows at once.
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
    }

    # Files under assets/ whose names carry no content hash (tinfirm.css, the fonts, the
    # logo): an hour.
    location /assets/ {
        add_header Cache-Control "public, max-age=3600";
    }

    # The theme's scripts and stylesheets carry a content hash in their names: a year.
    location ~ "^/assets/.+\.[0-9a-f]{8}\.min\.(css|js)$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
