# /etc/tmpfiles.d/tinfirm-node-agent.conf: the directories of the node agent, with the
# owners and modes that its two processes check at their start (the crate's README, "Files
# and directories").
d /run/tinfirm-node-agent-helper        0750 root                  tinfirm-node-listener -
d /var/lib/tinfirm-node-agent           0755 root                  root                  -
d /var/lib/tinfirm-node-agent/spool     0700 tinfirm-node-listener tinfirm-node-listener -
d /var/lib/tinfirm-node-agent/listener  0700 tinfirm-node-listener tinfirm-node-listener -
d /var/lib/tinfirm-node-agent/helper    0700 root                  root                  -
d /var/lib/tinfirm-node-agent/work      0700 root                  root                  -
d /var/lib/tinfirm-node-agent/images    0755 root                  root                  -
d /srv/tinfirm-jails                    0755 root                  root                  -
# `ip netns add` keeps a VM's namespace here; the helper's unit must find it at its start.
d /run/netns                            0755 root                  root                  -
