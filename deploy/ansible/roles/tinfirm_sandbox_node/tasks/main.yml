---
# A sandbox node (ADR-0112 decision 4): the node agent, Firecracker and its jailer, the guest
# kernel and the VM image, the node's own firewall, the sysctl and the modules, the agent's two
# services, its configuration, and the node's TLS identity, made here and never copied off.
# The hardening of ADR-0113 decision 5, by its switches (hardening.yml). It ends with the
# helper's own check of every template, and fails when it names a problem or when a line of the
# hardening whose switch is on does not hold.
#
# Not done here (deploy/ansible/README.md): the single machine, and `verify` trying the node's
# own egress.

- name: Check the target and the variables
  ansible.builtin.import_tasks: checks.yml

- name: Install the tools the node agent runs
  ansible.builtin.import_tasks: packages.yml

- name: Create the listener's user and the agent's directories
  ansible.builtin.import_tasks: users.yml

- name: Install the node agent's binary
  ansible.builtin.import_tasks: agent.yml

- name: Install Firecracker and its jailer
  ansible.builtin.import_tasks: firecracker.yml

- name: Install the guest kernel
  ansible.builtin.import_tasks: kernel.yml

- name: Install the VM image
  ansible.builtin.import_tasks: image.yml

- name: Install the node's firewall, sysctl, modules and units
  ansible.builtin.import_tasks: system.yml

- name: Harden the node
  ansible.builtin.import_tasks: hardening.yml

- name: Make the node's identity and write the agent's configuration
  ansible.builtin.import_tasks: config.yml

- name: Start the node agent
  ansible.builtin.import_tasks: service.yml

- name: Check the node as the agent does
  ansible.builtin.import_tasks: proof.yml
