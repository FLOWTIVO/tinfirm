---
- name: Write the systemd unit
  ansible.builtin.template:
    src: tinfirm-runner-host.service.j2
    dest: /etc/systemd/system/tinfirm-runner-host.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload the runner host

- name: Start the runner host
  ansible.builtin.systemd_service:
    name: tinfirm-runner-host
    enabled: true
    state: started
    daemon_reload: true
