---
# A Tinfirm runner host on a Linux VM with nested virtualisation: Docker Engine, Kata
# Containers with Cloud Hypervisor as Docker's `kata` runtime, the runner host binary as a
# systemd service with `--sandbox-runtime kata --sandbox-docker --egress-proxy
# --sandbox-bridge` under systemd sandboxing, and the runner images.
#
# Or, with tinfirm_runner_host_executor `vm` (control-host.yml), a control host (ADR-0112): the
# binary, the node driver's configuration and client certificate, and the service with
# `run --executor vm --vm-driver node`. No Docker, no Kata, no runner images, no KVM: the VMs
# run on the sandbox nodes, and their image holds the runner images.

- name: Check the target and the variables
  ansible.builtin.import_tasks: checks.yml

- name: Install Docker Engine
  ansible.builtin.import_tasks: docker.yml
  when: not (_tinfirm_runner_host_vm | bool)

- name: Install Kata Containers and register its runtime with Docker
  ansible.builtin.import_tasks: kata.yml
  when: not (_tinfirm_runner_host_vm | bool)

- name: Install the packages of a control host
  ansible.builtin.import_tasks: packages.yml
  when: _tinfirm_runner_host_vm | bool

- name: Install and register the runner host
  ansible.builtin.import_tasks: runner.yml

# Right after the binary is there, and before the images are built: a machine that cannot run
# this host should say so early. A failure here leaves the handlers that reload the service
# unrun.
- name: Check that the runner host can confine what it reads from sandboxes
  ansible.builtin.import_tasks: confinement.yml
  when: (tinfirm_runner_host_sandbox_bridge | bool) or (_tinfirm_runner_host_vm | bool)

- name: Make the client certificate and write the sandbox nodes' configuration
  ansible.builtin.import_tasks: nodes.yml
  when: _tinfirm_runner_host_vm | bool

- name: Build the runner images
  ansible.builtin.import_tasks: images.yml
  when:
    - tinfirm_runner_host_images_build | bool
    - not (_tinfirm_runner_host_vm | bool)

# Before the service: a control host is not started, and one that runs is stopped, while its
# user reaches a Docker socket.
- name: Check that the control host's user reaches no Docker
  ansible.builtin.import_tasks: proof.yml
  when: _tinfirm_runner_host_vm | bool

- name: Run the runner host as a systemd service
  ansible.builtin.import_tasks: service.yml
