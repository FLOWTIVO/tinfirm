# `helm lint` / `helm template` (CI and `make helm-lint`): LiteLLM's database on a PostgreSQL
# of its own, by split settings, with the role and password from a Secret a database
# operator created (CloudNativePG's `<cluster>-app`), verified TLS, and further connection
# parameters. The default values cover the password from litellm.existingSecret.
image:
  tag: v0.1.0
litellm:
  database:
    host: litellm-pg-rw.tinfirm.svc
    port: 5432
    name: litellm
    sslMode: verify-full
    caCertSecret:
      name: litellm-pg-ca
      key: ca.crt
    params: connection_limit=5&pool_timeout=30&connect_timeout=10
    existingSecret: litellm-pg-app
    secretKeys:
      username: username
      password: password
