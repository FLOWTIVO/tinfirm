{{- if .Values.litellm.enabled }}
# LiteLLM inside the cluster: port http, every route of LiteLLM, at the server's URL
# (TINFIRM_MODEL_GATEWAY_ADMIN_URL) for its admin API and its model requests, and for the
# company's services that litellm.from admits. Always ClusterIP, and the NetworkPolicy admits
# those callers only: LiteLLM is never exposed outside the release.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "tinfirm.litellm.fullname" . }}
  labels:
    {{- include "tinfirm.litellm.labels" . | nindent 4 }}
  {{- with .Values.litellm.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.litellm.service.port }}
      targetPort: http
      protocol: TCP
      appProtocol: http
  selector:
    {{- include "tinfirm.litellm.selectorLabels" . | nindent 4 }}
{{- end }}
