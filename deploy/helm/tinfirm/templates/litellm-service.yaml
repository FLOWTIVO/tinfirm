{{- if .Values.litellm.enabled }}
# LiteLLM inside the cluster (ADR-0069): port http, every route of LiteLLM, at the server's
# admin URL (TINFIRM_MODEL_GATEWAY_ADMIN_URL), for the server only; port model, the model port's
# routes alone, for the server's model requests (TINFIRM_MODEL_GATEWAY_MODEL_URL) and the company's
# services. Always ClusterIP, and the NetworkPolicy admits each port's callers only: LiteLLM
# is never exposed outside the release.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "tinfirm.litellm.fullname" . }}
  labels:
    {{- include "tinfirm.litellm.labels" . | nindent 4 }}
  {{- with .Values.litellm.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.litellm.service.port }}
      targetPort: http
      protocol: TCP
      appProtocol: http
    - name: model
      port: {{ .Values.litellm.modelApi.port }}
      targetPort: model
      protocol: TCP
      appProtocol: http
  selector:
    {{- include "tinfirm.litellm.selectorLabels" . | nindent 4 }}
{{- end }}
