{{- if and .Values.runner.enabled .Values.networkPolicy.enabled }}
{{- $np := .Values.networkPolicy }}
{{- $r := $np.runner }}
# The runner pod (ADR-0101, decision 8). Ingress: nothing; the pod dials the server and the
# VMs' bridges, and the sandboxes' traffic comes back through the bridges' tunnels. Egress (when
# enabled): DNS, https (the server's public URL, the VM provider's API, git hosts, model
# gateways, what the sandboxes may reach), the VMs' bridge port, plus configured extras.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "tinfirm.runner.fullname" . }}
  labels:
    {{- include "tinfirm.runner.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "tinfirm.runner.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    {{- if $np.egress.enabled }}
    - Egress
    {{- end }}
  ingress: []
  {{- if $np.egress.enabled }}
  egress:
    {{- include "tinfirm.networkPolicy.dnsEgress" . | nindent 4 }}
    {{- with $r.egress.https.to }}
    # https: the server, the VM provider's API, git hosts, model gateways.
    - to:
        {{- toYaml . | nindent 8 }}
      ports:
        {{- range $r.egress.https.ports }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
    {{- end }}
    {{- with $r.egress.vms.to }}
    # The VMs' bridges.
    - to:
        {{- toYaml . | nindent 8 }}
      ports:
        - protocol: TCP
          port: {{ $.Values.runner.vm.port }}
    {{- end }}
    {{- with $r.egress.extra }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
{{- end }}
