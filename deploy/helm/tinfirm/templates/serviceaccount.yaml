{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "tinfirm.serviceAccountName" . }}
  labels:
    {{- include "tinfirm.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The server does not use the Kubernetes API; no token is mounted.
automountServiceAccountToken: false
{{- end }}
