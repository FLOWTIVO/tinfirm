{{- if and .Values.runner.enabled (eq .Values.runner.vm.driver "pod") }}
{{- include "tinfirm.runner.validate" . }}
# The ServiceAccount of every run pod (ADR-0115, decision 2): bound to nothing, so it has no
# rights, and never mounted. The admission policy refuses a run pod with any other.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.runner.vm.cluster.runServiceAccount }}
  namespace: {{ .Values.runner.vm.cluster.namespace }}
  labels:
    {{- include "tinfirm.runner.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
