{{- if .Values.runner.enabled }}
{{- include "tinfirm.runner.validate" . }}
{{- $r := .Values.runner }}
# The runner pod (ADR-0101, decision 8): the declared company's runner host, whose sandboxes are
# VMs: Droplets (driver digitalocean), VMs on sandbox nodes outside the cluster (node), or a pod
# per run in the runs' namespace (pod, ADR-0115 decision 2). One replica, recreated, never two:
# a second process with the same token would replace the first one's connection, and both would
# use the same records.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tinfirm.runner.fullname" . }}
  labels:
    {{- include "tinfirm.runner.labels" . | nindent 4 }}
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "tinfirm.runner.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # Roll the pod when its settings change. The Secrets are not tracked: restart the pod
        # after rotating one.
        checksum/config: {{ include (print $.Template.BasePath "/runner-configmap.yaml") . | sha256sum }}
        {{- with $r.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "tinfirm.runner.labels" . | nindent 8 }}
        {{- with $r.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "tinfirm.runner.serviceAccountName" . }}
      # Never the automatic mount, which would add the namespace's file and the token under the
      # well-known path. Only the pod driver calls the Kubernetes API, with the token of its
      # projected volume (kubernetes-api).
      automountServiceAccountToken: false
      # No docker-link style variables, which would add TINFIRM_* names to the environment.
      enableServiceLinks: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      terminationGracePeriodSeconds: {{ $r.terminationGracePeriodSeconds }}
      securityContext:
        {{- include "tinfirm.securityContext" (dict "context" $r.podSecurityContext "root" $) | nindent 8 }}
      {{- if eq $r.vm.driver "node" }}
      initContainers:
        # The node driver reads its client key only from a file of the pod's user that no one
        # else may read (0600). A Secret's files belong to root, so this copies the key, as
        # the pod's user, into a memory volume that the runner container mounts read-only.
        - name: node-driver-key
          image: {{ include "tinfirm.runner.image" . | quote }}
          imagePullPolicy: {{ $r.image.pullPolicy }}
          command:
            - install
            - -m
            - "0600"
            - {{ printf "%s/%s" (include "tinfirm.runner.nodeKeySourceDir" .) $r.vm.node.secretKeys.key | quote }}
            - {{ printf "%s/%s" (include "tinfirm.runner.nodeKeyDir" .) $r.vm.node.secretKeys.key | quote }}
          securityContext:
            {{- include "tinfirm.securityContext" (dict "context" $r.securityContext "root" $) | nindent 12 }}
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: node-driver-key-source
              mountPath: {{ include "tinfirm.runner.nodeKeySourceDir" . }}
              readOnly: true
            - name: node-driver-key
              mountPath: {{ include "tinfirm.runner.nodeKeyDir" . }}
      {{- end }}
      containers:
        - name: runner
          image: {{ include "tinfirm.runner.image" . | quote }}
          imagePullPolicy: {{ $r.image.pullPolicy }}
          args:
            - run
            - --max-concurrent-runs
            - {{ $r.maxConcurrentRuns | toString | quote }}
          securityContext:
            {{- include "tinfirm.securityContext" (dict "context" $r.securityContext "root" $) | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ include "tinfirm.runner.fullname" . }}
          {{- if or (eq $r.vm.driver "pod") $r.extraEnv }}
          env:
            {{- if eq $r.vm.driver "pod" }}
            # The pod driver keeps every run pod off this pod's node, and names this pod.
            - name: TINFIRM_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: TINFIRM_POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: TINFIRM_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            {{- end }}
            {{- with $r.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          lifecycle:
            # Drain: no new runs, the active ones finish, then `run` exits. When the grace
            # period ends first, the pod is stopped, and the next one takes its runs back.
            preStop:
              exec:
                command: ["/usr/local/bin/tinfirm-runner-host", "drain"]
          resources:
            {{- toYaml $r.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/tinfirm-runner
            - name: tmp
              mountPath: /tmp
            - name: token
              mountPath: {{ include "tinfirm.runner.tokenDir" . }}
              readOnly: true
            {{- if eq $r.vm.driver "digitalocean" }}
            - name: digitalocean-token
              mountPath: {{ include "tinfirm.runner.digitaloceanTokenDir" . }}
              readOnly: true
            - name: digitalocean-config
              mountPath: {{ include "tinfirm.runner.digitaloceanConfigDir" . }}
              readOnly: true
            {{- else if eq $r.vm.driver "node" }}
            - name: node-driver-config
              mountPath: {{ include "tinfirm.runner.nodeConfigDir" . }}
              readOnly: true
            - name: node-driver-certificate
              mountPath: {{ include "tinfirm.runner.nodeCertificateDir" . }}
              readOnly: true
            - name: node-driver-key
              mountPath: {{ include "tinfirm.runner.nodeKeyDir" . }}
              readOnly: true
            {{- else if eq $r.vm.driver "pod" }}
            - name: pod-driver-config
              mountPath: {{ include "tinfirm.runner.podConfigDir" . }}
              readOnly: true
            - name: kubernetes-api
              mountPath: {{ include "tinfirm.runner.kubernetesApiDir" . }}
              readOnly: true
            {{- end }}
      volumes:
        - name: data
          {{- if $r.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ $r.persistence.existingClaim | default (include "tinfirm.runner.fullname" .) }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir:
            sizeLimit: {{ $r.tmpVolume.sizeLimit }}
        # The host's token, readable by the pod's group (fsGroup) only.
        - name: token
          secret:
            secretName: {{ $r.existingSecret }}
            defaultMode: 0440
            items:
              - key: {{ $r.secretKeys.token }}
                path: {{ $r.secretKeys.token }}
        {{- if eq $r.vm.driver "digitalocean" }}
        - name: digitalocean-token
          secret:
            secretName: {{ $r.vm.digitalocean.existingSecret }}
            defaultMode: 0440
            items:
              - key: {{ $r.vm.digitalocean.secretKeys.token }}
                path: {{ $r.vm.digitalocean.secretKeys.token }}
        - name: digitalocean-config
          configMap:
            name: {{ include "tinfirm.runner.fullname" . }}-digitalocean
        {{- else if eq $r.vm.driver "node" }}
        - name: node-driver-config
          configMap:
            name: {{ include "tinfirm.runner.fullname" . }}-node-driver
        # The client certificate, readable by the pod's group (fsGroup), as the tokens.
        - name: node-driver-certificate
          secret:
            secretName: {{ $r.vm.node.existingSecret }}
            defaultMode: 0440
            items:
              - key: {{ $r.vm.node.secretKeys.certificate }}
                path: {{ $r.vm.node.secretKeys.certificate }}
        # The client key as the Secret holds it, root's and 0440: the init container's alone.
        - name: node-driver-key-source
          secret:
            secretName: {{ $r.vm.node.existingSecret }}
            defaultMode: 0440
            items:
              - key: {{ $r.vm.node.secretKeys.key }}
                path: {{ $r.vm.node.secretKeys.key }}
        # The key's copy, the pod's user's and 0600, in memory: never on the node's disk.
        - name: node-driver-key
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        {{- else if eq $r.vm.driver "pod" }}
        - name: pod-driver-config
          configMap:
            name: {{ include "tinfirm.runner.fullname" . }}-pod-driver
        # The pod driver's credential for the API server: a token of this pod's own
        # ServiceAccount, valid for an hour and renewed by the kubelet, and the cluster's CA,
        # readable by the pod's group (fsGroup). Nothing else: no namespace file, no Secret.
        - name: kubernetes-api
          projected:
            defaultMode: 0440
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
        {{- end }}
      {{- with $r.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $r.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $r.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
