# The bundled LiteLLM's settings (ADR-0059; docs/operations/litellm.md). The Helm chart
# renders the same settings in templates/litellm-configmap.yaml: change both together.
#
# No models and no provider keys here. They live in LiteLLM's database, added by the
# operator through its admin API (docs/operations/litellm.md, section 4.2); Tinfirm adds none.
# The master key (LITELLM_MASTER_KEY), the salt key (LITELLM_SALT_KEY) and the database
# (DATABASE_*) come from the environment.
#
# A setting in this file wins over the same setting stored in the database through the
# admin API, so these cannot be turned back on with the master key.

general_settings:
  # Models and provider keys are added with POST /model/new and kept in the database,
  # encrypted with the salt key.
  store_model_in_db: true
  # Prompts and answers are never stored (security review 2026-10-12, row 17): the spend
  # logs keep who, which model, tokens and cost, never the request or response bodies.
  store_prompts_in_spend_logs: false
  # LiteLLM_ErrorLogs would keep a failed request's arguments and the provider's error text,
  # either of which may quote the prompt. A failure still shows in the spend logs, redacted.
  disable_error_logs: true

litellm_settings:
  # No message content to logging callbacks either, should anyone add one.
  turn_off_message_logging: true
  # Structured logs on stdout, like the server's.
  json_logs: true
  # A spent budget is 429 budget_exceeded, which the server's relay takes for a key whose
  # budget is spent; from v1.105.1 LiteLLM answers 422 unless this says otherwise.
  budget_exceeded_status_code: 429
