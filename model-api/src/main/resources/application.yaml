# The model port (ADR-0069). Every MODEL_API_* variable is described in model-api/README.md.
spring:
  application:
    name: tinfirm-model-api
  main:
    banner-mode: off
  threads:
    # One virtual thread a request: a streaming answer holds its request for minutes.
    virtual:
      enabled: true

server:
  port: ${MODEL_API_PORT:4001}
  shutdown: graceful
  tomcat:
    # A refused body is not read to its end: the connection closes instead.
    max-swallow-size: 0

# Health on its own port, for the probes; the model port's own answers nothing but its routes.
management:
  server:
    port: ${MODEL_API_MANAGEMENT_PORT:4002}
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

model-api:
  upstream: ${MODEL_API_UPSTREAM:http://127.0.0.1:4000}
  max-request-bytes: ${MODEL_API_MAX_REQUEST_BYTES:67108864}
  max-inflight-bytes: ${MODEL_API_MAX_INFLIGHT_BYTES:134217728}
  idle-timeout: ${MODEL_API_IDLE_TIMEOUT:PT10M}
  # Which tools the model's provider may run itself for a request (M1 of the security review of 2026-10-27): OFF, none
  # (a request that names web search or fetch, code execution or an MCP server is 400); WEB_SEARCH, the providers' web
  # search too. The server's relay applies each company's own choice before the port: the stricter of the two holds.
  provider-tools: ${MODEL_API_PROVIDER_TOOLS:OFF}
